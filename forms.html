<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan 2027秋季韩国四校网申 1:1 仿真样表与预填工作台 / Application Forms Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EFF6FF;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --text: #0F172A;
  --text-2: #334155;
  --text-3: #64748B;
  --primary: #1A73E8;
  --primary-soft: rgba(26, 115, 232, 0.10);
  --teal: #0D9488;
  --teal-soft: rgba(13, 148, 136, 0.10);
  --green: #0F9D58;
  --green-soft: #E6F4EA;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --orange: #EA580C;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --red: #D93025;
  --red-soft: #FCE8E6;
  --ku-crimson: #8B0029;
  --ku-soft: #FDF2F5;
  --hyu-blue: #0E4A84;
  --hyu-soft: #EFF6FF;
  --yu-navy: #003876;
  --yu-soft: #EEF4FF;
  --cau-blue: #004C97;
  --cau-soft: #EFF6FF;
  --paper-bg: #FFFFFF;
  --paper-ink: #0F172A;
  --paper-sub: #334155;
  --paper-border: #94A3B8;
  --paper-cell-head: #F1F5F9;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-paper: 0 10px 30px rgba(15, 23, 42, 0.10), 0 2px 8px rgba(15, 23, 42, 0.05);
  --radius: 14px;
  --radius-sm: 9px;
}

html[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #151F32;
  --surface-2: #1E293B;
  --surface-3: #1E3A5F;
  --border: #2D3D56;
  --border-strong: #475569;
  --text: #F1F5F9;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --primary: #60A5FA;
  --primary-soft: rgba(96, 165, 250, 0.16);
  --green-soft: rgba(16, 185, 129, 0.16);
  --amber-soft: rgba(245, 158, 11, 0.17);
  --purple-soft: rgba(167, 139, 250, 0.16);
  --red-soft: rgba(239, 68, 68, 0.18);
  --ku-soft: rgba(139, 0, 41, 0.24);
  --hyu-soft: rgba(14, 74, 132, 0.28);
  --yu-soft: rgba(0, 56, 118, 0.28);
  --cau-soft: rgba(0, 76, 151, 0.28);
  --paper-bg: #162033;
  --paper-ink: #F1F5F9;
  --paper-sub: #CBD5E1;
  --paper-border: #475569;
  --paper-cell-head: #1E2D45;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.32);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.38);
  --shadow-paper: 0 12px 32px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  line-height: 1.64;
  font-size: 14.5px;
  -webkit-font-smoothing: antialiased;
}

html[lang="fa"] body {
  font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', 'Inter', sans-serif;
  line-height: 1.82;
}

/* CRITICAL RULE: All form input values and simulated English/Korean form sheets remain strictly LTR */
input.ltr-field,
textarea.ltr-field,
select.ltr-field,
.ltr-box,
.sim-paper {
  direction: ltr !important;
  text-align: left !important;
  unicode-bidi: isolate;
  font-family: 'Inter', 'Noto Sans KR', 'Noto Sans SC', 'Segoe UI', sans-serif;
}

code.ic {
  font-family: 'JetBrains Mono', 'Consolas', monospace;
  font-size: 0.90em;
  background: rgba(148, 163, 184, 0.18);
  padding: 1px 5px;
  border-radius: 4px;
  direction: ltr;
  unicode-bidi: isolate;
}

/* Sticky Topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.93);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .topbar {
  background: rgba(21, 31, 50, 0.95);
}

.topbar-inner {
  max-width: 1360px;
  margin: 0 auto;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}

.back-guide-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary);
  border: 1.5px solid var(--primary);
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.back-guide-btn:hover {
  background: var(--primary);
  color: #FFFFFF;
}

.brand-title {
  font-weight: 800;
  font-size: 15.5px;
  color: var(--text);
  line-height: 1.28;
}
.brand-sub {
  font-size: 12px;
  color: var(--text-3);
}

.toolbar-cluster {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.lang-switch {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12.2px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.lang-btn.active {
  background: var(--primary);
  color: #FFFFFF;
}

.ctrl-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  padding: 6px 11px;
  border-radius: 999px;
  font-size: 12.3px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.15s;
}
.ctrl-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.ctrl-pill.primary-cta {
  background: var(--primary);
  border-color: var(--primary);
  color: #FFFFFF;
}
.ctrl-pill.primary-cta:hover {
  filter: brightness(1.06);
  color: #FFFFFF;
}
.ctrl-pill.green-cta {
  background: var(--green-soft);
  border-color: rgba(15, 157, 88, 0.45);
  color: var(--green);
}
.save-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--green-soft);
  color: var(--green);
  border: 1px solid rgba(15, 157, 88, 0.35);
}

/* Main Container */
.page-wrap {
  max-width: 1360px;
  margin: 0 auto;
  padding: 18px 18px 64px;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.sec-head-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.sec-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
}
.sec-sub {
  margin: 4px 0 0;
  font-size: 13.3px;
  color: var(--text-3);
}

/* Readiness Progress Strip */
.readiness-bar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 14px;
}
.readiness-track {
  flex: 1;
  min-width: 160px;
  height: 9px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  direction: ltr;
}
.readiness-fill {
  height: 100%;
  background: linear-gradient(90deg, #1A73E8, #0F9D58);
  border-radius: 999px;
  transition: width 0.25s ease;
}

/* Intake Accordion Groups */
.intake-groups-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 960px) {
  .intake-groups-grid { grid-template-columns: minmax(0, 1fr); }
}

.intake-group {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}
.intake-group-title {
  margin: 0 0 12px;
  font-size: 14.8px;
  font-weight: 800;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px dashed var(--border-strong);
  padding-bottom: 8px;
}

.fields-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px 12px;
}
.field-span-2 {
  grid-column: 1 / -1;
}
@media (max-width: 600px) {
  .fields-grid { grid-template-columns: minmax(0, 1fr); }
}

.field-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field-label {
  font-size: 12.3px;
  font-weight: 700;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.field-hint {
  font-size: 11.4px;
  color: var(--text-3);
  line-height: 1.45;
}

input.ltr-field,
textarea.ltr-field,
select.ltr-field {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13.4px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input.ltr-field:focus,
textarea.ltr-field:focus,
select.ltr-field:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
input.ltr-field.is-pending {
  border-style: dashed;
  border-color: #F59E0B;
  background: rgba(245, 158, 11, 0.06);
}
input.ltr-field.is-prefilled {
  border-color: rgba(15, 157, 88, 0.55);
}
input.ltr-field[readonly] {
  background: var(--surface-3);
  font-weight: 700;
  color: var(--primary);
  cursor: default;
}

.val-msg {
  font-size: 11.6px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  margin-top: 2px;
}
.val-msg.err { background: var(--red-soft); color: var(--red); border: 1px solid rgba(217, 48, 37, 0.35); }
.val-msg.warn { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(217, 119, 6, 0.35); }
.val-msg.ok { background: var(--green-soft); color: var(--green); border: 1px solid rgba(15, 157, 88, 0.35); }

/* University Switcher Tabs */
.uni-tabs-bar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
@media (max-width: 860px) {
  .uni-tabs-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
  .uni-tabs-bar { grid-template-columns: minmax(0, 1fr); }
}

.uni-tab-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  text-align: start;
  transition: all 0.16s ease;
}
.uni-tab-btn:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.uni-tab-btn.active[data-uni="ku"] { border-color: var(--ku-crimson); background: var(--ku-soft); box-shadow: var(--shadow-sm); }
.uni-tab-btn.active[data-uni="hyu"] { border-color: var(--hyu-blue); background: var(--hyu-soft); box-shadow: var(--shadow-sm); }
.uni-tab-btn.active[data-uni="yu"] { border-color: var(--yu-navy); background: var(--yu-soft); box-shadow: var(--shadow-sm); }
.uni-tab-btn.active[data-uni="cau"] { border-color: var(--cau-blue); background: var(--cau-soft); box-shadow: var(--shadow-sm); }

.uni-tab-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 6px;
  font-weight: 800;
  font-size: 14.5px;
}
.uni-tab-sub {
  font-size: 11.8px;
  color: var(--text-3);
}

/* Badges Legend Strip */
.legend-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  margin-bottom: 18px;
  font-size: 12.5px;
}
.badge-lock {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(26, 115, 232, 0.12);
  color: var(--primary);
  border: 1px solid rgba(26, 115, 232, 0.35);
}
.badge-sign {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 800;
  background: var(--red-soft);
  color: var(--red);
  border: 1.5px solid var(--red);
}
.badge-blank {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(100, 116, 139, 0.16);
  color: var(--text-2);
  border: 1px dashed var(--border-strong);
}

/* Trilingual Instructional Banner Above Each Simulated Sheet */
.sheet-guide-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-inline-start: 5px solid var(--primary);
  border-radius: 11px;
  padding: 12px 16px;
  margin: 22px 0 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.sheet-guide-banner.warn-red {
  background: var(--red-soft);
  border-color: var(--red);
  border-inline-start-width: 6px;
}

/* 1:1 Simulated Official Paper Sheet */
.sim-paper {
  background: var(--paper-bg);
  color: var(--paper-ink);
  border: 1.5px solid var(--paper-border);
  border-radius: 8px;
  padding: 26px 28px;
  margin-bottom: 26px;
  box-shadow: var(--shadow-paper);
  position: relative;
  overflow-x: auto;
}
@media (max-width: 680px) {
  .sim-paper { padding: 14px 12px; }
}

.paper-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 14px 18px;
  border-radius: 6px;
  color: #FFFFFF;
  margin-bottom: 16px;
}
.paper-header.ku { background: linear-gradient(135deg, #8B0029, #65001D); }
.paper-header.hyu { background: linear-gradient(135deg, #0E4A84, #082F57); }
.paper-header.yu { background: linear-gradient(135deg, #003876, #00224B); }
.paper-header.cau { background: linear-gradient(135deg, #004C97, #003166); }

.paper-h-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.2px;
  margin: 0 0 3px;
}
.paper-h-sub {
  font-size: 12px;
  opacity: 0.9;
}
.exam-no-box {
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11.5px;
  text-align: right;
  min-width: 175px;
}

/* Official Form Table Grid */
.form-tbl {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 14px;
  font-size: 13px;
  min-width: 560px;
}
.form-tbl th,
.form-tbl td {
  border: 1px solid var(--paper-border);
  padding: 8px 10px;
  vertical-align: middle;
  color: var(--paper-ink);
}
.form-tbl th {
  background: var(--paper-cell-head);
  font-weight: 700;
  width: 21%;
  color: var(--paper-sub);
  font-size: 12.2px;
}
.form-sec-caption {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 14px 0 6px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--paper-ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Values inside simulated forms */
.f-val {
  font-weight: 700;
  color: var(--paper-ink);
  font-family: 'JetBrains Mono', 'Inter', monospace;
  font-size: 13px;
}
.f-pending {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  background: rgba(245, 158, 11, 0.16);
  border: 1px dashed #D97706;
  color: #B45309;
  font-size: 12px;
  font-weight: 700;
}
html[data-theme="dark"] .f-pending {
  color: #FCD34D;
}
.f-locked {
  font-weight: 700;
  color: var(--primary);
}
.f-trap-alert {
  margin-top: 5px;
  padding: 5px 9px;
  border-radius: 5px;
  background: var(--red-soft);
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 11.8px;
  font-weight: 700;
}

/* 3x4 cm ID Photo Box */
.photo-frame-3x4 {
  width: 114px;
  height: 152px;
  border: 2px dashed var(--paper-border);
  border-radius: 6px;
  background: var(--paper-cell-head);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px;
  font-size: 11px;
  color: var(--paper-sub);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
}
.photo-frame-3x4 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Wet-Ink Signature Red Highlight Box */
.wet-sign-box {
  border: 2.5px dashed #D93025;
  background: rgba(217, 48, 37, 0.06);
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.wet-sign-line {
  min-width: 240px;
  border-bottom: 1.8px solid var(--paper-ink);
  padding-bottom: 4px;
  font-style: italic;
  color: var(--red);
  font-weight: 700;
  font-size: 13px;
}

/* Diagonal Hatched Locked Official-Use Zone */
.locked-verifier-zone {
  background: repeating-linear-gradient(
    -45deg,
    rgba(148, 163, 184, 0.16),
    rgba(148, 163, 184, 0.16) 10px,
    rgba(100, 116, 139, 0.26) 10px,
    rgba(100, 116, 139, 0.26) 20px
  );
  border: 2px dashed #64748B;
  border-radius: 8px;
  padding: 14px 16px;
  margin: 12px 0;
  position: relative;
}

/* Watermark Stamp for Page 4 Receipt & Discarded Art Pledge */
.stamp-overlay {
  display: inline-block;
  border: 3px solid #64748B;
  color: #475569;
  padding: 6px 14px;
  border-radius: 8px;
  font-weight: 900;
  font-size: 14px;
  transform: rotate(-3deg);
  background: rgba(241, 245, 249, 0.92);
  letter-spacing: 0.5px;
}
html[data-theme="dark"] .stamp-overlay {
  background: rgba(30, 41, 59, 0.92);
  color: #CBD5E1;
}
.stamp-overlay.discard-red {
  border-color: #D93025;
  color: #D93025;
  background: rgba(252, 232, 230, 0.95);
}

/* Cut-out Envelope Label */
.cut-label-box {
  border: 2px dashed var(--paper-ink);
  border-radius: 10px;
  padding: 18px 20px;
  background: var(--paper-bg);
  position: relative;
  margin-top: 10px;
}

/* CAU 3-Prompt Character Counter Progress */
.prompt-card {
  background: var(--surface-2);
  border: 1.5px solid var(--border-strong);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.char-bar-track {
  width: 100%;
  height: 8px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 6px;
  position: relative;
}
.char-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.15s ease, background 0.15s ease;
}

/* Print Preview Mode Bar */
.print-ctrl-bar {
  display: none;
  background: #0F172A;
  color: #FFFFFF;
  padding: 12px 18px;
  border-radius: 12px;
  margin-bottom: 18px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

}

}

  color: #1E293B !important;
}

}

(function() {
  const STORAGE_KEY = "arsan_forms_v1";
  const LANG_KEY = "arsan_lang";
  const THEME_KEY = "arsan_theme";
  const VALID_LANGS = ["zh", "en", "fa"];
  const VALID_UNIS = ["ku", "hyu", "yu", "cau"];

  function safeGet(k) {
    try { return window.localStorage ? localStorage.getItem(k) : null; } catch (_) { return null; }
  }
  function safeSet(k, v) {
    try { if (window.localStorage) localStorage.setItem(k, v); return true; } catch (_) { return false; }
  }

  function loadInitialForm() {
    const base = Object.assign({}, INITIAL_FORM_VALUES);
    const raw = safeGet(STORAGE_KEY);
    if (!raw) return base;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
        Object.keys(base).forEach(k => {
          if (typeof parsed[k] === "string") base[k] = parsed[k];
        });
        if (base.yuMajorChoice && base.yuMajorChoice.indexOf("Medical Sciences") < 0 && base.yuMajorChoice.indexOf("Medicine") < 0) {
          base.yuMajorChoice = INITIAL_FORM_VALUES.yuMajorChoice;
        }
      }
    } catch (_) {}
    return base;
  }

  const savedLang = safeGet(LANG_KEY);
  const savedTheme = safeGet(THEME_KEY);
  const savedUni = safeGet("arsan_forms_uni");

  const state = {
    lang: VALID_LANGS.includes(savedLang) ? savedLang : "zh",
    theme: savedTheme === "dark" ? "dark" : "light",
    activeUni: VALID_UNIS.includes(savedUni) ? savedUni : "ku",
    intakeCollapsed: false,
    a4Preview: false,
    printScope: "all",
    photoDataUrl: "",
    lastSavedTime: "",
    form: loadInitialForm()
  };

  function t(obj) {
    if (!obj) return "";
    if (typeof obj === "string") return obj;
    return obj[state.lang] || obj.zh || obj.en || "";
  }

  function escHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escAttr(s) {
    return escHtml(s);
  }

  function getUwayName() {
    const s = (state.form.surname || "").replace(/[^A-Za-z]/g, "").toUpperCase();
    const g = (state.form.givenName || "").replace(/[^A-Za-z]/g, "").toUpperCase();
    return s + g;
  }

  function getFullName() {
    const s = (state.form.surname || "").trim().toUpperCase();
    const g = (state.form.givenName || "").trim().toUpperCase();
    if (!s && !g) return "";
    return [g, s].filter(Boolean).join(" ");
  }

  function fv(val, placeholderLabel) {
    const trimmed = String(val == null ? "" : val).trim();
    if (!trimmed || trimmed === "+98-" || trimmed === "010-") {
      return `<span class="f-pending">[Pending: ${escHtml(placeholderLabel)}]</span>`;
    }
    return `<span class="f-val">${escHtml(trimmed)}</span>`;
  }

  // ==================== REAL-TIME VALIDATORS ====================
  function checkPassportExpiry(dateStr) {
    const s = (dateStr || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return { status: "none", msg: "" };
    const exp = new Date(s + "T00:00:00Z");
    if (isNaN(exp.getTime())) return { status: "none", msg: "" };
    const entryCutoff = new Date("2027-09-01T00:00:00Z");
    const twoYrTarget = new Date("2029-03-02T00:00:00Z");
    if (exp <= entryCutoff) return { status: "err", msg: t(I18N.val.passportExpired) };
    if (exp < twoYrTarget) return { status: "warn", msg: t(I18N.val.passportWarn) };
    return { status: "ok", msg: t(I18N.val.passportOk) };
  }

  function extractDomain(email) {
    const m = String(email || "").trim().toLowerCase().match(/^[^@\s]+@([^@\s]+\.[^@\s]+)$/);
    return m ? m[1] : "";
  }

  function checkDualEmail(e1, e2) {
    const d1 = extractDomain(e1);
    const d2 = extractDomain(e2);
    if (!d1 || !d2) return { status: "none", msg: "" };
    if (d1 === d2) return { status: "err", msg: t(I18N.val.emailSameDomain) };
    return { status: "ok", msg: t(I18N.val.emailDiffOk) };
  }

  function checkRecEmail(email) {
    const d = extractDomain(email);
    if (!d) return { status: "none", msg: "" };
    const personalDomains = ["gmail.com", "yahoo.com", "hotmail.com", "outlook.com", "icloud.com", "aol.com", "proton.me", "protonmail.com"];
    if (personalDomains.includes(d)) return { status: "err", msg: t(I18N.val.recPersonalMail) };
    return { status: "ok", msg: t(I18N.val.recOfficialOk) };
  }

  function getFieldValidation(validatorName, key) {
    if (validatorName === "passportExpiry") return checkPassportExpiry(state.form.passportExpiry);
    if (validatorName === "dualEmail") {
      if (key === "emailPrimary") return { status: "none", msg: "" };
      return checkDualEmail(state.form.emailPrimary, state.form.emailSecondary);
    }
    if (validatorName === "recEmail") return checkRecEmail(state.form[key]);
    return { status: "none", msg: "" };
  }

  const READINESS_KEYS = [
    "surname", "givenName", "dob", "passportNo", "passportExpiry", "iranNatId",
    "emailPrimary", "emailSecondary", "iranMobile", "iranAddress", "seoulAddress", "seoulZip", "charlottePhone",
    "univName", "degreeMajor", "studentId", "attendancePeriod", "regSemesters", "officialCgpa", "regOfficeTel", "regOfficeEmail",
    "fatherName", "fatherDob", "fatherPassport", "motherName", "motherDob", "motherPassport", "rec1Name", "rec1Email"
  ];

  function computeReadiness() {
    let filled = 0;
    READINESS_KEYS.forEach(k => {
      const v = String(state.form[k] || "").trim();
      if (v && v !== "+98-" && v !== "010-") filled++;
    });
    const total = READINESS_KEYS.length;
    const pct = Math.round((filled / total) * 100);
    return { filled, total, pct };
  }

  function persistFormNow() {
    const ok = safeSet(STORAGE_KEY, JSON.stringify(state.form));
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    state.lastSavedTime = ok ? `${hh}:${mm}:${ss}` : "Memory";
    const badge = document.getElementById("save-status-badge");
    if (badge) {
      badge.textContent = `${t(I18N.saveStatus)} (${state.lastSavedTime})`;
    }
  }

  function renderPhotoBox() {
    if (state.photoDataUrl) {
      return `
        <label class="photo-frame-3x4" title="Click to preview another 3x4 cm JPG photo locally">
          <img src="${escAttr(state.photoDataUrl)}" alt="3x4 ID Photo Preview" />
          <input type="file" accept="image/jpeg,image/png" class="no-print" data-photo-upload="1" style="display:none" />
        </label>
      `;
    }
    return `
      <label class="photo-frame-3x4" title="Click to test-preview your 3x4 cm photo locally (never uploaded)">
        <div style="font-weight:800;font-size:12px;color:var(--paper-ink)">3 × 4 cm</div>
        <div style="margin-top:4px;line-height:1.35">White BG Photo<br><strong>2027.01–02 新拍</strong><br>JPG ≤ 2MB</div>
        <div class="no-print" style="margin-top:6px;font-size:10px;color:var(--primary);font-weight:700">[Click Preview]</div>
        <input type="file" accept="image/jpeg,image/png" class="no-print" data-photo-upload="1" style="display:none" />
      </label>
    `;
  }


  // ==================== TAB 1: KOREA UNIVERSITY (UWAY 5 PAGES + LOR) ====================
  function renderSimKU() {
    const f = state.form;
    const emailCheck = checkDualEmail(f.emailPrimary, f.emailSecondary);
    const emailStatusBadge = emailCheck.status === "err"
      ? `<div class="f-trap-alert">⛔ ${escHtml(t(I18N.val.emailSameDomain))}</div>`
      : (emailCheck.status === "ok"
          ? `<div style="margin-top:4px;font-size:11.5px;color:var(--green);font-weight:700">${escHtml(t(I18N.val.emailDiffOk))}</div>`
          : `<div style="margin-top:4px;font-size:11.5px;color:var(--amber);font-weight:700">⚠️ ${{
              zh: "必填 2 个不同域名的本人有效邮箱（如 Gmail + Outlook）",
              en: "Enter 2 valid personal emails on DIFFERENT domains (e.g. Gmail + Outlook)",
              fa: "درج ۲ ایمیل معتبر شخصی با دامنه متفاوت الزامی است"
            }[state.lang]}</div>`);

    const photoHtml = renderPhotoBox();
    const hideOtherInReleaseMode = state.printScope === "ku_release" ? "print-hidden-sheet" : "";

    return `
      <div class="sheet-guide-banner ${hideOtherInReleaseMode}">
        <div>
          <strong style="font-size:15px;color:var(--ku-crimson)">${{
            zh: "📄 仿真页 ①–②｜高丽大学 Online Application Form (입학원서 · UWAY 第1–2页)",
            en: "📄 Simulated Pages ①–② | Korea Univ. Online Application Form (UWAY Pages 1–2)",
            fa: "📄 صفحات شبیه‌سازی ۱ و ۲ | فرم ثبت‌نام اینترنتی دانشگاه کره (سامانه UWAY)"
          }[state.lang]}</strong>
          <div style="font-size:12.6px;color:var(--text-3)">${{

  function renderPromptStatHtml(val) {
    const len = (val || "").length;
    const pct = Math.min(100, Math.round((len / 3000) * 100));
    let color = "#64748B";
    let msg = "";
    if (len === 0) {
      color = "#64748B";
      msg = {
        zh: "待输入英文正文（建议 1,500–3,000 字符，含空格）",
        en: "Enter English essay (Target: 1,500–3,000 chars incl. spaces)",
        fa: "متن انگلیسی را وارد کنید (بازه مجاز: ۱,۵۰۰ تا ۳,۰۰۰ کاراکتر)"
      }[state.lang];
    } else if (len < 1500) {
      color = "#D97706";
      const diff = 1500 - len;
      msg = {
        zh: `⚠️ 距 1,500 字符建议下限还差 ${diff} 字符`,
        en: `⚠️ ${diff} more chars needed to reach 1,500 recommended minimum`,
        fa: `⚠️ ${diff} کاراکتر تا رسیدن به کف پیشنهادی ۱,۵۰۰ باقی مانده است`
      }[state.lang];
    } else if (len <= 3000) {
      color = "#0F9D58";
      msg = {
        zh: `✅ 完美处于 1,500–3,000 字符合规区间！（余量 ${3000 - len} 字符）`,
        en: `✅ Optimal 1,500–3,000 char range! (${3000 - len} chars remaining)`,
        fa: `✅ در بازه استاندارد ۱,۵۰۰ تا ۳,۰۰۰ کاراکتر قرار دارد! (${3000 - len} کاراکتر جا دارد)`
      }[state.lang];
    } else {
      color = "#D93025";
      msg = {
        zh: `⛔ 已超出 3,000 字符上限 ${len - 3000} 字符！UWAY 系统会直接截断超出部分！`,
        en: `⛔ Exceeds 3,000-char hard limit by ${len - 3000} chars! UWAY will truncate!`,
        fa: `⛔ ${len - 3000} کاراکتر بیش از سقف مجاز ۳,۰۰۰! سامانه UWAY متن اضافی را قطع می‌کند!`
      }[state.lang];
    }
    return { len, pct, color, msg };
  }

  function triggerDownload(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 150);
  }

  function copyPlainText(txt, btnEl) {
    const done = () => {
      if (!btnEl) return;
      const orig = btnEl.textContent;
      btnEl.textContent = "✓ Copied!";
      setTimeout(() => { btnEl.textContent = orig; }, 1400);
    };
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else {
      fallbackCopy(txt, done);
    }
  }

  function fallbackCopy(txt, cb) {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); if (cb) cb(); } catch (_) {}
    document.body.removeChild(ta);
  }

        const isPending = !fd.readonly && (!String(rawVal).trim() || rawVal === "+98-" || rawVal === "010-");
        const stateCls = fd.readonly ? "" : (isPending ? "is-pending" : (fd.prefilled ? "is-prefilled" : ""));
        const valCheck = fd.validator ? getFieldValidation(fd.validator, fd.key) : { status: "none", msg: "" };

    return `

  function renderActiveSimSheets() {
    if (state.activeUni === "ku") return renderSimKU();
    if (state.activeUni === "hyu") return renderSimHYU();
    if (state.activeUni === "yu") return renderSimYU();
    return renderSimCAU();
  }

  function renderAll() {
    applyRootAttrs();
    renderTopbar();
    const main = document.getElementById("main-root");
    main.innerHTML = `
      ${renderIntakeSection()}
      <div id="sim-header-root">${renderSimHeaderAndTabs()}</div>
      <div id="sim-sheets-root">${renderActiveSimSheets()}</div>
    `;
  }

  // Surgical update when typing inside Master Intake so active <input> never loses cursor/IME focus!
  function refreshIntakeDerivedUI(changedKey, inputEl) {
    const val = state.form[changedKey] || "";
    const isPending = !String(val).trim() || val === "+98-" || val === "010-";
    if (inputEl) {
      inputEl.classList.toggle("is-pending", isPending);
    }

    if (changedKey === "surname" || changedKey === "givenName") {
      const concatEl = document.getElementById("uway-concat-preview");
      if (concatEl) {
        concatEl.value = getUwayName() ? `${getUwayName()}   |   Full: ${getFullName()}` : "";
      }
    }

    const updateValBox = (id, res) => {
      const box = document.getElementById(id);
      if (!box) return;
      if (res.status === "none") {
        box.style.display = "none";
        box.textContent = "";
      } else {
        box.style.display = "block";
        box.className = "val-msg " + res.status;
        box.textContent = res.msg;
      }
    };

    if (changedKey === "passportExpiry") updateValBox("val-passportExpiry", checkPassportExpiry(val));
    if (changedKey === "emailPrimary" || changedKey === "emailSecondary") {
      updateValBox("val-emailSecondary", checkDualEmail(state.form.emailPrimary, state.form.emailSecondary));
    }
    if (changedKey === "rec1Email") updateValBox("val-rec1Email", checkRecEmail(val));
    if (changedKey === "rec2Email") updateValBox("val-rec2Email", checkRecEmail(val));

    const rd = computeReadiness();
    const fillEl = document.getElementById("readiness-bar-fill");
    const txtEl = document.getElementById("readiness-bar-text");
    if (fillEl) fillEl.style.width = rd.pct + "%";
    if (txtEl) txtEl.textContent = `${rd.filled} / ${rd.total} (${rd.pct}%)`;

    const sheetsRoot = document.getElementById("sim-sheets-root");
    if (sheetsRoot) sheetsRoot.innerHTML = renderActiveSimSheets();
  }

  // ==================== EVENT DELEGATION ====================
  document.addEventListener("input", (e) => {
    const intakeInput = e.target.closest("[data-intake-key]");
    if (intakeInput) {
      const k = intakeInput.dataset.intakeKey;
      state.form[k] = intakeInput.value;
      persistFormNow();
      refreshIntakeDerivedUI(k, intakeInput);
      return;
    }

    const hyuTa = e.target.closest("[data-essay-field]");
    if (hyuTa) {
      const k = hyuTa.dataset.essayField;
      state.form[k] = hyuTa.value;
      persistFormNow();
      const stat = document.getElementById("hyu-essay-stat");
      if (stat) {
        const w = hyuTa.value.trim() ? hyuTa.value.trim().split(/\s+/).length : 0;
        stat.textContent = `${hyuTa.value.length} chars · ${w} words`;
      }
      return;
    }

    const cauTa = e.target.closest("[data-cau-prompt]");
    if (cauTa) {
      const k = cauTa.dataset.cauPrompt;
      state.form[k] = cauTa.value;
      persistFormNow();
      const st = renderPromptStatHtml(cauTa.value);
      const cnt = document.getElementById("cnt-" + k);
      const bar = document.getElementById("bar-" + k);
      const msg = document.getElementById("msg-" + k);
      if (cnt) {
        cnt.textContent = `${st.len.toLocaleString()} / 1,500 chars (Max 3,000)`;
        cnt.style.color = st.color;
      }
      if (bar) {
        bar.style.width = st.pct + "%";
        bar.style.background = st.color;
      }
      if (msg) {
        msg.textContent = st.msg;
        msg.style.color = st.color;
      }
      return;
    }

    const inlineInput = e.target.closest("[data-inline-field]");
    if (inlineInput) {
      state.form[inlineInput.dataset.inlineField] = inlineInput.value;
      persistFormNow();
    }
  });

  document.addEventListener("change", (e) => {
    const selField = e.target.closest("[data-select-field]");
    if (selField) {
      state.form[selField.dataset.selectField] = selField.value;
      persistFormNow();
      const sheetsRoot = document.getElementById("sim-sheets-root");
      if (sheetsRoot) sheetsRoot.innerHTML = renderActiveSimSheets();
      return;
    }

    if (e.target.id === "select-print-scope") {
      applyPrintScopeSelection(e.target.value);
      return;
    }

    if (e.target.id === "input-import-json" && e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || "{}"));
          const src = parsed.form && typeof parsed.form === "object" ? parsed.form : parsed;
          Object.keys(INITIAL_FORM_VALUES).forEach(k => {
            if (typeof src[k] === "string") state.form[k] = src[k];
          });
          persistFormNow();
          renderAll();
          showToast("✓ JSON Backup Imported!", false);
        } catch (err) {
          showToast("⛔ Invalid JSON backup file: " + err.message, true);
        }
      };
      reader.readAsText(e.target.files[0]);
      e.target.value = "";
      return;
    }

    const photoInput = e.target.closest("[data-photo-upload]");
    if (photoInput && photoInput.files && photoInput.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        state.photoDataUrl = String(reader.result || "");
        const sheetsRoot = document.getElementById("sim-sheets-root");
        if (sheetsRoot) sheetsRoot.innerHTML = renderActiveSimSheets();
      };
      reader.readAsDataURL(photoInput.files[0]);
    }
  });

  function applyPrintScopeSelection(scope) {
    state.printScope = scope;
    state.a4Preview = true;
    if (scope === "ku_release") state.activeUni = "ku";
    else if (scope === "yu_confirm") state.activeUni = "yu";
    else if (scope === "cau_consent") state.activeUni = "cau";
    safeSet("arsan_forms_uni", state.activeUni);
    renderAll();
  }

  document.addEventListener("click", (e) => {
    const langBtn = e.target.closest(".lang-btn[data-lang]");
    if (langBtn) {
      const next = langBtn.dataset.lang;
      if (VALID_LANGS.includes(next)) {
        state.lang = next;
        safeSet(LANG_KEY, next);
        renderAll();
      }
      return;
    }

    if (e.target.closest("#btn-theme-toggle")) {
      state.theme = state.theme === "dark" ? "light" : "dark";
      safeSet(THEME_KEY, state.theme);
      renderAll();
      return;
    }

    if (e.target.closest("#btn-toggle-intake")) {
      state.intakeCollapsed = !state.intakeCollapsed;
      renderAll();
      return;
    }

    const resetBtn = e.target.closest("#btn-reset-defaults");
    if (resetBtn) {
      if (!resetArmed) {
        resetArmed = true;
        resetBtn.textContent = "⚠️ Click Again to Confirm Reset";
        resetBtn.style.borderColor = "var(--red)";
        resetBtn.style.color = "var(--red)";
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          resetArmed = false;
          renderAll();
        }, 4000);
      } else {
        resetArmed = false;
        clearTimeout(resetTimer);
        state.form = Object.assign({}, INITIAL_FORM_VALUES);
        persistFormNow();
        renderAll();
        showToast("✓ Restored initial academic defaults", false);
      }
      return;
    }

    if (e.target.closest("#btn-export-txt")) {
      const content = buildCharlotteTxtPacket();
      triggerDownload("Arsan_2027_Seoul_Charlotte_Portal_CopyPaste_Pack.txt", content, "text/plain;charset=utf-8");
      showToast("✓ Exported Charlotte .txt Copy-Paste Packet!", false);
      return;
    }

    if (e.target.closest("#btn-export-json")) {
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        version: "arsan_forms_v1",
        form: state.form
      }, null, 2);
      triggerDownload("Arsan_2027_Forms_Backup.json", payload, "application/json;charset=utf-8");
      showToast("✓ Exported .json Backup!", false);
      return;
    }

    if (e.target.closest("#btn-print-a4")) {
      state.a4Preview = !state.a4Preview;
      if (!state.a4Preview) state.printScope = "all";
      renderAll();
      window.scrollTo(0, 0);
      return;
    }

    if (e.target.closest("#btn-exit-print-preview")) {
      state.a4Preview = false;
      state.printScope = "all";
      renderAll();
      return;
    }

    if (e.target.closest("#btn-trigger-window-print")) {
      window.print();
      return;
    }

    const singlePrintBtn = e.target.closest("[data-print-single]");
    if (singlePrintBtn) {
      applyPrintScopeSelection(singlePrintBtn.dataset.printSingle);
      const targetIds = {
        ku_release: "sheet-ku-release",
        yu_confirm: "sheet-yu-confirm",
        cau_consent: "sheet-cau-consent"
      };
      const tid = targetIds[singlePrintBtn.dataset.printSingle];
      const targetEl = tid ? document.getElementById(tid) : null;
      if (targetEl) {
        const top = Math.max(0, Math.round(window.scrollY + targetEl.getBoundingClientRect().top - 110));
        window.scrollTo(0, top);
      }
      return;
    }

    const copyBtn = e.target.closest("[data-copy-field]");
    if (copyBtn) {
      const key = copyBtn.dataset.copyField;
      copyPlainText(state.form[key] || "", copyBtn);
      return;
    }

    const uniBtn = e.target.closest(".uni-tab-btn[data-uni]");
    if (uniBtn) {
      const u = uniBtn.dataset.uni;
      if (VALID_UNIS.includes(u)) {
        state.activeUni = u;
        if (state.printScope !== "all") state.printScope = "all";
        safeSet("arsan_forms_uni", u);
        const hdrRoot = document.getElementById("sim-header-root");
        const sheetsRoot = document.getElementById("sim-sheets-root");
        if (hdrRoot) hdrRoot.innerHTML = renderSimHeaderAndTabs();
        if (sheetsRoot) sheetsRoot.innerHTML = renderActiveSimSheets();
      }
      return;
    }
  });

  let resetArmed = false;
  let resetTimer = null;

  function showToast(msg, isErr) {
    let el = document.getElementById("forms-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "forms-toast";
      el.className = "no-print";
      el.style.cssText = "position:fixed;bottom:20px;right:20px;z-index:200;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,0.25);transition:opacity 0.2s";
      document.body.appendChild(el);
    }
    el.style.background = isErr ? "#D93025" : "#0F172A";
    el.style.color = "#FFFFFF";
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = "0"; }, 3000);
  }
  renderAll();
})();
