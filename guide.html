<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan M.S. Fall 2027 — 韩国顶尖大学院全奖申请三语交互指南 (中文 · English · فارسی)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EFF6FF;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --text: #0F172A;
  --text-2: #334155;
  --text-3: #64748B;
  --primary: #1A73E8;
  --primary-soft: rgba(26, 115, 232, 0.10);
  --teal: #0D9488;
  --teal-soft: rgba(13, 148, 136, 0.10);
  --green: #0F9D58;
  --green-soft: #E6F4EA;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --orange: #FA903E;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --red: #D93025;
  --red-soft: #FCE8E6;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --radius: 14px;
  --radius-sm: 9px;
}

html[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #151F32;
  --surface-2: #1E293B;
  --surface-3: #1E3A5F;
  --border: #2D3D56;
  --border-strong: #475569;
  --text: #F1F5F9;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --primary: #60A5FA;
  --primary-soft: rgba(96, 165, 250, 0.15);
  --green-soft: rgba(16, 185, 129, 0.16);
  --amber-soft: rgba(245, 158, 11, 0.16);
  --purple-soft: rgba(167, 139, 250, 0.16);
  --red-soft: rgba(239, 68, 68, 0.18);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  line-height: 1.68;
  font-size: 14.5px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

html[lang="fa"] body {
  font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', 'Inter', sans-serif;
  line-height: 1.88;
  font-size: 15px;
}

/* Prevent long URLs/emails/identifiers from pushing mobile containers wide */
.section-card, .comp-card, .insp-item, .insp-v, .tuition-sub, .tuition-note,
.check-label, .metro-card, .hero-priority-alert, li, p, td {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Reusable Responsive Grids */
.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.grid-3col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 820px) {
  .grid-2col, .grid-3col { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

/* Red physical original callout */
.phys-red {
  color: #C5221F;
  background: rgba(217, 48, 37, 0.09);
  border-bottom: 1.5px solid rgba(217, 48, 37, 0.42);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
html[data-theme="dark"] .phys-red {
  color: #FCA5A5;
  background: rgba(239, 68, 68, 0.20);
  border-bottom-color: rgba(248, 113, 113, 0.55);
}

code.ic {
  font-family: 'JetBrains Mono', 'Consolas', monospace;
  font-size: 0.90em;
  background: rgba(148, 163, 184, 0.18);
  padding: 1px 5px;
  border-radius: 4px;
  direction: ltr;
  unicode-bidi: isolate;
}

/* Inline clickable glossary term highlight */
.term-hl {
  border-bottom: 1.5px dashed #0284C7;
  background: rgba(14, 165, 233, 0.09);
  color: inherit;
  padding: 0 3px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.term-hl:hover {
  background: rgba(14, 165, 233, 0.22);
  border-bottom-style: solid;
}
body.hl-off .term-hl {
  border-bottom: none;
  background: transparent;
  padding: 0;
  cursor: text;
}

/* Sticky Topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .topbar {
  background: rgba(21, 31, 50, 0.94);
}

.topbar-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #1A73E8, #0D9488);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(26, 115, 232, 0.28);
  flex-shrink: 0;
}
.brand-text-main {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  line-height: 1.25;
}
.brand-text-sub {
  font-size: 12px;
  color: var(--text-3);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.lang-group {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
  min-height: 32px;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(26, 115, 232, 0.30);
}

.ctrl-pill {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  font-family: inherit;
  min-height: 34px;
}
.ctrl-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.ctrl-pill.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* Primary Navigation Tabs */
.nav-tabs-bar {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-tabs-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-3);
  padding: 10px 13px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.18s;
  font-family: inherit;
  flex-shrink: 0;
}
.tab-btn:hover {
  color: var(--text);
  background: var(--surface-2);
  border-radius: 8px 8px 0 0;
}
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
.tab-badge-count {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}

/* Main Container */
.main-wrap {
  max-width: 1320px;
  margin: 22px auto 64px;
  padding: 0 20px;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.hero-banner {
  background: linear-gradient(135deg, rgba(26,115,232,0.08), rgba(13,148,136,0.08));
  border: 1px solid rgba(26,115,232,0.22);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.hero-badge {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 10px;
}
.hero-title {
  margin: 0 0 10px;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.35;
}
.hero-priority-alert {
  background: var(--surface);
  border-inline-start: 4px solid var(--red);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-2);
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.kpi-val {
  font-size: 23px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}
.kpi-sub {
  font-size: 13.5px;
  font-weight: 700;
  margin-top: 4px;
  color: var(--text);
}
.kpi-detail {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* Priority Cascade Funnel */
.cascade-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.cascade-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-top: 4px solid var(--primary);
  border-radius: 12px;
  padding: 15px;
}
.cascade-rank {
  display: inline-block;
  font-weight: 800;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  color: #fff;
  margin-bottom: 8px;
}
.cascade-uni { font-weight: 800; font-size: 15.5px; margin-bottom: 3px; }
.cascade-dept { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
.cascade-pis { font-size: 13.2px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.cascade-tag {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
}

/* Section Headings */
.sec-title {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.38;
}
.sec-sub {
  margin: 0 0 16px;
  font-size: 13.4px;
  color: var(--text-3);
}

/* Stacked Tuition & Workload Bars */
.tuition-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12.8px;
  font-weight: 600;
}
.leg-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
  vertical-align: middle;
  margin-inline-end: 6px;
}
.tuition-axis {
  direction: ltr;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  padding: 0 2px 6px;
  border-bottom: 1px dashed var(--border-strong);
  margin-bottom: 12px;
}
.tuition-row {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.16s;
  background: var(--surface-2);
}
.tuition-row:hover, .tuition-row.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.tuition-row-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.tuition-school-name { font-weight: 800; font-size: 15px; }
.tuition-pill {
  font-size: 11.8px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}
.tuition-sub { font-size: 12.8px; color: var(--text-3); margin-bottom: 9px; }

.bar-track-ltr {
  direction: ltr;
  width: 100%;
  height: 32px;
  background: rgba(148, 163, 184, 0.16);
  border-radius: 8px;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
}
.bar-seg-blue, .bar-seg-orange {
  height: 100%;
  color: #fff;
  font-size: 11.8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}
.bar-seg-blue { background: linear-gradient(90deg, #1A73E8, #2563EB); }
.bar-seg-orange { background: linear-gradient(90deg, #FA903E, #EA580C); }

.bar-total-tag {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  padding: 0 8px;
  white-space: nowrap;
}
.mobile-bar-summary {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
  font-size: 11.5px;
  font-weight: 700;
}
.tuition-note {
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 8px;
}

.inspector-drawer {
  background: var(--surface-3);
  border: 1px solid rgba(26, 115, 232, 0.28);
  border-radius: 12px;
  padding: 15px 16px;
  margin-top: 14px;
}
.inspector-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.insp-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
}
.insp-k { font-size: 11.5px; font-weight: 700; color: var(--text-3); margin-bottom: 3px; }
.insp-v { font-size: 13px; font-weight: 600; color: var(--text); }

/* Compliance & Card Grids */
.compliance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.comp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.pill-red { background: var(--red-soft); color: var(--red); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill-green { background: var(--green-soft); color: var(--green); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.comp-row { margin-bottom: 10px; font-size: 13.2px; }
.comp-k { font-weight: 700; color: var(--text); display: block; margin-bottom: 2px; }

/* Swipe Hint Pill for Mobile Horizontal Scroll Areas */
.mobile-swipe-hint {
  display: none;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 5px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

/* Responsive Tables */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 820px;
  font-size: 13px;
}
.data-table th {
  background: var(--surface-2);
  color: var(--text);
  font-weight: 700;
  text-align: start;
  padding: 11px 13px;
  border-bottom: 2px solid var(--border-strong);
  white-space: pre-line;
  vertical-align: top;
}
.data-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: pre-line;
}
.data-table tr:last-child td { border-bottom: none; }

/* 5-Step Pipeline Stepper */
.stepper-rail {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.step-node {
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 13px;
  cursor: pointer;
  transition: all 0.16s;
}
.step-node:hover, .step-node.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.step-num-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.step-num {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.step-days {
  font-size: 11.2px;
  font-weight: 700;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 8px;
  border-radius: 999px;
}
.step-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.step-loc { font-size: 12px; color: var(--text-3); }

/* 3-Tier Triage & All-Expanded 5-Step Walkthrough Cards */
.triage-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}
.triage-card {
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-inline-start-width: 5px;
  border-radius: 12px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.triage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.triage-chain {
  font-size: 12.8px;
  font-weight: 700;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  padding: 7px 11px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.triage-docs {
  font-size: 13.4px;
  white-space: pre-line;
  color: var(--text);
}

.steps-expanded-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 12px;
}
.step-full-card {
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: 12px;
  padding: 16px 18px;
  scroll-margin-top: 118px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.18s, box-shadow 0.18s;
}
.step-full-card.highlight-target {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}
.step-meta-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
  margin: 10px 0 12px;
  font-size: 12.5px;
}

/* Architecture 3-Column Visual */
.arch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.25fr;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 960px) {
  .arch-grid { grid-template-columns: minmax(0, 1fr); }
}
.arch-col {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.arch-col-head {
  font-weight: 800;
  font-size: 14px;
  color: var(--primary);
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--border-strong);
}
.arch-box {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
}
.arch-engine {

ionship and foreign nationality.", "fa": "سند رسمی هویتی و نسبی در ایران. برای اثبات غیردوگانه بودن تابعیت و رابطه فرزند و والدین در دانشگاه‌های کره، ترجمه رسمی انگلیسی هر سه جلد شناسنامه (متقاضی، پدر و مادر) با تأیید دادگستری و وزارت خارجه کافی است."}, "tip": {"zh": "身份簿只需办到“伊朗司法部+外交部双认证”即为最终成品，无需送韩国大使馆盖领事章！", "en": "Only requires Iranian MOJ + MFA stamps; Korean Embassy consular legalization is NOT needed for Shenasnameh.", "fa": "شناسنامه‌ها فقط به مهر دادگستری و وزارت خارجه نیاز دارند و نیازی به مهر کنسولی سفارت کره (و پرداخت دلار) ندارند!"}}, {"id": "consular_confirm", "cat": "iran", "term": {"zh": "韩国驻伊使馆领事认证 (영사확인)", "en": "Korean Embassy Consular Legalization (영사확인)", "fa": "تأییدیه کنسولی سفارت کره جنوبی (영사확인)"}, "aliases": ["영사확인", "领事认证", "韩国驻德黑兰大使馆领事认证", "韩国使馆领事认证"], "def": {"zh": "因伊朗非海牙（Apostille）成员国，学历与成绩单经伊朗司法部+外交部双认证后，须送交德黑兰 Vanak 广场韩国驻伊朗大使馆领事处加盖领事确认章（영사확인），韩国高校与法务部才承认其法律效力。", "en": "Because Iran is not part of the Hague Apostille Convention, academic documents authenticated by Iran's MOJ & MFA must receive final consular legalization at the Korean Embassy in Tehran (Vanak Sq.).", "fa": "از آنجا که ایران عضو کنوانسیون آپوستیل نیست، مدارک تحصیلی پس از تأیید دادگستری و وزارت خارجه باید به بخش کنسولی سفارت کره جنوبی در تهران (میدان ونک، خیابان شیخ بهایی شمالی، کوچه دانشور غربی، پلاک ۲) ارائه شوند."}, "tip": {"zh": "周日至周四 08:30–11:30 递交，2–3工作日出件，每份仅收 $4 USD 崭新无折痕美钞，不限申请批次（采用1月3套+4月1套分批策略）。", "en": "Sun–Thu 08:30–11:30 drop-off, 2–3 working days turnaround, $4 USD crisp cash per document, unlimited batches (3 sets in Jan + 1 set in Apr).", "fa": "یکشنبه تا پنجشنبه ۸:۳۰ تا ۱۱:۳۰ تحویل مدارک، ۲ تا ۳ روز کاری زمان بررسی، هزینه ۴ دلار اسکناس نو و بدون تاخوردگی به ازای هر مدرک و بدون محدودیت دفعات مراجعه."}}, {"id": "etrf", "cat": "korea", "term": {"zh": "机考雅思电子成绩单 (e-TRF)", "en": "Electronic Test Report Form (IELTS e-TRF)", "fa": "کارنامه الکترونیکی آیلتس کامپیوتری (e-TRF)"}, "aliases": ["e-TRF", "电子成绩单"], "def": {"zh": "机考雅思（IELTS on Computer）考后1–5天在考生后台（Test Taker Portal）签发的官方PDF成绩单，底部印有唯一防伪核验码（TRF Number），各大学可通过雅思官方核验系统在线查验真伪。", "en": "The official verifiable PDF score report issued 1–5 days after computer-delivered IELTS on the Test Taker Portal, featuring a unique TRF verification number.", "fa": "کارنامه رسمی PDF آیلتس کامپیوتری که ۱ تا ۵ روز پس از آزمون در پورتال زبان‌آموز صادر می‌شود و دارای کد رهگیری و اصالت‌سنجی (TRF Number) در پایین صفحه است."}, "tip": {"zh": "套磁可邮件发给教授；正式网申严禁私人邮件发招生办！高丽/汉阳走后台免费电子送分+首尔Charlotte激光彩打装袋；延世仅系统上传PDF（禁机构送分）。", "en": "Emailing PDF to professors is fine, but NEVER email admissions offices! Use free Portal e-delivery + Seoul color print for KU/HYU; upload PDF only for YU.", "fa": "ارسال PDF با ایمیل شخصی برای اساتید مجاز است، اما برای دفتر پذیرش دانشگاه‌ها اکیداً ممنوع است! برای KU/HYU ارسال الکترونیکی رایگان از پورتال + چاپ رنگی لیزری در سئول؛ برای یونسی فقط آپلود در سایت."}}, {"id": "korean_waiver", "cat": "korea", "term": {"zh": "韩语标准免除申请书 (한국어기준 면제 요청서)", "en": "Korean Proficiency Exemption Form (한국어기준 면제 요청서)", "fa": "فرم معافیت از مدرک زبان کره‌ای (한국어기준 면제 요청서)"}, "aliases": ["한국어기준 면제 요청서", "韩语标准免除申请书", "免韩语证明", "免韩语表"], "def": {"zh": "汉阳大学特有制度：未持有TOPIK 4级的外国新生默认在注册后被强制休学（휴학）；唯有汉阳指导教授在4–5月院系审查期向校方内部签交此表，学生才能凭英语成绩在9月正常选课进组。", "en": "Hanyang-specific rule: newly admitted international students without TOPIK Level 4 are placed on mandatory leave of absence unless their prospective Hanyang advisor internally signs and submits this waiver during April–May departmental review.", "fa": "قانون اختصاصی دانشگاه هانیانگ: دانشجویان بدون مدرک TOPIK سطح ۴ پس از ثبت‌نام به مرخصی اجباری فرستاده می‌شوند، مگر اینکه استاد راهنمای هانیانگ در بررسی داخلی آوریل–مه این فرم معافیت را امضا و رد کند."}, "tip": {"zh": "高丽、延世、中央3校凭IELTS ≥ 5.5制度自动免韩语；仅汉阳大学需在2月Zoom面试向导师确认并在3月报备考号！", "en": "KU, YU, and CAU automatically exempt Korean with IELTS ≥ 5.5; ONLY Hanyang requires asking your professor in Feb Zoom to submit this internal form.", "fa": "دانشگاه‌های کره، یونسی و چونگ‌آنگ با آیلتس ۵.۵ به بالا خودکار an flag your file during departmental screening.", "fa": "پس از ثبت‌نام در هانیانگ، کد 수험번호 را سریعاً برای استاد ایمیل کنید تا در مرحله بررسی دانشکده پرونده شما را پیدا و فرم معافیت زبان را امضا کند."}}, {"id": "scholaro", "cat": "korea", "term": {"zh": "Scholaro 逐科绩点换算母校鲜章件 (HYU/CAU免领事认证)", "en": "University-Stamped Scholaro GPA Report (Exempt from Consular Stamp)", "fa": "گزارش معادل‌سازی معدل Scholaro با مهر زنده دانشگاه (معاف از مهر سفارت)"}, "aliases": ["Scholaro", "scholaro.com"], "def": {"zh": "汉阳大学（HYU）与中央大学（CAU）简章均明文规定：针对20分制成绩单，在 scholaro.com 逐学期录入全部课程打印换算单后，只要加盖毕业大学教务处官方英文鲜章即直接具备官方效力，免做驻伊使馆领事认证！且汉阳漏交百分制换算原件将直接取消 HISP 全奖参评资格。", "en": "Both Hanyang (HYU) and Chung-Ang (CAU) guides explicitly state that a 10-semester scholaro.com GPA report bearing IAU Ardabil Registrar's official wet-ink English stamp is directly valid WITHOUT Korean Embassy legalization! Omitting percentage conversion at HYU voids HISP eligibility.", "fa": "دفترچه هر دو دانشگاه هانیانگ و چونگ‌آنگ صراحتاً اعلام کرده گزارش معادل‌سازی ۱۰ ترم از سایت scholaro.com به محض ممهور شدن به مهر زنده انگلیسی آموزش دانشگاه مبدأ، مستقیماً معتبر بوده و از تأیید کنسولی سفارت کره معاف است! نبودن معادل‌سازی درصدی در هانیانگ باعث حذف از بورسیه HISP می‌شود."}, "tip": {"zh": "防过期铁律：高丽明令仅认可提交截止（~03.19）前3个月内签发件，严禁在2026.12.20前过早盖章！统一在 2027.01.10–02.04 打印3份全10学期逐科单在分校教务处加盖英文鲜章（配合母校87.50%官方证明一套通杀4校）！", "en": "Anti-expiration rule: KU only accepts documents issued within 3 months of ~Mar 19—NEVER stamp before Dec 20, 2026! Print & wet-stamp 3 copies of your 10-sem Scholaro sheet during Jan 10–Feb 4, 2027 to satisfy all 4 schools!", "fa": "قانون ضد انقضا: دانشگاه کره فقط مدارک صادره در ۳ ماه منتهی به ~۱۹ مارس را می‌پذیرد؛ مطلقاً قبل از ۲۰ دسامبر مهر نزنید! در بازه ۱۰ ژانویه تا ۴ فوریه ۲۰۲۷ سه نسخه کامل ۱۰ ترم Scholaro را به مهر زنده انگلیسی واحد اردبیل برسانید."}}, {"id": "coa_d2", "cat": "korea", "term": {"zh": "标准入学许可书 (CoA) 与 D-2 留学签证", "en": "Certificate of Admission (CoA) & D-2 Student Visa", "fa": "گواهی پذیرش ا 完学位就走、无法长期合作”的顾虑。", "en": "State this right after your 30-second Korean greeting in Zoom interviews to show long-term commitment as a lab alumnus in Korea.", "fa": "در همان دقیقه اول مصاحبه زوم پس از سلام به زبان کره‌ای این هدف را مطرح کنید تا خیال استاد از تعهد بلندمدت شما راحت شود."}}, {"id": "hisp", "cat": "funding", "term": {"zh": "汉阳国际优秀奖学金 (HISP) 与理工科奖学金", "en": "Hanyang International Scholarship (HISP) & STEM Scholarship", "fa": "بورسیه بین‌المللی هانیانگ (HISP) و بورسیه مهندسی/علوم پایه"}, "aliases": ["HISP", "汉阳理工科外国人奖学金"], "def": {"zh": "汉阳大学两大校级学费减免：① HISP按书审综合评定减免4学期100%/70%/50%学费（门槛：前序绩点百分制≥80%，必须交官方百分制换算证明原件）；② 汉阳理工科外国人奖学金对录取理工科研究生保底减免50%入学金+50%学费（维持GPA ≥ 3.0）。", "en": "Hanyang's two tuition waivers: (1) HISP awards 100%/70%/50% waiver for 4 semesters (requires ≥80/100 GPA & physical percentage conversion certificate); (2) STEM Scholarship guarantees 50% admission + 50% tuition waiver automatically.", "fa": "دو بورسیه شهریه دانشگاه هانیانگ: ۱) بورسیه رقابتی HISP با معافیت ۱۰۰٪، ۷۰٪ یا ۵۰٪ برای ۴ ترم (نیازمند معدل بالای ۸۰٪ و ارائه اصل گواهی معادل‌سازی درصدی ۸۷.۵۰٪)؛ ۲) بورسیه تضمینی رشته‌های علوم و مهندسی با ۵۰٪ تخفیف شهریه و ورودی."}, "tip": {"zh": "漏交 D10（87.50%百分制换算原件或母校英文鲜章 Scholaro 报告）将直接丧失 HISP 参评资格，Charlotte 装汉阳信封时务必逐页核对！", "en": "Omitting D10 (87.50% percentage conversion original or IAU wet-stamped Scholaro report) disqualifies you from HISP—double-check Hanyang's mail packet!", "fa": "فراموش کردن مدرک D10 (اصل گواهی معادل‌سازی ۸۷.۵۰٪ یا گزارش ممهور Scholaro) باعث حذف مستقیم از رقابت HISP می‌شود؛ هنگام بسته‌بندی پاکت هانیانگ حتماً چک کنید."}}, {"id": "ku_global", "cat": "funding", "term": {"zh": "高丽大学 Global Leader A类 / 理工C类奖学金", "en": "Korea Univ. Global Leader (Type A) & STEM (Type C) Scholarships", "fa": "بورسیه Global Leader نوع A و علوم پایه نوع C دانشگاه کره"}, "aliases": ["Global Leader A类", "理工科 C类奖学金", "C类奖学金", "理工 C类校奖"], "def": {"zh": "高丽大学外国人研究生校奖：C类（CGPA ≥ 3.14/4.0 或 ≥85% + IELTS ≥ 6.0）首学期免65%学费（不免入学金）；A类（CGPA ≥ 3.57/4.0 或 ≥90% + IELTS ≥ 7.0）免100%入学金与学费+月发50万韩元。第2学期起每学期凭高丽在读GPA（C类≥3.5/4.5，A类≥4.0/4.5）续申，免重交雅思！", "en": "KU international scholarships: Type C (CGPA ≥ 85% + IELTS ≥ 6.0) waives 65% tuition in Sem 1; Type A (CGPA ≥ 90% + IELTS ≥ 7.0) waives 100% admission + tuition + 500k KRW/mo. From Sem 2, renewal depends solely on KU GPA (≥4.0/4.5 upgrades to Type A without re-submitting IELTS!).", "fa": "بورسیه‌های دانشگاه کره: نوع C (معدل بالای ۸۵٪ + آیلتس ۶.۰) شامل ۶۵٪ معافیت شهریه ترم اول است (کامل در دسترس آرسان)؛ نوع A شامل ۱۰۰٪ معافیت شهریه و ورودی است. از ترم دوم، ارتقا به نوع A فقط با معدل داخل دانشگاه کره (۴.۰ از ۴.۵) و بدون نیاز مجدد به آیلتس انجام می‌شود!"}, "tip": {"zh": "第1学期剩余35%学费+入学金差额（共358.26万KRW）在2月面试温和确认由 #2 정원영 教授课题RA覆盖即可；绝口不提教授财政担保签字表！", "en": "Politely confirm in Feb Zoom whether Prof. Jung's RA stipend covers the 3.58M KRW Sem 1 gap; NEVER ask the professor to sign a financial sponsorship form.", "fa": "در مصاحبه فوریه محترمانه بپرسید آیا حقوق RA آزمایشگاه مابه‌التفاوت ۳.۵۸ میلیون وونی ترم اول را پوشش می‌دهد؛ هرگز از استاد امضای فرم ضمانت مالی نخواهید."}}, {"id": "cayss", "cat": "funding", "term": {"zh": "中央大学青年科学家全奖 (CAYSS)", "en": "CAU Young Scientist Scholarship (CAYSS)", "fa": "بورسیه کامل دانشمندان جوان دانشگاه چونگ‌آنگ (CAYSS)"}, "aliases": ["CAYSS", "CAYSS推荐书"], "def": {"zh": "中央大学理工医药顶级全额奖学金：凭本科CGPA ≥ 80% + IELTS ≥ 5.5 + 中央大专职教授签署《CAYSS推荐书》，直接免报名费+免入学金+免4学期100%学费（药学系基准951.95万KRW/学期），且校规强制导师每月配套 ≥ 50万韩元生活津贴。", "en": "CAU's flagship STEM/Pharmacy fellowship: waives application fee, admission fee, and 100% tuition for 4 semesters, plus mandates ≥500,000 KRW/month stipend from the advisor upon signing the CAYSS Recommendation Form.", "fa": "بورسیه طلایی دانشگاه چونگ‌آنگ ویژه رشته‌های علوم و داروسازی: با تأیید استاد راهنما (فرم توصیه‌نامه CAYSS)، کل هزینه اپلای، ورودی و ۱۰۰٪ شهریه ۴ ترم بخشیده شده و استاد موظف به پرداخت حداقل ۵۰۰ هزار وون کمک‌هزینه ماهانه است."}, "tip": {"zh": "维持条件：每学期GPA ≥ 3.5 + 毕业1年内发表1篇独立于学位论文的JCR期刊论文；公证件严守90天红线（4月初补办第2批原件专供）。", "en": "Requires maintaining ≥3.5 GPA and publishing 1 JCR paper within 1 year of graduation; notarized docs must be <90 days old (handled via Apr Batch 2).", "fa": "شرط تداوم: معدل بالای ۳.۵ در هر ترم و چاپ ۱ مقاله JCR تا یک سال پس از فارغ‌التحصیلی؛ تاریخ ترجمه رسمی مدارک نباید بیش از ۹۰ روز گذشته باشد."}}, {"id": "bk21", "cat": "funding", "term": {"zh": "韩国国家BK21研究团与RA课题劳务津贴", "en": "Brain Korea 21 (BK21) & Lab RA Stipend", "fa": "طرح ملی پژوهش BK21 و حقوق دستیار پژوهشی (RA)"}, "aliases": ["BK21", "BK21-BIO4", "RA", "研究津贴"], "def": {"zh": "BK21（Brain Korea 21）是韩国教育部资助顶尖研究生院院系的国家级人才基金，叠加导师主持的科技部（NRF）/保健福祉部课题劳务费（Research Assistantship, RA），是韩国理工医药硕士覆盖剩余学费与每月生活费的核心资金池。", "en": "Brain Korea 21 is South Korea's flagship national graduate research grant. Combined with PI research grants (NRF / K-Moonshot / K-ARPA-H), RA stipends fund living expenses and cover any tuition not waived by university scholarships.", "fa": "طرح کلان دولت کره برای حمایت مالی از تحصیلات تکمیلی در دانشگاه‌های برتر که در کنار گرنت‌های تحقیقاتی استاد (NRF و غیره)، منبع اصلی پرداخت حقوق ماهانه دانشجو (RA) و پوشش کامل مابه‌التفاوت شهریه است."}, "tip": {"zh": "本报告锁定的5位导师全部背靠BK21研究团与国家级大课题，具备充足的经费兑现能力。", "en": "All 5 target professors belong to BK21 research groups backed by major national grants.", "fa": "هر ۵ استاد هدف در این گزارش عضو گروه‌های پژوهشی BK21 بوده و دارای گرنت‌های فعال دولتی هستند."}}, {"id": "dry_lab_intern", "cat": "funding", "term": {"zh": "无薪远程干实验预实习 (Remote Dry-Lab Pre-Internship)", "en": "Remote Dry-Lab Pre-Enrollment Internship", "fa": "پیش‌کارآموزی تحقیقاتی از راه دور (محاسباتی / Dry-Lab)"}, "aliases": ["远程干实验预实习", "进组前实习", "Remote Dry-Lab Pre-Internship", "Remote Pre-Internship"], "def": {"zh": "针对汉阳 #1a 남진우 教授官网“强烈建议入学前完成3–6个月实验室实习”的跨国破局策略：因人在伊朗等签证无法赴韩坐班，主动提议在2027年3月—8月通过互联网远程跑通组内公开RNA序列/单细胞代码与文献复现。", "en": "Strategic solution for labs like HYU BIG Lab (#1a Prof. Nam) that recommend 3–6 months of pre-enrollment internship: completing computational sequence/data pipelines remotely from Iran between March and August 2027 before flying to Seoul.", "fa": "راهکار هوشمندانه برای آزمایشگاه‌هایی مثل BIG Lab هانیانگ که ۳ تا ۶ ماه کارآموزی پیش از ورود توصیه می‌کنند: از آنجا که حضور فیزیکی قبل از ویزا ممکن نیست، پیشنهاد می‌دهید از مارس تا آگوست ۲۰۲۷ پایپ‌لاین‌های محاسباتی و مقالات آزمایشگاه را به صورت ریموت اجرا و تمرین کنید."}, "tip": {"zh": "这招对所有5位导师都是绝杀加分项——在首封套磁信末尾和Zoom面试收尾时主动请求导师指派3–8月前置学习书单与小任务！", "en": "Ask every prospective advisor in both your initial email and Zoom wrap-up for a Mar–Aug reading/coding prep list.", "fa": "در انتهای ایمیل اول و ۵ دقیقه پایانی مصاحبه زوم از استاد بخواهید مقالات و ابزارهای موردنیاز برای تمرین در بازه مارس تا آگوست را مشخص کند."}}, {"id": "epitope_cadd", "cat": "bio_ai", "term": {"zh": "多表位疫苗设计与 MVD 3D分子对接 (M0基座)", "en": "Multi-Epitope Vaccine Design & MVD 3D Docking (M0 Seed)", "fa": "طراحی واکسن چنداپیتوپی و داکینگ سه‌بعدی در MVD (پروژه پایه M0)"}, "aliases": ["Molegro Virtual Docker", "MVD", "NetMHCpan-4.1", "VaxiJen 2.0", "AllerTOP", "ToxinPred", "3Drefine", "ProtParam", "SWISS-MODEL", "py3Dmol", "多表位疫苗"], "def": {"zh": "利用免疫信息学全链条工具（NetMHCpan-4.1/IIpan-4.0预测MHC结合、VaxiJen 2.0 > 0.5筛抗原性、AllerTOP v.2.0排致敏、ToxinPred排毒、ProtParam算理化稳定度）构建多表位疫苗，经SWISS-MODEL与3Drefine精修三维结构后，在图形对接软件 Molegro Virtual Docker (MVD) 中完成免疫受体（HLA/TLR4）三维结合对接。", "en": "Full immunoinformatics pipeline screening peptides via NetMHCpan-4.1/IIpan-4.0, VaxiJen 2.0 (>0.5), AllerTOP v.2.0, ToxinPred, and ProtParam, refining 3D models with SWISS-MODEL & 3Drefine, and executing receptor docking (HLA/TLR4) in Molegro Virtual Docker (MVD).", "fa": "فرآیند کامل ایمونوانفورماتیک با ابزارهای NetMHCpan، VaxiJen 2.0 (>0.5)، AllerTOP v.2.0، ToxinPred و ProtParam، بهینه‌سازی ساختار سه‌بعدی در SWISS-MODEL و 3Drefine و انجام داکینگ مولکولی با گیرنده‌های ایمنی در نرم‌افزار Molegro Virtual Docker (MVD)."}, "tip": {"zh": "M0（11.24–11.30）100%兑现已结业的 40+ Hours《Computational Vaccine Design & Immunoinformatics》课程证书，并为M1供逆翻译CDS、为M2供保守抗原注释、为M4复用MVD对接流程、为M5供肿瘤新抗原肽段！", "en": "M0 (Nov 24–30) directly validates Arsan's completed 40+ Hours 'Computational Vaccine Design & Immunoinformatics' certificate and feeds M1, M2, M4 (MVD docking), and M5!", "fa": "پروژه M0 (۲۴ تا ۳۰ نوامبر) مستقیماً گواهی پایان‌دوره +۴۰ ساعته «طراحی محاسباتی واکسن و ایمونوانفورماتیک» را اثبات کرده و خوراک مستقیم پروژه‌های M1، M2، M4 و M5 را تأمین می‌کند!"}}, {"id": "utr_mfe_cnn", "cat": "bio_ai", "term": {"zh": "5'-UTR 最小折叠自由能 (MFE) 与 shRNAI 1D-CNN", "en": "5'-UTR Minimum Free Energy (MFE) & 1D-CNN (shRNAI)", "fa": "انرژی آزاد تاخوردگی 5'-UTR (MFE) و شبکه کانولوشنی shRNAI"}, "aliases": ["5'-UTR", "MFE", "ViennaRNA", "shRNAI", "Conv1d"], "def": {"zh": "mRNA编码区前端的5'非翻译区（5'-UTR）决定了核糖体能否顺利结合并高效翻译蛋白质。用ViennaRNA计算其二级结构最小折叠自由能（MFE，越负越稳定，帽端过度折叠反而阻碍核糖体），并结合一维卷积神经网络（1D-CNN，对标#1a 남진우教授2025 shRNAI架构）预测核糖体载荷（MRL）。", "en": "The 5' Untranslated Region governs mRNA translation efficiency. ViennaRNA computes secondary-structure Minimum Free Energy (MFE), while a 3-layer 1D Convolutional Neural Network (inspired by Prof. Nam's 2025 shRNAI paper) predicts Mean Ribosome Load (MRL).", "fa": "ناحیه غیرترجمه‌ای ابتدای mRNA (5'-UTR) میزان تولید پروتئین واکسن را کنترل می‌کند. با بسته ViennaRNA پایداری ساختار ثانویه (MFE) محاسبه شده و با شبکه عصبی کانولوشنی یک‌بعدی (الهام‌گرفته از مقاله ۲۰۲۵ shRNAI پروفسور نام) کارایی ترجمه ریبوزومی پیش‌بینی می‌شود."}, "tip": {"zh": "面试金句：5'帽端前15个核苷酸如果发夹结构太稳定（MFE过负），会像门锁一样挡住核糖体扫描，导致蛋白表达骤降。", "en": "Key interview insight: overly stable hairpins (highly negative MFE) near the first 15 nt of the 5' cap block ribosome scanning and suppress translation.", "fa": "نکته طلایی مصاحبه: پایداری بیش‌ازحد ساختار سنجاق‌سری در ۱۵ نوکلئوتید ابتدایی کلاهک '5 مانع حرکت ریبوزوم و کاهش شدید بیان پروتئین می‌شود."}}, {"id": "sctcr_brice", "cat": "bio_ai", "term": {"zh": "单细胞 TCR 克隆扩增与 BRiCE 细胞丰度偏移", "en": "scTCR Clonal Expansion & BRiCE Differential Abundance", "fa": "تکثیر کلونال گیرنده سلول T (scTCR) و معیار فراوانی سلولی BRiCE"}, "aliases": ["scTCR-seq", "BRiCE", "CD161+ TRM", "Scanpy", "Scirpy", "KLRB1"], "def": {"zh": "对标汉阳 #1b 조재원 教授代表作：结合单细胞转录组（Scanpy）与T细胞受体测序（Scirpy）追踪识别肿瘤抗原后大量增殖的组织驻留记忆T细胞（CD161+/KLRB1+ TRM），并按照其2026年独立作者论文 BRiCE 核心思想，同时量化基因表达变化与细胞亚群比例偏移（Differential Abundance log2FC）。", "en": "Targets HYU Prof. Jae-Won Cho's research: pairing Scanpy + Scirpy to map tumor-infiltrating KLRB1+ (CD161+) tissue-resident memory T-cell clonal expansion alongside cell-type differential abundance shifts (log2FC), echoing his solo-author 2026 BRiCE benchmark.", "fa": "هم‌راستا با پژوهش‌های پروفسور چو در هانیانگ: ترکیب داده‌های تک‌سلولی RNA و گیرنده سلول T با ابزارهای Scanpy و Scirpy برای ردیابی تکثیر سلول‌های ایمنی مقیم بافت تومور (CD161+ TRM) و بررسی همزمان تغییرات بیان ژن و تغییر نسبت جمعیت سلول‌ها طبق مقاله ۲۰۲۶ ایشان (BRiCE)."}, "tip": {"zh": "把 Scanpy/Scirpy 当作医学诊断实验室血液室流式细胞术软件（FlowJo）的代码版来理解——输入细胞矩阵，按表面标志物分群看比例变化，零背诵压力！", "en": "Think of Scanpy/Scirpy just like FlowJo gating in hematology lab—input cell matrix, gate marker populations, and compare clone proportions!", "fa": "ابزارهای Scanpy و Scirpy را دقیقاً مثل نرم‌افزار فلوسایتومتری (FlowJo) در آزمایشگاه هماتولوژی ببینید: دسته‌بندی سلول‌ها بر اساس مارکرها و مقایسه درصد جمعیت‌ها، بدون نیاز به حفظ کردن کد!"}}, {"id": "sys_serology", "cat": "bio_ai", "term": {"zh": "系统血清学 (Systems Serology) 与抗体 Fc 效应", "en": "Systems Serology & Antibody Fc Effector Profiling", "fa": "سرولوژی سیستم‌ها (Systems Serology) و عملکرد ناحیه Fc آنتی‌بادی"}, "aliases": ["系统血清学", "Systems Serology", "ADCP", "ADNP", "DVN/ZYHQRL"], "def": {"zh": "对标高丽大学 #2 정원영 教授方向：不仅测量抗体结合抗原的滴度，还高通量测定抗体尾部（Fc段）结合免疫受体（FcR）并触发吞噬（ADCP/ADNP）等多维免疫保护特征，利用LASSO/XGBoost找出真正阻断病毒或细菌感染的关键抗体特征。", "en": "Targets KU Prof. Wonyeong Jung's lab: profiling multidimensional antibody Fc receptor binding, IgG/IgA subclasses, and innate effector functions (ADCP/ADNP) using machine learning to pinpoint correlates of immune protection.", "fa": "حوزه تخصصی پروفسور جونگ در دانشگاه کره: بررسی چندبعدی ویژگی‌های بخش Fc آنتی‌بادی‌ها، زیررده‌های IgG/IgA و فعال‌سازی فاگوسیتوز ایمنی (ADCP/ADNP) با یادگیری ماشین برای کشف دقیق عوامل محافظت‌کننده در برابر عفونت."}, "tip": {"zh": "M2（12.09–12.14）直接复现정원영教授2026年iScience在Harvard Dataverse公开的真实母乳抗体Fc矩阵（DVN/ZYHQRL），采用折内标准化 + LASSO/XGBoost + 100次置换检验 + SHAP归因！", "en": "M2 (Dec 9–14) directly models Prof. Jung's open 2026 iScience dataset on Harvard Dataverse (DVN/ZYHQRL) with in-fold scaling, 100× permutation tests, and SHAP.", "fa": "پروژه M2 (۹ تا ۱۴ دسامبر) مستقیماً روی دیتاست واقعی منتشرشده توسط پروفسور جونگ (DVN/ZYHQRL) با استانداردسازی درون‌فولد، ۱۰۰ بار آزمون جایگشت و SHAP اجرا می‌شود."}}, {"id": "xgboost_shap", "cat": "bio_ai", "term": {"zh": "XGBoost 梯度提升树与 SHAP 可解释性归因", "en": "XGBoost & SHAP Explainable Feature Attribution", "fa": "الگوریتم XGBoost و تفسیرپذیری مدل با SHAP"}, "aliases": ["XGBoost", "SHAP"], "def": {"zh": "生物医学表格数据最强大的黄金组合：XGBoost通过多棵决策树接力纠错实现高精度分类与定量回归；SHAP（基于博弈论Shapley值）将模型透明化，精确量化每一项检验指标或分子子结构对临床结局或生物活性预测值的正负贡献。", "en": "Gold-standard biomedical tabular ML duo: XGBoost builds ensembles of decision trees for high-accuracy classification/regression, while SHAP quantifies how much each lab variable or molecular substructure shifts predictions.", "fa": "ترکیب طلایی یادگیری ماشین برای داده‌های جدولی زیست‌پزشکی: الگوریتم درختی XGBoost پیش‌بینی دقیق طبقه‌بندی و رگرسیون کمی انجام می‌دهد و ابزار SHAP سهم دقیق هر شاخص آزمایشگاهی یا زیرساختار مولکولی را مشخص می‌کند."}, "tip": {"zh": "在 M2（12.09–12.14）封装好这套60行折内标准化通用积木母版后，M3（延世 VitalDB/pAKI）与 M4（中央 hERG-QSAR-SHAP-Dock）均可直接复用出图！", "en": "Once this 60-line in-fold standardized template is locked in M2 (Dec 9–14), M3 (Yonsei VitalDB/pAKI) and M4 (CAU hERG-QSAR-SHAP-Dock) reuse it seamlessly!", "fa": "پس از آماده‌شدن این قالب مادر ۶۰ خطی در پروژه M2 (۹ تا ۱۴ دسامبر)، مستقیماً در پروژه‌های M3 (یونسی) و M4 (چونگ‌آنگ) بازاستفاده می‌شود!"}}, {"id": "paki_vitaldb", "cat": "bio_ai", "term": {"zh": "术后持续性急性肾损伤 (pAKI) 与首尔大 SNUH VitalDB", "en": "Persistent Acute Kidney Injury (pAKI) & SNUH VitalDB", "fa": "آسیب حاد کلیوی پایدار پس از جراحی (pAKI) و پایگاه SNUH VitalDB"}, "aliases": ["SNUH VitalDB", "pAKI", "VitalDB", "miceforest", "tableone"], "def": {"zh": "对标延世医大 #3 윤덕용 教授2026年iScience论文：M3（Dynamic-Lab-AKI）以韩国首尔大学医院 SNUH VitalDB (api.vitaldb.net) 真实开源围术期临床检验队列为主验证集，对齐复现 CMI-Laboratory/pAKI (85634e2) 方法管线（血肌酐斜率 ΔCr/Δt、tableone、miceforest多重插补与XGBoost/SHAP）。", "en": "Targets Yonsei Prof. Dukyong Yoon's 2026 iScience study: M3 (Dynamic-Lab-AKI) uses the real open-source SNUH VitalDB (api.vitaldb.net) perioperative lab cohort as primary validation set, aligned with CMI-Laboratory/pAKI (85634e2).", "fa": "هم‌راستا با مقاله ۲۰۲۶ پروفسور یون در یونسی: پروژه M3 از کوهورت واقعی و متن‌باز بیمارستان دانشگاه ملی سئول (SNUH VitalDB - api.vitaldb.net) به عنوان مجموعه اعتبارسنجی اصلی استفاده کرده و پایپ‌لاین CMI-Laboratory/pAKI را بازتولید می‌کند."}, "tip": {"zh": "最大化发挥 Arsan 医学院临床检验本科与 16学分（816学时）医学诊断实验室必修实训功底（标本稀释/溶血质控、危急值过滤与肌酐动力学）！", "en": "Showcases Arsan's Faculty of Medicine Clinical Lab B.S. and 16-credit (816-hour) clinical diagnostic laboratory practicum expertise (specimen QC, critical-value filtering, creatinine kinetics).", "fa": "بهترین ویترین برای نمایش پایه کارشناسی علوم آزمایشگاهی دانشکده پزشکی و مهارت عملی ۱۶ واحد (۸۱۶ ساعت) کارورزی آزمایشگاه تشخیص طبی آرسان است."}}, {"id": "hergboost", "cat": "bio_ai", "term": {"zh": "hERG 定量生物活性 QSAR 建模与骨架划分 (hERG-QSAR-SHAP-Dock)", "en": "hERG Quantitative Bioactivity QSAR, hERGBoost & Scaffold Split", "fa": "مدل‌سازی کمی زیست‌فعالی QSAR کانال hERG و تقسیم اسکلت مولکولی"}, "aliases": ["hERG-QSAR-SHAP-Dock", "hERGBoost", "Bemis-Murcko", "QSAR", "RDKit", "Scaffold"], "def": {"zh": "对标中央大学 #4 이윤지 教授化学/结构生物信息学方向（M4: hERG-QSAR-SHAP-Dock）：基于 TDC hERG 数据集采用严格的 Bemis-Murcko 化学母核骨架划分，开展分类评估与定量 IC50 / pIC50 生物活性 QSAR 回归（R² / RMSE），平行对照其2025综述表1评析的定量基准 hERGBoost（R²=0.622, RMSE=0.595），并结合新版 RDKit Morgan 指纹 SHAP 子结构归因与 PDB 7CN0 的 Molegro Virtual Docker (MVD) 3D 通道对接。", "en": "Targets CAU Prof. Yoonji Lee's chem/structural bioinformatics research (M4: hERG-QSAR-SHAP-Dock): Bemis-Murcko scaffold-split classification & quantitative IC50/pIC50 bioactivity QSAR regression (R²/RMSE) on TDC hERG datasets, benchmarked in parallel against hERGBoost (R²=0.622, RMSE=0.595) from Table 1 of her 2025 review, paired with modern RDKit Morgan fingerprint SHAP substructure attribution and PDB 7CN0 3D channel docking in Molegro Virtual Docker (MVD).", "fa": "هم‌راستا با پژوهش‌های شیمی/بیوانفورماتیک ساختاری پروفسور لی در دانشگاه چونگ‌آنگ (M4: hERG-QSAR-SHAP-Dock): ارزیابی طبقه‌بندی و رگرسیون کمی زیست‌فعالی IC50/pIC50 (شاخص‌های R² و RMSE) با تقسیم‌بندی سخت‌گیرانه اسکلت مولکولی Bemis-Murcko روی داده‌های TDC hERG در مقایسه موازی با معیار hERGBoost (در جدول ۱ مقاله مروری ۲۰۲۵ ایشان)، همراه با تحلیل زیرساختار SHAP با اثرانگشت RDKit Morgan و داکینگ سه‌بعدی کانال PDB 7CN0 در نرم‌افزار MVD."}, "tip": {"zh": "双重防呆红线：① 全程采用“定量生物活性 QSAR 建模与3D通道对接”口径（不将毒理学包装为个人专长）；② hERGBoost第3作者为中央大BME系 Yunhyeok Lee 而非药学系李允智本人，务必表述为“平行对照您2025综述表1评析的定量基准”！", "en": "Dual guardrails: (1) Frame strictly as quantitative bioactivity QSAR & MVD 3D channel docking (not toxicology specialization); (2) hERGBoost co-author is Yunhyeok Lee (BME), NOT Prof. Yoonji Lee—cite strictly as 'evaluated in Table 1 of your 2025 review'!", "fa": "دو نکته حیاتی: ۱) پروژه را دقیقاً با ادبیات «مدل‌سازی کمی زیست‌فعالی QSAR و داکینگ سه‌بعدی کانال در MVD» معرفی کنید (نه ادعای تخصص سم‌شناسی)؛ ۲) نویسنده همکار hERGBoost شخصی به نام Yunhyeok Lee است نه پروفسور Yoonji Lee—حتماً بنویسید «معیار بررسی‌شده در جدول ۱ مقاله مروری ۲۰۲۵ شما»!"}}, {"id": "amoozeshyar", "cat": "iran", "term": {"zh": "自由大学教务系统 (Amoozeshyar) 与离校清算", "en": "IAU Amoozeshyar Portal & Graduation Clearance (تسویه حساب)", "fa": "سامانه آموزشیار و تسویه‌حساب فارغ‌التحصیلی"}, "aliases": ["Amoozeshyar", "تسویه حساب", "毕业离校清算"], "def": {"zh": "伊斯兰自由大学统一教务管理平台。毕业生须先在系统内走完各部门离校清算（تسویه حساب），才能生成10学期正式成绩单与正式学士学位证（دانشنامه）。", "en": "Islamic Azad University's centralized academic portal where graduation clearance (Tasvieh Hesab) must be completed before offi al Set] by Mar 19<\/span> (notarized translation accepted provisionally if embassy stamp pending)", "fa": "<span class='phys-red'>تحویل «۱ سری اصل کنسولی» تا ۱۹ مارس<\/span> (در صورت آماده نبودن مهر سفارت، تحویل موقت ترجمه رسمی مجاز است)"}, "yu": {"zh": "网申仅传彩色扫描PDF；仅录取新生于7–8月办CoA时交<span class='phys-red'>【1份领事认证原件】<\/span>", "en": "Color PDF scan at application; submit <span class='phys-red'>[1 Legalized Original Set]<\/span> only in Jul–Aug upon admission for CoA", "fa": "در اپلای فقط اسکن رنگی PDF؛ تحویل <span class='phys-red'>«۱ سری اصل کنسولی»<\/span> فقط پس از قبولی نهایی در جولای–آگوست"}, "cau": {"zh": "<span class='phys-red'>网申期提交【1份认证原件 + 1份全套复印件】<\/span>；已交材料概不退还", "en": "<span class='phys-red'>Submit [1 Legalized Original Set + 1 Full Photocopy Set]<\/span> by May 13; non-returnable", "fa": "<span class='phys-red'>تحویل «۱ سری اصل کنسولی + ۱ سری کپی کامل از تمام صفحات»<\/span> تا ۱۳ مه؛ غیرقابل استرداد"}}, {"dim": {"zh": "IELTS最低线、官方送分与彩打规定", "en": "IELTS Minimum, Portal Delivery & Print Rule", "fa": "حداقل نمره آیلتس، نحوه ارسال رسمی و قانون نسخه چاپی"}, "hyu": {"zh": "• 生命科学无硬性英语最低分（交 6.5–7.0 极具竞争力）\n• 后台免费电子送分 + <span class='phys-red'>首尔彩打 e-TRF 装袋<\/span>；导师4–5月内签《韩语标准免除申请书》", "en": "• No hard min for Life Science (6.5–7.0 highly competitive)\n• Free Portal e-delivery + <span class='phys-red'>Seoul color-printed e-TRF in packet<\/span>; PI submits Korean waiver in Apr–May", "fa": "• بدون کف اجباری انگلیسی در علوم زیستی (نمره ۶.۵–۷ عالی است)\n• ارسال رایگان از پورتال + <span class='phys-red'>چاپ رنگی e-TRF در سئول<\/span>؛ امضای فرم معافیت کره‌ای توسط استاد"}, "ku": {"zh": "• 入学线：5.5（禁Indicator）；校奖线：C类 6.0，A类 7.0\n• 明文允许<span class='phys-red'>直接彩打含核验号的 e-TRF PDF<\/span> + 后台免费电子送分（免土耳其寄单）", "en": "• Min: 5.5 (No Indicator); Scholarship: Type C ≥6.0, Type A ≥7.0\n• Explicitly accepts <span class='phys-red'>color-printed e-TRF PDF<\/span> + free Portal e-delivery", "fa": "• کف پذیرش: ۵.۵؛ شرط بورسیه: نوع C نمره ۶.۰ و نوع A نمره ۷.۰\n• پذیرش رسمی <span cla LTS Academic score satisfies 100% of admission language requirements—zero Korean certificates or professor signatures needed! (Bonus: CAU STEM waives graduation TOPIK 4, and KU IELTS ≥ 6.0 waives the graduation foreign language exam.)", "fa": "در دانشکده‌های علوم، پزشکی و داروسازی این سه دانشگاه، قانون «انگلیسی (آیلتس ۵.۵ به بالا) یا کره‌ای» برقرار است. صرفاً با ارائه نمره آیلتس ۷ فوریه، شرط زبان ۱۰۰٪ تکمیل شده و به هیچ مدرک کره‌ای یا امضای استاد نیاز ندارید! (حتی برای فارغ‌التحصیلی نیز چونگ‌آنگ شرط TOPIK 4 ندارد و دانشگاه کره با آیلتس ۶ آزمون زبان فارغ‌التحصیلی را معاف می‌کند.)"}}, "hyuSteps": {"badge": {"zh": "汉阳大学（生命科学系）专属三步豁免法（防强制休学红线！）", "en": "Hanyang Univ. (Life Science) Mandatory 3-Step Advisor Waiver (Prevents Forced Leave!)", "fa": "فرآیند ۳ مرحله‌ای اختصاصی دانشگاه هانیانگ (جلوگیری از مرخصی اجباری ترم اول!)"}, "ruleQuote": {"zh": "简章原文依据：한양대학교 지도교수의 《한국어기준 면제 요청서》 취득자: 학과 서류심사 시 교수님의 판단 하에 결정되므로 학생이 별도로 제출할 필요 없음（由指导教授在院系书审时内部决定并提交，学生无需另行交表）", "en": "Official Guide Clause: Recipients of Hanyang Advisor's “Korean Proficiency Exemption Request Form” (한국어기준 면제 요청서) are decided internally by the professor during departmental screening; students do not submit a separate form.", "fa": "متن رسمی دفترچه هانیانگ: فرم «한국어기준 면제 요청서» در مرحله بررسی پرونده در دانشکده مستقیماً به تشخیص و امضای استاد راهنما در سیستم داخلی ثبت می‌شود و دانشجو نیازی به ارسال فرم فیزیکی جداگانه ندارد."}, "steps": [{"num": "Step 1", "time": "2027.02.16–02.28", "title": {"zh": "Zoom 面试礼貌口头确认", "en": "Polite Verbal Confirmation in Feb Zoom", "fa": "تأیید شفاهی محترمانه در مصاحبه زوم فوریه"}, "desc": {"zh": "向 #1a 남진우 或 #1b 조재원 教授确认接收意向后，礼貌询问是否愿意在春季院系审查时内部签交《韩语标准免除申请书》，确保9月免休学直接进组。", "en": "Once Prof. Nam or Prof. Cho expresses interest, politely ask if they are willing to submit the internal Korean Exemption Form during spring screening so you can start immediately in Sep.", "fa": "پس از اعلام نظر مثبت پروفسور نام یا چو، محترمانه بپرسید آیا در بررسی بهاره فرم داخلی معافیت زبان کره‌ای را امضا می‌کنند تا از سپتامبر مستقیماً وارد آزمایشگاه شوید."}}, {"num": "Step 2", "time": "2027.03.03–03.26", "title": {"zh": "网申缴费后邮件报备考号 (수험번호)", "en": "Email Application ID (수험번호) After Portal Payment", "fa": "ارسال ایمیل شماره داوطلبی (수험번호) پس از ثبت‌نام"}, "desc": {"zh": "完成汉阳 OIA 网申拿到专属考生编号（수험번호）后，立即发简短邮件给意向教授备案，方便教授在系审系统精准锁定档案。", "en": "Right after completing Hanyang OIA application, email your generated Examinee ID (수험번호) to your prospective advisor for easy file lookup.", "fa": "بلافاصله پس از ثبت‌نام در سایت هانیانگ و دریافت کد 수험번호، آن را برای استاد ایمیل کنید تا پرونده شما را در سیستم گروه به راحتی پیدا کند."}}, {"num": "Step 3", "time": "2027.04.22–05.12", "title": {"zh": "院系审查期教授内签 → 6月直拿无休学 CoA", "en": "Dept. Review Internal Sign-off → Full Admission & CoA", "fa": "امضای داخلی استاد در بررسی گروه ← پذیرش قطعی بدون مرخصی"}, "desc": {"zh": "4月中旬礼貌提醒一次；4.22–5.12院系材料审查期教授在系内系统勾选签字提交免除书，6.11放榜即获无休学限制正式录取！", "en": "Send one polite reminder in mid-April; professor signs the internal waiver during Apr 22–May 12 review → unconditional Sep enrollment & CoA!", "fa": "اواسط آوریل یک یادآوری کوتاه بفرستید؛ استاد در بازه ۲۲ آوریل تا ۱۲ مه فرم را در سیستم گروه امضا کرده و در ژوئن پذیرش قطعی و CoA صادر می‌شود!"}}]}}, "labs1_5": [{"rank": "#1a", "name": {"zh": "남진우 (Jin-Wu Nam) · 汉阳大学 生命科学系", "en": "Prof. Jin-Wu Nam (남진우) · Hanyang Life Science", "fa": "پروفسور نام جین‌وو (남진우) · علوم زیستی هانیانگ"}, "lab": "BIG Lab (biglab.or.kr)", "fundingTag": {"zh": "官网明文 100% 全包", "en": "Official 100% Full Package", "fa": "تضمین رسمی ۱۰۰٪ شهریه + حقوق"}, "fundingColor": "green", "funding": {"zh": "biglab.or.kr/positions 明确公告：提供 100% 全额学费支援（등록금 전액 지원）+ 生活津贴（생활비 지급）+ 科研成果绩效奖金。依托国家 K-Moonshot 新药PD、牧岩所 AI mRNA 大课题与汉阳 BK21-BIO4，经费极度充沛。", "en": "biglab.or.kr/positions explicitly pledges 100% full tuition support + monthly living stipend + publication incentives. Backed by Korea's K-Moonshot Drug PD, Mogam AI mRNA initiative, and HYU BK21-BIO4.", "fa": "در سایت رسمی biglab.or.kr/positions صر ine），比普通理工科多一道德黑兰中央组织“医科允许翻译章”。本页已将公证三级分流与 Step 01–05 全流程纵向完整展开（点击上方步骤卡可平滑定位，亦支持一键折叠/展开）。", "en": "Iran is a non-Apostille country, and IAU Clinical Laboratory Sciences belongs to the Faculty of Medicine—requiring a Medical Sciences clearance stamp in Tehran. Below, the 3-tier document triage and all 5 legalization steps (Step 01–05) are fully expanded vertically by default (click any top anchor card to jump, or toggle collapse/expand).", "fa": "ایران عضو کنوانسیون آپوستیل نیست و رشته علوم آزمایشگاهی دانشگاه آزاد زیرمجموعه دانشکده پزشکی محسوب می‌شود و به «مهر بلامانع بودن ترجمه علوم پزشکی» در تهران نیاز دارد. در این صفحه جدول تفکیک سه‌سطحی و هر ۵ مرحله (Step 01–05) به صورت کامل و باز نمایش داده شده‌اند."}}, "validityRedlinesCard": {"title": {"zh": "图 2A｜《全材料“有效期与签发窗口”生死红线速查表（早开 10 天即作废！）》", "en": "Fig 2A | Master Validity & Issuance Window Red-Lines Cheat Sheet (Stamping 10 Days Too Early Voids Your Docs!)", "fa": "جدول حیاتی ۲-الف | «خطوط قرمز اعتبار زمانی و پنجره دقیق صدور مدارک (صدور زودهنگام در نوامبر–دسامبر = ابطال مدرک!)»"}, "subtitle": {"zh": "切忌以为“越早去学校把所有证明盖完章越好”！高丽与中央对签发/公证日期卡死 90 天红线，存款证明卡死 30 天红线。请严格按以下 4 大时效法则锁死开证日：", "en": "Never assume 'stamping certificates in Nov–Dec is safer'! Korea Univ. and Chung-Ang enforce strict 90-day issuance/notary cutoffs, and bank certificates expire in 30 days. Lock every issuance window to these 4 rules:", "fa": "هرگز تصور نکنید «گرفتن مهر مدارک در نوامبر و دسامبر بهتر است»! دانشگاه کره و چونگ‌آنگ سقف اکید ۹۰ روزه و گواهی بانکی سقف ۳۰ روزه دارند. تاریخ صدور تمام مدارک را دقیقاً طبق این ۴ قانون تنظیم کنید:"}, "rules": [{"badge": {"zh": "① 高丽大学全局 3 个月签发红线", "en": "① Korea Univ. Global 3-Month Issuance Rule", "fa": "۱) خط قرمز سراسری ۳ ماهه دانشگاه کره (KU)"}, "color": "#D93025", "bg": "var(--red-soft)", "clause": "제출 마감일 기준 3개월 이내 발급본만 유효함 (~03.19 截止基准)", "body": {"zh": "高丽韩文简章明令：**以材料提交截止日（`~2027.03.19`）为基准，所有证明与公证件原则上仅限 3 个月内签发的原件有效**（唯一例外为不可补发的学位证原件）！\n🚨 **防过期铁律**：`2026年11月–12月20日前` 去 IAU Ardabil 分校**仅限催办独生子女 `طرح`、核对英 حض دریافت اصل دانشنامه (`دانشنامه`)، کل مسیر از حصارک تا مهر سفارت کره در حالت سریع تنها `۸ تا ۱۰ روز کاری` زمان می‌برد!**", "📦 **استراتژی `۳+۱` و اصلاح تاریخ پس از نوروز**: ۱) **سری اول (`۱۰ ژانویه تا ۴ فوریه`: ۳ نسخه)** برای کره، هانیانگ و یونسی/ویزا؛ ۲) **قانون ۹۰ روزه چونگ‌آنگ**: در صورت صدور سری اول در ژانویه، در **`۳ تا ۱۴ آوریل` (اولین روز پس از نوروز)** ۱ سری جدید از روی فایل آماده دارالترجمه چاپ و `۲۴ آوریل` به سئول پست کنید؛ تنها اگر سری اول در **`۲۲ تا ۲۸ فوریه`** صادر شده باشد (زیر ۸۰ روز تا ۱۳ مه) از سری دوم معافید!"]}}], "scholaroRulesCard": {"title": {"zh": "图 2C｜《针对伊朗 20 分制（17.50/20），四校到底要不要 Scholaro？精确规则与“一套通杀法”》", "en": "Fig 2C | Iran 0–20 Grading Scale (17.50/20): Exact 4-University Scholaro Rules & 'One-Combo Kills All 4' Playbook", "fa": "کارت ویژه ۲-ج | «برای سیستم نمره‌دهی ۲۰ ایران (۱۷.۵۰/۲۰)، کدام دانشگاه‌ها Scholaro می‌خواهند؟ قوانین دقیق و راهکار یکپارچه»"}, "subtitle": {"zh": "伊朗 0–20 分制属于非标准绩点制（既非 4.0/4.3/4.5 亦非天然 100 分制），四校招生办与奖学金委员会的法定核验口径各不相同，切勿混为一谈：", "en": "Iran's 0–20 grading scale is non-standard (neither 4.0/4.3/4.5 nor native 100-point). Each school's admissions & scholarship rules treat `Scholaro` vs. alma mater conversion certificates differently:", "fa": "سیستم نمره‌دهی ۰ تا ۲۰ ایران غیرمتعارف محسوب می‌شود و هر یک از ۴ دانشگاه قانون متفاوتی درباره گزارش `Scholaro` و گواهی معادل‌سازی دانشگاه مبدأ دارند:"}, "schools": [{"uni": {"zh": "① 中央大学 (CAU · 附录 05-01)", "en": "① Chung-Ang Univ. (CAU · Appendix 05-01)", "fa": "۱. دانشگاه چونگ‌آنگ (CAU · پیوست 05-01)"}, "pill": {"zh": "✅ 强制必交全10学期逐科 Scholaro（鲜章免领事认证）", "en": "✅ Mandatory 10-Sem Course-by-Course Scholaro (Wet Stamp Only)", "fa": "✅ الزام قطعی گزارش درس‌به‌درس ۱۰ ترم Scholaro (مهر زنده دانشگاه)"}, "color": "#EA580C", "desc": {"zh": "简章附录 `05-01` 明文规定：非标准分制必须提交包含<span class='phys-red'>**全部 10 学期、每一门课逐科换算**的 `scholaro.com`（或 `WES`）报告（严禁只转总均分！）<\/span>，且**只需由毕业大学（IAU Ardabil）加盖官方英文鲜章即直接有效，免做海牙或韩国使馆领事认证**（另附母校评分标准证明，随全套做 `1原+1复`）。", "en": "Appendix `05-01` explicitly mandates a `scholaro.com` (or `WES`) report covering <span class='phys-red'>**ALL 10 semesters course-by-course** (overall-only conversion rejected!)<\/span>. **Simply bearing IAU Ardabil's official English wet-ink stamp makes it directly valid—exempt from Apostille or Korean Embassy legalization** (submit `1 orig + 1 copy` alongside IAU's scale cert).", "fa": "پیوست `05-01` دفترچه صراحتاً الزام کرده برای سیستم ۲۰ نمره‌ای، گزارش `scholaro.com` شامل <span class='phys-red'>**ریز تک‌تک دروس تمام ۱۰ ترم**<\/span> ارائه شود و **صرفاً داشتن مهر زنده انگلیسی دانشگاه مبدأ (واحد اردبیل) کافی بوده و از آپوستیل یا مهر سفارت کره کاملاً معاف است** (`۱ اصل + ۱ کپی`)."}}, {"uni": {"zh": "② 汉阳大学 (HYU · HISP全奖生死线)", "en": "② Hanyang Univ. (HYU · HISP Scholarship Lifeline)", "fa": "۲. دانشگاه هانیانگ (HYU · شرط حیاتی بورسیه HISP)"}, "pill": {"zh": "✅ 必交二选一（漏交直接取消 HISP 全奖参评！）", "en": "✅ Mandatory Either/Or (Omitting Voids HISP Eligibility!)", "fa": "✅ الزامی یکی از دو مدرک (عدم ارائه = حذف از بورسیه HISP!)"}, "color": "#1A73E8", "desc": {"zh": "参评 HISP 奖学金硬性要求前学位百分制 `≥80%`；须随包提交 <span class='phys-red'>**母校加盖官方英文鲜章的 `Scholaro` 换算原件（免领事认证）** 或 **母校开具的 `87.50%` 百分制换算公证原件**<\/span>——**漏交此项将直接丧失 HISP 70%–100% 奖学金参评资格**（实操双件同放最稳）！", "en": "HISP scholarship eligibility requires `≥80%` converted GPA; you MUST include <span class='phys-red'>**IAU wet-stamped `Scholaro` original (exempt from Embassy)** OR **IAU's notarized `87.50%` conversion original**<\/span>—**omitting this immediately disqualifies you from HISP** (include both for bulletproof safety)!", "fa": "شرط بورسیه HISP معدل بالای `۸۰٪` است؛ باید <span class='phys-red'>**اصل ممهور `Scholaro` (معاف از سفارت)** یا **اصل گواهی معادل‌سازی `87.50%` دانشگاه مبدأ**<\/span> را در پاکت بگذارید — **فراموشی این مورد مستقیماً باعث حذف از رقابت بورسیه HISP می‌شود**!"}}, {"uni": {"zh": "③ 高丽大学 (KU · 奖学金章明文规定)", "en": "③ Korea Univ. (KU · Scholarship Clause Rule)", "fa": "۳. دانشگاه کره (KU · بند رسمی آیین‌نامه بورسیه)"}, "pill": {"zh": "⚠️ 主件必交“母校官方转换证明书”（Scho st the names, academic titles, and `@iau.ac.ir` institutional emails of 2 `20/20` recommending professors **ONLY at the bottom of your private cold-email attachment / portal `CV.pdf`** (which simultaneously satisfies CAU CAYSS Step 1's requirement to state former/current advisor names during initial contact!).", "fa": "🔒 **قانون محرمانگی اطلاعات اساتید در رزومه و سایت**: در وب‌سایت عمومی (`github.io`) و فایل `CV.pdf` عمومی **مطلقاً فایل توصیه‌نامه یا ایمیل اساتید را قرار ندهید**؛ نام، مرتبه علمی و ایمیل رسمی `@iau.ac.ir` دو استاد دروس ۲۰/۲۰ را **صرفاً در انتهای نسخه خصوصی `CV.pdf` پیوست ایمیل به اساتید و فرم ثبت‌نام** درج کنید (این کار همزمان شرط گام ۱ بورسیه CAYSS چونگ‌آنگ مبنی بر اعلام نام اساتید راهنمای قبلی را نیز برآورده می‌کند!)."}}, "etrfRouting": {"title": {"zh": "图 2D-2｜2月7日土耳其机考雅思 (D15 · e-TRF) 四校精准分流发送图（免除土耳其跨国寄纸质单！）", "en": "Fig 2D-2 | Feb 7 Computer-Delivered IELTS (D15 · e-TRF) 4-University Routing Map (Zero Turkey Courier Needed!)", "fa": "نمودار ۲-د-۲ | نقشه دقیق ارسال کارنامه آیلتس کامپیوتری (D15 · e-TRF) به ۴ دانشگاه (حذف کامل پست فیزیکی از ترکیه!)"}, "warningBanner": {"zh": "核心铁律：1–2月跟教授套磁约面试时，可直接用私人 Email 附件发 e-TRF PDF；但正式网申阶段，4校招生办一律严禁申请人用个人邮箱发成绩单代替交材料！", "en": "Golden Rule: Attaching your e-TRF PDF in private emails to professors (Jan–Feb) is 100% fine; however, during official admissions, ALL 4 admissions offices strictly prohibit emailing scores from personal accounts!", "fa": "قانون طلایی: ارسال فایل PDF کارنامه در ایمیل شخصی به اساتید (ژانویه–فوریه) کاملاً مجاز است؛ اما در مرحله ثبت‌نام رسمی، ارسال ایمیل شخصی کارنامه به دفتر پذیرش هر ۴ دانشگاه اکیداً ممنوع و بی‌اعتبار است!"}, "routes": [{"uni": {"zh": "高丽大学 (KU) & 汉阳大学 (HYU)", "en": "Korea Univ. (KU) & Hanyang (HYU)", "fa": "دانشگاه کره (KU) و هانیانگ (HYU)"}, "tag": {"zh": "后台免费电子送分 + 首尔彩打装袋", "en": "Free Portal e-Delivery + Seoul Color Print", "fa": "ارسال رایگان از پورتال + چاپ رنگی در سئول"}, "color": "#1A73E8", "steps": {"zh": "① 出分当日登录雅思考生后台（Test Taker Portal）免费勾选 Korea University 与 Hanyang University 发送官方电子成绩单（2年内0元免费）；② 将含防伪核验号（TRF Number）的 e-TRF PDF 发给首尔 Charlotte，<span class='phys-red'>由 Charlotte 用激光彩色打印机清晰彩打装入材料袋<\/span>（高丽简章明文认可带真伪确认号的PDF打印件，汉阳生命科学为选交加分项）。", "en": "(1) On results day (Feb 10–12), log into IELTS Test Taker Portal and select Korea University & Hanyang University for free official e-TRF Institutional Delivery; (2) Send the e-TRF PDF to Charlotte in Seoul to <span class='phys-red'>laser-color-print and place inside both packets<\/span> (KU explicitly accepts printed PDFs bearing the TRF verification number).", "fa": "۱) روز اعلام نمره در پورتال آیلتس (Test Taker Portal) به صورت رایگان گزینه ارسال الکترونیکی رسمی به Korea University و Hanyang University را بزنید؛ ۲) فایل PDF دارای کد رهگیری (TRF Number) را برای شارلوت بفرستید تا <span class='phys-red'>در سئول پرینت رنگی لیزری باکیفیت گرفته و داخل پاکت بگذارد<\/span> (مورد تأیید صریح دفترچه دانشگاه کره)."}}, {"uni": {"zh": "延世大学医学院 (YU)", "en": "Yonsei Univ. Medicine (YU)", "fa": "پزشکی دانشگاه یونسی (YU)"}, "tag": {"zh": "纯网申系统上传 PDF（禁机构送分！）", "en": "Portal PDF Upload ONLY (NO e-Delivery!)", "fa": "فقط آپلود PDF در سایت (ارسال سازمانی ممنوع!)"}, "color": "#7C3AED", "steps": {"zh": "延世简章明文规定 Score Reporting is NOT accepted（不接受考试机构送分）！无需在雅思后台勾选延世，只需在4月网申网页直接上传带核验码的 e-TRF PDF，全程0纸质（7月录取办CoA亦免交纸质雅思单）。", "en": "Yonsei's guide states 'Score Reporting is NOT accepted'! Do NOT send institutional scores; simply upload the verifiable e-TRF PDF directly onto Yonsei's online portal in April—0 paper needed even at July CoA stage.", "fa": "دفترچه یونسی صراحتاً اعلام کرده ارسال سازمانی نمره پذیرفته نمی‌شود (Score Reporting NOT accepted)! فقط در ماه آوریل فایل PDF کارنامه e-TRF را مستقیماً در سایت ثبت‌نام آپلود کنید (حتی در جولای هم نیازی به نسخه کاغذی آیلتس نیست)."}}, {"uni": {"zh": "中央大学 (CAU · CAYSS)", "en": "Chung-Ang Univ. (CAU · CAYSS)", "fa": "دانشگاه چونگ‌آنگ (CAU · CAYSS)"}, "tag": {"zh": "后台电子送分 + 3–4月邮件核实彩打件", "en": "Free Portal e-Delivery + Email Check in Mar", "fa": "ارسال از پورتال + استعلام ایمیلی نسخه چاپی"}, "color": "#EA580C", "steps": {"zh": "出分后先在雅思后台免费向 Chung-Ang University 电子送分；3–4月发邮件至 `gsadmin@cau.ac.kr` 一并书面确认两件事：①“机考官方仅签发带核验码e-TRF，已完成后台官方电子送分并随包提交首尔e-TRF彩打件是否认可？”②“父母有效护照彩印件能否替代第9项父母本国身份证复印件？”获认可在首尔直接彩打；<span class='phys-red'>仅当坚持要考点印制件时，再联系土耳其考点补寄1份硬拷贝至首尔 Charlotte 处<\/span>。", "en": "Send free Portal e-TRF to Chung-Ang University first; in Mar–Apr email `gsadmin@cau.ac.kr` to confirm both (1) Seoul color-printed e-TRF + Portal e-delivery, and (2) using parents' passport color copies for Item #9 parent IDs. <span class='phys-red'>Only if they strictly demand a test-center paper print, order 1 hard copy from Turkey to Charlotte's Seoul address<\/span>.", "fa": "ابتدا از پورتال آیلتس ارسال الکترونیکی رایگان به Chung-Ang University را انجام دهید؛ در مارس–آوریل به `gsadmin@cau.ac.kr` ایمیل بزنید و هم پذیرش چاپ رنگی e-TRF و هم جایگزینی کپی رنگی پاسپورت والدین به‌جای کارت ملی (بند ۹) را تأیید بگیرید. <span class='phys-red'>فقط در صورت الزام کتبی مرکز آزمون، ۱ نسخه کاغذی از ترکیه به آدرس سئول سفارش دهید<\/span>."}}]}, "portalPrefillCard": {"title": {"zh": "图 2E｜《2月底提前备齐！四校往届网申原表“预填字段 & 隐藏雷区”速查表（助 3 月首日 10 分钟秒出表！）》", "en": "Fig 2E | Prep by Late Feb! 4-University Past Portal Forms 'Pre-Fill Fields & Hidden Traps' Cheat Sheet (10-Min Day-1 Checkout!)", "fa": "کارت ویژه ۲-هـ | «آماده‌سازی تا اواخر فوریه! جدول فیلدهای پیش‌پرکردنی و تله‌های پنهان فرم ثبت‌نام ۴ دانشگاه (صدور فرم در ۱۰ دقیقه روز اول!)»"}, "subtitle": {"zh": "网申开启当日（`03.02 / 03.03 10:00 KST`）每一分钟都关乎跨国快件时效！请在 2 月底前按往届网申原表提前备齐以下必填项，避开选错通道、离线废表与锁死雷区：", "en": "Every hour on portal opening day (`03.02 / 03.03 10:00 KST`) counts for international shipping! Prepare these exact past-form fields by late Feb to avoid track traps, invalid offline templates, and portal lockouts:", "fa": "در روز باز شدن سایت (`۲ و ۳ مارس ساعت ۱۰:۰۰ کره`) هر ساعت برای پست بین‌المللی حیاتی است! این فیلدها و نکات فرم‌های سال قبل را تا اواخر فوریه آماده کنید:"}, "schools": [{"uni": {"zh": "① 高丽大学 (KU · UWAY系统)", "en": "① Korea Univ. (KU · UWAY Portal)", "fa": "۱. دانشگاه کره (KU · سامانه UWAY)"}, "pill": {"zh": "必选第1类纯外国人 · 名片框推荐表 · 第4页自留/第5页贴封", "en": "Pick Track 1 Foreigner · Business Card LOR · P.4 Keep / P.5 Paste", "fa": "انتخاب سهمیه ۱ اتباع خارجی · کادر کارت ویزیت استاد · صفحه ۴ و ۵"}, "color": "#0F9D58", "bullets": {"zh": ["🚨 **报名类型防错雷区**：本人与父母皆非韩国籍者**必选第 1 类（纯外国人 `Parents & Applicant Non-Korean`）**——**切勿误选第2类（16年海外全教育通道），否则会被强制索要小学、初中、高中整整12年海牙/领事认证成绩单！** 且报考 `Biomedical Sciences` 须在网申前先获意向教授许可。", "📋 **必填项提前备齐**：① **2个不同域名的本人有效邮箱**（如 Gmail + Outlook）；② `Release of Information Form` 手动填：**注册总学期数 `10`** + **IAU Ardabil 学籍办完整英文地址、电话（`+98-45-33727799`）、部门名及官方邮箱**（勾选 `■ I agree` 并湿墨手签，交复印件直接拒收！）。", "✉️ **高丽官方推荐表隐藏项与标签页**：推荐表含认识时长 `(__) Years (__) Months`、**勾选 `☑ I agree`**、粘贴**教授名片或工作证框（`Copy of Business Card`）**，且**每一页均须教授亲笔手写全名并签名**，由 `@iau.ac.ir` 直发 `grad_recommendation@korea.ac.kr`。网申导出第4页 `Receipt` 自留不交，第5页 `Document Submission Label` 贴信封正面！"], "en": ["🚨 **Application Track Trap**: Since applicant & both parents are non-Korean, **MUST select Track 1 (Pure Foreigner)**—**selecting Track 2 (16-yr overseas education) triggers mandatory 12-year elementary/middle/high school legalized transcripts!** `Biomedical Sciences` also requires prior advisor permission.", "📋 **Pre-Fill Fields**: (1) **2 valid personal emails on DIFFERENT domains**; (2) `Release of Information Form`: manually enter **total enrolled semesters = `10`** + **IAU Ardabil Registrar's full English address, phone (`+98-45-33727799`), dept name & official email** (check `■ I agree` & wet-sign; copies rejected!).", "✉️ **KU LOR Form Hidden Boxes & Page 4/5**: Includes acquaintance duration `(__) Years (__) Months`, **`☑ I agree`**, **`Copy of Business Card / Faculty ID` box**, and **handwritten full name + signature on EVERY page**, emailed from `@iau.ac.ir` to `grad_recommendation@korea.ac.kr`. Keep Page 4 `Receipt`; paste Page 5 `Label` on envelope!"], "fa": ["🚨 **تله نوع سهمیه ثبت‌نام**: چون خود و والدین غیرکره‌ای هستید **حتماً نوع ۱ (اتباع خارجی خالص) را انتخاب کنید** — **انتخاب اشتباه نوع ۲ باعث مطالبه ریزنمرات تاییدشده ۱۲ سال دبستان تا دبیرستان می‌شود!** همچنین رشته `Biomedical Sciences` نیازمند کسب اجازه قبلی از استاد است.", "📋 **فیلدهای آماده از قبل**: ۱) **۲ ایمیل معتبر شخصی با دامنه متفاوت**؛ ۲) در فرم `Release of Information`: درج دستی **تعداد کل ترم = `10`** + **آدرس دقیق انگلیسی، تلفن (`+98-45-33727799`) و ایمیل رسمی آموزش واحد اردبیل** (تیک `■ I agree` و امضای خیس؛ کپی رد می‌شود!).", "✉️ **جزئیات پنهان فرم توصیه‌نامه کره**: شامل مدت آشنایی `(__) Years (__) Months`، تیک **`☑ I agree`**، محل الصاق **کارت ویزیت یا کارت هیئت علمی استاد (`Copy of Business Card`)** و **نوشتن دستی نام و امضا در تمام صفحات** و ارسال از `@iau.ac.ir`؛ صفحه ۴ (`Receipt`) نزد شارلوت بماند و صفحه ۵ (`Label`) روی پاکت چسبانده شود!"]}}, {"uni": {"zh": "② 汉阳大学 (HYU · OIA系统)", "en": "② Hanyang Univ. (HYU · OIA Portal)", "fa": "۲. دانشگاه هانیانگ (HYU · سامانه OIA)"}, "pill": {"zh": "选 Type 1/Type A · 网页在线填文书 · A4严格按目录叠放", "en": "Pick Type 1/A · Online OIA Essay · Strict A4 Checklist Order", "fa": "انتخاب Type 1/A · ثبت آنلاین انگیزش‌نامه · ترتیب دقیق برگه‌های A4"}, "color": "#1A73E8", "bullets": {"zh": ["🎯 **通道与唯一导师**：报名通道必选 **`Type 1 / Type A`（父母及本人均为外国人）**；在系统内填报唯一意向指导教授（`#1a 남진우` 或 `#1b 조재원` 二选一）。", "⌨️ **网页端在线输入文书**：《自我陈述书和学习计划书》须在 **汉阳 OIA 网页端在线输入英文后导出打印**（2月底提前备好纯文本定稿直接复制粘贴）。", "📑 **A4 叠放顺序铁律**：全部纸质材料须统一为 **标准 A4 尺寸，并严格按照简章【提交材料目录】的先后顺序平整叠放**（直接丢弃艺术设计系专用的《作品提交誓约书》）。"], "en": ["🎯 **Track & Single Advisor**: Select **`Type 1 / Type A`** (applicant & parents non-Korean) and enter your single target advisor (`#1a Nam` OR `#1b Cho`).", "⌨️ **Online Web Text Entry**: Your Self-Introduction & Study Plan MUST be **typed/pasted in English directly inside the HYU OIA web portal and printed out** (prepare plain-text drafts in late Feb).", "📑 **Strict A4 Stacking Order**: All sheets must be **A4 size stacked in the EXACT order of the guide's [Required Documents Checklist]** (discard the Art-only Portfolio Pledge)."], "fa": ["🎯 **نوع سهمیه و استاد راهنما**: انتخاب گزینه **`Type 1 / Type A`** و ثبت نام تنها یک استاد راهنما (`#1a` یا `#1b`).", "⌨️ **ورود متن آنلاین در پورتال OIA**: متن معرفی و برنامه تحصیلی باید **مستقیماً در سامانه وب OIA تایپ/کپی و سپس پرینت شود** (متن انگلیسی خام را اواخر فوریه آماده دارید).", "📑 **چیدمان دقیق برگه‌های A4**: تمامی مدارک در ابعاد **A4 و دقیقاً به ترتیب فهرست رسمی دفترچه روی هم چیده شوند** (فرم تعهد رشته هنر را دور بیندازید)."]}}, {"uni": {"zh": "③ 延世大学医学院 (YU · 纯在线系统)", "en": "③ Yonsei Univ. Med (YU · Online Portal)", "fa": "۳. پزشکی دانشگاه یونسی (YU · سامانه آنلاین)"}, "pill": {"zh": "GPA必选 \"Others\" 填17.50 · 缴完 $130 彻底锁死禁改！", "en": "GPA 'Others' (17.50) · Permanent Lockout After Paying $130!", "fa": "انتخاب \"Others\" برای معدل · قفل کامل سیستم پس از پرداخت ۱۳۰ دلار!"}, "color": "#7C3AED", "bullets": {"zh": ["📄 **前置手签与直达联系方式**：提前从延世大学院官网下载 `Letter of Confirmation (Non-Korean)` 手签扫好彩色 PDF；系统填报的手机与邮箱必须 100% 直达 Arsan 本人。", "🔢 **20分制填报法**：在 `[Academic Records – GPA]` 栏下拉框**必选 `\"Others\"`**，填入 `17.50`，并上传母校官方评分标准证明 + 鲜章 `Scholaro` 合并 PDF；`Study Plan` 为网页在线输入。", "🔒 **缴费锁死生死线**：<span class='phys-red'>**一旦在线缴完 `$130` 报名费，延世系统即彻底锁死——严禁修改报考专业代码，亦严禁替换或补传任何 PDF 文件**<\/span>（缴费前双人逐项核验无误再点付款）！"], "en": ["📄 **Pre-Signed Form & Direct Contact**: Pre-download, hand-sign, and scan `Letter of Confirmation (Non-Korean)`; enter phone & email reaching Arsan directly.", "🔢 **20-Point GPA Entry**: Under `[Academic Records – GPA]`, **select `\"Others\"`**, enter `17.50`, and upload merged IAU grading scale + wet-stamped `Scholaro` PDF; `Study Plan` is typed online.", "🔒 **Post-Payment Hard Lockout**: <span class='phys-red'>**Once the `$130` fee is paid, Yonsei's portal permanently locks—NO major changes and NO replacing or adding any PDFs**<\/span> (double-check every file before paying)!"], "fa": ["📄 **فرم پیش‌امضا و اطلاعات تماس**: فرم `Letter of Confirmation (Non-Korean)` را از قبل دانلود، امضا و اسکن رنگی کنید؛ ایمیل و موبایل مستقیم ed by BRiCE.\n\nAre you recruiting full-time M.S. students for Fall 2027? If my profile is a potential fit, I would be deeply grateful if you could recommend key single-cell perturbation papers or Scanpy/PyTorch workflows I could study remotely between March and August before enrollment. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p2", "rank": "#2", "sendDate": {"zh": "2027.01.06 · 09:30 KST", "en": "Jan 6, 2027 · 09:30 KST", "fa": "۶ ژانویه ۲۰۲۷ · ساعت ۹:۳۰ کره"}, "pi": {"zh": "정원영 (Wonyeong Jung) · 高丽医生命融合科学", "en": "Prof. Wonyeong Jung (Korea Univ. · Systems Immunology)", "fa": "پروفسور جونگ وون‌یونگ (دانشگاه کره · ایمونولوژی سیستم‌ها)"}, "hook": {"zh": "2026.03 iScience (115520, 母乳抗体Fc追踪HIV传播公开数据 DVN/ZYHQRL) + 2026儿童金葡菌抗体保护力研究", "en": "Mar 2026 iScience (115520, open Dataverse DVN/ZYHQRL HIV Fc dataset) & 2026 pediatric S. aureus protection study", "fa": "مقاله مارس ۲۰۲۶ iScience (دیتاست باز آنتی‌بادی Fc در Harvard Dataverse) و پژوهش استافیلوکوک طلایی"}, "caution": {"zh": "首封信与面试均绝口不提教授财政支援签字表（自己开2,200万银行存款原件）；面试仅温和确认RA覆盖C类65%校奖外的35%差额。", "en": "NEVER mention any professor financial sponsorship form in emails or Zoom! Politely confirm in Feb Zoom whether RA covers the 35% gap beyond Type C.", "fa": "چه در ایمیل و چه در زوم، مطلقاً اسمی از فرم ضمانت مالی استاد نیاورید! فقط محترمانه پوشش ۳۵٪ مابه‌التفاوت شهریه از محل RA را بپرسید."}, "subject": "Prospective M.S. Student (Fall 2027) – Course-Based Systems Serology & S. aureus Epitope Mini-Projects", "body": "Dear Professor Wonyeong Jung,\n\nI closely studied your recent Systems Serology work tracking HIV vertical transmission via breastmilk Fc profiles (iScience, 2026) and protective humoral immunity against pediatric Staphylococcus aureus. I am completing my B.S. in Clinical Laboratory Sciences at the Faculty of Medicine (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), with 20/20 full marks in Medical Immunology Lab, Medical Bacteriology Lab, and Biostatistics.\n\nBuilding on my laboratory coursework alongside a completed 40+ hour Computational Vaccine Design & Immunoinformatics training and Python for Bioinformatics (11 Modules), I created two learning mini-projects on GitHub ([Link]): (1) S. aureus ClfA protective epitope screening (VaxiJen 2.0/AllerTOP) and Molegro Virtual Docker (MVD) 3D receptor docking, and (2) in-fold standardized LASSO/XGBoost, 100-permutation testing, and SHAP Fc-effector profiling reproduced on your open Harvard Dataverse dataset (DVN/ZYHQRL).\n\nAre you considering full-time M.S. applicants for Fall 2027? If my background aligns with your team, I would be deeply grateful if you could suggest any Systems Serology literature or modeling topics I should study between March and August prior to arriving in Seoul. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p3", "rank": "#3", "sendDate": {"zh": "2027.01.12 (首波后6天) · 09:30 KST", "en": "Jan 12, 2027 (+6d) · 09:30 KST", "fa": "۱۲ ژانویه ۲۰۲۷ (۶ روز بعد) · ساعت ۹:۳۰ کره"}, "pi": {"zh": "윤덕용 (Dukyong Yoon) · 延世大学医学院 CMI Lab", "en": "Prof. Dukyong Yoon (Yonsei Med · CMI Lab)", "fa": "پروفسور یون دوک‌یونگ (پزشکی یونسی · آزمایشگاه CMI)"}, "hook": {"zh": "2026.03 iScience (29(5):115416, 心脏术后持续性AKI动态预测) + SNUH VitalDB 真实开源围术期检验队列对齐复现", "en": "Mar 2026 iScience (29(5):115416, dynamic postoperative pAKI prediction) + primary validation on real open-source SNUH VitalDB cohort", "fa": "مقاله مارس ۲۰۲۶ iScience (پیش‌بینی پویای آسیب کلیوی pAKI) + اعتبارسنجی اصلی روی کوهورت واقعی SNUH VitalDB"}, "caution": {"zh": "突出医学院临床检验本科 + 16学分（816学时）医学诊断实验室必修实训（均分 18.94/20）及 SNUH VitalDB 主验证集；半句实测组内纯数值检验/生理信号课题英文沟通可行性。", "en": "Highlight Faculty of Medicine B.S. + 16 credits (816 hours) of clinical diagnostic laboratory practicum (GPA: 18.94/20) + SNUH VitalDB primary validation; gently check English communication on structured lab/biosignal tasks.", "fa": "برجسته‌سازی کارشناسی دانشکده پزشکی، ۱۶ واحد (۸۱۶ ساعت) کارورزی عملی آزمایشگاه تشخیص طبی (معدل ۱۸.۹۴) و اعتبارسنجی روی SNUH VitalDB؛ بررسی محترمانه امکان کار به زبان انگلیسی روی داده‌های عددی."}, "subject": "Prospective M.S. Student (Fall 2027) – Clinical Lab Background & SNUH VitalDB pAKI Mini-Project", "body": "Dear Professor Dukyong Yoon,\n\nI was deeply inspired by CMI Lab's dynamic prediction study on persistent acute kidney injury after cardiac surgery (iScience, 2026). I am completing my B.S. in Clinical Laboratory Sciences at the Faculty of Medicine (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), including 16 credits (816 hours) of clinical diagnostic laboratory practicum (GPA: 18.94/20) and 20/20 full marks in Biostatistics and Computer Basics.\n\nCombining my clinical diagnostic biochemistry workflow experience with Python for Bioinformatics (11 Modules) training, I built a small learning mini-project on GitHub ([Link]) using the real open-source SNUH VitalDB (api.vitaldb.net) perioperative clinical laboratory cohort as the primary validation set while aligning with and reproducing the CMI-Laboratory/pAKI methodological pipeline (creatinine-slope QC, tableone, miceforest imputation, and XGBoost/SHAP explanation).\n\nAre you recruiting full-time international M.S. students (communicating in English on structured laboratory/biosignal datasets) for Fall 2027? If so, I would be grateful for any pointers on SQL or time-series modeling topics I could prepare between March and August before enrollment. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p4", "rank": "#4", "sendDate": {"zh": "2027.01.12 (首波后6天) · 09:30 KST", "en": "Jan 12, 2027 (+6d) · 09:30 KST", "fa": "۱۲ ژانویه ۲۰۲۷ (۶ روز بعد) · ساعت ۹:۳۰ کره"}, "pi": {"zh": "이윤지 (Yoonji Lee) · 中央大学药学系", "en": "Prof. Yoonji Lee (Chung-Ang Univ. · Pharmacy)", "fa": "پروفسور لی یون‌جی (دانشگاه چونگ‌آنگ · داروسازی)"}, "hook": {"zh": "2026 Briefings in Bioinformatics (bbag421) + 2025 Frontiers in Chemistry 综述表1评析的定量 QSAR 基准 hERGBoost 平行对照", "en": "2026 Briefings in Bioinformatics (bbag421) & quantitative QSAR benchmark hERGBoost evaluated in Table 1 of her 2025 Front. Chem. review", "fa": "مقاله ۲۰۲۶ در Briefings in Bioinformatics و مقایسه موازی با معیار کمی QSAR مدل hERGBoost در جدول ۱ مقاله مروری ۲۰۲۵ ایشان"}, "caution": {"zh": "三重红线：① 聚焦定量生物活性 QSAR 建模、Bemis-Murcko骨架划分 R²/RMSE 对照与 MVD 3D通道对接（去毒理化口径）；② 切勿把 hERGBoost 写成李允智本人合著；③ 所附私密版 CV 底部须列出 2 位母校满分课推荐教授姓名与 `@iau.ac.ir` 邮箱（满足 CAYSS Step 1）！", "en": "Triple guardrails: (1) Focus strictly on quantitative bioactivity QSAR modeling, scaffold-split R²/RMSE benchmarking & MVD 3D channel docking (zero toxicology-specialty claim); (2) NEVER write that Prof. Yoonji Lee co-authored hERGBoost; (3) List your 2 IAU 20/20 recommending professors at the bottom of your attached private CV (satisfies CAYSS Step 1)!", "fa": "سه خط قرمز حیاتی: ۱) تمرکز کامل بر مدل‌سازی کمی زیست‌فعالی QSAR و داکینگ سه‌بعدی کانال در MVD (بدون ادعای تخصص سم‌شناسی)؛ ۲) هرگز مدل hERGBoost را اثر خود پروفسور لی ننویسید؛ ۳) در انتهای رزومه خصوصی پیوست، نام و ایمیل دانشگاهی ۲ استاد معرف واحد اردبیل را درج کنید (شرط گام ۱ بورسیه CAYSS)!"}, "subject": "Prospective M.S. Student (Fall 2027, CAYSS) – Quantitative Bioactivity QSAR & 3D Channel Docking Mini-Project", "body": "Dear Professor Yoonji Lee,\n\nI closely read your recent work in Briefings in Bioinformatics (2026) and your comprehensive Frontiers in Chemistry review (2025) evaluating ligand-based machine learning pipelines and quantitative benchmarks such as hERGBoost. I am completing my B.S. in Clinical Laboratory Sciences at the Faculty of Medicine (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), with 20/20 full marks in Medical Biochemistry, Biophysics, and Biostatistics.\n\nBuilding on my coursework alongside Bioinformatics-Driven Drug Design & QSAR Modeling (30 Topics) and Python for Bioinformatics (11 Modules) trainings, I built a learning mini-project on GitHub ([Link], hERG-QSAR-SHAP-Dock): Bemis-Murcko scaffold-split classification and quantitative IC50/pIC50 bioactivity QSAR regression on TDC datasets (benchmarked in parallel on R2/RMSE against hERGBoost in Table 1 of your review), paired with modern RDKit Morgan fingerprint SHAP substructure attribution and 3D channel docking (PDB 7CN0) in Molegro Virtual Docker (MVD).\n\nAre you considering full-time M.S. applicants (including potential CAYSS nominees) for Fall 2027? If my profile is a fit, I would be deeply grateful for any structural bioinformatics or QSAR topics you recommend mastering before September. My 1-page CV (including my two undergraduate faculty recommenders at IAU Ardabil) and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}], "zoomPlaybook": {"title": {"zh": "图 4C｜2月16日—28日 Zoom 15分钟面试时间轴与逐字实战剧本（会后24h发感谢信文字落定）", "en": "Fig 4C | Feb 16–28 15-Minute Zoom Interview Timeline & Verbatim Scripts (Confirm in 24h Thank-You Email)", "fa": "نمودار ۴-ج | خط زمانی مصاحبه ۱۵ دقیقه‌ای زوم (۱۶ تا ۲۸ فوریه) و متن دقیق دیالوگ‌های کلیدی"}, "stages": [{"time": "00:00 – 00:45", "badge": {"zh": "全员通用开场破冰", "en": "Universal Icebreaker", "fa": "یخ‌شکن آغازین (مشترک همه اساتید)"}, "title": {"zh": "30秒韩语微笑问候 + 100%留韩医药产业长期宣言", "en": "30s Korean Greeting + 100% Stay-in-Korea Biopharma Career Pledge", "fa": "۳۰ ثانیه سلام به زبان کره‌ای + اعلام تعهد ۱۰۰٪ به ماندن در صنعت دارویی کره"}, "script": "“안녕하세요, 교수님! 만나서 반갑습니다. 저는 아르산입니다. 지금 한국어를 열심히 공부하고 있습니다.”\n(Annyeonghaseyo, Gyosunim! Mannaseo bangapseumnida. Jeoneun Arsan-imnida. Jigeum hangugeo-reul yeolsimhi gongbuhago itseumnida.)\n\n→ Switch smoothly to English:\n“Thank you for your time, Professor. My long-term career goal is 100% in South Korea—after completing my M.S., I aim to enter Korea's biopharma AI or computational drug discovery R&D sector (via E-7 to F-2-7 visa) rather than going to the US, and remain a dedicated long-term alumnus of your lab.”", "why": {"zh": "瞬间击穿外籍生沟通隔阂，打消韩国教授最担心的“把课题组当去欧美跳板”顾虑。", "en": "Instantly builds warmth and reassures Korean PIs that you won't treat their lab as a mere stepping stone to the US.", "fa": "ایجاد صمیمیت فوری و رفع بزرگ‌ترین نگرانی اساتید کره‌ای درباره دانشجویانی که آزمایشگاه را صرفاً سکوی پرتاب به آمریکا می‌بینند."}}, {"time": "10:00 – 13:30 (Option A: HYU)", "badge": {"zh": "汉阳专属 (#1a / #1b)", "en": "Hanyang Specific (#1a / #1b)", "fa": "اختصاصی دانشگاه هانیانگ (#1a و #1b)"}, "title": {"zh": "确认经费闭环 + 恳请4–5月内部签交《韩语标准免除申请书》", "en": "Confirm Full Tuition/Stipend Loop + Internal Korean Exemption Sign-Off", "fa": "تأیید پوشش شهریه/حقوق + هماهنگی امضای داخلی فرم معافیت زبان کره‌ای"}, "script": "“Professor [Nam/Cho], may I briefly confirm two administrative items from Hanyang's graduate guide? First, alongside competing for HISP and Hanyang's 50% STEM tuition scholarship, does our lab's grant / BK21 package support full-time M.S. students for the remaining tuition balance and living stipend from Semester 1?\nSecond, Hanyang places newly admitted students without TOPIK Level 4 on leave of absence unless the advisor submits the internal 'Korean Proficiency Exemption Request Form' (한국어기준 면제 요청서) during the April–May departmental screening. If you decide to accept me, would you be willing to submit that internal exemption so I can start coursework and research right away in September?”", "why": {"zh": "把行政流程说得清晰专业，让教授知道无需学生交表、只需系审时他勾选一下即可。", "en": "Shows you know Hanyang's exact policy so the PI realizes it's just a quick internal departmental checkbox.", "fa": "نشان می‌دهد قوانین دقیق هانیانگ را کاملاً بلدید و استاد مت
