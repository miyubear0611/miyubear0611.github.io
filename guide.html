<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan M.S. Fall 2027 — 韩国顶尖大学院全奖申请三语交互指南 (中文 · English · فارسی)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EFF6FF;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --text: #0F172A;
  --text-2: #334155;
  --text-3: #64748B;
  --primary: #1A73E8;
  --primary-soft: rgba(26, 115, 232, 0.10);
  --teal: #0D9488;
  --teal-soft: rgba(13, 148, 136, 0.10);
  --green: #0F9D58;
  --green-soft: #E6F4EA;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --orange: #FA903E;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --red: #D93025;
  --red-soft: #FCE8E6;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --radius: 14px;
  --radius-sm: 9px;
}

html[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #151F32;
  --surface-2: #1E293B;
  --surface-3: #1E3A5F;
  --border: #2D3D56;
  --border-strong: #475569;
  --text: #F1F5F9;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --primary: #60A5FA;
  --primary-soft: rgba(96, 165, 250, 0.15);
  --green-soft: rgba(16, 185, 129, 0.16);
  --amber-soft: rgba(245, 158, 11, 0.16);
  --purple-soft: rgba(167, 139, 250, 0.16);
  --red-soft: rgba(239, 68, 68, 0.18);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  line-height: 1.68;
  font-size: 14.5px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

html[lang="fa"] body {
  font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', 'Inter', sans-serif;
  line-height: 1.88;
  font-size: 15px;
}

/* Prevent long URLs/emails/identifiers from pushing mobile containers wide */
.section-card, .comp-card, .insp-item, .insp-v, .tuition-sub, .tuition-note,
.check-label, .metro-card, .hero-priority-alert, li, p, td {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Reusable Responsive Grids */
.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.grid-3col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 820px) {
  .grid-2col, .grid-3col { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

/* Red physical original callout */
.phys-red {
  color: #C5221F;
  background: rgba(217, 48, 37, 0.09);
  border-bottom: 1.5px solid rgba(217, 48, 37, 0.42);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
html[data-theme="dark"] .phys-red {
  color: #FCA5A5;
  background: rgba(239, 68, 68, 0.20);
  border-bottom-color: rgba(248, 113, 113, 0.55);
}

code.ic {
  font-family: 'JetBrains Mono', 'Consolas', monospace;
  font-size: 0.90em;
  background: rgba(148, 163, 184, 0.18);
  padding: 1px 5px;
  border-radius: 4px;
  direction: ltr;
  unicode-bidi: isolate;
}

/* Inline clickable glossary term highlight */
.term-hl {
  border-bottom: 1.5px dashed #0284C7;
  background: rgba(14, 165, 233, 0.09);
  color: inherit;
  padding: 0 3px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.term-hl:hover {
  background: rgba(14, 165, 233, 0.22);
  border-bottom-style: solid;
}
body.hl-off .term-hl {
  border-bottom: none;
  background: transparent;
  padding: 0;
  cursor: text;
}

/* Sticky Topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .topbar {
  background: rgba(21, 31, 50, 0.94);
}

.topbar-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #1A73E8, #0D9488);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(26, 115, 232, 0.28);
  flex-shrink: 0;
}
.brand-text-main {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  line-height: 1.25;
}
.brand-text-sub {
  font-size: 12px;
  color: var(--text-3);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.lang-group {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
  min-height: 32px;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(26, 115, 232, 0.30);
}

.ctrl-pill {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  font-family: inherit;
  min-height: 34px;
}
.ctrl-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.ctrl-pill.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* Primary Navigation Tabs */
.nav-tabs-bar {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-tabs-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-3);
  padding: 10px 13px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.18s;
  font-family: inherit;
  flex-shrink: 0;
}
.tab-btn:hover {
  color: var(--text);
  background: var(--surface-2);
  border-radius: 8px 8px 0 0;
}
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
.tab-badge-count {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}

/* Main Container */
.main-wrap {
  max-width: 1320px;
  margin: 22px auto 64px;
  padding: 0 20px;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.hero-banner {
  background: linear-gradient(135deg, rgba(26,115,232,0.08), rgba(13,148,136,0.08));
  border: 1px solid rgba(26,115,232,0.22);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.hero-badge {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 10px;
}
.hero-title {
  margin: 0 0 10px;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.35;
}
.hero-priority-alert {
  background: var(--surface);
  border-inline-start: 4px solid var(--red);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-2);
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.kpi-val {
  font-size: 23px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}
.kpi-sub {
  font-size: 13.5px;
  font-weight: 700;
  margin-top: 4px;
  color: var(--text);
}
.kpi-detail {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* Priority Cascade Funnel */
.cascade-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.cascade-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-top: 4px solid var(--primary);
  border-radius: 12px;
  padding: 15px;
}
.cascade-rank {
  display: inline-block;
  font-weight: 800;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  color: #fff;
  margin-bottom: 8px;
}
.cascade-uni { font-weight: 800; font-size: 15.5px; margin-bottom: 3px; }
.cascade-dept { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
.cascade-pis { font-size: 13.2px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.cascade-tag {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
}

/* Section Headings */
.sec-title {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.38;
}
.sec-sub {
  margin: 0 0 16px;
  font-size: 13.4px;
  color: var(--text-3);
}

/* Stacked Tuition & Workload Bars */
.tuition-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12.8px;
  font-weight: 600;
}
.leg-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
  vertical-align: middle;
  margin-inline-end: 6px;
}
.tuition-axis {
  direction: ltr;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  padding: 0 2px 6px;
  border-bottom: 1px dashed var(--border-strong);
  margin-bottom: 12px;
}
.tuition-row {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.16s;
  background: var(--surface-2);
}
.tuition-row:hover, .tuition-row.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.tuition-row-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.tuition-school-name { font-weight: 800; font-size: 15px; }
.tuition-pill {
  font-size: 11.8px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}
.tuition-sub { font-size: 12.8px; color: var(--text-3); margin-bottom: 9px; }

.bar-track-ltr {
  direction: ltr;
  width: 100%;
  height: 32px;
  background: rgba(148, 163, 184, 0.16);
  border-radius: 8px;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
}
.bar-seg-blue, .bar-seg-orange {
  height: 100%;
  color: #fff;
  font-size: 11.8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}
.bar-seg-blue { background: linear-gradient(90deg, #1A73E8, #2563EB); }
.bar-seg-orange { background: linear-gradient(90deg, #FA903E, #EA580C); }

.bar-total-tag {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  padding: 0 8px;
  white-space: nowrap;
}
.mobile-bar-summary {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
  font-size: 11.5px;
  font-weight: 700;
}
.tuition-note {
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 8px;
}

.inspector-drawer {
  background: var(--surface-3);
  border: 1px solid rgba(26, 115, 232, 0.28);
  border-radius: 12px;
  padding: 15px 16px;
  margin-top: 14px;
}
.inspector-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.insp-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
}
.insp-k { font-size: 11.5px; font-weight: 700; color: var(--text-3); margin-bottom: 3px; }
.insp-v { font-size: 13px; font-weight: 600; color: var(--text); }

/* Compliance & Card Grids */
.compliance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.comp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.pill-red { background: var(--red-soft); color: var(--red); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill-green { background: var(--green-soft); color: var(--green); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.comp-row { margin-bottom: 10px; font-size: 13.2px; }
.comp-k { font-weight: 700; color: var(--text); display: block; margin-bottom: 2px; }

/* Swipe Hint Pill for Mobile Horizontal Scroll Areas */
.mobile-swipe-hint {
  display: none;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 5px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

/* Responsive Tables */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 820px;
  font-size: 13px;
}
.data-table th {
  background: var(--surface-2);
  color: var(--text);
  font-weight: 700;
  text-align: start;
  padding: 11px 13px;
  border-bottom: 2px solid var(--border-strong);
  white-space: pre-line;
  vertical-align: top;
}
.data-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: pre-line;
}
.data-table tr:last-child td { border-bottom: none; }

/* 5-Step Pipeline Stepper */
.stepper-rail {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.step-node {
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 13px;
  cursor: pointer;
  transition: all 0.16s;
}
.step-node:hover, .step-node.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.step-num-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.step-num {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.step-days {
  font-size: 11.2px;
  font-weight: 700;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 8px;
  border-radius: 999px;
}
.step-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.step-loc { font-size: 12px; color: var(--text-3); }

/* 3-Tier Triage & All-Expanded 5-Step Walkthrough Cards */
.triage-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}
.triage-card {
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-inline-start-width: 5px;
  border-radius: 12px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.triage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.triage-chain {
  font-size: 12.8px;
  font-weight: 700;
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  padding: 7px 11px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.triage-docs {
  font-size: 13.4px;
  white-space: pre-line;
  color: var(--text);
}

.steps-expanded-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 12px;
}
.step-full-card {
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: 12px;
  padding: 16px 18px;
  scroll-margin-top: 118px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.18s, box-shadow 0.18s;
}
.step-full-card.highlight-target {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}
.step-meta-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 12px;
  margin: 10px 0 12px;
  font-size: 12.5px;
}

/* Architecture 3-Column Visual */
.arch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.25fr;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 960px) {
  .arch-grid { grid-template-columns: minmax(0, 1fr); }
}
.arch-col {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.arch-col-head {
  font-weight: 800;
  font-size: 14px;
  color: var(--primary);
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--border-strong);
}
.arch-box {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
}
.arch-engine {

ionship and foreign nationality.", "fa": "سند رسمی هویتی و نسبی در ایران. برای اثبات غیردوگانه بودن تابعیت و رابطه فرزند و والدین در دانشگاه‌های کره، ترجمه رسمی انگلیسی هر سه جلد شناسنامه (متقاضی، پدر و مادر) با تأیید دادگستری و وزارت خارجه کافی است."}, "tip": {"zh": "身份簿只需办到“伊朗司法部+外交部双认证”即为最终成品，无需送韩国大使馆盖领事章！", "en": "Only requires Iranian MOJ + MFA stamps; Korean Embassy consular legalization is NOT needed for Shenasnameh.", "fa": "شناسنامه‌ها فقط به مهر دادگستری و وزارت خارجه نیاز دارند و نیازی به مهر کنسولی سفارت کره (و پرداخت دلار) ندارند!"}}, {"id": "consular_confirm", "cat": "iran", "term": {"zh": "韩国驻伊使馆领事认证 (영사확인)", "en": "Korean Embassy Consular Legalization (영사확인)", "fa": "تأییدیه کنسولی سفارت کره جنوبی (영사확인)"}, "aliases": ["영사확인", "领事认证", "韩国驻德黑兰大使馆领事认证", "韩国使馆领事认证"], "def": {"zh": "因伊朗非海牙（Apostille）成员国，学历与成绩单经伊朗司法部+外交部双认证后，须送交德黑兰 Vanak 广场韩国驻伊朗大使馆领事处加盖领事确认章（영사확인），韩国高校与法务部才承认其法律效力。", "en": "Because Iran is not part of the Hague Apostille Convention, academic documents authenticated by Iran's MOJ & MFA must receive final consular legalization at the Korean Embassy in Tehran (Vanak Sq.).", "fa": "از آنجا که ایران عضو کنوانسیون آپوستیل نیست، مدارک تحصیلی پس از تأیید دادگستری و وزارت خارجه باید به بخش کنسولی سفارت کره جنوبی در تهران (میدان ونک، خیابان شیخ بهایی شمالی، کوچه دانشور غربی، پلاک ۲) ارائه شوند."}, "tip": {"zh": "周日至周四 08:30–11:30 递交，2–3工作日出件，每份仅收 $4 USD 崭新无折痕美钞，不限申请批次（采用1月3套+4月1套分批策略）。", "en": "Sun–Thu 08:30–11:30 drop-off, 2–3 working days turnaround, $4 USD crisp cash per document, unlimited batches (3 sets in Jan + 1 set in Apr).", "fa": "یکشنبه تا پنجشنبه ۸:۳۰ تا ۱۱:۳۰ تحویل مدارک، ۲ تا ۳ روز کاری زمان بررسی، هزینه ۴ دلار اسکناس نو و بدون تاخوردگی به ازای هر مدرک و بدون محدودیت دفعات مراجعه."}}, {"id": "etrf", "cat": "korea", "term": {"zh": "机考雅思电子成绩单 (e-TRF)", "en": "Electronic Test Report Form (IELTS e-TRF)", "fa": "کارنامه الکترونیکی آیلتس کامپیوتری (e-TRF)"}, "aliases": ["e-TRF", "电子成绩单"], "def": {"zh": "机考雅思（IELTS on Computer）考后1–5天在考生后台（Test Taker Portal）签发的官方PDF成绩单，底部印有唯一防伪核验码（TRF Number），各大学可通过雅思官方核验系统在线查验真伪。", "en": "The official verifiable PDF score report issued 1–5 days after computer-delivered IELTS on the Test Taker Portal, featuring a unique TRF verification number.", "fa": "کارنامه رسمی PDF آیلتس کامپیوتری که ۱ تا ۵ روز پس از آزمون در پورتال زبان‌آموز صادر می‌شود و دارای کد رهگیری و اصالت‌سنجی (TRF Number) در پایین صفحه است."}, "tip": {"zh": "套磁可邮件发给教授；正式网申严禁私人邮件发招生办！高丽/汉阳走后台免费电子送分+首尔Charlotte激光彩打装袋；延世仅系统上传PDF（禁机构送分）。", "en": "Emailing PDF to professors is fine, but NEVER email admissions offices! Use free Portal e-delivery + Seoul color print for KU/HYU; upload PDF only for YU.", "fa": "ارسال PDF با ایمیل شخصی برای اساتید مجاز است، اما برای دفتر پذیرش دانشگاه‌ها اکیداً ممنوع است! برای KU/HYU ارسال الکترونیکی رایگان از پورتال + چاپ رنگی لیزری در سئول؛ برای یونسی فقط آپلود در سایت."}}, {"id": "korean_waiver", "cat": "korea", "term": {"zh": "韩语标准免除申请书 (한국어기준 면제 요청서)", "en": "Korean Proficiency Exemption Form (한국어기준 면제 요청서)", "fa": "فرم معافیت از مدرک زبان کره‌ای (한국어기준 면제 요청서)"}, "aliases": ["한국어기준 면제 요청서", "韩语标准免除申请书", "免韩语证明", "免韩语表"], "def": {"zh": "汉阳大学特有制度：未持有TOPIK 4级的外国新生默认在注册后被强制休学（휴학）；唯有汉阳指导教授在4–5月院系审查期向校方内部签交此表，学生才能凭英语成绩在9月正常选课进组。", "en": "Hanyang-specific rule: newly admitted international students without TOPIK Level 4 are placed on mandatory leave of absence unless their prospective Hanyang advisor internally signs and submits this waiver during April–May departmental review.", "fa": "قانون اختصاصی دانشگاه هانیانگ: دانشجویان بدون مدرک TOPIK سطح ۴ پس از ثبت‌نام به مرخصی اجباری فرستاده می‌شوند، مگر اینکه استاد راهنمای هانیانگ در بررسی داخلی آوریل–مه این فرم معافیت را امضا و رد کند."}, "tip": {"zh": "高丽、延世、中央3校凭IELTS ≥ 5.5制度自动免韩语；仅汉阳大学需在2月Zoom面试向导师确认并在3月报备考号！", "en": "KU, YU, and CAU automatically exempt Korean with IELTS ≥ 5.5; ONLY Hanyang requires asking your professor in Feb Zoom to submit this internal form.", "fa": "دانشگاه‌های کره، یونسی و چونگ‌آنگ با آیلتس ۵.۵ به بالا خودکار an flag your file during departmental screening.", "fa": "پس از ثبت‌نام در هانیانگ، کد 수험번호 را سریعاً برای استاد ایمیل کنید تا در مرحله بررسی دانشکده پرونده شما را پیدا و فرم معافیت زبان را امضا کند."}}, {"id": "scholaro", "cat": "korea", "term": {"zh": "Scholaro 逐科绩点换算母校鲜章件 (HYU/CAU免领事认证)", "en": "University-Stamped Scholaro GPA Report (Exempt from Consular Stamp)", "fa": "گزارش معادل‌سازی معدل Scholaro با مهر زنده دانشگاه (معاف از مهر سفارت)"}, "aliases": ["Scholaro", "scholaro.com"], "def": {"zh": "汉阳大学（HYU）与中央大学（CAU）简章均明文规定：针对20分制成绩单，在 scholaro.com 逐学期录入全部课程打印换算单后，只要加盖毕业大学教务处官方英文鲜章即直接具备官方效力，免做驻伊使馆领事认证！且汉阳漏交百分制换算原件将直接取消 HISP 全奖参评资格。", "en": "Both Hanyang (HYU) and Chung-Ang (CAU) guides explicitly state that a 10-semester scholaro.com GPA report bearing IAU Ardabil Registrar's official wet-ink English stamp is directly valid WITHOUT Korean Embassy legalization! Omitting percentage conversion at HYU voids HISP eligibility.", "fa": "دفترچه هر دو دانشگاه هانیانگ و چونگ‌آنگ صراحتاً اعلام کرده گزارش معادل‌سازی ۱۰ ترم از سایت scholaro.com به محض ممهور شدن به مهر زنده انگلیسی آموزش دانشگاه مبدأ، مستقیماً معتبر بوده و از تأیید کنسولی سفارت کره معاف است! نبودن معادل‌سازی درصدی در هانیانگ باعث حذف از بورسیه HISP می‌شود."}, "tip": {"zh": "防过期铁律：高丽明令仅认可提交截止（~03.19）前3个月内签发件，严禁在2026.12.20前过早盖章！统一在 2027.01.10–02.04 打印3份全10学期逐科单在分校教务处加盖英文鲜章（配合母校87.50%官方证明一套通杀4校）！", "en": "Anti-expiration rule: KU only accepts documents issued within 3 months of ~Mar 19—NEVER stamp before Dec 20, 2026! Print & wet-stamp 3 copies of your 10-sem Scholaro sheet during Jan 10–Feb 4, 2027 to satisfy all 4 schools!", "fa": "قانون ضد انقضا: دانشگاه کره فقط مدارک صادره در ۳ ماه منتهی به ~۱۹ مارس را می‌پذیرد؛ مطلقاً قبل از ۲۰ دسامبر مهر نزنید! در بازه ۱۰ ژانویه تا ۴ فوریه ۲۰۲۷ سه نسخه کامل ۱۰ ترم Scholaro را به مهر زنده انگلیسی واحد اردبیل برسانید."}}, {"id": "coa_d2", "cat": "korea", "term": {"zh": "标准入学许可书 (CoA) 与 D-2 留学签证", "en": "Certificate of Admission (CoA) & D-2 Student Visa", "fa": "گواهی پذیرش استاندارد (CoA) و ویزای تحصیلی D-2"}, "aliases": ["CoA", "标准入学许可书", "D-2", "D-2 留学签证", "D-2签证"], "def": {"zh": "6–7月正式录取注册并提交30天内最新银行存款证明原件后，韩国大学签发的法务部《标准入学许可书（표준입학허가서 / CoA）》。凭 CoA + 第1批预留的第3套领事认证原件赴韩国驻德黑兰使馆申办 D-2 硕士留学签证。", "en": "Official Certificate of Admission issued in July after tuition/registration confirmation and fresh (<30-day) bank balance proof; used with your 3rd set of legalized degree documents at the Korean Embassy in Tehran to obtain the D-2 Master's visa.", "fa": "برگه رسمی پذیرش که پس از ثبت‌نام نهایی و ارائه گواهی تمکن مالی جدید (صادرشده در ۳۰ روز اخیر) در ماه جولای توسط دانشگاه صادر می‌شود. با CoA و سری سوم مدارک کنسولی، ویزای تحصیلی D-2 را از سفارت کره در تهران می‌گیرید."}, "tip": {"zh": "法定死线：韩国法务部规定9月1日开学后一律停发 CoA，定校与新存款证明务必在2027年7月中旬前交齐！", "en": "Hard legal deadline: Korean Immigration prohibits issuing CoAs after Sep 1 semester start—submit registration and fresh bank proof before mid-July 2027.", "fa": "خط قرمز قانونی: اداره مهاجرت کره پس از ۱ سپتامبر مطلقاً CoA صادر نمی‌کند؛ ثبت‌نام و گواهی بانکی جدید را حتماً تا اواسط جولای ۲۰۲۷ تکمیل کنید."}}, {"id": "e7_f27", "cat": "korea", "term": {"zh": "韩国就业与优才永居通道 (E-7 → F-2-7)", "en": "Korea R&D Work & Points Residency Visa (E-7 → F-2-7)", "fa": "مسیر ویزای کاری تخصصی و اقامت امتیازی کره (E-7 به F-2-7)"}, "aliases": ["E-7", "F-2-7"], "def": {"zh": "韩国生物医药/医疗AI硕士毕业后的留韩职业路径：先通过特定活动工作签（E-7）进入韩国药企或AI研发岗位，随后凭韩国名校硕士学历、薪资与年龄加分转优才居住签（F-2-7）。在Zoom面试中表明留韩深耕而非跳板去美国，极受韩国教授青睐。", "en": "Post-M.S. career visa pathway in South Korea: transitioning from D-2 to E-7 (specialty R&D employment in Korean biopharma/AI) and F-2-7 (points-based residency). Highlighting long-term commitment to Korea strongly appeals to Korean PIs.", "fa": "مسیر شغلی پس از کارشناسی ارشد در کره: ورود به صنعت دارو و هوش مصنوعی پزشکی کره با ویزای تخصصی E-7 و سپس تبدیل به اقامت امتیازی F-2-7. اعلام هدف ماندن در کره (به‌جای مهاجرت به آمریکا) امتیاز بزرگی در مصاحبه با اساتید کره‌ای است."}, "tip": {"zh": "Zoom面试开场30秒韩语问候后紧接着抛出这一留韩职业规划，打消教授对外国学生“拿完学位就走、无法长期合作”的顾虑。", "en": "State this right after your 30-second Korean greeting in Zoom interviews to show long-term commitment as a lab alumnus in Korea.", "fa": "در همان دقیقه اول مصاحبه زوم پس از سلام به زبان کره‌ای این هدف را مطرح کنید تا خیال استاد از تعهد بلندمدت شما راحت شود."}}, {"id": "hisp", "cat": "funding", "term": {"zh": "汉阳国际优秀奖学金 (HISP) 与理工科奖学金", "en": "Hanyang International Scholarship (HISP) & STEM Scholarship", "fa": "بورسیه بین‌المللی هانیانگ (HISP) و بورسیه مهندسی/علوم پایه"}, "aliases": ["HISP", "汉阳理工科外国人奖学金"], "def": {"zh": "汉阳大学两大校级学费减免：① HISP按书审综合评定减免4学期100%/70%/50%学费（门槛：前序绩点百分制≥80%，必须交官方百分制换算证明原件）；② 汉阳理工科外国人奖学金对录取理工科研究生保底减免50%入学金+50%学费（维持GPA ≥ 3.0）。", "en": "Hanyang's two tuition waivers: (1) HISP awards 100%/70%/50% waiver for 4 semesters (requires ≥80/100 GPA & physical percentage conversion certificate); (2) STEM Scholarship guarantees 50% admission + 50% tuition waiver automatically.", "fa": "دو بورسیه شهریه دانشگاه هانیانگ: ۱) بورسیه رقابتی HISP با معافیت ۱۰۰٪، ۷۰٪ یا ۵۰٪ برای ۴ ترم (نیازمند معدل بالای ۸۰٪ و ارائه اصل گواهی معادل‌سازی درصدی ۸۷.۵۰٪)؛ ۲) بورسیه تضمینی رشته‌های علوم و مهندسی با ۵۰٪ تخفیف شهریه و ورودی."}, "tip": {"zh": "漏交 D10（87.50%百分制换算原件或母校英文鲜章 Scholaro 报告）将直接丧失 HISP 参评资格，Charlotte 装汉阳信封时务必逐页核对！", "en": "Omitting D10 (87.50% percentage conversion original or IAU wet-stamped Scholaro report) disqualifies you from HISP—double-check Hanyang's mail packet!", "fa": "فراموش کردن مدرک D10 (اصل گواهی معادل‌سازی ۸۷.۵۰٪ یا گزارش ممهور Scholaro) باعث حذف مستقیم از رقابت HISP می‌شود؛ هنگام بسته‌بندی پاکت هانیانگ حتماً چک کنید."}}, {"id": "ku_global", "cat": "funding", "term": {"zh": "高丽大学 Global Leader A类 / 理工C类奖学金", "en": "Korea Univ. Global Leader (Type A) & STEM (Type C) Scholarships", "fa": "بورسیه Global Leader نوع A و علوم پایه نوع C دانشگاه کره"}, "aliases": ["Global Leader A类", "理工科 C类奖学金", "C类奖学金", "理工 C类校奖"], "def": {"zh": "高丽大学外国人研究生校奖：C类（CGPA ≥ 3.14/4.0 或 ≥85% + IELTS ≥ 6.0）首学期免65%学费（不免入学金）；A类（CGPA ≥ 3.57/4.0 或 ≥90% + IELTS ≥ 7.0）免100%入学金与学费+月发50万韩元。第2学期起每学期凭高丽在读GPA（C类≥3.5/4.5，A类≥4.0/4.5）续申，免重交雅思！", "en": "KU international scholarships: Type C (CGPA ≥ 85% + IELTS ≥ 6.0) waives 65% tuition in Sem 1; Type A (CGPA ≥ 90% + IELTS ≥ 7.0) waives 100% admission + tuition + 500k KRW/mo. From Sem 2, renewal depends solely on KU GPA (≥4.0/4.5 upgrades to Type A without re-submitting IELTS!).", "fa": "بورسیه‌های دانشگاه کره: نوع C (معدل بالای ۸۵٪ + آیلتس ۶.۰) شامل ۶۵٪ معافیت شهریه ترم اول است (کامل در دسترس آرسان)؛ نوع A شامل ۱۰۰٪ معافیت شهریه و ورودی است. از ترم دوم، ارتقا به نوع A فقط با معدل داخل دانشگاه کره (۴.۰ از ۴.۵) و بدون نیاز مجدد به آیلتس انجام می‌شود!"}, "tip": {"zh": "第1学期剩余35%学费+入学金差额（共358.26万KRW）在2月面试温和确认由 #2 정원영 教授课题RA覆盖即可；绝口不提教授财政担保签字表！", "en": "Politely confirm in Feb Zoom whether Prof. Jung's RA stipend covers the 3.58M KRW Sem 1 gap; NEVER ask the professor to sign a financial sponsorship form.", "fa": "در مصاحبه فوریه محترمانه بپرسید آیا حقوق RA آزمایشگاه مابه‌التفاوت ۳.۵۸ میلیون وونی ترم اول را پوشش می‌دهد؛ هرگز از استاد امضای فرم ضمانت مالی نخواهید."}}, {"id": "cayss", "cat": "funding", "term": {"zh": "中央大学青年科学家全奖 (CAYSS)", "en": "CAU Young Scientist Scholarship (CAYSS)", "fa": "بورسیه کامل دانشمندان جوان دانشگاه چونگ‌آنگ (CAYSS)"}, "aliases": ["CAYSS", "CAYSS推荐书"], "def": {"zh": "中央大学理工医药顶级全额奖学金：凭本科CGPA ≥ 80% + IELTS ≥ 5.5 + 中央大专职教授签署《CAYSS推荐书》，直接免报名费+免入学金+免4学期100%学费（药学系基准951.95万KRW/学期），且校规强制导师每月配套 ≥ 50万韩元生活津贴。", "en": "CAU's flagship STEM/Pharmacy fellowship: waives application fee, admission fee, and 100% tuition for 4 semesters, plus mandates ≥500,000 KRW/month stipend from the advisor upon signing the CAYSS Recommendation Form.", "fa": "بورسیه طلایی دانشگاه چونگ‌آنگ ویژه رشته‌های علوم و داروسازی: با تأیید استاد راهنما (فرم توصیه‌نامه CAYSS)، کل هزینه اپلای، ورودی و ۱۰۰٪ شهریه ۴ ترم بخشیده شده و استاد موظف به پرداخت حداقل ۵۰۰ هزار وون کمک‌هزینه ماهانه است."}, "tip": {"zh": "维持条件：每学期GPA ≥ 3.5 + 毕业前投稿并于毕业后1年内发表(含录用) 1 篇独作或与导师合著（as sole author or jointly with the advisor）的 JCR 期刊论文（必须包含指定科研基金致谢，无基金致谢不予认定！）；教授交推荐书后务必等中央大 OIA 发送 Step 3 个人免报名费指引邮件再填 UWAY！", "en": "Requires ≥3.5 GPA and submitting pre-grad & publishing/accepting within 1 yr post-grad 1 JCR paper (sole author or jointly with the advisor, MUST carry the designated grant acknowledgment!); wait for CAU OIA's Step 3 Individual Guidance fee-waiver email before UWAY!", "fa": "شرط تداوم: معدل بالای ۳.۵ و چاپ/پذیرش ۱ مقاله JCR تا ۱ سال پس از فراغت (تک‌نویسنده یا مشترک با استاد راهنما + الزام ذکر گرنت پژوهشی مشخص‌شده!)؛ پس از ارسال فرم توسط استاد منتظر ایمیل راهنمای Step 3 از OIA برای معافیت اپلای فی بمانید!"}}, {"id": "bk21", "cat": "funding", "term": {"zh": "韩国国家BK21研究团与RA课题劳务津贴", "en": "Brain Korea 21 (BK21) & Lab RA Stipend", "fa": "طرح ملی پژوهش BK21 و حقوق دستیار پژوهشی (RA)"}, "aliases": ["BK21", "BK21-BIO4", "RA", "研究津贴"], "def": {"zh": "BK21（Brain Korea 21）是韩国教育部资助顶尖研究生院院系的国家级人才基金，叠加导师主持的科技部（NRF）/保健福祉部课题劳务费（Research Assistantship, RA），是韩国理工医药硕士覆盖剩余学费与每月生活费的核心资金池。", "en": "Brain Korea 21 is South Korea's flagship national graduate research grant. Combined with PI research grants (NRF / K-Moonshot / K-ARPA-H), RA stipends fund living expenses and cover any tuition not waived by university scholarships.", "fa": "طرح کلان دولت کره برای حمایت مالی از تحصیلات تکمیلی در دانشگاه‌های برتر که در کنار گرنت‌های تحقیقاتی استاد (NRF و غیره)، منبع اصلی پرداخت حقوق ماهانه دانشجو (RA) و پوشش کامل مابه‌التفاوت شهریه است."}, "tip": {"zh": "本报告锁定的5位导师全部背靠BK21研究团与国家级大课题，具备充足的经费兑现能力。", "en": "All 5 target professors belong to BK21 research groups backed by major national grants.", "fa": "هر ۵ استاد هدف در این گزارش عضو گروه‌های پژوهشی BK21 بوده و دارای گرنت‌های فعال دولتی هستند."}}, {"id": "dry_lab_intern", "cat": "funding", "term": {"zh": "无薪远程干实验预实习 (Remote Dry-Lab Pre-Internship)", "en": "Remote Dry-Lab Pre-Enrollment Internship", "fa": "پیش‌کارآموزی تحقیقاتی از راه دور (محاسباتی / Dry-Lab)"}, "aliases": ["远程干实验预实习", "进组前实习", "Remote Dry-Lab Pre-Internship", "Remote Pre-Internship"], "def": {"zh": "针对汉阳 #1a 남진우 教授官网“强烈建议入学前完成3–6个月实验室实习”的跨国破局策略：因人在伊朗等签证无法赴韩坐班，主动提议在2027年3月—8月通过互联网远程跑通组内公开RNA序列/单细胞代码与文献复现。", "en": "Strategic solution for labs like HYU BIG Lab (#1a Prof. Nam) that recommend 3–6 months of pre-enrollment internship: completing computational sequence/data pipelines remotely from Iran between March and August 2027 before flying to Seoul.", "fa": "راهکار هوشمندانه برای آزمایشگاه‌هایی مثل BIG Lab هانیانگ که ۳ تا ۶ ماه کارآموزی پیش از ورود توصیه می‌کنند: از آنجا که حضور فیزیکی قبل از ویزا ممکن نیست، پیشنهاد می‌دهید از مارس تا آگوست ۲۰۲۷ پایپ‌لاین‌های محاسباتی و مقالات آزمایشگاه را به صورت ریموت اجرا و تمرین کنید."}, "tip": {"zh": "这招对所有5位导师都是绝杀加分项——在首封套磁信末尾和Zoom面试收尾时主动请求导师指派3–8月前置学习书单与小任务！", "en": "Ask every prospective advisor in both your initial email and Zoom wrap-up for a Mar–Aug reading/coding prep list.", "fa": "در انتهای ایمیل اول و ۵ دقیقه پایانی مصاحبه زوم از استاد بخواهید مقالات و ابزارهای موردنیاز برای تمرین در بازه مارس تا آگوست را مشخص کند."}}, {"id": "epitope_cadd", "cat": "bio_ai", "term": {"zh": "多表位疫苗设计与 MVD 3D分子对接 (M0基座)", "en": "Multi-Epitope Vaccine Design & MVD 3D Docking (M0 Seed)", "fa": "طراحی واکسن چنداپیتوپی و داکینگ سه‌بعدی در MVD (پروژه پایه M0)"}, "aliases": ["Molegro Virtual Docker", "MVD", "NetMHCpan-4.1", "VaxiJen 2.0", "AllerTOP", "ToxinPred", "3Drefine", "ProtParam", "SWISS-MODEL", "py3Dmol", "多表位疫苗"], "def": {"zh": "利用免疫信息学全链条工具（NetMHCpan-4.1/IIpan-4.0预测MHC结合、VaxiJen 2.0 > 0.5筛抗原性、AllerTOP v.2.0排致敏、ToxinPred排毒、ProtParam算理化稳定度）构建多表位疫苗，经SWISS-MODEL与3Drefine精修三维结构后，在图形对接软件 Molegro Virtual Docker (MVD) 中完成免疫受体（HLA/TLR4）三维结合对接。", "en": "Full immunoinformatics pipeline screening peptides via NetMHCpan-4.1/IIpan-4.0, VaxiJen 2.0 (>0.5), AllerTOP v.2.0, ToxinPred, and ProtParam, refining 3D models with SWISS-MODEL & 3Drefine, and executing receptor docking (HLA/TLR4) in Molegro Virtual Docker (MVD).", "fa": "فرآیند کامل ایمونوانفورماتیک با ابزارهای NetMHCpan، VaxiJen 2.0 (>0.5)، AllerTOP v.2.0، ToxinPred و ProtParam، بهینه‌سازی ساختار سه‌بعدی در SWISS-MODEL و 3Drefine و انجام داکینگ مولکولی با گیرنده‌های ایمنی در نرم‌افزار Molegro Virtual Docker (MVD)."}, "tip": {"zh": "M0（11.24–11.29，Day 1–6；11.30 启动 M0→M1 衔接抽样）100%兑现已结业的 40+ Hours《Computational Vaccine Design & Immunoinformatics》课程证书，并为M1供逆翻译CDS、为M2供保守抗原注释、为M4复用MVD对接流程、为M5供肿瘤新抗原肽段！", "en": "M0 (Nov 24–29, Day 1–6; Nov 30 starts M0→M1 bridge sampling) directly validates Arsan's completed 40+ Hours 'Computational Vaccine Design & Immunoinformatics' certificate and feeds M1, M2, M4 (MVD docking), and M5!", "fa": "پروژه M0 (۲۴ تا ۲۹ نوامبر، روز ۱ تا ۶؛ ۳۰ نوامبر اتصال به M1) مستقیماً گواهی پایان‌دوره +۴۰ ساعته «طراحی محاسباتی واکسن و ایمونوانفورماتیک» را اثبات کرده و خوراک مستقیم پروژه‌های M1، M2، M4 و M5 را تأمین می‌کند!"}}, {"id": "utr_mfe_cnn", "cat": "bio_ai", "term": {"zh": "5'-UTR 最小折叠自由能 (MFE) 与 shRNAI 1D-CNN", "en": "5'-UTR Minimum Free Energy (MFE) & 1D-CNN (shRNAI)", "fa": "انرژی آزاد تاخوردگی 5'-UTR (MFE) و شبکه کانولوشنی shRNAI"}, "aliases": ["5'-UTR", "MFE", "ViennaRNA", "shRNAI", "Conv1d"], "def": {"zh": "mRNA编码区前端的5'非翻译区（5'-UTR）决定了核糖体能否顺利结合并高效翻译蛋白质。用ViennaRNA计算其二级结构最小折叠自由能（MFE，越负越稳定，帽端过度折叠反而阻碍核糖体），并结合一维卷积神经网络（1D-CNN，对标#1a 남진우教授2025 shRNAI架构）预测核糖体载荷（MRL）。", "en": "The 5' Untranslated Region governs mRNA translation efficiency. ViennaRNA computes secondary-structure Minimum Free Energy (MFE), while a 3-layer 1D Convolutional Neural Network (inspired by Prof. Nam's 2025 shRNAI paper) predicts Mean Ribosome Load (MRL).", "fa": "ناحیه غیرترجمه‌ای ابتدای mRNA (5'-UTR) میزان تولید پروتئین واکسن را کنترل می‌کند. با بسته ViennaRNA پایداری ساختار ثانویه (MFE) محاسبه شده و با شبکه عصبی کانولوشنی یک‌بعدی (الهام‌گرفته از مقاله ۲۰۲۵ shRNAI پروفسور نام) کارایی ترجمه ریبوزومی پیش‌بینی می‌شود."}, "tip": {"zh": "面试金句：5'帽端前15个核苷酸如果发夹结构太稳定（MFE过负），会像门锁一样挡住核糖体扫描，导致蛋白表达骤降。", "en": "Key interview insight: overly stable hairpins (highly negative MFE) near the first 15 nt of the 5' cap block ribosome scanning and suppress translation.", "fa": "نکته طلایی مصاحبه: پایداری بیش‌ازحد ساختار سنجاق‌سری در ۱۵ نوکلئوتید ابتدایی کلاهک '5 مانع حرکت ریبوزوم و کاهش شدید بیان پروتئین می‌شود."}}, {"id": "sctcr_brice", "cat": "bio_ai", "term": {"zh": "单细胞 TCR 克隆扩增与 BRiCE 细胞丰度偏移", "en": "scTCR Clonal Expansion & BRiCE Differential Abundance", "fa": "تکثیر کلونال گیرنده سلول T (scTCR) و معیار فراوانی سلولی BRiCE"}, "aliases": ["scTCR-seq", "BRiCE", "CD161+ TRM", "Scanpy", "Scirpy", "KLRB1"], "def": {"zh": "对标汉阳 #1b 조재원 教授代表作：结合单细胞转录组（Scanpy）与T细胞受体测序（Scirpy）追踪识别肿瘤抗原后大量增殖的组织驻留记忆T细胞（CD161+/KLRB1+ TRM），并按照其2026年独立作者论文 BRiCE 核心思想，同时量化基因表达变化与细胞亚群比例偏移（Differential Abundance log2FC）。", "en": "Targets HYU Prof. Jae-Won Cho's research: pairing Scanpy + Scirpy to map tumor-infiltrating KLRB1+ (CD161+) tissue-resident memory T-cell clonal expansion alongside cell-type differential abundance shifts (log2FC), echoing his solo-author 2026 BRiCE benchmark.", "fa": "هم‌راستا با پژوهش‌های پروفسور چو در هانیانگ: ترکیب داده‌های تک‌سلولی RNA و گیرنده سلول T با ابزارهای Scanpy و Scirpy برای ردیابی تکثیر سلول‌های ایمنی مقیم بافت تومور (CD161+ TRM) و بررسی همزمان تغییرات بیان ژن و تغییر نسبت جمعیت سلول‌ها طبق مقاله ۲۰۲۶ ایشان (BRiCE)."}, "tip": {"zh": "把 Scanpy/Scirpy 当作医学诊断实验室血液室流式细胞术软件（FlowJo）的代码版来理解——输入细胞矩阵，按表面标志物分群看比例变化，零背诵压力！", "en": "Think of Scanpy/Scirpy just like FlowJo gating in hematology lab—input cell matrix, gate marker populations, and compare clone proportions!", "fa": "ابزارهای Scanpy و Scirpy را دقیقاً مثل نرم‌افزار فلوسایتومتری (FlowJo) در آزمایشگاه هماتولوژی ببینید: دسته‌بندی سلول‌ها بر اساس مارکرها و مقایسه درصد جمعیت‌ها، بدون نیاز به حفظ کردن کد!"}}, {"id": "sys_serology", "cat": "bio_ai", "term": {"zh": "系统血清学 (Systems Serology) 与抗体 Fc 效应", "en": "Systems Serology & Antibody Fc Effector Profiling", "fa": "سرولوژی سیستم‌ها (Systems Serology) و عملکرد ناحیه Fc آنتی‌بادی"}, "aliases": ["系统血清学", "Systems Serology", "ADCP", "ADNP", "DVN/ZYHQRL"], "def": {"zh": "对标高丽大学 #2 정원영 教授方向：不仅测量抗体结合抗原的滴度，还高通量测定抗体尾部（Fc段）结合免疫受体（FcR）并触发吞噬（ADCP/ADNP）等多维免疫保护特征，利用LASSO/XGBoost找出真正阻断病毒或细菌感染的关键抗体特征。", "en": "Targets KU Prof. Wonyeong Jung's lab: profiling multidimensional antibody Fc receptor binding, IgG/IgA subclasses, and innate effector functions (ADCP/ADNP) using machine learning to pinpoint correlates of immune protection.", "fa": "حوزه تخصصی پروفسور جونگ در دانشگاه کره: بررسی چندبعدی ویژگی‌های بخش Fc آنتی‌بادی‌ها، زیررده‌های IgG/IgA و فعال‌سازی فاگوسیتوز ایمنی (ADCP/ADNP) با یادگیری ماشین برای کشف دقیق عوامل محافظت‌کننده در برابر عفونت."}, "tip": {"zh": "M2（12.07–12.12，Day 14–19）直接复现정원영教授2026年iScience在Harvard Dataverse公开的真实母乳抗体Fc矩阵（DVN/ZYHQRL），采用折内标准化 + LASSO/XGBoost + 100次置换检验 + SHAP归因！", "en": "M2 (Dec 7–12, Day 14–19) directly models Prof. Jung's open 2026 iScience dataset on Harvard Dataverse (DVN/ZYHQRL) with in-fold scaling, 100× permutation tests, and SHAP.", "fa": "پروژه M2 (۷ تا ۱۲ دسامبر، روز ۱۴ تا ۱۹) مستقیماً روی دیتاست واقعی منتشرشده توسط پروفسور جونگ (DVN/ZYHQRL) با استانداردسازی درون‌فولد، ۱۰۰ بار آزمون جایگشت و SHAP اجرا می‌شود."}}, {"id": "xgboost_shap", "cat": "bio_ai", "term": {"zh": "XGBoost 梯度提升树与 SHAP 可解释性归因", "en": "XGBoost & SHAP Explainable Feature Attribution", "fa": "الگوریتم XGBoost و تفسیرپذیری مدل با SHAP"}, "aliases": ["XGBoost", "SHAP"], "def": {"zh": "生物医学表格数据最强大的黄金组合：XGBoost通过多棵决策树接力纠错实现高精度分类与定量回归；SHAP（基于博弈论Shapley值）将模型透明化，精确量化每一项检验指标或分子子结构对临床结局或生物活性预测值的正负贡献。", "en": "Gold-standard biomedical tabular ML duo: XGBoost builds ensembles of decision trees for high-accuracy classification/regression, while SHAP quantifies how much each lab variable or molecular substructure shifts predictions.", "fa": "ترکیب طلایی یادگیری ماشین برای داده‌های جدولی زیست‌پزشکی: الگوریتم درختی XGBoost پیش‌بینی دقیق طبقه‌بندی و رگرسیون کمی انجام می‌دهد و ابزار SHAP سهم دقیق هر شاخص آزمایشگاهی یا زیرساختار مولکولی را مشخص می‌کند."}, "tip": {"zh": "在 M2（12.07–12.12）封装好这套60行折内标准化通用积木母版后，M3（12.13–12.17 延世 VitalDB/pAKI）与 M4（12.18–12.23 中央 hERG-QSAR-SHAP-Dock）均可直接复用出图！", "en": "Once this 60-line in-fold standardized template is locked in M2 (Dec 7–12), M3 (Dec 13–17 Yonsei VitalDB/pAKI) and M4 (Dec 18–23 CAU hERG-QSAR-SHAP-Dock) reuse it seamlessly!", "fa": "پس از آماده‌شدن این قالب مادر ۶۰ خطی در پروژه M2 (۷ تا ۱۲ دسامبر)، مستقیماً در پروژه‌های M3 (۱۳–۱۷ دسامبر یونسی) و M4 (۱۸–۲۳ دسامبر چونگ‌آنگ) بازاستفاده می‌شود!"}}, {"id": "paki_vitaldb", "cat": "bio_ai", "term": {"zh": "术后持续性急性肾损伤 (pAKI) 与首尔大 SNUH VitalDB", "en": "Persistent Acute Kidney Injury (pAKI) & SNUH VitalDB", "fa": "آسیب حاد کلیوی پایدار پس از جراحی (pAKI) و پایگاه SNUH VitalDB"}, "aliases": ["SNUH VitalDB", "pAKI", "VitalDB", "miceforest", "tableone"], "def": {"zh": "对标延世医大 #3 윤덕용 教授2026年iScience论文：M3（Dynamic-Lab-AKI）以韩国首尔大学医院 SNUH VitalDB (api.vitaldb.net) 真实开源围术期临床检验队列为主验证集，对齐复现 CMI-Laboratory/pAKI (85634e2) 方法管线（血肌酐斜率 ΔCr/Δt、tableone、miceforest多重插补与XGBoost/SHAP）。", "en": "Targets Yonsei Prof. Dukyong Yoon's 2026 iScience study: M3 (Dynamic-Lab-AKI) uses the real open-source SNUH VitalDB (api.vitaldb.net) perioperative lab cohort as primary validation set, aligned with CMI-Laboratory/pAKI (85634e2).", "fa": "هم‌راستا با مقاله ۲۰۲۶ پروفسور یون در یونسی: پروژه M3 از کوهورت واقعی و متن‌باز بیمارستان دانشگاه ملی سئول (SNUH VitalDB - api.vitaldb.net) به عنوان مجموعه اعتبارسنجی اصلی استفاده کرده و پایپ‌لاین CMI-Laboratory/pAKI را بازتولید می‌کند."}, "tip": {"zh": "最大化发挥 Arsan 医学院临床检验本科与 16学分（816学时）医学诊断实验室必修实训功底（标本稀释/溶血质控、危急值过滤与肌酐动力学）！", "en": "Showcases Arsan's Faculty of Medicine Clinical Lab B.S. and 16-credit (816-hour) clinical diagnostic laboratory practicum expertise (specimen QC, critical-value filtering, creatinine kinetics).", "fa": "بهترین ویترین برای نمایش پایه کارشناسی علوم آزمایشگاهی دانشکده پزشکی و مهارت عملی ۱۶ واحد (۸۱۶ ساعت) کارورزی آزمایشگاه تشخیص طبی آرسان است."}}, {"id": "hergboost", "cat": "bio_ai", "term": {"zh": "hERG 定量生物活性 QSAR 建模与骨架划分 (hERG-QSAR-SHAP-Dock)", "en": "hERG Quantitative Bioactivity QSAR, hERGBoost & Scaffold Split", "fa": "مدل‌سازی کمی زیست‌فعالی QSAR کانال hERG و تقسیم اسکلت مولکولی"}, "aliases": ["hERG-QSAR-SHAP-Dock", "hERGBoost", "Bemis-Murcko", "QSAR", "RDKit", "Scaffold"], "def": {"zh": "对标中央大学 #4 이윤지 教授化学/结构生物信息学方向（M4: hERG-QSAR-SHAP-Dock）：基于 TDC hERG 数据集采用严格的 Bemis-Murcko 化学母核骨架划分，开展分类评估与定量 IC50 / pIC50 生物活性 QSAR 回归（R² / RMSE），平行对照其2025综述表1评析的定量基准 hERGBoost（R²=0.622, RMSE=0.595），并结合新版 RDKit Morgan 指纹 SHAP 子结构归因与 PDB 7CN0 的 Molegro Virtual Docker (MVD) 3D 通道对接。", "en": "Targets CAU Prof. Yoonji Lee's chem/structural bioinformatics research (M4: hERG-QSAR-SHAP-Dock): Bemis-Murcko scaffold-split classification & quantitative IC50/pIC50 bioactivity QSAR regression (R²/RMSE) on TDC hERG datasets, benchmarked in parallel against hERGBoost (R²=0.622, RMSE=0.595) from Table 1 of her 2025 review, paired with modern RDKit Morgan fingerprint SHAP substructure attribution and PDB 7CN0 3D channel docking in Molegro Virtual Docker (MVD).", "fa": "هم‌راستا با پژوهش‌های شیمی/بیوانفورماتیک ساختاری پروفسور لی در دانشگاه چونگ‌آنگ (M4: hERG-QSAR-SHAP-Dock): ارزیابی طبقه‌بندی و رگرسیون کمی زیست‌فعالی IC50/pIC50 (شاخص‌های R² و RMSE) با تقسیم‌بندی سخت‌گیرانه اسکلت مولکولی Bemis-Murcko روی داده‌های TDC hERG در مقایسه موازی با معیار hERGBoost (در جدول ۱ مقاله مروری ۲۰۲۵ ایشان)، همراه با تحلیل زیرساختار SHAP با اثرانگشت RDKit Morgan و داکینگ سه‌بعدی کانال PDB 7CN0 در نرم‌افزار MVD."}, "tip": {"zh": "双重防呆红线：① 全程采用“定量生物活性 QSAR 建模与3D通道对接”口径（不将毒理学包装为个人专长）；② hERGBoost第3作者为中央大BME系 Yunhyeok Lee 而非药学系李允智本人，务必表述为“平行对照您2025综述表1评析的定量基准”！", "en": "Dual guardrails: (1) Frame strictly as quantitative bioactivity QSAR & MVD 3D channel docking (not toxicology specialization); (2) hERGBoost co-author is Yunhyeok Lee (BME), NOT Prof. Yoonji Lee—cite strictly as 'evaluated in Table 1 of your 2025 review'!", "fa": "دو نکته حیاتی: ۱) پروژه را دقیقاً با ادبیات «مدل‌سازی کمی زیست‌فعالی QSAR و داکینگ سه‌بعدی کانال در MVD» معرفی کنید (نه ادعای تخصص سم‌شناسی)؛ ۲) نویسنده همکار hERGBoost شخصی به نام Yunhyeok Lee است نه پروفسور Yoonji Lee—حتماً بنویسید «معیار an> | مصاحبه: شنبه هفته بعد | نتایج: اواسط ژوئن"}, "cau": {"zh": "• 网申(UWAY)：04.23 – 05.12 (23:59，等OIA Step 3免报名费指引!)\n• <span class='phys-red'>面交(黑石站310馆2楼210室)或寄出：05.13/05.14（截止日邮戳有效！）<\/span>\n• 视频面试：06.07–06.12｜放榜：07.01前后", "en": "• Online (UWAY): Apr 23 – May 12 (23:59, wait for OIA Step 3 fee-waiver email!)\n• <span class='phys-red'>Drop-off (Bldg 310, 2F Rm 210) or Mail: May 13/14 (postmark valid!)<\/span>\n• Video Interview: Jun 7–12 | Result: ~Jul 1", "fa": "• ثبت‌نام (UWAY): ۲۳ آوریل تا ۱۲ مه (پس از ایمیل معافیت Step 3 از OIA!)\n• <span class='phys-red'>تحویل حضوری (ساختمان ۳۱۰ اتاق ۲۱۰) یا پست تا ۱۳/۱۴ مه (ملاک مهر پست!)<\/span>\n• مصاحبه ویدیویی: ۷ تا ۱۲ ژوئن | نتایج: حدود ۱ جولای"}}, {"dim": {"zh": "报名费金额与支付方式", "en": "Application Fee & Payment", "fa": "هزینه ثبت‌نام (اپلای فی) و روش پرداخت"}, "hyu": {"zh": "142,000 KRW\n(支持海外卡、转账或 Alipay)", "en": "142,000 KRW\n(Overseas card, wire, or Alipay)", "fa": "۱۴۲,۰۰۰ وون کره\n(کارت بین‌المللی، حواله یا Alipay)"}, "ku": {"zh": "127,000 KRW\n(报名费12万 + 手续费7,000 KRW)", "en": "127,000 KRW\n(120k fee + 7k service charge)", "fa": "۱۲۷,۰۰۰ وون کره\n(۱۲۰ هزار ثبت‌نام + ۷ هزار کارمزد)"}, "yu": {"zh": "130,000 KRW\n(海外 PayPal 固定为 $130 USD)", "en": "130,000 KRW\n(Fixed $130 USD via overseas PayPal)", "fa": "۱۳۰,۰۰۰ وون کره\n(پرداخت ارزی با PayPal معادل ۱۳۰ دلار)"}, "cau": {"zh": "100,000 KRW\n(获评 CAYSS 全奖者退免报名费与入学金)", "en": "100,000 KRW\n(Waived/refunded for CAYSS awardees)", "fa": "۱۰۰,۰۰۰ وون کره\n(در صورت کسب بورسیه CAYSS کاملاً بخشیده می‌شود)"}}, {"dim": {"zh": "线下纸质原件节点与份数", "en": "Physical Originals Timing & Sets", "fa": "زمان تحویل و تعداد نسخه‌های فیزیکی اصل مدارک"}, "hyu": {"zh": "<span class='phys-red'>网申期寄达【1份领事认证原件】<\/span>（拒收认证件复印件）；材料概不退还", "en": "<span class='phys-red'>Mail [1 Legalized Original Set] during application<\/span> (photocopies rejected); non-returnable", "fa": "<span class='phys-red'>ارسال پستی «۱ سری اصل تأییدشده کنسولی» در بازه اپلای<\/span> (کپی برابر اصل پذیرفته نمی‌شود)؛ غیرقابل استرداد"}, lor-printed e-TRF PDF<\/span> + free Portal e-delivery", "fa": "• کف پذیرش: ۵.۵؛ شرط بورسیه: نوع C نمره ۶.۰ و نوع A نمره ۷.۰\n• پذیرش رسمی <span class='phys-red'>چاپ رنگی e-TRF<\/span> همراه با ارسال الکترونیکی رایگان از پورتال"}, "yu": {"zh": "• 最低线：IELTS Academic 5.5（认可 One Skill Retake）\n• 明文不收机构送分（NOT accepted）且禁发私人邮件，仅在网申系统上传 e-TRF PDF", "en": "• Min: IELTS Academic 5.5 (accepts One Skill Retake)\n• Institutional score reporting NOT accepted; upload verifiable e-TRF PDF on portal only", "fa": "• حداقل آیلتس آکادمیک ۵.۵ (قبول One Skill Retake)\n• ارسال سازمانی نمره ممنوع است! فقط آپلود فایل PDF کارنامه e-TRF در سایت ثبت‌نام"}, "cau": {"zh": "• 入学及CAYSS最低线：IELTS Academic 5.5（禁后补）\n• 先后台免费电子送分，3–4月邮件 gsadmin@cau.ac.kr 确认能否交<span class='phys-red'>首尔 e-TRF 彩打件<\/span>", "en": "• Min & CAYSS: IELTS 5.5 (no late submission)\n• Free Portal e-delivery + email gsadmin@cau.ac.kr in Mar–Apr to confirm <span class='phys-red'>Seoul e-TRF print<\/span>", "fa": "• حداقل پذیرش و CAYSS: آیلتس ۵.۵ (تکمیل بعدی ممنوع)\n• ارسال رایگان از پورتال + ایمیل در مارس–آوریل به gsadmin@cau.ac.kr برای تأیید <span class='phys-red'>چاپ رنگی e-TRF<\/span>"}}]}, "koreanWaiverFlow": {"title": {"zh": "图 1B｜“零韩语基础（无 TOPIK）”直入韩国名校豁免通道对比与汉阳三步签字法", "en": "Fig 1B | Zero-TOPIK Korean Language Exemption Pathways & Hanyang 3-Step Internal Sign-off", "fa": "نمودار ۱-ب | مقایسه مسیر معافیت از مدرک زبان کره‌ای (بدون TOPIK) و فرآیند ۳ مرحله‌ای دانشگاه هانیانگ"}, "autoGroup": {"badge": {"zh": "3校制度自动豁免（0签字手续）", "en": "3 Universities: Automatic Institutional Exemption (0 Signatures)", "fa": "۳ دانشگاه با معافیت خودکار آیین‌نامه‌ای (بدون نیاز به هیچ فرم و امضایی)"}, "schools": {"zh": "高丽大学 (KU) · 延世大学医大 (YU) · 中央大学 (CAU)", "en": "Korea Univ. (KU) · Yonsei Med (YU) · Chung-Ang Univ. (CAU)", "fa": "دانشگاه کره (KU) · پزشکی یونسی (YU) · دانشگاه چونگ‌آنگ (CAU)"}, "desc": {"zh": "三校理工医药院系均实行“英语达标（IELTS ≥ 5.5）或韩语达标二选一”。只要提交2月7日考取的 IELTS Academic 成绩单，网申系统直接认定语言100%合格，全程无需提交韩语证明，更无需找教授签任何豁免表！（甚至毕业环节：中央大理工医免毕业TOPIK 4级，高丽大凭IELTS 6.0直接免毕业外语考。）", "en": "All three STEM/Biomedical graduate schools enforce an 'English (IELTS ≥ 5.5) OR Korean' rule. Submitting your Feb 7 IELTS Academic score satisfies 100% of admission language requirements—zero Korean certificates or professor signatures needed! (Bonus: CAU STEM waives graduation TOPIK 4, and KU IELTS ≥ 6.0 waives the graduation foreign language exam.)", "fa": "در دانشکده‌های علوم، پزشکی و داروسازی این سه دانشگاه، قانون «انگلیسی (آیلتس ۵.۵ به بالا) یا کره‌ای» برقرار است. صرفاً با ارائه نمره آیلتس ۷ فوریه، شرط زبان ۱۰۰٪ تکمیل شده و به هیچ مدرک کره‌ای یا امضای استاد نیاز ندارید! (حتی برای فارغ‌التحصیلی نیز چونگ‌آنگ شرط TOPIK 4 ندارد و دانشگاه کره با آیلتس ۶ آزمون زبان فارغ‌التحصیلی را معاف می‌کند.)"}}, "hyuSteps": {"badge": {"zh": "汉阳大学（生命科学系）专属三步豁免法（防强制休学红线！）", "en": "Hanyang Univ. (Life Science) Mandatory 3-Step Advisor Waiver (Prevents Forced Leave!)", "fa": "فرآیند ۳ مرحله‌ای اختصاصی دانشگاه هانیانگ (جلوگیری از مرخصی اجباری ترم اول!)"}, "ruleQuote": {"zh": "简章原文依据：한양대학교 지도교수의 《한국어기준 면제 요청서》 취득자: 학과 서류심사 시 교수님의 판단 하에 결정되므로 학생이 별도로 제출할 필요 없음（由指导教授在院系书审时内部决定并提交，学生无需另行交表）", "en": "Official Guide Clause: Recipients of Hanyang Advisor's “Korean Proficiency Exemption Request Form” (한국어기준 면제 요청서) are decided internally by the professor during departmental screening; students do not submit a separate form.", "fa": "متن رسمی دفترچه هانیانگ: فرم «한국어기준 면제 요청서» در مرحله بررسی پرونده در دانشکده مستقیماً به تشخیص و امضای استاد راهنما در سیستم داخلی ثبت می‌شود و دانشجو نیازی به ارسال فرم فیزیکی جداگانه ندارد."}, "steps": [{"num": "Step 1", "time": "2027.02.16–02.28", "title": {"zh": "Zoom 面试礼貌口头确认", "en": "Polite Verbal Confirmation in Feb Zoom", "fa": "تأیید شفاهی محترمانه در مصاحبه زوم فوریه"}, "desc": {"zh": "向 #1a 남진우 或 #1b 조재원 教授确认接收意向后，礼貌询问是否愿意在春季院系审查时内部签交《韩语标准免除申请书》，确保9月免休学直接进组。", "en": "Once Prof. Nam or Prof. Cho expresses interest, politely ask if they are willing to submit the internal Korean Exemption Form during spring screening so you ca ation incentives. Backed by Korea's K-Moonshot Drug PD, Mogam AI mRNA initiative, and HYU BK21-BIO4.", "fa": "در سایت رسمی biglab.or.kr/positions صراحتاً پشتیبانی ۱۰۰٪ کل شهریه + حقوق ماهانه زندگی + پاداش پژوهشی اعلام شده است. متکی به گرنت‌های عظیم ملی K-Moonshot، پروژه هوش مصنوعی mRNA مؤسسه موگام و BK21-BIO4."}, "internTag": {"zh": "官网建议 3–6个月前置实习（远程破局！）", "en": "Recommends 3–6 Mo Pre-Internship (Solve Remotely!)", "fa": "توصیه به ۳–۶ ماه کارآموزی پیش از ورود (حل به صورت ریموت!)"}, "intern": {"zh": "招募页写明“强烈建议入学前完成至少3–6个月实验室实习”。因Arsan在伊朗受签证限制无法赴韩坐班，套磁与面试主动提议 2027年3月—8月开展“无薪远程干实验预实习（Remote Dry-Lab Pre-Internship）”，提前跑通组内RNA序列管线！", "en": "Website strongly recommends 3–6 months pre-enrollment internship. Since visa rules prevent in-person work from Iran before Sep, proactively propose a 'Remote Dry-Lab Pre-Internship' (Mar–Aug 2027) running his lab's RNA pipelines!", "fa": "سایت آزمایشگاه ۳ تا ۶ ماه کارآموزی قبل از ورود را قویاً توصیه کرده است. به دلیل محدودیت ویزا از ایران، در ایمیل و مصاحبه پیشنهاد هوشمندانه «پیش‌کارآموزی محاسباتی از راه دور (Remote Dry-Lab)» از مارس تا آگوست ۲۰۲۷ را مطرح کنید!"}}, {"rank": "#1b", "name": {"zh": "조재원 (Jae-Won Cho) · 汉阳大学 生命科学系", "en": "Prof. Jae-Won Cho (조재원) · Hanyang Life Science", "fa": "پروفسور چو جه‌وون (조재원) · علوم زیستی هانیانگ"}, "lab": "System Single-cell Lab", "fundingTag": {"zh": "50%校奖保底 + 面试核实50% RA", "en": "50% Uni Waiver + Confirm 50% RA", "fa": "۵۰٪ بورسیه دانشگاه + تأیید ۵۰٪ RA در مصاحبه"}, "fundingColor": "blue", "funding": {"zh": "2025年新任助理教授，学生保底享汉阳理工50%入学金及学费减免（或冲HISP 70%–100%），同属汉阳 BK21-BIO4 并具新PI启动金/NRF课题；2月面试确认课题RA覆盖剩余50%学费（约325万KRW/学期）与生活费。", "en": "2025 new Assistant Professor; students automatically get Hanyang's 50% STEM waiver (or 70–100% HISP) plus BK21-BIO4 & NRF startup grants. Confirm in Feb Zoom that lab RA covers the remaining ~3.25M KRW/sem and living costs.", "fa": "استادیار جوان (ورودی ۲۰۲۵) عضو BK21-BIO4 با گرنت راه‌اندازی آزمایشگاه؛ ۵۰٪ تخفیف شهریه علوم پایه قطعی است (به علاوه شانس ۱۰۰٪ HISP). isor`，且必须包含指定科研基金致谢，无基金致谢不予认定！）<\/span>", "en": "• Waives app fee + adm fee + 100% tuition (4 sems) + mandatory ≥500k KRW/mo stipend\n• Maintain: GPA ≥3.5 + <span class='phys-red'>submit pre-grad & publish (incl. acceptance) within 1 yr post-grad 1 JCR journal paper (`as sole author or jointly with the advisor`, MUST include designated research grant acknowledgment!)<\/span>", "fa": "• معافیت هزینه اپلای، ورودی و ۱۰۰٪ شهریه ۴ ترم + حداقل ۵۰۰ هزار وون ماهانه\n• شرط تداوم: معدل بالای ۳.۵ + <span class='phys-red'>ارسال قبل از فراغت و چاپ/پذیرش ۱ مقاله JCR تا ۱ سال پس از فارغ‌التحصیلی (`تک‌نویسنده یا مشترک با استاد راهنما` + الزام قطعی درج تشکر از گرنت پژوهشی مشخص‌شده!)<\/span>"}, "red": {"zh": "• <span class='phys-red'>英文宣誓翻译公证件仅认伊朗本土且严格 90天内有效<\/span>（04.03收假补第2批稳过05.13）\n• 7月办CoA存款按（1,600万 − 年津贴）核减且≤30天", "en": "• <span class='phys-red'>Iran-only sworn translations strictly ≤90 days old<\/span> (Apr 3 Batch 2 beats May 13)\n• CoA bank proof (16M − annual stipend) ≤30d in Jul", "fa": "• <span class='phys-red'>ترجمه رسمی فقط در ایران و حداکثر ۹۰ روزه<\/span> (صدور سری دوم در ۳ آوریل)\n• گواهی بانکی CoA زیر ۳۰ روز در جولای"}}]}}, "tab2": {"intro": {"title": {"zh": "模块 1.2–1.3｜伊朗涉外认证“三级分流”、五步全展开实操、四校推荐信专卡与 D01–D16 颗粒度清单", "en": "Module 1.2–1.3 | Iran 3-Tier Legalization Triage, Expanded 5-Step Walkthrough, LOR Matrix & D01–D16 Master Specs", "fa": "بخش ۱.۲ و ۱.۳ | تفکیک سه‌سطحی تأییدات ایران، راهنمای کامل ۵ مرحله‌ای، جدول توصیه‌نامه‌ها و فهرست دقیق D01 تا D16"}, "subtitle": {"zh": "伊朗为非海牙公约国，且自由大学临床检验科学属医科分支（Faculty of Medicine），比普通理工科多一道德黑兰中央组织“医科允许翻译章”。本页已将公证三级分流与 Step 01–05 全流程纵向完整展开（点击上方步骤卡可平滑定位，亦支持一键折叠/展开）。", "en": "Iran is a non-Apostille country, and IAU Clinical Laboratory Sciences belongs to the Faculty of Medicine—requiring a Medical Sciences clearance stamp in Tehran. Below, the 3-tier document triage and all 5 legalization steps (Step 01–05) are fully expanded vertically by default (click any top anchor card to jump, or toggle collapse/expand).", "fa": "ایران عضو کنوانسیون آپوستیل نیست و رشته علوم آزمایشگاهی دانشگاه آزاد زیرمجموعه دانشکده پزشکی محسوب می‌شود و به «مهر بلامانع بودن ترجمه علوم پزشکی» در تهران نیاز دارد. در این صفحه جدول تفکیک سه‌سطحی و هر ۵ مرحله (Step 01–05) به صورت کامل و باز نمایش داده شده‌اند."}}, "validityRedlinesCard": {"title": {"zh": "图 2A｜《全材料“有效期与签发窗口”生死红线速查表（早开 10 天即作废！）》", "en": "Fig 2A | Master Validity & Issuance Window Red-Lines Cheat Sheet (Stamping 10 Days Too Early Voids Your Docs!)", "fa": "جدول حیاتی ۲-الف | «خطوط قرمز اعتبار زمانی و پنجره دقیق صدور مدارک (صدور زودهنگام در نوامبر–دسامبر = ابطال مدرک!)»"}, "subtitle": {"zh": "切忌以为“越早去学校把所有证明盖完章越好”！高丽与中央对签发/公证日期卡死 90 天红线，存款证明卡死 30 天红线。请严格按以下 4 大时效法则锁死开证日：", "en": "Never assume 'stamping certificates in Nov–Dec is safer'! Korea Univ. and Chung-Ang enforce strict 90-day issuance/notary cutoffs, and bank certificates expire in 30 days. Lock every issuance window to these 4 rules:", "fa": "هرگز تصور نکنید «گرفتن مهر مدارک در نوامبر و دسامبر بهتر است»! دانشگاه کره و چونگ‌آنگ سقف اکید ۹۰ روزه و گواهی بانکی سقف ۳۰ روزه دارند. تاریخ صدور تمام مدارک را دقیقاً طبق این ۴ قانون تنظیم کنید:"}, "rules": [{"badge": {"zh": "① 高丽大学全局 3 个月签发红线", "en": "① Korea Univ. Global 3-Month Issuance Rule", "fa": "۱) خط قرمز سراسری ۳ ماهه دانشگاه کره (KU)"}, "color": "#D93025", "bg": "var(--red-soft)", "clause": "제출 마감일 기준 3개월 이내 발급본만 유효함 (~03.19 截止基准)", "body": {"zh": "高丽韩文简章明令：**以材料提交截止日（`~2027.03.19`）为基准，所有证明与公证件原则上仅限 3 个月内签发的原件有效**（唯一例外为不可补发的学位证原件）！\n🚨 **防过期铁律**：`2026年11月–12月20日前` 去 IAU Ardabil 分校**仅限催办独生子女 `طرح`、核对英文证明模板与预约推荐信教授，严禁在 12 月 20 日前给排名证明、预毕业证明或 `Scholaro` 换算单盖章落款（否则到 `03.19` 已超 90 天作废）**！所有第 1 批母校盖章件、`Scholaro` 打印与宣誓公证统一锁在 <span class='phys-red'>**`2027.01.10 – 02.04`**<\/span> 集中办理（距 `03.19` 仅 `43–68天`，同时满足高丽 `≤3个月` 与汉阳 `≤6个月` 规定）！", "en": "KU's Korean guide mandates: **Measured from the document submission deadline (`~2027.03.19`), ONLY originals issued within 3 months are valid** (sole exception: non-reissuable permanent diplomas)!\n🚨 **Anti-Expiration Iron Rule**: Before `2026.12.20`, visit IAU Ardabil **ONLY to fast-track single-child `طرح`, verify certificate templates, and line up recommenders—NEVER date or wet-stamp rank certs, provisional certs, or `Scholaro` sheets before Dec 20 (they will exceed 90 days by `03.19` and be voided!)**. Lock ALL Batch 1 university stamps, `Scholaro` prints, and sworn notarizations into <span class='phys-red'>**`2027.01.10 – 02.04`**<\/span> (`43–68 days` before `03.19`, satisfying both KU `≤3 mo` and HYU `≤6 mo`)!", "fa": "متن صریح دفترچه کره‌ای دانشگاه کره: **به ملاک روز پایان تحویل مدارک (`~۱۹ مارس ۲۰۲۷`)، اصولاً فقط مدارک و ترجمه‌هایی معتبرند که در ۳ ماه اخیر صادر شده باشند** (تنها استثنا اصل دانشنامه غیرقابل صدور مجدد است)!\n🚨 **قانون طلایی ضد انقضا**: تا پیش از `۲۰ دسامبر ۲۰۲۶` مراجعه به واحد اردبیل **صرفاً برای پیگیری طرح تک‌فرزند، چک کردن متن گواهی‌ها و هماهنگی اساتید معرف باشد؛ مطلقاً قبل از ۲۰ دسامبر روی گواهی رتبه، پیش‌ازفراغت یا برگه `Scholaro` مهر و تاریخ نزنید (چون تا ۱۹ مارس بیش از ۹۰ روز شده و باطل می‌شود!)**. صدور، مهر و ترجمه رسمی کل سری اول را دقیقاً در بازه <span class='phys-red'>**`۱۰ ژانویه تا ۴ فوریه ۲۰۲۷`**<\/span> انجام دهید (`۴۳ تا ۶۸ روز` قبل از مهلت کره)!"}}, {"badge": {"zh": "② 中央大 90 天红线 + 签发国属地公证铁律", "en": "② CAU 90-Day Cutoff + Issuing-Country Notary Rule", "fa": "۲) سقف ۹۰ روزه چونگ‌آنگ + الزام ترجمه در ایران"}, "color": "#EA580C", "bg": "var(--amber-soft)", "clause": "Strictly ≤90 Days & Issuing-Country (Iran) Notarization ONLY", "body": {"zh": "中央大简章明令：英文宣誓翻译公证件自公证日起 **严格 3 个月（90天）内有效**，且 <span class='phys-red'>**仅认可文件签发机构所在国（伊朗本土）出具的公证——严禁在韩国或土耳其等第三国公证伊朗学历文件！**<\/span>\n📅 **精准补件排期**：若走 1 月第 1 批，须在伊朗诺鲁孜春假收假首日（<span class='phys-red'>**`2027.04.03 – 04.14`**<\/span>，避开 `03.20–04.02` 春假停摆期）由原翻译社调底稿重出 1 套带 4 月新日期的认证件专供中央大（距 `05.13` 仅约 `35天`）；仅当第 1 批本身推迟至 **`2027.02.22 – 02.28`** 才办出时（距 `05.13` 不足 `80天`），核对当年截止日未超 90 天方可免办第 2 批。", "en": "CAU mandates: Sworn English translations are **strictly valid within 3 months (90 days)** of notarization, and <span class='phys-red'>**ONLY notarizations issued in the document-issuing country (Iran) are accepted—notarizing Iranian academic docs in Korea or a third country like Turkey is STRICTLY BANNED!**<\/span>\n📅 **Post-Nowruz Schedule**: If Batch 1 runs in Jan, have your Iranian translation agency re-issue 1 fresh-dated set right after Nowruz (<span class='phys-red'>**`2027.04.03 – 04.14`**<\/span>, ~35 days before `05.13`); you may skip Batch 2 ONLY if Batch 1 itself was issued late on **`2027.02.22 – 02.28`** (under 80 days before `05.13`).", "fa": "دستور صریح دفترچه چونگ‌آنگ: ترجمه رسمی انگلیسی از تاریخ ترجمه **حداکثر ۳ ماه (۹۰ روز)** اعتبار دارد و <span class='phys-red'>**منحصراً ترجمه رسمی صادرشده در کشور صادرکننده مدرک (خاک ایران) پذیرفته می‌شود — ترجمه و تأیید مدارک تحصیلی ایران در کره یا کشور ثالثی مثل ترکیه مطلقاً ممنوع و باطل است!**<\/span>\n📅 **تنظیم دقیق پس از نوروز**: در صورت اخذ سری اول در ژانویه، در اولین روز کاری پس از تعطیلات نوروز (<span class='phys-red'>**`۳ تا ۱۴ آوریل ۲۰۲۷`**<\/span>) از روی فایل آماده دارالترجمه ۱ سری با تاریخ جدید ویژه چونگ‌آنگ بگیرید؛ تنها اگر سری اول شما در **`۲۲ تا ۲۸ فوریه`** صادر شده باشد (کمتر از ۸۰ روز تا `۱۳ مه`) نیازی به سری دوم نیست."}}, {"badge": {"zh": "③ 银行存款证明“30天三窗口 + 冻结期”精算", "en": "③ Bank Proof '3 Separate 30-Day Windows + Freeze'", "fa": "۳) محاسبه دقیق «۳ پنجره ۳۰ روزه + انسداد» گواهی بانکی"}, "color": "#1A73E8", "bg": "var(--surface-3)", "clause": "입학 지원 일자 기준 30일 이내 + Frozen to 2027.08.31", "body": {"zh": "• **第1窗｜高丽 3 月网申原件（`2027.02.25 – 03.02`）**：须在**高丽网上报名日基准 30 天内（`입학 지원 일자 기준 30일 이내`）**由银行柜台书面开具盖章原件（`≥2,200万 KRW`），且资金**必须冻结至 `2027.08.31`（开学前一日）**。\n• **第2窗｜延世 4 月网申防超期重开（`2027.04.03 – 04.06`）**：延世 `04.05–04.16` 网申时，2月底旧证明已超 30 天！须在**诺鲁孜收假后去银行花 10 分钟重开一张 30 天内最新日期余额证明**扫成 `600 DPI PDF` 上传延世（0邮寄）。\n• **第3窗｜6–7月录取后办 `CoA` 重交原件**：<span class='phys-red'>高丽明令须重交 **6月放榜当月之后开具** 的新原件；汉阳(`07.15前`)、延世、中央(`07.20前`，基准为 **`1,600万 KRW 减去导师年津贴`**)均须交 **`CoA` 申请前 30 天内最新原件**<\/span>（`CoA` 有效 3 个月，`09.01` 起法务部停发 `CoA`）。", "en": "• **Window 1 | KU March Original (`2027.02.25 – 03.02`)**: Issued **within 30 days of KU online application (`입학 지원 일자 기준 30일 이내`)** at bank counter (`≥22M KRW`), **frozen through `2027.08.31`**.\n• **Window 2 | YU April Fresh Scan (`2027.04.03 – 04.06`)**: By `04.05–04.16`, late-Feb certs exceed 30 days! **Spend 10 min at the bank right after Nowruz to print a fresh `≤30d` balance cert** and scan at `600 DPI PDF` for YU (0 mail).\n• **Window 3 | Jun–Jul Visa `CoA` Original**: <span class='phys-red'>KU strictly requires a fresh original **issued in/after June admission month**; HYU (by `07.15`), YU & CAU (by `07.20`, baseline **`16M KRW minus annual PI stipend`**) all require a **fresh `≤30d` original**<\/span> (`CoA` valid 3 mo; issuance stops `09.01`).", "fa": "• **پنجره ۱ | اصل ماه مارس دانشگاه کره (`۲۵ فوریه تا ۲ مارس`)**: صادره در **۳۰ روز منتهی به ثبت‌نام آنلاین کره** (`≥22M KRW`) و **مسدود تا `۳۱ آگوست ۲۰۲۷`**.\n• **پنجره ۲ | گواهی جدید آوریل یونسی (`۳ تا ۶ آوریل`)**: گواهی اواخر فوریه در زمان اپلای آوریل یونسی بیش از ۳۰ روز شده و منقضی است! **بلافاصله پس از نوروز ۱۰ دقیقه‌ای یک گواهی موجودی جدید زیر ۳۰ روز از بانک بگیرید** و اسکن `600 DPI PDF` آن را در سایت یونسی آپلود کنید.\n• **پنجره ۳ | اصل جدید ژوئن–جولای برای `CoA`**: <span class='phys-red'>دانشگاه کره صراحتاً گواهی جدید **صادره در ماه ژوئن به بعد** می‌خواهد؛ هانیانگ (`تا ۱۵ جولای`)، یونسی و چونگ‌آنگ (`تا ۲۰ جولای` بر پایه `۱۶ میلیون وون منهای حقوق سالانه استاد`) همگی اصل جدید زیر ۳۰ روز می‌خواهند<\/span>."}}, {"badge": {"zh": "④ 其余 4 项隐藏有效期（照片/雅思/二维码/护照）", "en": "④ 4 Hidden Validity Windows (Photo / IELTS / QR / Passport)", "fa": "۴) چهار بازه اعتبار پنهان (عکس / آیلتس / کد استعلام / پاسپورت)"}, "color": "#0F9D58", "bg": "var(--green-soft)", "clause": "Photo ≤3m · IELTS 2y · estelam QR 6m · Passport ≥2y", "body": {"zh": "• **证件照 JPG (`D07`)**：高丽网申手册规定须为 <span class='phys-red'>**网申前 3 个月内新拍（锁定 `2027年1–2月` 新拍白底免冠 `3×4 cm` / `≤2MB` JPG，切勿用几年前的旧护照同底照！）**<\/span>。\n• **机考雅思 `e-TRF` (`D15`)**：考试日起 **2 年内有效**（`2027.02.07` 考取，有效至 `2029.02.07`，全周期无忧）。\n• **自由大学 `estelam.iau.ir` 二维码核验单**：签发后 **6 个月内有效**（`2027.01` 申请一次即可同时覆盖第1批与4月第2批送司法部）。\n• **护照有效期 (`D14`)**：本人护照建议剩余有效期 **`≥2年`**（防韩国出入境按护照到期日截短 D-2 居留期）；父母护照在提交日须在有效期内。", "en": "• **ID Photo JPG (`D07`)**: KU manual requires a photo <span class='phys-red'>**taken within 3 months of application (shoot fresh in `Jan–Feb 2027`, white background `3×4 cm` / `≤2MB` JPG—do NOT reuse old passport photos!)**<\/span>.\n• **CBT IELTS `e-TRF` (`D15`)**: Valid **2 years** from test date (`2027.02.07` → `2029.02.07`).\n• **`estelam.iau.ir` QR Verification Sheet**: Valid **6 months** (one Jan 2027 sheet covers both Batch 1 and April Batch 2 at MOJ).\n• **Passports (`D14`)**: Applicant passport should have **`≥2 years` remaining validity** (prevents Korean Immigration from truncating D-2 stay length); parents' passports must be valid at submission.", "fa": "• **عکس پرسنلی (`D07`)**: طبق راهنمای دانشگاه کره باید <span class='phys-red'>**حداکثر در ۳ ماه پیش از ثبت‌نام گرفته شده باشد (عکاسی جدید در `ژانویه–فوریه ۲۰۲۷`، زمینه سفید `3×4 cm` و زیر `2MB` — از عکس قدیمی پاسپورت استفاده نکنید!)**<\/span>.\n• **کارنامه آیلتس `e-TRF` (`D15`)**: معتبر تا **۲ سال** از تاریخ آزمون (`۲۰۲۷/۰۲/۰۷` تا `۲۰۲۹/۰۲/۰۷`).\n• **کد بارکددار `estelam.iau.ir`**: معتبر تا **۶ ماه** (یک‌بار دریافت در ژانویه هر دو سری ژانویه و آوریل دادگستری را پوشش می‌دهد).\n• **اعتبار پاسپورت‌ها (`D14`)**: پاسپورت متقاضی ترجیحاً **`حداقل ۲ سال`** اعتبار داشته باشد تا مدت اقامت D-2 کوتاه نشود؛ پاسپورت والدین در روز تحویل معتبر باشد."}}]}, "triageTable": {"title": {"zh": "图 2B｜《伊朗涉外公证认证“三级分流”速查表》（认证什么、走到哪一步为止一目了然！）", "en": "Fig 2B | Iran Foreign Document Legalization '3-Tier Triage' Cheat Sheet (Avoid Over-Notarizing or Missing Stamps!)", "fa": "جدول ۲-ب | راهنمای سریع «تفکیک سه‌سطحی تأییدات مدارک ایران» (جلوگیری از هزینه اضافه یا کسری مهر!)"}, "subtitle": {"zh": "切勿把所有纸张一股脑全送翻译社或韩国大使馆！严格按以下 🅰️ / 🅱️ / 🅾️ 三级分流执行，立省冤枉钱与跑腿工时：", "en": "Never send every document to a sworn trans عطیل)"}, "fee": {"zh": "按伊朗司法部官方宣誓译文页数计价", "en": "Official MOJ Per-Page Sworn Tariff", "fa": "طبق نرخنامه رسمی قوه قضائیه بر اساس تعداد صفحات"}, "title": {"zh": "宣誓英文精译、打孔铅封 (پلمپ) 与“翻译社专员一条龙代跑”委托机制", "en": "Sworn English Translation, Grommet Seal (پلمپ) & Turnkey Agency Runner Mechanism", "fa": "ترجمه رسمی انگلیسی، پلمپ و مکانیسم «پیگیری صفر تا صد توسط نماینده دارالترجمه»"}, "bullets": {"zh": ["🔑 **核心实操真相（个人无需也不能自己去司法部排队！）**：在伊朗，**司法部（`دادگستری`）认证窗口不受理个人散交，仅接收持牌翻译社注册专员（`نماینده دارالترجمه`）送件**！统一将盖好 Hesarak 医科章的原件（`D08/D09/D10-A`）、`estelam.iau.ir` 二维码单（收件人填该翻译师姓名）、三本身份簿（`D13 شناسنامه`）及全家人护照扫描件交给 <span class='phys-red'>司法部持牌宣誓翻译社（`دارالترجمه رسمی`），由其专员一条龙代办“英文宣誓翻译打印于司法部防伪水印纸并与波斯语原件打孔火漆密封 (`پلمپ`) + 司法部 (`دادگستری`) + 外交部 (`وزارت امور خارجه`)”<\/span>！", "⚡ **户籍先行 + 土耳其首拨直飞**：`D13` 本人及父母三本身份簿（`شناسنامه`）不绑定毕业证，**2027年1月初即可先行办妥翻译+双认证原件锁好**，并于 `02.08` 随身带去土耳其考完雅思次日直接用 `DHL Express` 寄往首尔！", "🎯 **定稿锁名铁律 + 专业英文名锁死 + 第9学期 `مهمان` 禁译 `Transfer` 红线**：① 去学校、银行、翻译社前统一钉附 **《全家护照首页拼写锁定卡》**，且 **`2027.01.10` 送德黑兰持牌宣誓翻译社时书面要求将本科专业名统一译为 `Clinical Laboratory Sciences`**（与 `Scholaro`、`CV`、`Release` 表及四校网申 100% 一字不差，防译成 `Medical Laboratory Technology` 等异名！）；② <span class='phys-red'>**成绩单第 9 学期单科跨校选修（`مهمان`）必须译为 `Guest Course`，绝对严禁误译为 `Transfer`（防触发高丽/汉阳要求“转学生”补交前序大学领事认证成绩单条款）！**<\/span>"], "en": ["🔑 **Crucial Practical Rule (Individuals CANNOT Queue at Iran's MOJ in Person!)**: Iran's Ministry of Justice (`دادگستری`) **rejects individual walk-ins and ONLY accepts registered couriers (`نماینده دارالترجمه`) from licensed sworn translation offices**! Hand your Hesarak-stamped originals (`D08/D09/D10-A`), `estelam.iau.ir` QR sheet, 3× `شناسنامه` booklets (`D13`), and family passport scans to a <span class='phys-red'>licensed sworn translation office (`دارالترجمه رسمی`) for turnkey 'Sworn English Translation on MOJ Watermarked Paper Wax/Grommet-Sealed (`پلمپ`) with Persian Original + MOJ + MFA' processing<\/span>!", "⚡ **Civil Docs First + Turkey Wave 1 Express**: `D13` 3× `شناسنامه` booklets do not depend on your diploma—**complete their sworn translation + MOJ/MFA dual auth in early Jan 2027**, carry 2 sets to Turkey to ship via `DHL Express` to Seoul on `02.08` (keeping 2 sets in Iran for YU scan & Tehran visa)!", "🎯 **Passport Spelling + Major Name Lock (`Clinical Laboratory Sciences`) + Sem 9 `مهمان` ('Guest Course', NEVER 'Transfer'!)**: (1) Staple a **Family Passport Bio-Page Spelling Card** AND give **written instruction on `2027.01.10` to translate your major strictly as `Clinical Laboratory Sciences`** (matching `Scholaro`, `CV`, `Release` & all 4 portals—never `Medical Laboratory Technology`!); (2) <span class='phys-red'>**Render Semester 9's cross-campus course (`مهمان`) strictly as `Guest Course`—NEVER `Transfer`, or KU/HYU will demand 'prior university' legalized transcripts!**<\/span>"], "fa": ["🔑 **نکته کلیدی اجرایی (دادگستری مراجعه‌کننده شخصی نمی‌پذیرد!)**: اداره کل اسناد قوه قضائیه (`دادگستری`) **مراجعه‌کننده انفرادی نمی‌پذیرد و مدارک را صرفاً از طریق «نماینده رسمی دارالترجمه» (`نماینده`) تحویل می‌گیرد**! کافی است اصل مدارک ممهور به مهر حصارک (`D08/D09/D10-A`)، برگه `estelam`، سه جلد شناسنامه (`D13`) و اسکن پاسپورت اعضای خانواده را به <span class='phys-red'>دارالترجمه رسمی بدهید تا ترجمه انگلیسی روی سربرگ واترمارک‌دار قوه قضائیه چاپ و با اصل فارسی سوراخ و لاک‌ومهر (`پلمپ`) شده و مهر دادگستری و وزارت خارجه یکجا اخذ گردد<\/span>!", "⚡ **تکمیل زودهنگام شناسنامه‌ها**: ترجمه ۳ جلد شناسنامه (`D13`) مستقل از دانشنامه است؛ پس از ۱۰ ژانویه تکمیل کرده، ۲ سری را ۸ فوریه از ترکیه به سئول بفرستید و ۲ سری را نزد خودتان در ایران نگه دارید!", "🎯 **قفل اسپل پاسپورت‌ها + تثبیت نام رشته (`Clinical Laboratory Sciences`) + خط قرمز واژه «`مهمان`»**: ۱) کپی پاسپورت کل خانواده را منگنه کنید و **در `۱۰ ژانویه ۲۰۲۷` کتباً از دارالترجمه بخواهید نام رشته کارشناسی را دقیقاً `Clinical Laboratory Sciences` ترجمه کند** (هماهنگ با `Scholaro`، رزومه و فرم‌های ثبت‌نام؛ نه `Medical Laboratory Technology`!)؛ ۲) <span class='phys-red'>**تک‌درس «`مهمان`» در ترم ۹ الز red'>**母校加盖官方英文鲜章的 `Scholaro` 换算原件（免领事认证）** 或 **母校开具的 `87.50%` 百分制换算公证原件**<\/span>——**漏交此项将直接丧失 HISP 70%–100% 奖学金参评资格**（实操双件同放最稳）！", "en": "HISP scholarship eligibility requires `≥80%` converted GPA; you MUST include <span class='phys-red'>**IAU wet-stamped `Scholaro` original (exempt from Embassy)** OR **IAU's notarized `87.50%` conversion original**<\/span>—**omitting this immediately disqualifies you from HISP** (include both for bulletproof safety)!", "fa": "شرط بورسیه HISP معدل بالای `۸۰٪` است؛ باید <span class='phys-red'>**اصل ممهور `Scholaro` (معاف از سفارت)** یا **اصل گواهی معادل‌سازی `87.50%` دانشگاه مبدأ**<\/span> را در پاکت بگذارید — **فراموشی این مورد مستقیماً باعث حذف از رقابت بورسیه HISP می‌شود**!"}}, {"uni": {"zh": "③ 高丽大学 (KU · 奖学金章明文规定)", "en": "③ Korea Univ. (KU · Scholarship Clause Rule)", "fa": "۳. دانشگاه کره (KU · بند رسمی آیین‌نامه بورسیه)"}, "pill": {"zh": "⚠️ 主件必交“母校官方转换证明书”（Scholaro仅作辅助）", "en": "⚠️ Primary: Alma Mater Official Conversion Cert (Scholaro Auxiliary)", "fa": "⚠️ مدرک اصلی: گواهی رسمی تبدیل نمره دانشگاه آزاد (Scholaro کمکی)"}, "color": "#0F9D58", "desc": {"zh": "高丽奖学金章明文规定：**“不能使用本校转换表时，必须提交由申请者原籍大学正式开具的转换成绩证明书”**——因此高丽**主靠 `D10-A` 母校正式开具并经领事认证的《官方评分标准与百分制转换证明》（写明 `17.50/20 = 87.50% ≥ 85%` 稳达 C类65%校奖线，`17–20 = Grade A`）**，同时顺手附 1 份 `01.10` 后盖章的母校鲜章 `Scholaro` 单作辅助佐证！", "en": "KU's scholarship guide states: **'When KU's conversion table cannot be applied, an official converted grade certificate issued by the home university MUST be submitted'**—so KU **primarily relies on `D10-A` IAU's legalized Official Grading Scale & `87.50% ≥ 85%` Conversion Certificate (`17–20 = Grade A`, clearing Type C 65% waiver)**, plus 1 post-`01.10` wet-stamped `Scholaro` sheet as supporting proof!", "fa": "آیین‌نامه بورسیه دانشگاه کره تصریح دارد: **«در صورت عدم شمول جدول دانشگاه کره، باید گواهی رسمی معادل‌سازی صادره از خود دانشگاه مبدأ ارائه شود»** — بنابراین مدرک اصلی برای کره همان **`D10-A` گواهی رسمی کنسولی مقیاس نمره و معادل `87.50% ≥ 85%` (`17–20 = Grade A` جهت تثبیت بورسیه نوع C)** است و ۱ نسخه `Scholaro` ممهور نیز به عنوان مکمل ضمیمه می‌شود!"}}, {"uni": {"zh": "④ 延世大学医学院 (YU · 网申系统填法)", "en": "④ Yonsei Univ. Med (YU · Online Portal GPA Entry)", "fa": "۴. پزشکی دانشگاه یونسی (YU · نحوه ثبت معدل در سایت)"}, "pill": {"zh": "⚠️ 下拉必选 \"Others\" 填 17.50 + 传合并说明 PDF", "en": "⚠️ Select 'Others' (17.50) + Upload Merged Scale/Scholaro PDF", "fa": "⚠️ انتخاب گزینه \"Others\" با عدد ۱۷.۵۰ + آپلود PDF ترکیبی"}, "color": "#7C3AED", "desc": {"zh": "延世网申填报 `[Academic Records – GPA]` 时，分制下拉框**必选 `\"Others\"` 并填入 `17.50`**，同时将上述 `D10-A` 母校官方评分等级转换证明与 `D10-B` 鲜章 `Scholaro` 报告合并扫描为高清彩色 PDF 上传系统。", "en": "Under `[Academic Records – GPA]` on Yonsei's portal, **select `\"Others\"` from the scale dropdown, enter `17.50`**, and upload a merged color PDF scan of your `D10-A` Official Grading Scale Cert + `D10-B` wet-stamped `Scholaro` report.", "fa": "در بخش `[Academic Records – GPA]` سایت یونسی، از منوی مقیاس نمره حتماً گزینه **`\"Others\"` را انتخاب کرده و عدد `17.50` را وارد کنید** و اسکن رنگی ترکیبی گواهی مقیاس نمره `D10-A` به همراه برگه ممهور `Scholaro` را آپلود نمایید."}}], "masterCombo": {"zh": "💡 **一套动作通杀全部 4 校（零返工标准 SOP）**：`2027.01.10` 后（严防早于 `12.20` 过期！），由首尔 Charlotte 在 `scholaro.com` 录好全 10 学期逐科换算报告发 PDF → Arsan 打印 **3 份** 在 IAU Ardabil 教务处直接加盖官方英文鲜章（`D10-B`：1份给中央、1份给汉阳、1份给高丽辅助并扫PDF给延世）+ 同步开具领事认证版《排名(`4/32`)、评分标准(`17–20=A`)与 `87.50%` 转换证明》（`D10-A`），毕其功于一役！", "en": "💡 **One-Action Master Combo for All 4 Schools**: Right after `2027.01.10` (never before Dec 20!), Charlotte generates your full 10-sem course-by-course `scholaro.com` PDF in Seoul → Arsan prints **3 copies** and stamps them with IAU Ardabil's English wet-ink seal (`D10-B`: 1 for CAU, 1 for HYU, 1 for KU + PDF scan for YU) + processes legalized `D10-A` (`Rank 4/32`, `17–20=A`, `87.50%`), satisfying every rule at all 4 universities!", "fa": "💡 **یک حرکت یکپارچه برای هر ۴ دانشگاه**: بلافاصله پس از `۱۰ ژانویه ۲۰۲۷` (نه قبل از ۲۰ دسامبر!)، شارلوت در سئول گزارش کا
