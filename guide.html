<!DOCTYPE html>
<html lang="zh" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arsan M.S. Fall 2027 — 韩国顶尖大学院全奖申请三语交互指南 (中文 · English · فارسی)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EFF6FF;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --text: #0F172A;
  --text-2: #334155;
  --text-3: #64748B;
  --primary: #1A73E8;
  --primary-soft: rgba(26, 115, 232, 0.10);
  --teal: #0D9488;
  --teal-soft: rgba(13, 148, 136, 0.10);
  --green: #0F9D58;
  --green-soft: #E6F4EA;
  --amber: #D97706;
  --amber-soft: #FEF3C7;
  --orange: #FA903E;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --red: #D93025;
  --red-soft: #FCE8E6;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07), 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);
  --radius: 14px;
  --radius-sm: 9px;
}

html[data-theme="dark"] {
  --bg: #0B1120;
  --surface: #151F32;
  --surface-2: #1E293B;
  --surface-3: #1E3A5F;
  --border: #2D3D56;
  --border-strong: #475569;
  --text: #F1F5F9;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --primary: #60A5FA;
  --primary-soft: rgba(96, 165, 250, 0.15);
  --green-soft: rgba(16, 185, 129, 0.16);
  --amber-soft: rgba(245, 158, 11, 0.16);
  --purple-soft: rgba(167, 139, 250, 0.16);
  --red-soft: rgba(239, 68, 68, 0.18);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  line-height: 1.68;
  font-size: 14.5px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

html[lang="fa"] body {
  font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', 'Inter', sans-serif;
  line-height: 1.88;
  font-size: 15px;
}

/* Prevent long URLs/emails/identifiers from pushing mobile containers wide */
.section-card, .comp-card, .insp-item, .insp-v, .tuition-sub, .tuition-note,
.check-label, .metro-card, .hero-priority-alert, li, p, td {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Reusable Responsive Grids */
.grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.grid-3col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 820px) {
  .grid-2col, .grid-3col { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}

/* Red physical original callout */
.phys-red {
  color: #C5221F;
  background: rgba(217, 48, 37, 0.09);
  border-bottom: 1.5px solid rgba(217, 48, 37, 0.42);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
html[data-theme="dark"] .phys-red {
  color: #FCA5A5;
  background: rgba(239, 68, 68, 0.20);
  border-bottom-color: rgba(248, 113, 113, 0.55);
}

/* Inline clickable glossary term highlight */
.term-hl {
  border-bottom: 1.5px dashed #0284C7;
  background: rgba(14, 165, 233, 0.09);
  color: inherit;
  padding: 0 3px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.term-hl:hover {
  background: rgba(14, 165, 233, 0.22);
  border-bottom-style: solid;
}
body.hl-off .term-hl {
  border-bottom: none;
  background: transparent;
  padding: 0;
  cursor: text;
}

/* Sticky Topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 90;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .topbar {
  background: rgba(21, 31, 50, 0.94);
}

.topbar-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #1A73E8, #0D9488);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(26, 115, 232, 0.28);
  flex-shrink: 0;
}
.brand-text-main {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  line-height: 1.25;
}
.brand-text-sub {
  font-size: 12px;
  color: var(--text-3);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.lang-group {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
  min-height: 32px;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active {
  background: var(--primary);
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(26, 115, 232, 0.30);
}

.ctrl-pill {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  font-family: inherit;
  min-height: 34px;
}
.ctrl-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.ctrl-pill.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
}

/* Primary Navigation Tabs */
.nav-tabs-bar {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  gap: 2px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-tabs-bar::-webkit-scrollbar { display: none; }

.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-3);
  padding: 10px 13px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.18s;
  font-family: inherit;
  flex-shrink: 0;
}
.tab-btn:hover {
  color: var(--text);
  background: var(--surface-2);
  border-radius: 8px 8px 0 0;
}
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 700;
}
.tab-badge-count {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}

/* Main Container */
.main-wrap {
  max-width: 1320px;
  margin: 22px auto 64px;
  padding: 0 20px;
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.hero-banner {
  background: linear-gradient(135deg, rgba(26,115,232,0.08), rgba(13,148,136,0.08));
  border: 1px solid rgba(26,115,232,0.22);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.hero-badge {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 10px;
}
.hero-title {
  margin: 0 0 10px;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.35;
}
.hero-priority-alert {
  background: var(--surface);
  border-inline-start: 4px solid var(--red);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text-2);
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.kpi-val {
  font-size: 23px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}
.kpi-sub {
  font-size: 13.5px;
  font-weight: 700;
  margin-top: 4px;
  color: var(--text);
}
.kpi-detail {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* Priority Cascade Funnel */
.cascade-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.cascade-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-top: 4px solid var(--primary);
  border-radius: 12px;
  padding: 15px;
}
.cascade-rank {
  display: inline-block;
  font-weight: 800;
  font-size: 12px;
  padding: 2px 9px;
  border-radius: 999px;
  color: #fff;
  margin-bottom: 8px;
}
.cascade-uni { font-weight: 800; font-size: 15.5px; margin-bottom: 3px; }
.cascade-dept { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
.cascade-pis { font-size: 13.2px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.cascade-tag {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
}

/* Section Headings */
.sec-title {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.38;
}
.sec-sub {
  margin: 0 0 16px;
  font-size: 13.4px;
  color: var(--text-3);
}

/* Stacked Tuition & Workload Bars */
.tuition-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12.8px;
  font-weight: 600;
}
.leg-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
  vertical-align: middle;
  margin-inline-end: 6px;
}
.tuition-axis {
  direction: ltr;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  padding: 0 2px 6px;
  border-bottom: 1px dashed var(--border-strong);
  margin-bottom: 12px;
}
.tuition-row {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.16s;
  background: var(--surface-2);
}
.tuition-row:hover, .tuition-row.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.tuition-row-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.tuition-school-name { font-weight: 800; font-size: 15px; }
.tuition-pill {
  font-size: 11.8px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
}
.tuition-sub { font-size: 12.8px; color: var(--text-3); margin-bottom: 9px; }

.bar-track-ltr {
  direction: ltr;
  width: 100%;
  height: 32px;
  background: rgba(148, 163, 184, 0.16);
  border-radius: 8px;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
}
.bar-seg-blue, .bar-seg-orange {
  height: 100%;
  color: #fff;
  font-size: 11.8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 6px;
}
.bar-seg-blue { background: linear-gradient(90deg, #1A73E8, #2563EB); }
.bar-seg-orange { background: linear-gradient(90deg, #FA903E, #EA580C); }

.bar-total-tag {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  padding: 0 8px;
  white-space: nowrap;
}
.mobile-bar-summary {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
  font-size: 11.5px;
  font-weight: 700;
}
.tuition-note {
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 8px;
}

.inspector-drawer {
  background: var(--surface-3);
  border: 1px solid rgba(26, 115, 232, 0.28);
  border-radius: 12px;
  padding: 15px 16px;
  margin-top: 14px;
}
.inspector-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.insp-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
}
.insp-k { font-size: 11.5px; font-weight: 700; color: var(--text-3); margin-bottom: 3px; }
.insp-v { font-size: 13px; font-weight: 600; color: var(--text); }

/* Compliance & Card Grids */
.compliance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}
.comp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.comp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.pill-red { background: var(--red-soft); color: var(--red); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill-green { background: var(--green-soft); color: var(--green); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.comp-row { margin-bottom: 10px; font-size: 13.2px; }
.comp-k { font-weight: 700; color: var(--text); display: block; margin-bottom: 2px; }

/* Swipe Hint Pill for Mobile Horizontal Scroll Areas */
.mobile-swipe-hint {
  display: none;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 5px 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

/* Responsive Tables */
.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 820px;
  font-size: 13px;
}
.data-table th {
  background: var(--surface-2);
  color: var(--text);
  font-weight: 700;
  text-align: start;
  padding: 11px 13px;
  border-bottom: 2px solid var(--border-strong);
  white-space: pre-line;
  vertical-align: top;
}
.data-table td {
  padding: 11px 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: pre-line;
}
.data-table tr:last-child td { border-bottom: none; }

/* 5-Step Pipeline Stepper */
.stepper-rail {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.step-node {
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 13px;
  cursor: pointer;
  transition: all 0.16s;
}
.step-node:hover, .step-node.active {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.step-num-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.step-num {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.step-days {
  font-size: 11.2px;
  font-weight: 700;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 8px;
  border-radius: 999px;
}
.step-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.step-loc { font-size: 12px; color: var(--text-3); }

/* Architecture 3-Column Visual */
.arch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.25fr;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 960px) {
  .arch-grid { grid-template-columns: minmax(0, 1fr); }
}
.arch-col {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.arch-col-head {
  font-weight: 800;
  font-size: 14px;
  color: var(--primary);
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--border-strong);
}
.arch-box {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
}
.arch-engine {
  background: linear-gradient(135deg, #1E40AF, #1A73E8);
  color: #fff;
  border-radius: 12px;
  padding: 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.arch-deriv-btn {
  border: 1px solid var(--border);
  border-inline-start: 5px solid var(--primary);
  background: var(--surface);
  border-radius: 9px;
  padding: 10px 12px;
  text-align: start;
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
  transition: transform 0.14s, box-shadow 0.14s;
}

.pyramid-tier {
  margin: 0 auto 10px;
  background: var(--surface);
  border-radius: 10px;
  padding: 12px 14px;
}

/* Code / Terminal Copy Cards */
.cmd-block {
  direction: ltr;
  text-align: left;
  background: #0F172A;
  color: #E2E8F0;
  font-family: 'JetBrains Mono', 'Consolas', monospace;
  font-size: 12.5px;
  padding: 10px 12px;
  border-radius: 9px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.cmd-block code, .cmd-block span {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
}
.copy-btn {
  background: rgba(255,255,255,0.14);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.24);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 11.5px;
  cursor: pointer;
  flex-shrink: 0;
  min-height: 30px;
}

.email-preview {
  direction: ltr;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: 'Inter', Georgia, serif;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--text);
}

/* Upgraded Master Gantt Chart */
.gantt-callouts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

د."}, "tip": {"zh": "1张核验PDF在6个月内可重复打印使用，1月第1批和4月第2批公证都能直接共用。", "en": "Valid for 6 months and reusable for both Batch 1 (Jan 2027) and Batch 2 (Apr 2027) notarizations.", "fa": "تا ۶ ماه قابل چاپ مجدد است و هم برای سری اول (ژانویه) و هم سری دوم (آوریل ویژه دانشگاه چونگ‌آنگ) قابل استفاده است."}}, {"id": "med_stamp", "cat": "iran", "term": {"zh": "医科允许翻译章 (مهر علوم پزشکی)", "en": "Medical Sciences Translation Clearance Stamp", "fa": "مهر بلامانع بودن ترجمه (معاونت علوم پزشکی)"}, "aliases": ["医科允许翻译章", "允许翻译章", "医科放行章", "معاونت علوم پزشکی"], "def": {"zh": "伊朗自由大学医学与副医学分支（含临床医学检验科学 علوم آزمایشگاهی）专属前置手续：须赴德黑兰中央组织（Hesarak校区）医学副校长办公室加盖“允许翻译章”，否则官方翻译社与司法部无法受理。", "en": "Mandatory extra clearance for IAU medical/paramedical majors (including Clinical Laboratory Sciences): obtained in person at IAU Central Organization (Hesarak, Tehran) before sworn translation.", "fa": "مجوز الزامی ویژه رشته‌های علوم پزشکی و پیراپزشکی دانشگاه آزاد (از جمله علوم آزمایشگاهی) که باید حضوری در سازمان مرکزی تهران (واحد علوم و تحقیقات / حصارک، معاونت علوم پزشکی) روی دانشنامه و ریزنمرات درج شود."}, "tip": {"zh": "若原件格式标准现场1个工作日办结；若旧版成绩单需重排格式则需2–3周，务必在2026年12月办妥。", "en": "Takes 1 business day if transcript format is standard, or 2–3 weeks if reformatting is needed—complete this in Dec 2026.", "fa": "اگر فرمت ریزنمرات استاندارد باشد ۱ روزه انجام می‌شود، اما در صورت نیاز به اصلاح فرمت ۲ تا ۳ هفته زمان می‌برد؛ حتماً در دسامبر ۲۰۲۶ انجام دهید."}}, {"id": "shenasnameh", "cat": "iran", "term": {"zh": "伊朗身份簿亲属公证 (شناسنامه)", "en": "Iranian Birth & Identity Booklet (Shenasnameh)", "fa": "شناسنامه (اثبات رابطه خویشاوندی والدین)"}, "aliases": ["شناسنامه", "Shenasnameh", "身份簿"], "def": {"zh": "伊朗公民记载出生、父母姓名及户籍变更的官方身份簿。韩国高校审核外国人资格（本人与父母均为非韩国籍）时，用本人+父亲+母亲三本身份簿的宣誓英文翻译+伊朗司法部/外交部双认证原件作为官方亲属关系证明。", "en": "Iran's official civil identity booklet listing parents and family ties. Translating and dual-authenticating (MOJ + MFA) all three booklets (applicant, father, mother) serves as official proof of parent-child relationship and foreign nationality.", "fa": "سند رسمی هویتی و نسبی در ایران. برای اثبات غیردوگانه بودن تابعیت و رابطه فرزند و والدین در دانشگاه‌های کره، ترجمه رسمی انگلیسی هر سه جلد شناسنامه (متقاضی، پدر و مادر) با تأیید دادگستری و وزارت خارجه کافی است."}, "tip": {"zh": "身份簿只需办到“伊朗司法部+外交部双认证”即为最终成品，无需送韩国大使馆盖领事章！", "en": "Only requires Iranian MOJ + MFA stamps; Korean Embassy consular legalization is NOT needed for Shenasnameh.", "fa": "شناسنامه‌ها فقط به مهر دادگستری و وزارت خارجه نیاز دارند و نیازی به مهر کنسولی سفارت کره (و پرداخت دلار) ندارند!"}}, {"id": "consular_confirm", "cat": "iran", "term": {"zh": "韩国驻伊使馆领事认证 (영사확인)", "en": "Korean Embassy Consular Legalization (영사확인)", "fa": "تأییدیه کنسولی سفارت کره جنوبی (영사확인)"}, "aliases": ["영사확인", "领事认证", "韩国驻德黑兰大使馆领事认证", "韩国使馆领事认证"], "def": {"zh": "因伊朗非海牙（Apostille）成员国，学历与成绩单经伊朗司法部+外交部双认证后，须送交德黑兰 Vanak 广场韩国驻伊朗大使馆领事处加盖领事确认章（영사확인），韩国高校与法务部才承认其法律效力。", "en": "Because Iran is not part of the Hague Apostille Convention, academic documents authenticated by Iran's MOJ & MFA must receive final consular legalization at the Korean Embassy in Tehran (Vanak Sq.).", "fa": "از آنجا که ایران عضو کنوانسیون آپوستیل نیست، مدارک تحصیلی پس از تأیید دادگستری و وزارت خارجه باید به بخش کنسولی سفارت کره جنوبی در تهران (میدان ونک، خیابان شیخ بهایی شمالی، کوچه دانشور غربی، پلاک ۲) ارائه شوند."}, "tip": {"zh": "周日至周四 08:30–11:30 递交，2–3工作日出件，每份仅收 $4 USD 崭新无折痕美钞，不限申请批次（采用1月3套+4月1套分批策略）。", "en": "Sun–Thu 08:30–11:30 drop-off, 2–3 working days turnaround, $4 USD crisp cash per document, unlimited batches (3 sets in Jan + 1 set in Apr).", "fa": "یکشنبه تا پنجشنبه ۸:۳۰ تا ۱۱:۳۰ تحویل مدارک، ۲ تا ۳ روز کاری زمان بررسی، هزینه ۴ دلار اسکناس نو و بدون تاخوردگی به ازای هر مدرک و بدون محدودیت دفعات مراجعه."}}, {"id": "etrf", "cat": "korea", "term": {"zh": "机考雅思电子成绩单 (e-TRF)", "en": "Electronic Test Report Form (IELTS e-TRF)", "fa": "کارنامه الکترونیکی آیلتس کامپیوتری (e-TRF)"}, "aliases": ["e-TRF", "电子成绩单"], "def": {"zh": "机考雅思（IELTS on Computer）考后1–5天在考生后台（Test Taker Portal）签发的官方PDF成绩单，底部印有唯一防伪核验码（TRF Number），各大学可通过雅思官方核验系统在线查验真伪。", "en": "The official verifiable PDF score report issued 1–5 days after computer-delivered IELTS on the Test Taker Portal, featuring a unique TRF verification number.", "fa": "کارنامه رسمی PDF آیلتس کامپیوتری که ۱ تا ۵ روز پس از آزمون در پورتال زبان‌آموز صادر می‌شود و دارای کد رهگیری و اصالت‌سنجی (TRF Number) در پایین صفحه است."}, "tip": {"zh": "套磁可邮件发给教授；正式网申严禁私人邮件发招生办！高丽/汉阳走后台免费电子送分+首尔Charlotte激光彩打装袋；延世仅系统上传PDF（禁机构送分）。", "en": "Emailing PDF to professors is fine, but NEVER email admissions offices! Use free Portal e-delivery + Seoul color print for KU/HYU; upload PDF only for YU.", "fa": "ارسال PDF با ایمیل شخصی برای اساتید مجاز است، اما برای دفتر پذیرش دانشگاه‌ها اکیداً ممنوع است! برای KU/HYU ارسال الکترونیکی رایگان از پورتال + چاپ رنگی لیزری در سئول؛ برای یونسی فقط آپلود در سایت."}}, {"id": "korean_waiver", "cat": "korea", "term": {"zh": "韩语标准免除申请书 (한국어기준 면제 요청서)", "en": "Korean Proficiency Exemption Form (한국어기준 면제 요청서)", "fa": "فرم معافیت از مدرک زبان کره‌ای (한국어기준 면제 요청서)"}, "aliases": ["한국어기준 면제 요청서", "韩语标准免除申请书", "免韩语证明", "免韩语表"], "def": {"zh": "汉阳大学特有制度：未持有TOPIK 4级的外国新生默认在注册后被强制休学（휴학）；唯有汉阳指导教授在4–5月院系审查期向校方内部签交此表，学生才能凭英语成绩在9月正常选课进组。", "en": "Hanyang-specific rule: newly admitted international students without TOPIK Level 4 are placed on mandatory leave of absence unless their prospective Hanyang advisor internally signs and submits this waiver during April–May departmental review.", "fa": "قانون اختصاصی دانشگاه هانیانگ: دانشجویان بدون مدرک TOPIK سطح ۴ پس از ثبت‌نام به مرخصی اجباری فرستاده می‌شوند، مگر اینکه استاد راهنمای هانیانگ در بررسی داخلی آوریل–مه این فرم معافیت را امضا و رد کند."}, "tip": {"zh": "高丽、延世、中央3校凭IELTS ≥ 5.5制度自动免韩语；仅汉阳大学需在2月Zoom面试向导师确认并在3月报备考号！", "en": "KU, YU, and CAU automatically exempt Korean with IELTS ≥ 5.5; ONLY Hanyang requires asking your professor in Feb Zoom to submit this internal form.", "fa": "دانشگاه‌های کره، یونسی و چونگ‌آنگ با آیلتس ۵.۵ به بالا خودکار an flag your file during departmental screening.", "fa": "پس از ثبت‌نام در هانیانگ، کد 수험번호 را سریعاً برای استاد ایمیل کنید تا در مرحله بررسی دانشکده پرونده شما را پیدا و فرم معافیت زبان را امضا کند."}}, {"id": "scholaro", "cat": "korea", "term": {"zh": "Scholaro 逐科绩点换算母校鲜章件", "en": "University-Stamped Scholaro GPA Report", "fa": "گزارش معادل‌سازی معدل Scholaro با مهر زنده دانشگاه"}, "aliases": ["Scholaro", "scholaro.com"], "def": {"zh": "中央大学（CAU）对非4.0/4.3/4.5/百分制成绩单（如伊朗20分制）的专属规定：在 scholaro.com 录入全部10学期课程生成4.0制换算单打印，由母校教务处直接加盖大学官方英文鲜章即可，免做使馆领事认证。", "en": "CAU's special GPA conversion rule for 20-point scales: enter all 10 semesters on scholaro.com, print the report, and get a wet-ink official English stamp from IAU Ardabil's registrar (exempt from consular legalization).", "fa": "الزام ویژه دانشگاه چونگ‌آنگ برای سیستم نمره‌دهی ۲۰ نمره‌ای ایران: نمرات تمام ۱۰ ترم را در سایت scholaro.com وارد و چاپ کنید و به مهر زنده انگلیسی آموزش دانشگاه آزاد اردبیل برسانید (معاف از تأیید سفارت)."}, "tip": {"zh": "2026年12月在阿尔达比勒分校办毕业证时顺手盖好鲜章带回，省去事后跨城补章麻烦。", "en": "Print and get IAU Ardabil's wet stamp on your Scholaro report in Dec 2026 while collecting your diploma.", "fa": "در دسامبر ۲۰۲۶ همزمان با دریافت دانشنامه از واحد اردبیل، برگه پرینت‌شده Scholaro را هم مهر زنده انگلیسی بزنید."}}, {"id": "coa_d2", "cat": "korea", "term": {"zh": "标准入学许可书 (CoA) 与 D-2 留学签证", "en": "Certificate of Admission (CoA) & D-2 Student Visa", "fa": "گواهی پذیرش استاندارد (CoA) و ویزای تحصیلی D-2"}, "aliases": ["CoA", "标准入学许可书", "D-2", "D-2 留学签证", "D-2签证"], "def": {"zh": "6–7月正式录取注册并提交30天内最新银行存款证明原件后，韩国大学签发的法务部《标准入学许可书（표준입학허가서 / CoA）》。凭 CoA + 第1批预留的第3套领事认证原件赴韩国驻德黑兰使馆申办 D-2 硕士留学签证。", "en": "Official Certificate of Admission issued in July after tuition/registration confirmation and fresh (<30-day) bank balance proof; used with your 3rd set of legalized degree documents at the Korean Embassy in Tehran to obtain the D-2 Master's visa.", "fa": "برگه رسمی پذیرش که پس از ثبت‌نام نهایی و ارائه گواهی تمکن مالی جدید (صادرشده در ۳۰ روز اخیر) در ماه جولای توسط دانشگاه صادر می‌شود. با CoA و سری سوم مدارک کنسولی، ویزای تحصیلی D-2 را از سفارت کره در تهران می‌گیرید."}, "tip": {"zh": "法定死线：韩国法务部规定9月1日开学后一律停发 CoA，定校与新存款证明务必在2027年7月中旬前交齐！", "en": "Hard legal deadline: Korean Immigration prohibits issuing CoAs after Sep 1 semester start—submit registration and fresh bank proof before mid-July 2027.", "fa": "خط قرمز قانونی: اداره مهاجرت کره پس از ۱ سپتامبر مطلقاً CoA صادر نمی‌کند؛ ثبت‌نام و گواهی بانکی جدید را حتماً تا اواسط جولای ۲۰۲۷ تکمیل کنید."}}, {"id": "e7_f27", "cat": "korea", "term": {"zh": "韩国就业与优才永居通道 (E-7 → F-2-7)", "en": "Korea R&D Work & Points Residency Visa (E-7 → F-2-7)", "fa": "مسیر ویزای کاری تخصصی و اقامت امتیازی کره (E-7 به F-2-7)"}, "aliases": ["E-7", "F-2-7"], "def": {"zh": "韩国生物医药/医疗AI硕士毕业后的留韩职业路径：先通过特定活动工作签（E-7）进入韩国药企或AI研发岗位，随后凭韩国名校硕士学历、薪资与年龄加分转优才居住签（F-2-7）。在Zoom面试中表明留韩深耕而非跳板去美国，极受韩国教授青睐。", "en": "Post-M.S. career visa pathway in South Korea: transitioning from D-2 to E-7 (specialty R&D employment in Korean biopharma/AI) and F-2-7 (points-based residency). Highlighting long-term commitment to Korea strongly appeals to Korean PIs.", "fa": "مسیر شغلی پس از کارشناسی ارشد در کره: ورود به صنعت دارو و هوش مصنوعی پزشکی کره با ویزای تخصصی E-7 و سپس تبدیل به اقامت امتیازی F-2-7. اعلام هدف ماندن در کره (به‌جای مهاجرت به آمریکا) امتیاز بزرگی در مصاحبه با اساتید کره‌ای است."}, "tip": {"zh": "Zoom面试开场30秒韩语问候后紧接着抛出这一留韩职业规划，打消教授对外国学生“拿完学位就走、无法长期合作”的顾虑。", "en": "State this right after your 30-second Korean greeting in Zoom interviews to show long-term commitment as a lab alumnus in Korea.", "fa": "در همان دقیقه اول مصاحبه زوم پس از سلام به زبان کره‌ای این هدف را مطرح کنید تا خیال استاد از تعهد بلندمدت شما راحت شود."}}, {"id": "hisp", "cat": "funding", "term": {"zh": "汉阳国际优秀奖学金 (HISP) 与理工科奖学金", "en": "Hanyang International Scholarship (HISP) & STEM Scholarship", "fa": "بورسیه بین‌المللی هانیانگ (HISP) و بورسیه مهندسی/علوم پایه"}, "aliases": ["HISP", "汉阳理工科外国人奖学金"], "def": {"zh": "汉阳大学两大校级学费减免：① HISP按书审综合评定减免4学期100%/70%/50%学费（门槛：前序绩点百分制≥80%，必须交官方百分制换算证明原件）；② 汉阳理工科外国人奖学金对录取理工科研究生保底减免50%入学金+50%学费（维持GPA ≥ 3.0）。", "en": "Hanyang's two tuition waivers: (1) HISP awards 100%/70%/50% waiver for 4 semesters (requires ≥80/100 GPA & physical percentage conversion certificate); (2) STEM Scholarship guarantees 50% admission + 50% tuition waiver automatically.", "fa": "دو بورسیه شهریه دانشگاه هانیانگ: ۱) بورسیه رقابتی HISP با معافیت ۱۰۰٪، ۷۰٪ یا ۵۰٪ برای ۴ ترم (نیازمند معدل بالای ۸۰٪ و ارائه اصل گواهی معادل‌سازی درصدی ۸۷.۵۰٪)؛ ۲) بورسیه تضمینی رشته‌های علوم و مهندسی با ۵۰٪ تخفیف شهریه و ورودی."}, "tip": {"zh": "漏交G3《87.50%百分制换算公证原件》将直接丧失HISP参评资格，Charlotte装汉阳信封时务必逐页核对！", "en": "Omitting the physical 87.50% percentage conversion certificate disqualifies you from HISP—double-check Hanyang's mail packet!", "fa": "فراموش کردن اصل گواهی معادل‌سازی درصدی (۸۷.۵۰٪) باعث حذف مستقیم از رقابت HISP می‌شود؛ هنگام بسته‌بندی پاکت هانیانگ حتماً چک کنید."}}, {"id": "ku_global", "cat": "funding", "term": {"zh": "高丽大学 Global Leader A类 / 理工C类奖学金", "en": "Korea Univ. Global Leader (Type A) & STEM (Type C) Scholarships", "fa": "بورسیه Global Leader نوع A و علوم پایه نوع C دانشگاه کره"}, "aliases": ["Global Leader A类", "理工科 C类奖学金", "C类奖学金", "理工 C类校奖"], "def": {"zh": "高丽大学外国人研究生校奖：C类（CGPA ≥ 3.14/4.0 或 ≥85% + IELTS ≥ 6.0）首学期免65%学费（不免入学金）；A类（CGPA ≥ 3.57/4.0 或 ≥90% + IELTS ≥ 7.0）免100%入学金与学费+月发50万韩元。第2学期起每学期凭高丽在读GPA（C类≥3.5/4.5，A类≥4.0/4.5）续申，免重交雅思！", "en": "KU international scholarships: Type C (CGPA ≥ 85% + IELTS ≥ 6.0) waives 65% tuition in Sem 1; Type A (CGPA ≥ 90% + IELTS ≥ 7.0) waives 100% admission + tuition + 500k KRW/mo. From Sem 2, renewal depends solely on KU GPA (≥4.0/4.5 upgrades to Type A without re-submitting IELTS!).", "fa": "بورسیه‌های دانشگاه کره: نوع C (معدل بالای ۸۵٪ + آیلتس ۶.۰) شامل ۶۵٪ معافیت شهریه ترم اول است (کامل در دسترس آرسان)؛ نوع A شامل ۱۰۰٪ معافیت شهریه و ورودی است. از ترم دوم، ارتقا به نوع A فقط با معدل داخل دانشگاه کره (۴.۰ از ۴.۵) و بدون نیاز مجدد به آیلتس انجام می‌شود!"}, "tip": {"zh": "第1学期剩余35%学费+入学金差额（共358.26万KRW）在2月面试温和确认由 #2 정원영 教授课题RA覆盖即可；绝口不提教授财政担保签字表！", "en": "Politely confirm in Feb Zoom whether Prof. Jung's RA stipend covers the 3.58M KRW Sem 1 gap; NEVER ask the professor to sign a financial sponsorship form.", "fa": "در مصاحبه فوریه محترمانه بپرسید آیا حقوق RA آزمایشگاه مابه‌التفاوت ۳.۵۸ میلیون وونی ترم اول را پوشش می‌دهد؛ هرگز از استاد امضای فرم ضمانت مالی نخواهید."}}, {"id": "cayss", "cat": "funding", "term": {"zh": "中央大学青年科学家全奖 (CAYSS)", "en": "CAU Young Scientist Scholarship (CAYSS)", "fa": "بورسیه کامل دانشمندان جوان دانشگاه چونگ‌آنگ (CAYSS)"}, "aliases": ["CAYSS", "CAYSS推荐书"], "def": {"zh": "中央大学理工医药顶级全额奖学金：凭本科CGPA ≥ 80% + IELTS ≥ 5.5 + 中央大专职教授签署《CAYSS推荐书》，直接免报名费+免入学金+免4学期100%学费（药学系基准951.95万KRW/学期），且校规强制导师每月配套 ≥ 50万韩元生活津贴。", "en": "CAU's flagship STEM/Pharmacy fellowship: waives application fee, admission fee, and 100% tuition for 4 semesters, plus mandates ≥500,000 KRW/month stipend from the advisor upon signing the CAYSS Recommendation Form.", "fa": "بورسیه طلایی دانشگاه چونگ‌آنگ ویژه رشته‌های علوم و داروسازی: با تأیید استاد راهنما (فرم توصیه‌نامه CAYSS)، کل هزینه اپلای، ورودی و ۱۰۰٪ شهریه ۴ ترم بخشیده شده و استاد موظف به پرداخت حداقل ۵۰۰ هزار وون کمک‌هزینه ماهانه است."}, "tip": {"zh": "维持条件：每学期GPA ≥ 3.5 + 毕业1年内发表1篇独立于学位论文的JCR期刊论文；公证件严守90天红线（4月初补办第2批原件专供）。", "en": "Requires maintaining ≥3.5 GPA and publishing 1 JCR paper within 1 year of graduation; notarized docs must be <90 days old (handled via Apr Batch 2).", "fa": "شرط تداوم: معدل بالای ۳.۵ در هر ترم و چاپ ۱ مقاله JCR تا یک سال پس از فارغ‌التحصیلی؛ تاریخ ترجمه رسمی مدارک نباید بیش از ۹۰ روز گذشته باشد."}}, {"id": "bk21", "cat": "funding", "term": {"zh": "韩国国家BK21研究团与RA课题劳务津贴", "en": "Brain Korea 21 (BK21) & Lab RA Stipend", "fa": "طرح ملی پژوهش BK21 و حقوق دستیار پژوهشی (RA)"}, "aliases": ["BK21", "BK21-BIO4", "RA", "研究津贴"], "def": {"zh": "BK21（Brain Korea 21）是韩国教育部资助顶尖研究生院院系的国家级人才基金，叠加导师主持的科技部（NRF）/保健福祉部课题劳务费（Research Assistantship, RA），是韩国理工医药硕士覆盖剩余学费与每月生活费的核心资金池。", "en": "Brain Korea 21 is South Korea's flagship national graduate research grant. Combined with PI research grants (NRF / K-Moonshot / K-ARPA-H), RA stipends fund living expenses and cover any tuition not waived by university scholarships.", "fa": "طرح کلان دولت کره برای حمایت مالی از تحصیلات تکمیلی در دانشگاه‌های برتر که در کنار گرنت‌های تحقیقاتی استاد (NRF و غیره)، منبع اصلی پرداخت حقوق ماهانه دانشجو (RA) و پوشش کامل مابه‌التفاوت شهریه است."}, "tip": {"zh": "本报告锁定的5位导师全部背靠BK21研究团与国家级大课题，具备充足的经费兑现能力。", "en": "All 5 target professors belong to BK21 research groups backed by major national grants.", "fa": "هر ۵ استاد هدف در این گزارش عضو گروه‌های پژوهشی BK21 بوده و دارای گرنت‌های فعال دولتی هستند."}}, {"id": "dry_lab_intern", "cat": "funding", "term": {"zh": "无薪远程干实验预实习 (Remote Dry-Lab Pre-Internship)", "en": "Remote Dry-Lab Pre-Enrollment Internship", "fa": "پیش‌کارآموزی تحقیقاتی از راه دور (محاسباتی / Dry-Lab)"}, "aliases": ["远程干实验预实习", "进组前实习", "Remote Dry-Lab Pre-Internship", "Remote Pre-Internship"], "def": {"zh": "针对汉阳 #1a 남진우 教授官网“强烈建议入学前完成3–6个月实验室实习”的跨国破局策略：因人在伊朗等签证无法赴韩坐班，主动提议在2027年3月—8月通过互联网远程跑通组内公开RNA序列/单细胞代码与文献复现。", "en": "Strategic solution for labs like HYU BIG Lab (#1a Prof. Nam) that recommend 3–6 months of pre-enrollment internship: completing computational sequence/data pipelines remotely from Iran between March and August 2027 before flying to Seoul.", "fa": "راهکار هوشمندانه برای آزمایشگاه‌هایی مثل BIG Lab هانیانگ که ۳ تا ۶ ماه کارآموزی پیش از ورود توصیه می‌کنند: از آنجا که حضور فیزیکی قبل از ویزا ممکن نیست، پیشنهاد می‌دهید از مارس تا آگوست ۲۰۲۷ پایپ‌لاین‌های محاسباتی و مقالات آزمایشگاه را به صورت ریموت اجرا و تمرین کنید."}, "tip": {"zh": "这招对所有5位导师都是绝杀加分项——在首封套磁信末尾和Zoom面试收尾时主动请求导师指派3–8月前置学习书单与小任务！", "en": "Ask every prospective advisor in both your initial email and Zoom wrap-up for a Mar–Aug reading/coding prep list.", "fa": "در انتهای ایمیل اول و ۵ دقیقه پایانی مصاحبه زوم از استاد بخواهید مقالات و ابزارهای موردنیاز برای تمرین در بازه مارس تا آگوست را مشخص کند."}}, {"id": "epitope_cadd", "cat": "bio_ai", "term": {"zh": "多表位疫苗设计与3D分子对接 (M0基座)", "en": "Multi-Epitope Vaccine Design & 3D Molecular Docking (M0)", "fa": "طراحی واکسن چنداپیتوپی و داکینگ مولکولی سه‌بعدی (پروژه پایه M0)"}, "aliases": ["NetMHCpan-4.1", "VaxiJen 2.0", "ToxinPred", "SWISS-MODEL", "py3Dmol", "多表位疫苗"], "def": {"zh": "利用免疫信息学工具（NetMHCpan预测MHC结合亲和力、VaxiJen评估抗原性、ToxinPred排毒）筛选病原体或肿瘤新抗原肽段，串联成候选疫苗并用SWISS-MODEL与分子对接模拟其与免疫受体（HLA/TLR4）的三维氢键结合。", "en": "Computational pipeline screening pathogen/tumor peptides for MHC binding (NetMHCpan), antigenicity (VaxiJen), and non-toxicity (ToxinPred), linking them into a vaccine construct and docking 3D structures against HLA/TLR4 receptors.", "fa": "فرآیند ایمونوانفورماتیک برای غربالگری پپتیدهای آنتی‌ژنی ایمن و قوی با ابزارهایی مثل NetMHCpan و VaxiJen، اتصال آن‌ها با لینکرهای مناسب و شبیه‌سازی اتصال سه‌بعدی واکسن با گیرنده‌های ایمنی (HLA/TLR4)."}, "tip": {"zh": "M0直接把Arsan已修完的40小时实操课转化为可展示的GitHub代码仓库，并为M1提供mRNA序列、为M2提供肿瘤表位、为M4-B提供3D对接基础！", "en": "M0 directly proves Arsan's 40-hour CADD certificate and feeds sequences/skills directly into M1, M2, M3, and M4-B.", "fa": "پروژه M0 دقیقاً مهارت دوره ۴۰ ساعته آرسان را اثبات کرده و خروجی آن مستقیماً خوراک پروژه‌های M1، M2 و M4-B می‌شود."}}, {"id": "utr_mfe_cnn", "cat": "bio_ai", "term": {"zh": "5'-UTR 最小折叠自由能 (MFE) 与 shRNAI 1D-CNN", "en": "5'-UTR Minimum Free Energy (MFE) & 1D-CNN (shRNAI)", "fa": "انرژی آزاد تاخوردگی 5'-UTR (MFE) و شبکه کانولوشنی shRNAI"}, "aliases": ["5'-UTR", "MFE", "ViennaRNA", "shRNAI", "Conv1d"], "def": {"zh": "mRNA编码区前端的5'非翻译区（5'-UTR）决定了核糖体能否顺利结合并高效翻译蛋白质。用ViennaRNA计算其二级结构最小折叠自由能（MFE，越负越稳定，帽端过度折叠反而阻碍核糖体），并结合一维卷积神经网络（1D-CNN，对标#1a 남진우教授2025 shRNAI架构）预测核糖体载荷（MRL）。", "en": "The 5' Untranslated Region governs mRNA translation efficiency. ViennaRNA computes secondary-structure Minimum Free Energy (MFE), while a 3-layer 1D Convolutional Neural Network (inspired by Prof. Nam's 2025 shRNAI paper) predicts Mean Ribosome Load (MRL).", "fa": "ناحیه غیرترجمه‌ای ابتدای mRNA (5'-UTR) میزان تولید پروتئین واکسن را کنترل می‌کند. با بسته ViennaRNA پایداری ساختار ثانویه (MFE) محاسبه شده و با شبکه عصبی کانولوشنی یک‌بعدی (الهام‌گرفته از مقاله ۲۰۲۵ shRNAI پروفسور نام) کارایی ترجمه ریبوزومی پیش‌بینی می‌شود."}, "tip": {"zh": "面试金句：5'帽端前15个核苷酸如果发夹结构太稳定（MFE过负），会像门锁一样挡住核糖体扫描，导致蛋白表达骤降。", "en": "Key interview insight: overly stable hairpins (highly negative MFE) near the first 15 nt of the 5' cap block ribosome scanning and suppress translation.", "fa": "نکته طلایی مصاحبه: پایداری بیش‌ازحد ساختار سنجاق‌سری در ۱۵ نوکلئوتید ابتدایی کلاهک '5 مانع حرکت ریبوزوم و کاهش شدید بیان پروتئین می‌شود."}}, {"id": "sctcr_brice", "cat": "bio_ai", "term": {"zh": "单细胞 TCR 克隆扩增与 BRiCE 细胞丰度偏移", "en": "scTCR Clonal Expansion & BRiCE Differential Abundance", "fa": "تکثیر کلونال گیرنده سلول T (scTCR) و معیار فراوانی سلولی BRiCE"}, "aliases": ["scTCR-seq", "BRiCE", "CD161+ TRM", "Scanpy", "Scirpy", "KLRB1"], "def": {"zh": "对标汉阳 #1b 조재원 教授代表作：结合单细胞转录组（Scanpy）与T细胞受体测序（Scirpy）追踪识别肿瘤抗原后大量增殖的组织驻留记忆T细胞（CD161+/KLRB1+ TRM），并按照其2026年独立作者论文 BRiCE 核心思想，同时量化基因表达变化与细胞亚群比例偏移（Differential Abundance log2FC）。", "en": "Targets HYU Prof. Jae-Won Cho's research: pairing Scanpy + Scirpy to map tumor-infiltrating KLRB1+ (CD161+) tissue-resident memory T-cell clonal expansion alongside cell-type differential abundance shifts (log2FC), echoing his solo-author 2026 BRiCE benchmark.", "fa": "هم‌راستا با پژوهش‌های پروفسور چو در هانیانگ: ترکیب داده‌های تک‌سلولی RNA و گیرنده سلول T با ابزارهای Scanpy و Scirpy برای ردیابی تکثیر سلول‌های ایمنی مقیم بافت تومور (CD161+ TRM) و بررسی همزمان تغییرات بیان ژن و تغییر نسبت جمعیت سلول‌ها طبق مقاله ۲۰۲۶ ایشان (BRiCE)."}, "tip": {"zh": "把 Scanpy/Scirpy 当作医院血液科流式细胞术软件（FlowJo）的代码版来理解——输入细胞矩阵，按表面标志物分群看比例变化，零背诵压力！", "en": "Think of Scanpy/Scirpy just like FlowJo gating in hematology lab—input cell matrix, gate marker populations, and compare clone proportions!", "fa": "ابزارهای Scanpy و Scirpy را دقیقاً مثل نرم‌افزا y 13 valid)</span>\n• Video Interview: Jun 7–12 | Result: ~Jul 1", "fa": "• ثبت‌نام (UWAY): ۲۳ آوریل تا ۱۲ مه\n• <span class='phys-red'>ارسال پستی/حضوری: تا ۱۳ مه (مهر پست روز ۱۳ مه معتبر است)</span>\n• مصاحبه ویدیویی: ۷ تا ۱۲ ژوئن | نتایج: حدود ۱ جولای"}}, {"dim": {"zh": "报名费金额与支付方式", "en": "Application Fee & Payment", "fa": "هزینه ثبت‌نام (اپلای فی) و روش پرداخت"}, "hyu": {"zh": "142,000 KRW\n(支持海外卡、转账或 Alipay)", "en": "142,000 KRW\n(Overseas card, wire, or Alipay)", "fa": "۱۴۲,۰۰۰ وون کره\n(کارت بین‌المللی، حواله یا Alipay)"}, "ku": {"zh": "127,000 KRW\n(报名费12万 + 手续费7,000 KRW)", "en": "127,000 KRW\n(120k fee + 7k service charge)", "fa": "۱۲۷,۰۰۰ وون کره\n(۱۲۰ هزار ثبت‌نام + ۷ هزار کارمزد)"}, "yu": {"zh": "130,000 KRW\n(海外 PayPal 固定为 $130 USD)", "en": "130,000 KRW\n(Fixed $130 USD via overseas PayPal)", "fa": "۱۳۰,۰۰۰ وون کره\n(پرداخت ارزی با PayPal معادل ۱۳۰ دلار)"}, "cau": {"zh": "100,000 KRW\n(获评 CAYSS 全奖者退免报名费与入学金)", "en": "100,000 KRW\n(Waived/refunded for CAYSS awardees)", "fa": "۱۰۰,۰۰۰ وون کره\n(در صورت کسب بورسیه CAYSS کاملاً بخشیده می‌شود)"}}, {"dim": {"zh": "线下纸质原件节点与份数", "en": "Physical Originals Timing & Sets", "fa": "زمان تحویل و تعداد نسخه‌های فیزیکی اصل مدارک"}, "hyu": {"zh": "<span class='phys-red'>网申期寄达【1份领事认证原件】</span>（拒收认证件复印件）；材料概不退还", "en": "<span class='phys-red'>Mail [1 Legalized Original Set] during application</span> (photocopies rejected); non-returnable", "fa": "<span class='phys-red'>ارسال پستی «۱ سری اصل تأییدشده کنسولی» در بازه اپلای</span> (کپی برابر اصل پذیرفته نمی‌شود)؛ غیرقابل استرداد"}, "ku": {"zh": "<span class='phys-red'>网申期送达【1份领事认证原件】</span>（若使馆章未及盖好可先交翻译公证原件，录取后补领事章）", "en": "<span class='phys-red'>Deliver [1 Legalized Original Set] by Mar 19</span> (notarized translation accepted provisionally if embassy stamp pending)", "fa": "<span class='phys-red'>تحویل «۱ سری اصل کنسولی» تا ۱۹ مارس</span> (در صورت آماده نبودن مهر سفارت، تحویل موقت ترجمه رسمی مجاز است)"}, "yu": {"zh": "网申仅传彩色扫描PDF；仅录取新生于7–8月办CoA时交<span class='phys-red'>【1份领事认证原件】</span>", "en": "Color PDF scan at application; submit <span class='phys-red'>[1 Legalized Original Set]</span> only in Jul–Aug upon admission for CoA", "fa": "در اپلای فقط اسکن رنگی PDF؛ تحویل <span class='phys-red'>«۱ سری اصل کنسولی»</span> فقط پس از قبولی نهایی در جولای–آگوست"}, "cau": {"zh": "<span class='phys-red'>网申期提交【1份认证原件 + 1份全套复印件】</span>；已交材料概不退还", "en": "<span class='phys-red'>Submit [1 Legalized Original Set + 1 Full Photocopy Set]</span> by May 13; non-returnable", "fa": "<span class='phys-red'>تحویل «۱ سری اصل کنسولی + ۱ سری کپی کامل از تمام صفحات»</span> تا ۱۳ مه؛ غیرقابل استرداد"}}, {"dim": {"zh": "IELTS最低线、官方送分与彩打规定", "en": "IELTS Minimum, Portal Delivery & Print Rule", "fa": "حداقل نمره آیلتس، نحوه ارسال رسمی و قانون نسخه چاپی"}, "hyu": {"zh": "• 生命科学无硬性英语最低分（交 6.5–7.0 极具竞争力）\n• 后台免费电子送分 + <span class='phys-red'>首尔彩打 e-TRF 装袋</span>；导师4–5月内签《韩语标准免除申请书》", "en": "• No hard min for Life Science (6.5–7.0 highly competitive)\n• Free Portal e-delivery + <span class='phys-red'>Seoul color-printed e-TRF in packet</span>; PI submits Korean waiver in Apr–May", "fa": "• بدون کف اجباری انگلیسی در علوم زیستی (نمره ۶.۵–۷ عالی است)\n• ارسال رایگان از پورتال + <span class='phys-red'>چاپ رنگی e-TRF در سئول</span>؛ امضای فرم معافیت کره‌ای توسط استاد"}, "ku": {"zh": "• 入学线：5.5（禁Indicator）；校奖线：C类 6.0，A类 7.0\n• 明文允许<span class='phys-red'>直接彩打含核验号的 e-TRF PDF</span> + 后台免费电子送分（免土耳其寄单）", "en": "• Min: 5.5 (No Indicator); Scholarship: Type C ≥6.0, Type A ≥7.0\n• Explicitly accepts <span class='phys-red'>color-printed e-TRF PDF</span> + free Portal e-delivery", "fa": "• کف پذیرش: ۵.۵؛ شرط بورسیه: نوع C نمره ۶.۰ و نوع A نمره ۷.۰\n• پذیرش رسمی <span class='phys-red'>چاپ رنگی e-TRF</span> همراه با ارسال الکترونیکی رایگان از پورتال"}, "yu": {"zh": "• 最低线：IELTS Academic 5.5（认可 One Skill Retake）\n• 明文不收机构送分（NOT accepted）且禁发私人邮件，仅在网申系统上传 e-TRF PDF", "en": "• Min: IELTS Academic 5.5 (accepts One Skill Retake)\n• Institutional score reporting NOT accepted; upload verifiable e-TRF PDF on portal only", "fa": "• حداقل آیلتس آکادمیک ۵.۵ (قبول One Skill Retake)\n• ارسال سازمانی نمره ممنوع است! فقط آپلود فایل PDF کارنامه e-TRF در سایت ثبت‌نام"}, "cau": {"zh": "• 入学及CAYSS最低线：IELTS Academic 5.5（禁后补）\n• 先后台免费电子送分，3–4月邮件 gsadmin@cau.ac.kr 确认能否交<span class='phys-red'>首尔 e-TRF 彩打件</span>", "en": "• Min & CAYSS: IELTS 5.5 (no late submission)\n• Free Portal e-delivery + email gsadmin@cau.ac.kr in Mar–Apr to confirm <span class='phys-red'>Seoul e-TRF print</span>", "fa": "• حداقل پذیرش و CAYSS: آیلتس ۵.۵ (تکمیل بعدی ممنوع)\n• ارسال رایگان از پورتال + ایمیل در مارس–آوریل به gsadmin@cau.ac.kr برای تأیید <span class='phys-red'>چاپ رنگی e-TRF</span>"}}]}, "koreanWaiverFlow": {"title": {"zh": "图 1B｜“零韩语基础（无 TOPIK）”直入韩国名校豁免通道对比与汉阳三步签字法", "en": "Fig 1B | Zero-TOPIK Korean Language Exemption Pathways & Hanyang 3-Step Internal Sign-off", "fa": "نمودار ۱-ب | مقایسه مسیر معافیت از مدرک زبان کره‌ای (بدون TOPIK) و فرآیند ۳ مرحله‌ای دانشگاه هانیانگ"}, "autoGroup": {"badge": {"zh": "3校制度自动豁免（0签字手续）", "en": "3 Universities: Automatic Institutional Exemption (0 Signatures)", "fa": "۳ دانشگاه با معافیت خودکار آیین‌نامه‌ای (بدون نیاز به هیچ فرم و امضایی)"}, "schools": {"zh": "高丽大学 (KU) · 延世大学医大 (YU) · 中央大学 (CAU)", "en": "Korea Univ. (KU) · Yonsei Med (YU) · Chung-Ang Univ. (CAU)", "fa": "دانشگاه کره (KU) · پزشکی یونسی (YU) · دانشگاه چونگ‌آنگ (CAU)"}, "desc": {"zh": "三校理工医药院系均实行“英语达标（IELTS ≥ 5.5）或韩语达标二选一”。只要提交2月7日考取的 IELTS Academic 成绩单，网申系统直接认定语言100%合格，全程无需提交韩语证明，更无需找教授签任何豁免表！（甚至毕业环节：中央大理工医免毕业TOPIK 4级，高丽大凭IELTS 6.0直接免毕业外语考。）", "en": "All three STEM/Biomedical graduate schools enforce an 'English (IELTS ≥ 5.5) OR Korean' rule. Submitting your Feb 7 IELTS Academic score satisfies 100% of admission language requirements—zero Korean certificates or professor signatures needed! (Bonus: CAU STEM waives graduation TOPIK 4, and KU IELTS ≥ 6.0 waives the graduation foreign language exam.)", "fa": "در دانشکده‌های علوم، پزشکی و داروسازی این سه دانشگاه، قانون «انگلیسی (آیلتس ۵.۵ به بالا) یا کره‌ای» برقرار است. صرفاً با ارائه نمره آیلتس ۷ فوریه، شرط زبان ۱۰۰٪ تکمیل شده و به هیچ مدرک کره‌ای یا امضای استاد نیاز ندارید! (حتی برای فارغ‌التحصیلی نیز چونگ‌آنگ شرط TOPIK 4 ندارد و دانشگاه کره با آیلتس ۶ آزمون زبان فارغ‌التحصیلی را معاف می‌کند.)"}}, "hyuSteps": {"badge": {"zh": "汉阳大学（生命科学系）专属三步豁免法（防强制休学红线！）", "en": "Hanyang Univ. (Life Science) Mandatory 3-Step Advisor Waiver (Prevents Forced Leave!)", "fa": "فرآیند ۳ مرحله‌ای اختصاصی دانشگاه هانیانگ (جلوگیری از مرخصی اجباری ترم اول!)"}, "ruleQuote": {"zh": "简章原文依据：한양대학교 지도교수의 <한국어기준 면제 요청서> 취득자: 학과 서류심사 시 교수님의 판단 하에 결정되므로 학생이 별도로 제출할 필요 없음（由指导教授在院系书审时内部决定并提交，学生无需另行交表）", "en": "Official Guide Clause: Recipients of Hanyang Advisor's <Korean Proficiency Exemption Request Form> (한국어기준 면제 요청서) are decided internally by the professor during departmental screening; students do not submit a separate form.", "fa": "متن رسمی دفترچه هانیانگ: فرم <한국어기준 면제 요청서> در مرحله بررسی پرونده در دانشکده مستقیماً به تشخیص و امضای استاد راهنما در سیستم داخلی ثبت می‌شود و دانشجو نیازی به ارسال فرم فیزیکی جداگانه ندارد."}, "steps": [{"num": "Step 1", "time": "2027.02.16–02.28", "title": {"zh": "Zoom 面试礼貌口头确认", "en": "Polite Verbal Confirmation in Feb Zoom", "fa": "تأیید شفاهی محترمانه در مصاحبه زوم فوریه"}, "desc": {"zh": "向 #1a 남진우 或 #1b 조재원 教授确认接收意向后，礼貌询问是否愿意在春季院系审查时内部签交《韩语标准免除申请书》，确保9月免休学直接进组。", "en": "Once Prof. Nam or Prof. Cho expresses interest, politely ask if they are willing to submit the internal Korean Exemption Form during spring screening so you can start immediately in Sep.", "fa": "پس از اعلام نظر مثبت پروفسور نام یا چو، محترمانه بپرسید آیا در بررسی بهاره فرم داخلی معافیت زبان کره‌ای را امضا می‌کنند تا از سپتامبر مستقیماً وارد آزمایشگاه شوید."}}, {"num": "Step 2", "time": "2027.03.03–03.26", "title": {"zh": "网申缴费后邮件报备考号 (수험번호)", "en": "Email Application ID (수험번호) After Portal Payment", "fa": "ارسال ایمیل شماره داوطلبی (수험번호) پس از ثبت‌نام"}, "desc": {"zh": "完成汉阳 OIA 网申拿到专属考生编号（수험번호）后，立即发简短邮件给意向教授备案，方便教授在系审系统精准锁定档案。", "en": "Right after completing Hanyang OIA application, email your generated Examinee ID (수험번호) to your prospective advisor for easy file lookup.", "fa": "بلافاصله پس از ثبت‌نام در سایت هانیانگ و دریافت کد 수험번호، آن را برای استاد ایمیل کنید تا پرونده شما را در سیستم گروه به راحتی پیدا کند."}}, {"num": "Step 3", "time": "2027.04.22–05.12", "title": {"zh": "院系审查期教授内签 → 6月直拿无休学 CoA", "en": "Dept. Review Internal Sign-off → Full Admission & CoA", "fa": "امضای داخلی استاد در بررسی گروه ← پذیرش قطعی بدون مرخصی"}, "desc": {"zh": "4月中旬礼貌提醒一次；4.22–5.12院系材料审查期教授在系内系统勾选签字提交免除书，6.11放榜即获无休学限制正式录取！", "en": "Send one polite reminder in mid-April; professor signs the internal waiver during Apr 22–May 12 review → unconditional Sep enrollment & CoA!", "fa": "اواسط آوریل یک یادآوری کوتاه بفرستید؛ استاد در بازه ۲۲ آوریل تا ۱۲ مه فرم را در سیستم گروه امضا کرده و در ژوئن پذیرش قطعی و CoA صادر می‌شود!"}}]}}, "labs1_5": [{"rank": "#1a", "name": {"zh": "남진우 (Jin-Wu Nam) · 汉阳大学 生命科学系", "en": "Prof. Jin-Wu Nam (남진우) · Hanyang Life Science", "fa": "پروفسور نام جین‌وو (남진우) · علوم زیستی هانیانگ"}, "lab": "BIG Lab (biglab.or.kr)", "fundingTag": {"zh": "官网明文 100% 全包", "en": "Official 100% Full Package", "fa": "تضمین رسمی ۱۰۰٪ شهریه + حقوق"}, "fundingColor": "green", "funding": {"zh": "biglab.or.kr/positions 明确公告：提供 100% 全额学费支援（등록금 전액 지원）+ 生活津贴（생활비 지급）+ 科研成果绩效奖金。依托国家 K-Moonshot 新药PD、牧岩所 AI mRNA 大课题与汉阳 BK21-BIO4，经费极度充沛。", "en": "biglab.or.kr/positions explicitly pledges 100% full tuition support + monthly living stipend + publication incentives. Backed by Korea's K-Moonshot Drug PD, Mogam AI mRNA initiative, and HYU BK21-BIO4.", "fa": "در سایت رسمی biglab.or.kr/positions صراحتاً پشتیبانی ۱۰۰٪ کل شهریه + حقوق ماهانه زندگی + پاداش پژوهشی اعلام شده است. متکی به گرنت‌های عظیم ملی K-Moonshot، پروژه هوش مصنوعی mRNA مؤسسه موگام و BK21-BIO4."}, "internTag": {"zh": "官网建议 3–6个月前置实习（远程破局！）", "en": "Recommends 3–6 Mo Pre-Internship (Solve Remotely!)", "fa": "توصیه به ۳–۶ ماه کارآموزی پیش از ورود (حل  with 18.87/20 (94.36%) GPA; (4) Cohort Rank 4 / 32 (Top 12.5%).", "<span class='phys-red'>Obtain Medical School stamped <816-Hour Hospital Clinical Rotation Certificate> (GPA 18.94/20)</span>.", "<span class='phys-red'>Enter all 10 semesters on scholaro.com, print the report, and get IAU Ardabil's official English wet-ink stamp</span> (exempt from consular legalization per CAU guide)."], "fa": ["<span class='phys-red'>تکمیل تسویه‌حساب در آموزشیار و دریافت اصل دانشنامه رسمی کارشناسی و ریزنمرات رسمی ۱۰ ترم</span> (کنترل دقیق ۱۳۷.۵۰ واحد کل، ۱۳۶ واحد محاسبه‌شده، مجموع وزنی ۲۳۷۹.۵۰، معدل ۱۷.۵۰ از ۲۰، بدون افتادگی F=0 و ثبت مرخصی ترم ۷). استفاده از «گواهی موقت» مطلقاً ممنوع است!", "<span class='phys-red'>درخواست گواهی رسمی ممهور به مهر آموزش کل و رئیس واحد شامل ۴ بند کلیدی</span>: ۱) مقیاس ۲۰ نمره‌ای (۱۰ قبولی) که در آن ۱۷ تا ۲۰ معادل Grade A / Excellent = 4.00/4.00 است؛ ۲) معدل کل ۱۷.۵۰/۲۰ در بالاترین سطح Excellent معادل ۸۷.۵۰٪ (۳.۵۱ از ۴)؛ ۳) کسب معدل درخشان ۱۸.۸۷/۲۰ (۹۴.۳۶٪) در ۴۹ واحد سه ترم آخر (ترم ۸ تا ۱۰)؛ ۴) رتبه ۴ از بین ۳۲ فارغ‌التحصیل ورودی (۱۲.۵٪ برتر).", "<span class='phys-red'>دریافت گواهی رسمی ۸۱۶ ساعت کارآموزی چرخشی بیمارستانی از دانشکده علوم پزشکی (با ذکر معدل ۱۸.۹۴ از ۲۰)</span>.", "<span class='phys-red'>ورود نمرات ۱۰ ترم در سایت scholaro.com، پرینت گزارش و دریافت مهر زنده انگلیسی آموزش واحد اردبیل</span> (ویژه دانشگاه چونگ‌آنگ، معاف از تأیید سفارت)."]}}, {"step": "02", "days": {"zh": "3–7 个工作日", "en": "3–7 Workdays", "fa": "۳ تا ۷ روز کاری"}, "when": {"zh": "2026年12月办妥", "en": "Complete in Dec 2026", "fa": "انجام قطعی در دسامبر ۲۰۲۶"}, "loc": {"zh": "德黑兰自由大学中央组织 (Hesarak)", "en": "Tehran IAU Central (Hesarak)", "fa": "سازمان مرکزی دانشگاه آزاد (حصارک تهران)"}, "title": {"zh": "线上核验码 + 医科专属“允许翻译章”", "en": "Online QR Verification + Medical Clearance Stamp", "fa": "کد استعلام estelam + مهر علوم پزشکی سازمان مرکزی"}, "bullets": {"zh": ["登录 estelam.iau.ir 输入国民身份证号申请线上学历核验（“收件人”栏填官方宣誓翻译师姓名），3–7个工作日出带二维码 PDF（6个月内有效可重复打印，送司法部必附）。", "<span class='phys-red'>赴 ang (HYU)", "fa": "دانشگاه کره (KU) و هانیانگ (HYU)"}, "tag": {"zh": "后台免费电子送分 + 首尔彩打装袋", "en": "Free Portal e-Delivery + Seoul Color Print", "fa": "ارسال رایگان از پورتال + چاپ رنگی در سئول"}, "color": "#1A73E8", "steps": {"zh": "① 出分当日登录雅思考生后台（Test Taker Portal）免费勾选 Korea University 与 Hanyang University 发送官方电子成绩单（2年内0元免费）；② 将含防伪核验号（TRF Number）的 e-TRF PDF 发给首尔 Charlotte，<span class='phys-red'>由 Charlotte 用激光彩色打印机清晰彩打装入材料袋</span>（高丽简章明文认可带真伪确认号的PDF打印件，汉阳生命科学为选交加分项）。", "en": "(1) On results day (Feb 10–12), log into IELTS Test Taker Portal and select Korea University & Hanyang University for free official e-TRF Institutional Delivery; (2) Send the e-TRF PDF to Charlotte in Seoul to <span class='phys-red'>laser-color-print and place inside both packets</span> (KU explicitly accepts printed PDFs bearing the TRF verification number).", "fa": "۱) روز اعلام نمره در پورتال آیلتس (Test Taker Portal) به صورت رایگان گزینه ارسال الکترونیکی رسمی به Korea University و Hanyang University را بزنید؛ ۲) فایل PDF دارای کد رهگیری (TRF Number) را برای شارلوت بفرستید تا <span class='phys-red'>در سئول پرینت رنگی لیزری باکیفیت گرفته و داخل پاکت بگذارد</span> (مورد تأیید صریح دفترچه دانشگاه کره)."}}, {"uni": {"zh": "延世大学医学院 (YU)", "en": "Yonsei Univ. Medicine (YU)", "fa": "پزشکی دانشگاه یونسی (YU)"}, "tag": {"zh": "纯网申系统上传 PDF（禁机构送分！）", "en": "Portal PDF Upload ONLY (NO e-Delivery!)", "fa": "فقط آپلود PDF در سایت (ارسال سازمانی ممنوع!)"}, "color": "#7C3AED", "steps": {"zh": "延世简章明文规定 Score Reporting is NOT accepted（不接受考试机构送分）！无需在雅思后台勾选延世，只需在4月网申网页直接上传带核验码的 e-TRF PDF，全程0纸质（7月录取办CoA亦免交纸质雅思单）。", "en": "Yonsei's guide states 'Score Reporting is NOT accepted'! Do NOT send institutional scores; simply upload the verifiable e-TRF PDF directly onto Yonsei's online portal in April—0 paper needed even at July CoA stage.", "fa": "دفترچه یونسی صراحتاً اعلام کرده ارسال سازمانی نمره پذیرفته نمی‌شود (Score Reporting NOT accepted)! فقط در ماه آوریل فایل PDF کارنامه e-TRF را مستقیماً در سایت ثبت‌نام آپلود h": "2026.03 iScience (29(5):115416, 心脏术后持续性AKI动态机器学习预警 + 开源合成队列)", "en": "Mar 2026 iScience (29(5):115416, dynamic ML prediction of cardiac surgery persistent AKI + open pAKI repo)", "fa": "مقاله مارس ۲۰۲۶ iScience (پیش‌بینی پویای آسیب کلیوی pAKI پس از جراحی قلب با یادگیری ماشین)"}, "caution": {"zh": "半句实测组内纯数值检验/生理信号子课题是否接收英文沟通外籍生；2月面试确认填报 Medical Sciences (BK21) 还是 BSI 代码。", "en": "Check gently whether structured numerical lab/biosignal subprojects accept English-communicating M.S. students; confirm Medical Sciences BK21 vs BSI code in Zoom.", "fa": "بررسی محترمانه امکان فعالیت به زبان انگلیسی روی داده‌های عددی آزمایشگاهی و سیگنال‌های حیاتی؛ تعیین کد رشته در مصاحبه."}, "subject": "Prospective M.S. Student (Fall 2027) – Clinical Lab Background & Postoperative pAKI Mini-Project", "body": "Dear Professor Dukyong Yoon,\n\nI was deeply inspired by CMI Lab's dynamic prediction study on persistent acute kidney injury after cardiac surgery (iScience, 2026). I am completing my B.S. in Clinical Laboratory Sciences (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), including 816 hours of hospital laboratory rotations (18.94/20) and 20/20 full marks in Biostatistics and Computer Basics.\n\nDrawing on my hospital biochemistry workflow experience, I built a small learning mini-project on GitHub ([Link]) reproducing perioperative creatinine-slope QC, miceforest imputation, and XGBoost/SHAP risk explanation on CMI Lab's open pAKI synthetic cohort and VitalDB.\n\nAre you recruiting full-time international M.S. students (communicating in English on structured laboratory/biosignal datasets) for Fall 2027? If so, I would be grateful for any pointers on SQL or time-series modeling topics I could prepare between March and August before enrollment. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nGitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p4", "rank": "#4", "sendDate": "2027.01.18 (Mon 09:30 KST)", "pi": {"zh": "이윤지 (Yoonji Lee) · 中央大学药学系", "en": "Prof. Yoonji Lee (Chung-Ang Univ. · Pharmacy)", "fa": "پروفسور لی یون‌جی (دانشگاه چونگ‌آنگ · داروسازی)"}, "hook": {"zh": "2026 Briefings in Bioinformatics (bbag421) + 2025 Frontiers in Chemistry 综述表1重点评析的 hERGBoost 定量基准", "en": "2026 Briefings in Bioinformatics (bbag421) & quantitative hERGBoost benchmark highlighted in Table 1 of her 2025 Front. Chem. review", "fa": "مقاله ۲۰۲۶ در Briefings in Bioinformatics و معیار کمی hERGBoost در جدول ۱ مقاله مروری ۲۰۲۵ ایشان"}, "caution": {"zh": "防呆红线：切勿把 hERGBoost 写成李允智教授合著（第3作者是BME系 Yunhyeok Lee）！点到为止表达希望竞争 CAYSS 提名。", "en": "CRITICAL: Never write that Prof. Yoonji Lee co-authored hERGBoost (co-author is Yunhyeok Lee in BME)—phrase it strictly as 'highlighted in your 2025 review'! Gently note interest in CAYSS.", "fa": "هشدار اکید: مدل hERGBoost را اثر خود پروفسور لی ننویسید، بلکه بنویسید «مدل معیار بررسی‌شده در مقاله مروری ۲۰۲۵ شما»! اشاره محترمانه به نامزدی بورسیه CAYSS."}, "subject": "Prospective M.S. Student (Fall 2027, CAYSS) – Scaffold-Split hERG & 3D Docking Mini-Projects", "body": "Dear Professor Yoonji Lee,\n\nI closely read your recent work in Briefings in Bioinformatics (2026) and your comprehensive Frontiers in Chemistry review (2025) evaluating AI cardiotoxicity models and quantitative benchmarks such as hERGBoost. I am completing my B.S. in Clinical Laboratory Sciences (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), with 20/20 full marks in Medical Biochemistry, Biophysics, and Biostatistics.\n\nBuilding on my coursework and a 40-hour hands-on CADD/molecular docking training, I created a learning mini-project on GitHub ([Link]) combining RDKit scaffold-split XGBoost/SHAP quantitative hERG prediction (benchmarked against the R2/RMSE metrics highlighted in Table 1 of your review) with 3D channel docking (PDB 7CN0).\n\nAre you considering full-time M.S. applicants (including potential CAYSS nominees) for Fall 2027? If my profile is a fit, I would be deeply grateful for any structural bioinformatics tools or readings you recommend mastering before September. My 1-page CV and summary are attached.\n\nSincerely,\nArsan [Last Name]\nGitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}], "zoomPlaybook": {"title": {"zh": "图 4B｜2月16日—28日 Zoom 15分钟面试时间轴与逐字实战剧本（会后24h发感谢信文字落定）", "en": "Fig 4B | Feb 16–28 15-Minute Zoom Interview Timeline & Verbatim Scripts (Confirm in 24h Thank-You Email)", "fa": "نمودار ۴-ب | خط زمانی مصاحبه ۱۵ دقیقه‌ای زوم (۱۶ تا ۲۸ فوریه) و متن دقیق دیالوگ‌های کلیدی"}, "stages": [{"time": "00:00 – 00:45", "badge": {"zh": "全员通用开场破冰", "en": "Universal Icebreaker", "fa": "یخ‌شکن آغازین (مشترک همه اساتید)"}, "title": {"zh": "30秒韩语微笑问候 + 100%留韩医药产业长期宣言", "en": "30s Korean Greeting + 100% Stay-in-Korea Biopharma Career Pledge", "fa": "۳۰ ثانیه سلام به زبان کره‌ای + اعلام تعهد ۱۰۰٪ به ماندن در صنعت دارویی کره"}, "script": "“안녕하세요, 교수님! 만나서 반갑습니다. 저는 아르산입니다. 지금 한국어를 열심히 공부하고 있습니다.”\n(Annyeonghaseyo, Gyosunim! Mannaseo bangapseumnida. Jeoneun Arsan-imnida. Jigeum hangugeo-reul yeolsimhi gongbuhago itseumnida.)\n\n→ Switch smoothly to English:\n“Thank you for your time, Professor. My long-term career goal is 100% in South Korea—after completing my M.S., I aim to enter Korea's biopharma AI or CADD R&D sector (via E-7 to F-2-7 visa) rather than going to the US, and remain a dedicated long-term alumnus of your lab.”", "why": {"zh": "瞬间击穿外籍生沟通隔阂，打消韩国教授最担心的“把课题组当去欧美跳板”顾虑。", "en": "Instantly builds warmth and reassures Korean PIs that you won't treat their lab as a mere stepping stone to the US.", "fa": "ایجاد صمیمیت فوری و رفع بزرگ‌ترین نگرانی اساتید کره‌ای درباره دانشجویانی که آزمایشگاه را صرفاً سکوی پرتاب به آمریکا می‌بینند."}}, {"time": "10:00 – 13:30 (Option A: HYU)", "badge": {"zh": "汉阳专属 (#1a / #1b)", "en": "Hanyang Specific (#1a / #1b)", "fa": "اختصاصی دانشگاه هانیانگ (#1a و #1b)"}, "title": {"zh": "确认经费闭环 + 恳请4–5月内部签交《韩语标准免除申请书》", "en": "Confirm Full Tuition/Stipend Loop + Internal Korean Exemption Sign-Off", "fa": "تأیید پوشش شهریه/حقوق + هماهنگی امضای داخلی فرم معافیت زبان کره‌ای"}, "script": "“Professor [Nam/Cho], may I briefly confirm two administrative items from Hanyang's graduate guide? First, alongside competing for HISP and Hanyang's 50% STEM tuition scholarship, does our lab's grant / BK21 package support full-time M.S. students for the remaining tuition balance and living stipend from Semester 1?\nSecond, Hanyang places newly admitted students without TOPIK Level 4 on leave of absence unless the advisor submits the internal <Korean Proficiency Exemption Request Form> (한국어기준 면제 요청서) during the April–May departmental screening. If you decide to accept me, would you be willing to submit that internal exemption so I can start coursework and research right away in September?”", "why": {"zh": "把行政流程说得清晰专业，让教授知道无需学生交表、只需系审时他勾选一下即可。", "en": "Shows you know Hanyang's exact policy so the PI realizes it's just a quick internal departmental checkbox.", "fa": "نشان می‌دهد قوانین دقیق هانیانگ را کاملاً بلدید و استاد متوجه می‌شود فقط کافی است در بررسی داخلی گروه یک گزینه را تأیید کند."}}, {"time": "10:00 – 13:30 (Option B: KU)", "badge": {"zh": "高丽专属 (#2 정원영)", "en": "Korea Univ. Specific (#2 Jung)", "fa": "اختصاصی دانشگاه کره (#2 پروفسور جونگ)"}, "title": {"zh": "温和确认 35% 学费差额 RA 覆盖（绝口不提财政担保签字表！）", "en": "Politely Confirm 35% RA Gap Coverage (ZERO Mention of Sponsor Form!)", "fa": "تأیید محترمانه پوشش ۳۵٪ مابه‌التفاوت از حقوق RA (ممنوعیت مطلق فرم ضمانت مالی!)"}, "script": "“Professor Jung, with my GPA and official IELTS score, I qualify for KU's Type C Natural Science Scholarship (65% tuition waiver) in Semester 1, and I will work toward a 4.0+ GPA at KU to compete for the 100% Type A scholarship from Semester 2. For the remaining 35% tuition gap and basic living expenses, would your lab's RA stipend be able to support full-time M.S. students?”", "why": {"zh": "再次铁律提醒：2,200万韩元冻结存款证明自己去银行开原件寄交，绝不让教授背个人法律担保心理负担！", "en": "Self-provide the ≥22M KRW frozen bank original—never burden the PI with personal financial sponsorship liability!", "fa": "گواهی بانکی ۲۲ میلیون وونی را خودتان تهیه و پست کنید تا هیچ بار حقوقی ضمانت مالی روی دوش استاد نیفتد."}}, {"time": "13:30 – 15:00", "badge": {"zh": "全员通用黄金收尾 + 第7学期休学标准应答", "en": "Golden Closing Ask + Sem 7 Leave Defense", "fa": "جمع‌بندی طلایی پایان مصاحبه + پاسخ آماده درباره مرخصی ترم ۷"}, "title": {"zh": "主动索要 3月—8月 远程前置学习任务清单", "en": "Request 5-Month (Mar–Aug) Pre-Enrollment Reading/Coding Assignment", "fa": "درخواست فهرست مطالعه و تمرین محاسباتی برای ۵ ماه پیش از ورود (مارس–آگوست)"}, "script": "“Finally, Professor, between submitting my application in March and arriving in Seoul in August, I will have five full months of dedicated preparation time. Could you recommend 2 or 3 core papers, software packages, or a small remote dry-lab dataset exercise that you would like me to master first so I can contribute to the team immediately in Semester 1?”\n\n[If asked about Semester 7 Leave of Absence]:\n“I took a formal one-semester medical leave for a brief health recovery, returned completely healthy, and achieved an 18.87/20 (94.36%) GPA across 49 credits in my final three semesters with zero failed courses overall.”", "why": {"zh": "把5个月空窗期变成远程入组试训期；用后3学期94.36%硬核成绩一锤定音化解第7学期休学疑问。", "en": "Turns the 5-month wait into an onboarding runway; neutralizes any Sem 7 leave question with your 94.36% rebound across 49 final credits.", "fa": "تبدیل ۵ ماه انتظار ویزا به دوره آمادگی عملی؛ پاسخ آرام و قاطع به مرخصی ترم ۷ با تکیه بر معدل خیره‌کننده ۹۴.۳۶٪ در ۳ ترم پایانی."}}]}}, "tab5": {"ganttHeader": {"title": {"zh": "图 5A｜2026年11月—2027年9月 双线并行申请与公证有效期全周期交互甘特图", "en": "Fig 5A | Nov 2026 – Sep 2027 Dual-Track Admissions & Legalization Validity Master Gantt Chart", "fa": "نمودار ۵-الف | گانت‌چارت جامع دوخطی اپلای و بازه اعتبار ترجمه رسمی (نوامبر ۲۰۲۶ تا سپتامبر ۲۰۲۷)"}, "subtitle": {"zh": "悬停或点击任意任务行，底部检视面板即时锁定该节点的【核心交付物与执行标准】及【止损备选预案 Contingency】", "en": "Hover or click any task row to lock its Core Deliverables & Stop-Loss Contingency Plan in the inspector panel below", "fa": "نشانگر موس را روی هر ردیف ببرید یا کلیک کنید تا «خروجی‌های دقیق اجرایی» و «برنامه جایگزین توقف ضرر (Plan B)» در پنل پایین نمایش داده شود"}, "callouts": [{"color": "blue", "title": {"zh": "1.12 vs 1.26 汉阳错峰14天", "en": "Jan 12 vs Jan 26: Hanyang 14-Day Stagger", "fa": "۱۲ در برابر ۲۶ ژانویه: فاصله ۱۴ روزه هانیانگ"}, "desc": {"zh": "生命科学系 #1a 남진우 与 #1b 조재원 严格串行发信，正式网申二选一防同系撞车", "en": "Email Life Sci #1a Nam & #1b Cho strictly sequentially; select ONLY ONE on official portal", "fa": "مکاتبه سریالی با دو استاد هانیانگ با ۱۴ روز فاصله؛ انتخاب فقط یک استاد در ثبت‌نام رسمی"}}, {"color": "red", "title": {"zh": "2.07 机考雅思 e-TRF 校准", "en": "Feb 7 Computer IELTS e-TRF Routing", "fa": "۷ فوریه: کالیبراسیون کارنامه e-TRF آیلتس"}, "desc": {"zh": "考后1–5天出电子单：后台免费电子送分 + 发首尔Charlotte激光彩打装袋（免土耳其跨国寄原件）", "en": "PDF ready in 1–5 days: free Portal e-delivery + Charlotte Seoul color print (0 courier from Turkey)", "fa": "صدور کارنامه ۱ تا ۵ روزه: ارسال رایگان از پورتال + چاپ رنگی در سئول توسط شارلوت (بدون پست از ترکیه)"}}, {"color": "orange", "title": {"zh": "首尔Charlotte合包转投 + 3+1分批认证", "en": "Seoul Hub Consolidation + 3+1 Legalization", "fa": "تجمیع بسته در سئول + تأییدات دو مرحله‌ای ۳+۱"}, "desc": {"zh": "1月先拿稳3套认证原件；3月初手签寄首尔合入e-TRF彩打页，高丽代交126B室 / 汉阳走韩国우체국 등기", "en": "Secure 3 legalized sets in Jan; ship signed forms in Mar to Seoul → KU Rm 126B / HYU Korea Post", "fa": "دریافت ۳ سری اصل در ژانویه؛ ارسال فرم امضاشده در مارس به سئول ← تحویل حضوری کره / پست سفارشی هانیانگ"}}], "months": [{"code": "26.11", "w": 8.982, "yr": true, "zh": "26.11", "en": "Nov '26", "fa": "26.11"}, {"code": "26.12", "w": 9.2814, "yr": false, "zh": "12月", "en": "Dec", "fa": "Dec"}, {"code": "27.01", "w": 9.2814, "yr": true, "zh": "27.01", "en": "Jan '27", "fa": "27.01"}, {"code": "27.02", "w": 8.3832, "yr": false, "zh": "02月", "en": "Feb", "fa": "Feb"}, {"code": "27.03", "w": 9   const aliasToId = {};

  function enrichTerms(html) {
    if (!html) return "";
    const parts = html.split(/(<[^>]+>)/g);
    let insideCode = 0;
    return parts.map(part => {
      if (part.startsWith("<")) {
        const lower = part.toLowerCase();
        if (lower.startsWith("<code") || lower.startsWith("<pre")) insideCode++;
        if (lower.startsWith("</code") || lower.startsWith("</pre")) insideCode = Math.max(0, insideCode - 1);

      return part.replace(termRegex, (match) => {

  // ==================== TAB 6: CHECKLIST & BAG PACKER ====================
  function renderTab6() {
    const d = DATA.tab6;
    const total = d.checkItems.length;
    const done = getDoneCount();
    const pct = Math.round((done / total) * 100);

    const phaseBars = d.phases.map(ph => {
      const phItems = d.checkItems.filter(x => x.ph === ph.id);
      const phDone = phItems.filter(x => state.checked[x.id]).length;
      const phPct = Math.round((phDone / phItems.length) * 100);
      return `
        <div class="insp-item">
          <div style="display:flex;justify-content:space-between;font-size:12.2px;font-weight:700;margin-bottom:6px;gap:6px">
            <span>${t(ph.name)}</span>
            <span dir="ltr">${phDone}/${phItems.length}</span>
          </div>
          <div class="bar-track-ltr" style="height:9px">
            <div class="bar-seg-blue" style="width:${phPct}%;background:var(--green)"></div>
          </div>
        </div>
      `;
    }).join("");

    const filteredItems = d.checkItems.filter(it => {
      if (state.checkFilter === "phys") return it.phys;
      if (state.checkFilter === "all") return true;
      return it.actor === state.checkFilter;
    });

    const curBag = d.bagPacker.bags.find(b => b.id === state.selectedBag) || d.bagPacker.bags[0];
    const bagTotal = curBag.items.length;
    const bagDone = curBag.items.filter((_, idx) => state.bagChecked[`${curBag.id}_${idx}`]).length;

    return `
      <div class="section-card">
        <h2 class="sec-title">✅ ${t(d.intro.title)}</h2>
        <p class="sec-sub">${t(d.intro.subtitle)}</p>

        <div style="display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface-2);padding:15px;border-radius:12px;border:1px solid var(--border)">
          <svg width="104" height="104" viewBox="0 0 42 42" style="flex-shrink:0">
            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#E2E8F0" stroke-width="4.5"></circle>
            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#0F9D58" stroke-width="4.5" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="25"></circle>
            <text x="21" y="21" text-anchor="middle" font-size="7.5" font-weight="800" fill="currentColor">${pct}%</text>
            <text x="21" y="27" text-anchor="middle" font-size="3.8" fill="#64748B">${done}/${total}</text>
          </svg>
          <div style="flex:1;min-width:220px" class="inspector-grid">
            ${phaseBars}
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${["all", "arsan", "charlotte", "joint", "phys"].map(f => `
              <button class="ctrl-pill ${state.checkFilter === f ? "active" : ""}" data-cfilter="${f}">${t(UI_STR.actors[f])}</button>
            `).join("")}
          </div>
          <button class="ctrl-pill" id="btn-reset-checks">🔄 ${{zh:"重置勾选",en:"Reset",fa:"بازنشانی"}[state.lang]}</button>
        </div>

        <div>
          ${filteredItems.map(it => {
            const isDone = !!state.checked[it.id];
            return `
              <div class="check-item ${isDone ? "done" : ""}" data-check="${it.id}">
                <div class="check-box-ui">${isDone ? "✓" : ""}</div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px">
                    <span class="tuition-pill" style="font-size:11px">${t(UI_STR.actors[it.actor])}</span>
                    ${it.phys ? `<span class="pill-red" style="font-size:11px">🔴 ${{zh:"实体原件/盖章必办",en:"Physical Original / Stamp",fa:"اقدام حضوری / اصل فیزیکی"}[state.lang]}</span>` : ""}
                  </div>
                  <div class="check-label" style="font-size:13.6px;font-weight:500">${enrichTerms(t(it.text))}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>

      <div class="section-card">
        <h2 class="sec-title">🎒 ${t(d.bagPacker.title)}</h2>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin:12px 0">
          ${d.bagPacker.bags.map(b => `
            <button class="ctrl-pill ${state.selectedBag === b.id ? "active" : ""}" data-bag="${b.id}">${t(b.name)}</button>
          `).join("")}
        </div>

        <div class="inspector-drawer" style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <strong style="font-size:15.5px">${t(curBag.name)}</strong>
              <div style="font-size:12.8px;color:var(--red);font-weight:700;margin-top:3px">⏰ ${t(curBag.deadline)}</div>
            </div>
            <span class="${bagDone === bagTotal ? "pill-green" : "pill-red"}" style="font-size:12.5px">
              ${bagDone === bagTotal
                ? {zh:"🎉 全套齐备，可封口投递！",en:"🎉 100% Ready to Seal!",fa:"🎉 کامل و آماده ارسال!"}[state.lang]
                : `${bagDone} / ${bagTotal} ${{zh:"已核验",en:"Verified",fa:"بررسی‌شده"}[state.lang]}`}
            </span>
          </div>
        </div>

        <div>
          ${curBag.items.map((item, idx) => {
            const key = `${curBag.id}_${idx}`;
            const ok = !!state.bagChecked[key];
            return `
              <div class="check-item ${ok ? "done" : ""}" data-bagcheck="${key}">
                <div class="check-box-ui">${ok ? "✓" : ""}</div>
                <div class="check-label" style="font-size:13.5px">${enrichTerms(t(item))}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  // ==================== TAB 7: TRILINGUAL GLOSSARY ====================
  function renderGlossaryCardsHtml() {
    const q = state.glossQuery.trim().toLowerCase();
    const list = DATA.glossary.filter(item => {
      if (state.glossCat !== "all" && item.cat !== state.glossCat) return false;
      if (!q) return true;
      const blob = [item.term.zh, item.term.en, item.term.fa, item.def.zh, item.def.en, item.def.fa, ...(item.aliases || [])].join(" ").toLowerCase();
      return blob.includes(q);
    });
    return list.map(item => `
      <div class="comp-card" id="gloss-card-${item.id}">
        <div class="comp-head">
          <div style="width:100%">
            <span class="tuition-pill" style="margin-bottom:6px;display:inline-block">${t(UI_STR.cats[item.cat])}</span>
            <div style="font-weight:800;font-size:15px">${t(item.term)}</div>
            ${state.glossTriView ? `
              <div style="font-size:12px;color:var(--text-3);margin-top:5px;display:flex;flex-direction:column;gap:2px">
                <div dir="ltr" style="unicode-bidi:isolate">🇨🇳 ${item.term.zh}&lrm;</div>
                <div dir="ltr" style="unicode-bidi:isolate">🇬🇧 ${item.term.en}&lrm;</div>
                <div dir="rtl" style="unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 ${item.term.fa}&rlm;</div>
              </div>
            ` : ""}
          </div>
        </div>
        <div style="font-size:13.4px;margin-bottom:10px">${t(item.def)}</div>
        ${state.glossTriView && state.lang !== "en" ? `<div style="font-size:12.4px;color:var(--text-3);margin-bottom:8px;unicode-bidi:isolate" dir="ltr">🇬🇧 ${item.def.en}</div>` : ""}
        ${state.glossTriView && state.lang !== "fa" ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:8px;unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif" dir="rtl">🇮🇷 ${item.def.fa}</div>` : ""}
        <div style="background:var(--amber-soft);border-inline-start:3px solid var(--amber);padding:8px 11px;border-radius:7px;font-size:12.5px">
          <strong>💡 ${{zh:"实操要点：",en:"Action Tip: ",fa:"نکته اجرایی: "}[state.lang]}</strong>${t(item.tip)}
        </div>
      </div>
    `).join("");
  }
