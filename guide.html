پستی!"}, "koreaSide": {"zh": "<span class='phys-red'>韩国侧 CAYSS 三步闭环：① **Step 1（2月教授同意提名后立即补发 5 件套）**：官方《`CAYSS Application Form`》+ `CV` + 本科成绩单扫描件（`Transcripts`）+ 现/原指导教授姓名与邮箱 + 研究成果摘要；② **Step 2**：`#4 이윤지` 教授签交《CAYSS 推荐书》至中央大国际处 OIA；③ **Step 3（`Individual Guidance`）**：务必等 OIA 发送个人专属免报名费网申指引邮件后再填 UWAY（切勿盲目按普通自费生缴费锁表！）<\/span>。", "en": "<span class='phys-red'>Korean Side CAYSS 3-Step Loop: (1) **Step 1 (5-Piece Nomination Pack once `#4 Prof. Lee` agrees in Feb)**: ① Official `CAYSS Application Form`, ② `CV`, ③ Undergrad `Transcripts` scan, ④ Former/current advisor names & emails, ⑤ Research achievements summary; (2) **Step 2**: PI submits signed `CAYSS Recommendation Form` to CAU OIA; (3) **Step 3 (`Individual Guidance`)**: WAIT for OIA's individual portal & `100,000 KRW` fee-waiver email before UWAY (never pay early as regular self-funded!)<\/span>.", "fa": "<span class='phys-red'>چرخه ۳ گام CAYSS در کره: ۱) **گام ۱ (ارسال پکیج ۵تایی پس از موافقت `#4 پروفسور لی` در فوریه)**: فرم `CAYSS Application Form` + رزومه + اسکن ریزنمرات + نام و ایمیل اساتید قبلی + خلاصه دستاوردهای پژوهشی؛ ۲) **گام ۲**: تحویل توصیه‌نامه CAYSS توسط استاد به OIA؛ ۳) **گام ۳ (`Individual Guidance`)**: انتظار برای ایمیل راهنمای اختصاصی معافیت ۱۰۰ هزار وون اپلای فی از OIA قبل از ثبت نهایی UWAY!<\/span>"}}], "privacyRule": {"zh": "🔒 **CV 与学术主页推荐人隐私铁律**：公开学术网站（`github.io`）及网页公开下载版 `CV.pdf` **严禁放置任何推荐信文件或母校教授邮箱**（防垃圾邮件骚扰老师）；**仅在私密套磁邮件附件版 / 网申上传版 `CV.pdf` 底部 `References` 栏** 列出 2 位满分课推荐教授的姓名、职称与 `@iau.ac.ir` 官方邮箱（此举同时直接满足中央大 CAYSS Step 1 要求在首轮联系时提供曾任/现任指导老师姓名的规定！）。", "en": "🔒 **Public vs. Private CV Privacy Iron Rule**: Your public portfolio website (`github.io`) and public `CV.pdf` must **NEVER display LORs or professors' email addresses**; list the names, academic titles, and `@iau.ac.ir` institutional emails of 2 `20/20` recommending professors **ONLY at the bottom of your private cold-email attachment / portal `CV.pdf`** (which simultaneously satisfies CAU CAYSS Step 1's requirement to state former/current advisor names during initial contact!).", "fa": "🔒 **قانون محرمانگی اطلاعات اساتید در رزومه و سایت**: در وب‌سایت عمومی (`github.io`) و فایل `CV.pdf` عمومی **مطلقاً فایل توصیه‌نامه یا ایمیل اساتید را قرار ندهید**؛ نام، مرتبه علمی و ایمیل رسمی `@iau.ac.ir` دو استاد دروس ۲۰/۲۰ را **صرفاً در انتهای نسخه خصوصی `CV.pdf` پیوست ایمیل به اساتید و فرم ثبت‌نام** درج کنید (این کار همزمان شرط گام ۱ بورسیه CAYSS چونگ‌آنگ مبنی بر اعلام نام اساتید راهنمای قبلی را نیز برآورده می‌کند!)."}}, "etrfRouting": {"title": {"zh": "图 2D-2｜2月7日土耳其机考雅思 (D15 · e-TRF) 四校精准分流发送图（免除土耳其跨国寄纸质单！）", "en": "Fig 2D-2 | Feb 7 Computer-Delivered IELTS (D15 · e-TRF) 4-University Routing Map (Zero Turkey Courier Needed!)", "fa": "نمودار ۲-د-۲ | نقشه دقیق ارسال کارنامه آیلتس کامپیوتری (D15 · e-TRF) به ۴ دانشگاه (حذف کامل پست فیزیکی از ترکیه!)"}, "warningBanner": {"zh": "核心铁律：1–2月跟教授套磁约面试时，可直接用私人 Email 附件发 e-TRF PDF；但正式网申阶段，4校招生办一律严禁申请人用个人邮箱发成绩单代替交材料！", "en": "Golden Rule: Attaching your e-TRF PDF in private emails to professors (Jan–Feb) is 100% fine; however, during official admissions, ALL 4 admissions offices strictly prohibit emailing scores from personal accounts!", "fa": "قانون طلایی: ارسال فایل PDF کارنامه در ایمیل شخصی به اساتید (ژانویه–فوریه) کاملاً مجاز است؛ اما در مرحله ثبت‌نام رسمی، ارسال ایمیل شخصی کارنامه به دفتر پذیرش هر ۴ دانشگاه اکیداً ممنوع و بی‌اعتبار است!"}, "routes": [{"uni": {"zh": "高丽大学 (KU) & 汉阳大学 (HYU)", "en": "Korea Univ. (KU) & Hanyang (HYU)", "fa": "دانشگاه کره (KU) و هانیانگ (HYU)"}, "tag": {"zh": "后台免费电子送分 + 首尔彩打装袋", "en": "Free Portal e-Delivery + Seoul Color Print", "fa": "ارسال رایگان از پورتال + چاپ رنگی در سئول"}, "color": "#1A73E8", "steps": {"zh": "① 出分当日登录雅思考生后台（Test Taker Portal）免费勾选 Korea University 与 Hanyang University 发送官方电子成绩单（2年内0元免费）；② 将含防伪核验号（TRF Number）的 e-TRF PDF 发给首尔 Charlotte，<span class='phys-red'>由 Charlotte 用激光彩色打印机清晰彩打装入材料袋<\/span>（高丽简章明文认可带真伪确认号的PDF打印件，汉阳生命科学为选交加分项）。", "en": "(1) On results day (Feb 10–12), log into IELTS Test Taker Portal and select Korea University & Hanyang University for free official e-TRF Institutional Delivery; (2) Send the e-TRF PDF to Charlotte in Seoul to <span class='phys-red'>laser-color-print and place inside both packets<\/span> (KU explicitly accepts printed PDFs bearing the TRF verification number).", "fa": "۱) روز اعلام نمره در پورتال آیلتس (Test Taker Portal) به صورت رایگان گزینه ارسال الکترونیکی رسمی به Korea University و Hanyang University را بزنید؛ ۲) فایل PDF دارای کد رهگیری (TRF Number) را برای شارلوت بفرستید تا <span class='phys-red'>در سئول پرینت رنگی لیزری باکیفیت گرفته و داخل پاکت بگذارد<\/span> (مورد تأیید صریح دفترچه دانشگاه کره)."}}, {"uni": {"zh": "延世大学医学院 (YU)", "en": "Yonsei Univ. Medicine (YU)", "fa": "پزشکی دانشگاه یونسی (YU)"}, "tag": {"zh": "纯网申系统上传 PDF（禁机构送分！）", "en": "Portal PDF Upload ONLY (NO e-Delivery!)", "fa": "فقط آپلود PDF در سایت (ارسال سازمانی ممنوع!)"}, "color": "#7C3AED", "steps": {"zh": "延世简章明文规定 Score Reporting is NOT accepted（不接受考试机构送分）！无需在雅思后台勾选延世，只需在4月网申网页直接上传带核验码的 e-TRF PDF，全程0纸质（7月录取办CoA亦免交纸质雅思单）。", "en": "Yonsei's guide states 'Score Reporting is NOT accepted'! Do NOT send institutional scores; simply upload the verifiable e-TRF PDF directly onto Yonsei's online portal in April—0 paper needed even at July CoA stage.", "fa": "دفترچه یونسی صراحتاً اعلام کرده ارسال سازمانی نمره پذیرفته نمی‌شود (Score Reporting NOT accepted)! فقط در ماه آوریل فایل PDF کارنامه e-TRF را مستقیماً در سایت ثبت‌نام آپلود کنید (حتی در جولای هم نیازی به نسخه کاغذی آیلتس نیست)."}}, {"uni": {"zh": "中央大学 (CAU · CAYSS)", "en": "Chung-Ang Univ. (CAU · CAYSS)", "fa": "دانشگاه چونگ‌آنگ (CAU · CAYSS)"}, "tag": {"zh": "后台电子送分 + 3–4月邮件核实彩打件", "en": "Free Portal e-Delivery + Email Check in Mar", "fa": "ارسال از پورتال + استعلام ایمیلی نسخه چاپی"}, "color": "#EA580C", "steps": {"zh": "出分后先在雅思后台免费向 Chung-Ang University 电子送分；3–4月发邮件至 `gsadmin@cau.ac.kr` 一并书面确认两件事：①“机考官方仅签发带核验码e-TRF，已完成后台官方电子送分并随包提交首尔e-TRF彩打件是否认可？”②“父母有效护照彩印件能否替代第9项父母本国身份证复印件？”获认可在首尔直接彩打；<span class='phys-red'>仅当坚持要考点印制件时，再联系土耳其考点补寄1份硬拷贝至首尔 Charlotte 处<\/span>。", "en": "Send free Portal e-TRF to Chung-Ang University first; in Mar–Apr email `gsadmin@cau.ac.kr` to confirm both (1) Seoul color-printed e-TRF + Portal e-delivery, and (2) using parents' passport color copies for Item #9 parent IDs. <span class='phys-red'>Only if they strictly demand a test-center paper print, order 1 hard copy from Turkey to Charlotte's Seoul address<\/span>.", "fa": "ابتدا از پورتال آیلتس ارسال الکترونیکی رایگان به Chung-Ang University را انجام دهید؛ در مارس–آوریل به `gsadmin@cau.ac.kr` ایمیل بزنید و هم پذیرش چاپ رنگی e-TRF و هم جایگزینی کپی رنگی پاسپورت والدین به‌جای کارت ملی (بند ۹) را تأیید بگیرید. <span class='phys-red'>فقط در صورت الزام کتبی مرکز آزمون، ۱ نسخه کاغذی از ترکیه به آدرس سئول سفارش دهید<\/span>."}}]}, "portalPrefillCard": {"title": {"zh": "图 2E｜《2月底提前备齐！四校往届网申原表“预填字段 & 隐藏雷区”速查表（助 3 月首日 10 分钟秒出表！）》", "en": "Fig 2E | Prep by Late Feb! 4-University Past Portal Forms 'Pre-Fill Fields & Hidden Traps' Cheat Sheet (10-Min Day-1 Checkout!)", "fa": "کارت ویژه ۲-هـ | «آماده‌سازی تا اواخر فوریه! جدول فیلدهای پیش‌پرکردنی و تله‌های پنهان فرم ثبت‌نام ۴ دانشگاه (صدور فرم در ۱۰ دقیقه روز اول!)»"}, "subtitle": {"zh": "网申开启当日（`03.02 / 03.03 10:00 KST`）每一分钟都关乎跨国快件时效！请在 2 月底前按往届网申原表提前备齐以下必填项，避开选错通道、离线废表与锁死雷区：", "en": "Every hour on portal opening day (`03.02 / 03.03 10:00 KST`) counts for international shipping! Prepare these exact past-form fields by late Feb to avoid track traps, invalid offline templates, and portal lockouts:", "fa": "در روز باز شدن سایت (`۲ و ۳ مارس ساعت ۱۰:۰۰ کره`) هر ساعت برای پست بین‌المللی حیاتی است! این فیلدها و نکات فرم‌های سال قبل را تا اواخر فوریه آماده کنید:"}, "schools": [{"uni": {"zh": "① 高丽大学 (KU · UWAY系统)", "en": "① Korea Univ. (KU · UWAY Portal)", "fa": "۱. دانشگاه کره (KU · سامانه UWAY)"}, "pill": {"zh": "必选 보건과학대학(禁选医学院!) · 必勾②奖学金 · 名片框推荐表", "en": "Pick Health Sci (NEVER Med!) · Check ② Scholarship · Business Card LOR", "fa": "انتخاب 보건과학대학 (ممنوعیت پزشکی!) · تیک ② بورسیه · توصیه‌نامه"}, "color": "#0F9D58", "bullets": {"zh": ["🚨 **双重选错即废雷区（通道 + 同名院系！）**：① 本人与父母皆非韩籍**必选第 1 类纯外国人**（误选第2类触发中小学12年认证！）；② <span class='phys-red'>**院系下拉框唯一正确选项：`College of Health Science (보건과학대학)` → `Department of Integrated Biomedical and Life Sciences (의생명융합과학과)` → Major: `Biomedical Science (바이오의과학)`**（`#2 정원영` 教授归属系，可参评 C 类 65% 并冲刺 **A 类 Global Leader 100% 全奖**）；**绝对禁止误选 `College of Medicine (의과대학)` 下的 `Department of Biomedical Sciences (의과학과)`（医学院外籍生仅限评C类/B-C类，彻底封死A类100%全奖资格！）**<\/span> ③ UWAY 界面 **`② Type of Scholarship` 必须手动勾选申请外国人奖学金**（漏勾不予参评）！", "📋 **必填项提前备齐**：① **2个不同域名的本人有效邮箱**（如 Gmail + Outlook）；② `Release of Information Form` 手动填：**注册总学期数 `10`** + **IAU Ardabil 学籍办完整英文地址、电话（`+98-45-33727799`）、部门名及官方邮箱**（勾选 `■ I agree` 并湿墨手签，交复印件直接拒收！）；③ 学位（预）毕业公证件纸面必写明精确年月日（`학위수여(예정)일 명시 필수`）。", "✉️ **高丽官方推荐表隐藏项与标签页**：推荐表含认识时长 `(__) Years (__) Months`、**勾选 `☑ I agree`**、粘贴**教授名片或工作证框（`Copy of Business Card`）**，且**每一页均须教授亲笔手写全名并签名**，由 `@iau.ac.ir` 直发 `grad_recommendation@korea.ac.kr`。网申导出第4页 `Receipt` 自留不交，第5页 `Document Submission Label` 贴信封正面！"], "en": ["🚨 **Dual Fatal Selection Traps (Track + Identical-Sounding Dept!)**: (1) **MUST pick Track 1 (Pure Foreigner)** (Track 2 triggers 12-yr K-12 transcripts!); (2) <span class='phys-red'>**ONLY Correct Dept: `College of Health Science (보건과학대학)` → `Dept. of Integrated Biomedical and Life Sciences (의생명융합과학과)` → Major: `Biomedical Science (바이오의과학)`** (`#2 Prof. Jung`, eligible for Type C 65% & **Type A 100% full waiver**); **NEVER pick `College of Medicine (의과대학)` → `Dept. of Biomedical Sciences (의과학과)` (Medicine restricts intl students to Type C/B-C ONLY, permanently blocking Type A 100% full scholarship!)**<\/span> (3) Manually check **`② Type of Scholarship`** on UWAY!", "📋 **Pre-Fill Fields**: (1) **2 valid personal emails on DIFFERENT domains**; (2) `Release of Information Form`: manually enter **total enrolled semesters = `10`** + **IAU Ardabil Registrar's full English address, phone (`+98-45-3372779 alance Original (`≥22M KRW`)**<\/span> for `CoA` (April's scanned cert cannot be reused).", "fa": "<span class='phys-red'>ارائه **اصل گواهی تمکن بانکی جدید زیر ۳۰ روز (`≥22M KRW`)**<\/span> برای صدور `CoA`."}}, {"stage": {"zh": "④ 中央大学 (CAU)\n毕业证后补 + 津贴核减存款", "en": "④ Chung-Ang Univ. (CAU)\nDiploma + Reduced Bank", "fa": "۴) دانشگاه چونگ‌آنگ (CAU)\nدانشنامه + تمکن کسرشده"}, "scope": {"zh": "• 简章死线：**开学前**\n• <span class='phys-red'>办 `CoA` 实操死线：**`2027.07.20 前`**<\/span>", "en": "• Guide Cutoff: **Before Semester Start**\n• <span class='phys-red'>`CoA` Practical Cutoff: **By `Jul 20, 2027`**<\/span>", "fa": "• مهلت دفترچه: **پیش از شروع ترم**\n• <span class='phys-red'>مهلت عملی `CoA`: **تا `۲۰ جولای ۲۰۲۷`**<\/span>"}, "docs": {"zh": "若5月启用了预毕业过渡，须补交 <span class='phys-red'>**韩国使馆领事认证《正式毕业证 (`دانشنامه`) 原件》**<\/span>（Plan A 已交正式毕业证认证件者免补）。", "en": "If provisional graduation was used in May, submit <span class='phys-red'>**Korean-Embassy legalized Permanent Diploma (`دانشنامه`) original**<\/span> (exempt if already submitted in May).", "fa": "در صورت استفاده از گواهی پیش‌ازفراغت در مه، تحویل <span class='phys-red'>**اصل دانشنامه رسمی (`دانشنامه`) ممهور به سفارت کره**<\/span> الزامی است."}, "redline": {"zh": "首次提交按最新基准核减后的 <span class='phys-red'>**`≤30天` 新存款原件（`16,000,000 KRW` 减去导师承诺年津贴总额）**<\/span> 申领 `CoA`（`09.01` 开学日起法务部停发 `CoA`！）。", "en": "Submit <span class='phys-red'>**fresh (`≤30-day`) Bank Balance Original calculated at (`16,000,000 KRW` minus annual PI stipend)**<\/span> before `07.20` (`CoA` issuance stops `09.01`!).", "fa": "تحویل <span class='phys-red'>**اصل گواهی بانکی جدید زیر ۳۰ روز بر مبنای (`۱۶ میلیون وون` منهای حقوق سالانه استاد)**<\/span> تا پیش از `۲۰ جولای`!"}}]}, "ultimateDetailsCard": {"title": {"zh": "图 2H｜《五大终极防漏细节专卡：份数留存 · 禁译 Transfer · 拼写防废票 · 中央第9项 · 首尔借宿 ARC 三件套》", "en": "Fig 2H | 5 Ultimate Anti-Omission Details: 4-Set Split · 'Guest Course' Rule · Bank/Spelling Lock · CAU Item #9 · Seoul Hosted ARC Trio", "fa": "کارت ویژه ۲-ح | «۵ نکته طلایی ضدنقص نهایی: تقسیم ۴ سری مدرک · ممنوعیت واژه Transfer · قفل اسپل و بانک · بند ۹ چونگ‌آنگ · مدارک اقامت منزل شارلوت (ARC)»"}, "subtitle": {"zh": "针对跨国寄件不可退还、波斯语成绩单特殊词条与入境后不住校直住首尔 Charlotte 家中的实况，最后锁死以下 5 条防返工铁律：", "en": "Lock down these final 5 operational safeguards tailored to non-returnable university packets, Persian transcript terminology, and living off-campus at Charlotte's home in Seoul:", "fa": "در نهایت، با توجه به عدم استرداد مدارک توسط دانشگاه‌ها، اصطلاحات خاص ریزنمرات فارسی و اقامت در منزل شارلوت در سئول (بدون خوابگاه)، این ۵ قانون طلایی را رعایت کنید:"}, "items": [{"badge": {"zh": "① 份数与留存地修正（2寄首尔 + 2留伊朗 · 羊皮纸母本禁寄！）", "en": "① Batch-1 4-Set Split (2 to Seoul + 2 Kept in Iran · Never Mail Parchment!)", "fa": "۱) اصلاح تعداد و محل نگهداری (۲ سری سئول + ۲ سری ایران · ممنوعیت پست اصل پوستی!)"}, "color": "#D93025", "bg": "var(--red-soft)", "body": {"zh": "`2027.01.10 – 02.04` 第 1 批领事认证建议同批加印 1 套副本**共办 `4 套`**：<span class='phys-red'>**仅将 `2 套` 寄往首尔（供 `KU` + `HYU`，韩国高校收件后一律概不退还！），其余 `2 套` 稳稳留在伊朗 Arsan 本人手中**<\/span>——① 4月直接在伊朗扫 `600 DPI PDF` 传给延世网申（若6月定校延世再寄1套换 `CoA`）；② **7月亲赴德黑兰韩国大使馆办 `D-2` 留学签证时当场核验手上留存的领事认证原件，彻底免除从首尔反向寄回伊朗的丢件与延误风险**！🚨 **且全伊朗仅发一张的唯一羊皮纸学位证母本（`اصل دانشنامه`）绝对严禁寄出，留本人 8 月随身携往韩国！**", "en": "During `2027.01.10 – 02.04` Batch 1, print 1 extra duplicate to legalize **`4 sets` in total**: <span class='phys-red'>**Ship ONLY `2 sets` to Seoul (for `KU` + `HYU`, which NEVER return submitted documents!), and keep the remaining `2 sets` safely in Iran with Arsan**<\/span>—(1) scan `600 DPI PDF` in Apr for `YU`, and (2) **present the original in person at the Korean Embassy in Tehran in July for `D-2` visa verification, eliminating risky reverse shipping from Seoul to Iran**! 🚨 **NEVER mail your sole parchment diploma original (`اصل دانشنامه`)—hand-carry it to Korea in August!**", "fa": "در سری اول (`۱۰ ژانویه تا ۴ فوریه`)، با چاپ ۱ نسخه اضافه مجموعاً **`۴ سری` تأیید کنسولی** بگیرید: <span class='phys-red'>**فقط `۲ سری` را به سئول بفرستید (برای دانشگاه  · 汉阳生命科学 BIG Lab", "en": "Prof. Jin-Wu Nam (HYU Life Science · BIG Lab)", "fa": "پروفسور نام جین‌وو (هانیانگ · آزمایشگاه BIG Lab)"}, "hook": {"zh": "牧岩所 AI 虚拟实验室自动化 mRNA 课题 + 2025.12 Mol. Ther. Nucleic Acids (shRNAI 3层1D-CNN)", "en": "Mogam AI Virtual Lab mRNA Design + 2025.12 Mol. Ther. Nucleic Acids (shRNAI 3-layer 1D-CNN)", "fa": "پروژه طراحی خودکار mRNA مؤسسه موگام + مقاله دسامبر ۲۰۲۵ مدل shRNAI"}, "caution": {"zh": "汉阳同系严禁同时群发！01.06 仅发 #1a 남진우；主动呼应 BIG Lab 官网 3–6 个月前置实习建议，提议 3–8 月远程干实验预实习。", "en": "Never email two PIs in the same HYU department simultaneously! Send #1a only on Jan 6, and echo BIG Lab's 3–6 mo pre-internship advice by proposing Mar–Aug remote dry-lab prep.", "fa": "از ارسال همزمان به دو استاد یک گروه در هانیانگ خودداری کنید! در ۶ ژانویه فقط به #1a ایمیل بزنید و پیشنهاد پیش‌کارآموزی محاسباتی ریموت (مارس–آگوست) را مطرح کنید."}, "subject": "Prospective M.S. Student (Fall 2027) – Course-Based mRNA 5'-UTR & Epitope Mini-Projects", "body": "Dear Professor Jin-Wu Nam,\n\nI closely followed BIG Lab's shRNAI framework (Mol. Ther. Nucleic Acids, 2025) and your AI-driven virtual lab initiative for automated mRNA design. I am completing my B.S. in Clinical Laboratory Sciences at the Faculty of Medicine (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), with 20/20 full marks in Biophysics, Molecular Techniques, Medical Genetics, and Biostatistics.\n\nBuilding on these undergraduate courses alongside my completed 40+ hour Computational Vaccine Design & Immunoinformatics training and Python for Bioinformatics (11 Modules) coursework, I built two small learning mini-projects on GitHub ([Link]): (1) a multi-epitope vaccine sequence design and Molegro Virtual Docker (MVD) 3D receptor-docking pipeline, and (2) an mRNA 5'-UTR thermodynamic folding (ViennaRNA) and 3-layer 1D-CNN/XGBoost ribosome-loading exploration (GSE114002 20k 50-nt subset) inspired by shRNAI.\n\nAre you considering full-time M.S. applicants for Fall 2027? Noting BIG Lab's recommendation for pre-enrollment training, if my background is a potential fit, I would be deeply grateful if you could point me toward any foundational papers, codebases, or remote dry-lab pre-study topics I could work on before September. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p1b", "rank": "#1b", "sendDate": {"zh": "2027.01.20 · 满14天闸门条件发信", "en": "Jan 20, 2027 · 14-Day Conditional Switch", "fa": "۲۰ ژانویه ۲۰۲۷ · ارسال شرطی پس از ۱۴ روز"}, "pi": {"zh": "조재원 (Jae-Won Cho) · 汉阳生命科学单细胞组", "en": "Prof. Jae-Won Cho (HYU Life Science · Single-Cell)", "fa": "پروفسور چو جه‌وون (هانیانگ · آزمایشگاه تک‌سلولی)"}, "hook": {"zh": "2026.05 独立作者 Scientific Reports (16:23797, BRiCE 基因表达+细胞丰度双重扰动响应) + 2024 JITC (CD161+ TRM)", "en": "Solo-author May 2026 Scientific Reports (16:23797, BRiCE expression + abundance perturbation) & 2024 JITC (CD161+ TRM)", "fa": "مقاله تک‌نویسنده مه ۲۰۲۶ در Scientific Reports (معیار BRiCE) و مقاله ۲۰۲۴ سلول‌های CD161+ TRM"}, "caution": {"zh": "仅当 #1a 남진우 回复无名额或至 01.20 满14天未回时发出（若 #1a 已积极回复邀面则永久冻结不发，防汉阳同系撞车）！", "en": "Send ONLY if #1a Prof. Nam is full or silent after 14 days on Jan 20 (keep permanently frozen if #1a responded positively, avoiding same-department collision)!", "fa": "فقط در صورت عدم پذیرش یا سکوت ۱۴ روزه استاد اول در ۲۰ ژانویه ارسال شود (در صورت پاسخ مثبت استاد اول، ارسال به استاد دوم کاملاً متوقف شود)!"}, "subject": "Prospective M.S. Student (Fall 2027) – Course-Based scTCR & BRiCE Abundance Mini-Projects", "body": "Dear Professor Jae-Won Cho,\n\nI read with great interest your solo-authored BRiCE benchmark (Scientific Reports, 2026) demonstrating why perturbation analysis must jointly capture gene expression and cell abundance shifts, alongside your JITC study on CD161+ tissue-resident memory T cells. I am completing my B.S. in Clinical Laboratory Sciences at the Faculty of Medicine (CGPA 17.50/20 = 87.5%, Rank 4/32; final 3-semester GPA 18.87/20 = 94.36%), with 20/20 full marks in Medical Immunology Lab, Molecular Techniques, and Biostatistics.\n\nBuilding on these courses alongside my completed 40+ hour Computational Vaccine Design & Immunoinformatics training and Python for Bioinformatics (11 Modules) coursework, I built two small learning mini-projects on GitHub ([Link]): (1) tumor neoantigen screening (NetMHCpan-4.1) and Molegro Virtual Docker (MVD) 3D HLA docking, and (2) paired scRNA/scTCR exploration of KLRB1+ TRM clonal expansion and tumor/control log2FC cell-subtype abundance shifts (wu2020_3k) inspired by BRiCE.\n\nAre you recruiting full-time M.S. students for Fall 2027? If my profile is a potential fit, I would be deeply grateful if you could recommend key single-cell perturbation papers or Scanpy/PyTorch workflows I could study remotely between March and August before enrollment. My 1-page CV and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}, {"id": "p2", "rank": "#2", "sendDate": {"zh": "2027.01.06 · 09:30 KST", "en": "Jan 6, 2027 · 09:30 KST", "fa": "۶ ژانویه ۲۰۲۷ · ساعت ۹:۳۰ کره"}, "pi": {"zh": "정원영 (Wonyeong Jung) · 高丽医生命融合科学", "en": "Prof. Wonyeong Jung (Korea Univ. · Systems Immunology)", "fa": "پروفسور جونگ وون‌یونگ (دانشگاه کره · ایمونولوژی سیستم‌ها)"}, "hook": {"zh": "2026.03 iScience (115520, 母乳抗体Fc追踪HIV传播公开数据 DVN/ZYHQRL) + 2026儿童金葡菌抗体保护力研究", "en": "Mar 2026 iScience (115520, open Dataverse DVN/ZYHQRL HIV Fc dataset) & 2026 pediatric S. aureus protection study", "fa": "مقاله مارس ۲۰۲۶ iScience (دیتاست باز آنتی‌بادی Fc در Harvard Dataverse) و پژوهش استافیلوکوک طلایی"}, "caution": {"zh": "首封信与面试均绝口不提教授财政支援签字表（自己开2,200万银行存款原件）；面试仅温和确认RA覆盖C类65%校奖外的35%差额。", "en": "NEVER mention any professor financial sponsorship form in emails or Zoom! Politely confirm in Feb Zoom whether RA covers the 35% ics you recommend mastering before September. My 1-page CV (including my two undergraduate faculty recommenders at IAU Ardabil) and project summary are attached.\n\nSincerely,\nArsan [Last Name]\nAcademic Portfolio & GitHub: [URL] | IELTS Academic (CBT): Scheduled Feb 7, 2027 (Official TRF by Feb 12)"}], "zoomPlaybook": {"title": {"zh": "图 4C｜2月16日—28日 Zoom 15分钟面试时间轴与逐字实战剧本（会后24h发感谢信文字落定）", "en": "Fig 4C | Feb 16–28 15-Minute Zoom Interview Timeline & Verbatim Scripts (Confirm in 24h Thank-You Email)", "fa": "نمودار ۴-ج | خط زمانی مصاحبه ۱۵ دقیقه‌ای زوم (۱۶ تا ۲۸ فوریه) و متن دقیق دیالوگ‌های کلیدی"}, "stages": [{"time": "00:00 – 00:45", "badge": {"zh": "全员通用开场破冰", "en": "Universal Icebreaker", "fa": "یخ‌شکن آغازین (مشترک همه اساتید)"}, "title": {"zh": "30秒韩语微笑问候 + 100%留韩医药产业长期宣言", "en": "30s Korean Greeting + 100% Stay-in-Korea Biopharma Career Pledge", "fa": "۳۰ ثانیه سلام به زبان کره‌ای + اعلام تعهد ۱۰۰٪ به ماندن در صنعت دارویی کره"}, "script": "“안녕하세요, 교수님! 만나서 반갑습니다. 저는 아르산입니다. 지금 한국어를 열심히 공부하고 있습니다.”\n(Annyeonghaseyo, Gyosunim! Mannaseo bangapseumnida. Jeoneun Arsan-imnida. Jigeum hangugeo-reul yeolsimhi gongbuhago itseumnida.)\n\n→ Switch smoothly to English:\n“Thank you for your time, Professor. My long-term career goal is 100% in South Korea—after completing my M.S., I aim to enter Korea's biopharma AI or computational drug discovery R&D sector (via E-7 to F-2-7 visa) rather than going to the US, and remain a dedicated long-term alumnus of your lab.”", "why": {"zh": "瞬间击穿外籍生沟通隔阂，打消韩国教授最担心的“把课题组当去欧美跳板”顾虑。", "en": "Instantly builds warmth and reassures Korean PIs that you won't treat their lab as a mere stepping stone to the US.", "fa": "ایجاد صمیمیت فوری و رفع بزرگ‌ترین نگرانی اساتید کره‌ای درباره دانشجویانی که آزمایشگاه را صرفاً سکوی پرتاب به آمریکا می‌بینند."}}, {"time": "10:00 – 13:30 (Option A: HYU)", "badge": {"zh": "汉阳专属 (#1a / #1b)", "en": "Hanyang Specific (#1a / #1b)", "fa": "اختصاصی دانشگاه هانیانگ (#1a و #1b)"}, "title": {"zh": "确认经费闭环 + 恳请4–5月内部签交 وامبر (روز ۱–۶؛ اتصال ۳۰ نوامبر): تکمیل پروژه پایه واکسن M0 و داکینگ MVD در Colab شخصی آرسان، چاپ نسخه پکیج‌ها و ارسال مستقیم به گیت‌هاب"}}, {"id": "c06", "ph": "ph1", "actor": "joint", "phys": false, "text": {"zh": "11.30–12.17 依次完成 M1（11.30–12.07 汉阳#1a mRNA-UTR-ThermoCNN）、M2（12.07–12.12 高丽#2 SysSero-Fc-Engine 60行母版）与 M3（12.13–12.17 延世#3 SNUH VitalDB 主验证集 + Day 21 CV校准）", "en": "Nov 30–Dec 17 finish M1 (Nov 30–Dec 7 HYU #1a ThermoCNN), M2 (Dec 7–12 KU #2 60-line engine), and M3 (Dec 13–17 YU #3 SNUH VitalDB + Day 21 CV calibration)", "fa": "۳۰ نوامبر تا ۱۷ دسامبر: تکمیل پروژه‌های M1 (هانیانگ #1a)، M2 (کره #2 موتور ۶۰ خطی) و M3 (یونسی #3 کوهورت VitalDB + کالیبره رزومه)"}}, {"id": "c07", "ph": "ph1", "actor": "joint", "phys": false, "text": {"zh": "12.18–12.31 完成 M4（12.18–23 中央#4 定量QSAR+MVD）与 M5（12.24–31）；12.28 组对称 `3×2` 六宫格并导出2页作品集摘要，12.30 上线全公开个人学术主页（6库6图+6个 `?focus=` 静默参数，严禁出现母校推荐教授姓名/邮箱），12.31 六图盲抽英文答辩封箱！", "en": "Dec 18–31 finish M4 (Dec 18–23 CAU #4) & M5 (Dec 24–31); Dec 28 build symmetric `3×2` grid & 2p summary, Dec 30 launch all-public site (6 repos/figs + 6 `?focus=` params; zero prof names/emails on web), Dec 31 6-fig blind defense freeze!", "fa": "۱۸–۳۱ دسامبر: تکمیل M4 و M5؛ ۲۸ دسامبر چیدمان متقارن `3×2` و خلاصه ۲ صفحه‌ای، ۳۰ دسامبر انتشار عمومی سایت (۶ مخزن و تصویر + ۶ پارامتر `?focus=`؛ بدون نام/ایمیل اساتید معرف)، ۳۱ دسامبر دفاع انگلیسی و پلمپ!"}}, {"id": "c03", "ph": "ph2", "actor": "joint", "phys": true, "text": {"zh": "【一套通杀4校】锁定 2027.01.10–02.04 办理 D10-B & D10-A：Charlotte 录好 scholaro.com 全10学期逐科报告发 PDF → Arsan 打印 3 份请 IAU Ardabil 教务处直接加盖官方英文鲜章（HYU/CAU明文免领事章！）+ 同步开具认证版 D10-A 排名/87.50%证明", "en": "[One-Combo for All 4] Lock into Jan 10–Feb 4, 2027: Charlotte generates full 10-sem course-by-course scholaro.com PDF → Arsan prints 3 copies & wet-stamps in English at IAU Ardabil (exempt from Embassy at HYU & CAU!) + issues legalized D10-A Rank/87.50% cert", "fa": "«یک حرکت برای هر ۴ دانشگاه» در بازه ۱۰ ژانویه تا ۴ فوریه ۲۰۲۷: تولید PDF درس‌به‌درس ۱۰ ترم scholaro.com توسط شارلوت ← چاپ ۳ نسخه و اخذ مهر زنده انگلیسی آموزش اردبیل (معاف از سفارت در هانیانگ و چونگ‌آنگ!) + صدور گواهی D10-A"}}, {"id": "c04", "ph": "ph2", "actor": "arsan", "phys": true, "text": {"zh": "2027.01 申领 estelam.iau.ir 二维码单赴 Hesarak 盖医科章；【伊朗本土 Plan B 兜底】万一2–3月未印出毕业证，用分校盖章波斯语成绩单+《137.5学分修满说明信》（必写明精确预计毕业年月日 `학위수여(예정)일 명시`！）在伊朗本土办宣誓公证（严禁土耳其公证！高丽倒推5月底拿稳毕业证与使馆章；汉阳1月底邮件OIA报备）", "en": "Jan 2027 generate estelam.iau.ir QR & Hesarak Med stamp; [Iran-Only Plan B] if diploma delayed, notarize branch-stamped Persian transcript + 137.5-cr letter (stating exact Expected Graduation YYYY-MM-DD per KU Item ④!) strictly inside Iran (ZERO Turkey notary!)", "fa": "ژانویه ۲۰۲۷ اخذ کد estelam و مهر حصارک؛ «پلن B داخل ایران» در صورت تأخیر دانشنامه، ترجمه رسمی ریزنمرات و نامه اتمام ۱۳۷.۵ واحد (با ذکر تاریخ دقیق فراغت از تحصیل!) فقط در ایران (ممنوعیت ترجمه ترکیه!)"}}, {"id": "c08", "ph": "ph2", "actor": "arsan", "phys": true, "text": {"zh": "01.10–02.04 钉附《全家护照首页拼写锁定卡》，书面要求持牌翻译社将专业译为 `Clinical Laboratory Sciences`、第9学期 `مهمان` 译为 `Guest Course`（严禁误译 `Transfer`！），一条龙办妥水印纸铅封+双认证（D13身份簿共4套到此完结）+ 新拍1–2月白底 `3×4 cm ≤2MB` 证件照 JPG + 彩扫全家3张 `کارت ملی`", "en": "Jan 10–Feb 4 staple Family Passport Spelling Card, instruct translator in writing: major = `Clinical Laboratory Sciences` & Sem 9 `مهمان` = `Guest Course` (NEVER `Transfer`!), finish MOJ/MFA dual-auth (4 sets of D13 stop here) + shoot fresh `3×4 cm ≤2MB` photo + scan 3 `کارت ملی` cards", "fa": "۱۰ ژانویه تا ۴ فوریه منگنه کردن کپی پاسپورت خانواده، دستور کتبی به دارالترجمه برای عنوان `Clinical Laboratory Sciences` و ترجمه «`مهمان`» به `Guest Course` (ممنوعیت `Transfer`!)، تکمیل ۴ سری شناسنامه + عکس جدید ۳×۴ و اسکن ۳ کارت ملی"}}, {"id": "c09", "ph": "ph2", "actor": "arsan", "phys": true, "text": {"zh": "【4套黄金分配·免反向寄回】周日–周四携本人护照原件(≥2年有效)+复印件及2013后崭新 `$4 USD` 美钞赴 Vanak 韩国使馆同批共办 **4 套** 🅰️级学历认证原件——仅寄 **2 套** 去首尔（供 KU+HYU，收件不退），留 **2 套** 在伊朗手中（供4月延世扫描与7月德黑兰办D-2核验），且唯一羊皮纸学位证母本（`اصل دانشنامه`）绝对严禁寄出！", "en": "[4-Set Split · Zero Reverse Mail] Sun–Thu bring passport + crisp `$4 USD` bills to Korean Embassy Vanak to issue **4 sets** of Tier 🅰️ legalized originals—ship ONLY **2 sets** to Seoul (KU+HYU, non-returnable) and keep **2 sets** in Iran (Apr YU scan + Jul Tehran D-2 visa); NEVER mail sole parchment `اصل دانشنامه`!", "fa": "«تقسیم طلایی ۴ سری» مراجعه به سفارت کره در ونک با اسکناس ۴ دلاری نو و صدور **۴ سری** اصل کنسولی — ارسال فقط **۲ سری** به سئول (KU+HYU) و نگهداری **۲ سری** در ایران (اسکن یونسی + ویزای D-2 تهران)؛ ممنوعیت مطلق پست تک‌نسخه پوستی `اصل دانشنامه`!"}}, {"id": "c10", "ph": "ph2", "actor": "joint", "phys": false, "text": {"zh": "2027.01.06 · 09:30 KST 发出第1波早鸟套磁信：汉阳第1棒 #1a 남진우（主推 M0+M1）+ 高丽 #2 정원영（主推 M0+M2）", "en": "Jan 6, 2027 · 09:30 KST send Wave 1 early-bird cold emails: HYU #1a Prof. Nam (pitching M0+M1) + KU #2 Prof. Jung (pitching M0+M2)", "fa": "۶ ژانویه ۲۰۲۷ ساعت ۹:۳۰ کره: ارسال موج اول ایمیل به #1a پروفسور نام (ارائه M0+M1) و #2 پروفسور جونگ (ارائه M0+M2)"}}, {"id": "c11", "ph": "ph2", "actor": "joint", "phys": false, "text": {"zh": "01.12（+6天）发延世 #3 윤덕용（16学分/816h诊断实验室实训+SNUH VitalDB）与中央 #4 이윤지（私密CV底部列2位推荐教授契合CAYSS Step 1）；01.20（满14天防撞车闸门）视 #1a 回复情况按需切换联系汉阳同系备选 #1b 조재원", "en": "Jan 12 (+6d) email YU #3 Yoon (816h diagnostic lab practicum + SNUH VitalDB) & CAU #4 Lee (private CV lists 2 IAU recommenders for CAYSS Step 1); Jan 20 (+14d anti-collision gate) conditionally contact HYU backup #1b Cho if #1a is full/silent", "fa": "۱۲ ژانویه ارسال به #3 یونسی و #4 چونگ‌آنگ (همراه درج نام ۲ استاد معرف در رزومه خصوصی جهت گام ۱ CAYSS)؛ ۲۰ ژانویه (دروازه ۱۴ روزه ضدتداخل) ارسال شرطی به گزینه دوم هانیانگ #1b پروفسور چو در صورت عدم پاسخ #1a"}}, {"id": "c12", "ph": "ph3", "actor": "arsan", "phys": true, "text": {"zh": "02.07 赴土耳其参加机考 IELTS Academic（2年有效）；【第1拨直飞快件】次日（02.08）直接在土耳其门店发官方 DHL Express / FedEx，将 01.10–02.04 在伊朗本土办妥的不绑考号原件（D13身份簿双认证、3份鲜章Scholaro及已出认证/伊朗公证过渡件）2–3工作日稳锁首尔 Charlotte！", "en": "Feb 7 sit CBT IELTS in Turkey (valid 2y); [Wave 1 Express] next day (Feb 8) ship all Iran-issued heavy originals (D13 Shenasnamehs, 3× wet Scholaro, ready certs) via official Turkey DHL Express / FedEx to Seoul in 2–3 workdays!", "fa": "۷ فوریه شرکت در آیلتس ترکیه (معتبر تا ۲ سال)؛ «مرسوله اول» فردای آن (۸ فوریه) ارسال مستقیم اصل مدارک تأییدشده ایران (شناسنامه‌ها، ۳ برگ Scholaro و مدارک کنسولی) با DHL Express رسمی از ترکیه به سئول (۲–۳ روزه)!"}}, {"id": "c13", "ph": "ph3", "actor": "arsan", "phys": false, "text": {"zh": "02.10–02.12 在雅思考生后台（Test Taker Portal）免费向高丽、汉阳、中央3校发送官方电子成绩单（延世切勿勾选送分！）", "en": "Feb 10–12 trigger FREE Portal e-TRF delivery to KU, HYU & CAU (do NOT select institutional reporting for Yonsei!)", "fa": "۱۰–۱۲ فوریه ارسال الکترونیکی رایگان کارنامه از پورتال آیلتس به کره، هانیانگ و چونگ‌آنگ (عدم ارسال سازمانی برای یونسی!)"}}, {"id": "c14", "ph": "ph3", "actor": "arsan", "phys": false, "text": {"zh": "【补交节点①】02.11–02.12 仅向已套磁教授原邮件线程补发含核验码 e-TRF PDF 预约 Zoom 面试，并把 e-TRF 与 1–2月新拍 `3×4cm` 证件照发首尔 Charlotte（警告：4校正式网申均严禁截止后补交语言成绩；1–2月严禁手填无考号空白表提前寄出！）", "en": "[Supplement ①] Feb 11–12 reply ONLY in professor email threads with verifiable e-TRF PDF to book Zoom & send e-TRF/fresh `3×4cm` photo to Charlotte (WARNING: 0 late IELTS allowed after portal cutoffs; NEVER mail unnumbered blank forms in Jan–Feb!)", "fa": "«تکمیل ۱» ۱۱–۱۲ فوریه ارسال کارنامه e-TRF صرفاً در ایمیل اساتید برای وقت زوم و ارسال به شارلوت همراه عکس جدید ۳×۴ (هشدار: ارسال نمره زبان پس از ددلاین و پست فرم بدون کد در ژانویه–فوریه مطلقاً ممنوع!)"}}, {"id": "c15", "ph": "ph3", "actor": "arsan", "phys": false, "text": {"zh": "02.16–02.28 完成 Zoom 面试（一旦 `#4 이윤지` 教授同意提名，立即按 `CAYSS Step 1` 补发5件套：①官方《`CAYSS Application Form`》、②`CV`、③本科成绩单扫描件、④现/原指导教授姓名邮箱、⑤研究成果摘要！），并在 `forms.html` 备齐四校预填稿（含中央大第16项上半页蓝框6项+下半页★4项及UWAY三题文书稿）！", "en": "Feb 16–28 complete Zoom interviews (as soon as `#4 Prof. Lee` agrees, send `CAYSS Step 1` 5-piece pack: ① `CAYSS Application Form`, ② `CV`, ③ `Transcripts` scan, ④ Former/current advisor names/emails, ⑤ Research summary!) & prep all fields in `forms.html` (incl. CAU Item #16 Upper 6 + Lower 4 & 3 UWAY prompts)!", "fa": "۱۶–۲۸ فوریه انجام مصاحبه‌های زوم (ارسال فوری پکیج ۵تایی `CAYSS Step 1` شامل `CAYSS Application Form`، رزومه، ریزنمرات، اساتید قبلی و خلاصه پژوهش پس از موافقت `#4`) و آماده‌سازی کامل فرم‌ها در `forms.html`!"}}, {"id": "c16", "ph": "ph3", "actor": "arsan", "phys": true, "text": {"zh": "【存款第1窗·防废票三要素】02.25–03.02 钉附全家护照首页赴银行柜台开具带**银行公章/钢印、写明币种（建议等值 `≥$17,000 USD` / `≥2,200万KRW`）并冻结至 `2027.08.31`** 的英文存款原件 D16 专供高丽；并在 03.15 诺鲁孜放假前拿齐母校教授签字推荐信与中央10项打分骑缝密封原件！", "en": "[Bank Win 1 · Anti-Rejection Trio] Feb 25–Mar 2 attach Family Passport Spelling Card at bank to issue D16 original w/ **official bank stamp/embossed seal, explicit currency (`≥$17,000 USD` / `≥22M KRW`), and frozen to `2027.08.31`** for KU; collect all LORs & CAU sealed LOR before Mar 15 Nowruz!", "fa": "«پنجره ۱ بانک · استاندارد ضد ابطال» ۲۵ فوریه تا ۲ مارس اخذ اصل گواهی بانکی دارای **مهر برجسته بانک، ذکر ارز (`≥$17,000 USD` / ۲۲ میلیون وون) و مسدود تا `۳۱ آگوست ۲۰۲۷`** ویژه کره؛ دریافت تمام توصیه‌نامه‌ها پیش از ۱۵ مارس!"}}, {"id": "c17", "ph": "ph4", "actor": "joint", "phys": true, "text": {"zh": "【第2拨首日4h闪电战】03.02/03 10:00 KST 照预填稿15分钟填完（🚨高丽必选 `College of Health Science 보건과학대학 의생명융합과학과`，严禁误选医学院 `의과대학` 封死A类全奖！且必勾 `② Type of Scholarship`！）→ Charlotte 秒付考号 → Arsan 当日打印湿墨手签，03.03 周三中午前连同存款原件经 Tipax/Aramex/早班机1h转Karpis 报纯 DOC 发出！", "en": "[Wave 2 Day-1 4h Blitz] Mar 2/3 10:00 KST finish entry in 15m (🚨KU MUST pick `College of Health Science 보건과학대학`, NEVER `College of Medicine 의과대학`, and MUST check `② Type of Scholarship`!) → Charlotte pays in 1m → Arsan wet-signs & ships before Mar 3 Wed noon via Tipax/Aramex/Karpis as pure DOC!", "fa": "«عملیات ۴ ساعته مرسوله دوم» ۲–۳ مارس تکمیل فرم‌ها (🚨در کره انتخاب الزامی `보건과학대학` و پرهیز از دانشکده پزشکی + تیک گام `② Type of Scholarship`!) ← پرداخت شارلوت ← امضای خیس آرسان و ارسال ظهر ۳ مارس با تیپاکس/آرامکس/کارپیس!"}}, {"id": "c18", "ph": "ph4", "actor": "arsan", "phys": false, "text": {"zh": "跟进高丽推荐教授在 03.15 春假前贴名片/工作证框并每页手签由 `@iau.ac.ir` 直发（严禁装袋！）；汉阳网申后将 `수험번호` 发导师备案；3月发邮件向 `gsadmin@cau.ac.kr` 确认首尔 `e-TRF` 彩打及配齐3本护照彩印后第9项3张身份证（`کارت ملی`）是否免做翻译公证", "en": "Confirm KU recommender pastes Business Card & emails all-page signed LOR from `@iau.ac.ir` before Mar 15 (NEVER in bag!); email HYU `수험번호` to advisor; email `gsadmin@cau.ac.kr` in Mar to confirm Seoul `e-TRF` print & whether 3 passport prints exempt Item #9 (`3× کارت ملی`) from notarization", "fa": "پیگیری ارسال ایمیل توصیه‌نامه کره از `@iau.ac.ir` پیش از ۱۵ مارس؛ ارسال کد `수험번호` به استاد هانیانگ؛ استعلام ایمیلی ماه مارس از `gsadmin@cau.ac.kr` درباره چاپ رنگی `e-TRF` و معافیت ترجمه ۳ کارت ملی (بند ۹)"}}, {"id": "c19", "ph": "ph4", "actor": "charlotte", "phys": true, "text": {"zh": "【首尔第1批·高丽】03.19(周五) 17:00前：Charlotte 合入第1套认证（必写明精确毕业年月日！）、彩打 e-TRF、护照页、独立结构化 CV 与 ≤5页作品集，外贴第5页 Document Submission Label（自留第4页 Receipt），乘地铁6号线至安岩站当面送交图书馆 `126B室`！", "en": "[Seoul Batch 1 · KU] By Mar 19 (Fri) 17:00: Charlotte merges Set #1 (stating exact graduation YYYY-MM-DD!), color e-TRF, passports, structured CV & ≤5p Portfolio, pastes P.5 Label (keeps P.4 Receipt), and hand-delivers via Line 6 Anam Stn to Library `Rm 126B`!", "fa": "«تحویل نوبت ۱ سئول · کره» تا جمعه ۱۹ مارس ساعت ۱۷: تجمیع سری اول مدارک، چاپ رنگی e-TRF و رزومه ساختاریافته، الصاق برچسب صفحه ۵ و تحویل حضوری با خط ۶ مترو به اتاق `126B` کتابخانه!"}}, {"id": "c20", "ph": "ph4", "actor": "charlotte", "phys": true, "text": {"zh": "【首尔第2批·汉阳】04.02(周五) 17:00前：Charlotte 将全套 A4 裸装（免文件夹/订书针）严格按 `1→10` 精确目录顺序叠放（①입학원서→②지원서약서→③OIA文书→④学位→⑤成绩→⑥D10-A+Scholaro→⑦护照→⑧身份簿→⑨e-TRF→⑩CV作品集），外贴 `발송용 봉투표지` 于 03.25–29 寄挂号信 `우체국 등기우편` 至国际馆 `218室`（禁面交！）", "en": "[Seoul Batch 2 · HYU] By Apr 2 (Fri) 17:00: Charlotte stacks bare A4 sheets (no folders/staples) in exact `1→10` order (①Form→②Pledge→③OIA Essay→④Diploma→⑤Transcript→⑥D10-A+Scholaro→⑦Passports→⑧Shenasnamehs→⑨e-TRF→⑩CV/Portfolio), pastes `발송용 봉투표지`, and mails via `우체국 등기우편` to `Rm 218` (NO walk-in!)", "fa": "«تحویل نوبت ۲ سئول · هانیانگ» تا جمعه ۲ آوریل ساعت ۱۷: چیدمان برگه‌های A4 بدون پوشه/منگنه دقیقاً به ترتیب `۱ تا ۱۰` و ارسال با پست سفارشی `우체국 등기우편` در ۲۵–۲۹ مارس به اتاق `218` ساختمان بین‌الملل (حضوری ممنوع!)"}}, {"id": "c21", "ph": "ph4", "actor": "arsan", "phys": true, "text": {"zh": "【04.03诺鲁孜收假双动作】① 存款第2窗：04.03–04.06 去银行10分钟重开一张 ≤30天 最新日期余额证明扫 600 DPI PDF 传延世；② 若申中央大且第1批非 02.22–02.28 办出，于 04.03–04.14 调底稿重印1套新日期认证件（若CAU要求第9项 `کارت ملی` 公证则同批办妥），04.24 寄首尔", "en": "[Apr 3 Post-Nowruz Dual Actions] (1) Bank Win 2: Apr 3–6 re-print fresh ≤30d balance cert & scan 600 DPI PDF for YU; (2) if applying CAU (and Batch 1 wasn't Feb 22–28), re-print 1 fresh set Apr 3–14 (+ 3× `کارت ملی` notary if demanded) & ship Apr 24", "fa": "«دو اقدام فوری ۳ آوریل پس از نوروز» ۱) پنجره ۲ بانک: ۳–۶ آوریل دریافت گواهی موجودی جدید زیر ۳۰ روز و اسکن PDF برای یونسی؛ ۲) چاپ سری دوم چونگ‌آنگ در ۳–۱۴ آوریل (+ ترجمه کارت ملی در صورت الزام) و پست ۲۴ آوریل"}}, {"id": "c22", "ph": "ph4", "actor": "arsan", "phys": false, "text": {"zh": "【首尔第3批·延世 0纸质】4月上中旬用留在伊朗的认证件直扫 600 DPI PDF 完成网申：必选 `Track 1`、GPA选 `\"Others\"` 填 `17.50`、**`≤5页作品集PDF` 传研究业绩栏（严禁误传至 `Proof of employment` 在职栏！）**、传 e-TRF（认可 `One Skill Retake`）与2封推荐信（🚨缴完 `$130` 永久锁死！）", "en": "[Batch 3 · YU 0 Paper] Early–Mid Apr scan Iran-held set at 600 DPI PDF: pick `Track 1`, GPA `\"Others\"` (`17.50`), **upload `≤5p Portfolio PDF` in Research Achievements (NEVER in `Proof of employment`!)**, upload e-TRF (`One Skill Retake` OK) & 2 LORs (🚨permanently locks once `$130` paid!)", "fa": "«نوبت ۳ · یونسی بدون کاغذ» اسکن ۶۰۰ DPI سری نگهداری‌شده در ایران: انتخاب `Track 1`، معدل `\"Others\"` (`17.50`)، **آپلود پورتفولیو فقط در سوابق پژوهشی (ممنوعیت آپلود در `Proof of employment`!)** و قفل دائمی پس از پرداخت `۱۳۰ دلار`!"}}, {"id": "c25", "ph": "ph4", "actor": "arsan", "phys": false, "text": {"zh": "【新增节点A·延世三分类筛选放榜】2027.05上旬（周五 17:00 KST，正式面试前约1周）：登录 `graduate.yonsei.ac.kr` 查验结果——区分 `[Admitted]`（免面直录）、`[Not admitted]` 与 `[Interview Candidates]`（仅此类进入次周周六面试，紧盯系里邮件/电话，缺席直接淘汰！）", "en": "[Milestone A · Yonsei 3-Way Screening] Early May 2027 (Fri 17:00 KST, ~1 wk pre-interview): check `graduate.yonsei.ac.kr` for `[Admitted]` (direct offer), `[Not admitted]`, or `[Interview Candidates]` (attends next-Sat interview; monitor email/phone—no-show = disqualification!)", "fa": "«ایستگاه جدید الف · غربالگری مصاحبه یونسی» اوایل مه ۲۰۲۷ (جمعه ساعت ۱۷ کره): بررسی سایت `graduate.yonsei.ac.kr` برای سه وضعیت `[Admitted]` (قبولی مستقیم)، `[Not admitted]` یا `[Interview Candidates]` (مصاحبه شنبه هفته بعد؛ غیبت = حذف قطعی!)"}}, {"id": "c23", "ph": "ph4", "actor": "charlotte", "phys": true, "text": {"zh": "【首尔第4批·中央】05.13/14前（邮戳有效）：**先等中央大 OIA 发送 `CAYSS Step 3` 个人免报名费指引邮件**再填 UWAY 在线3道题 `Study Plan`（自留 `수험표` 准考证备 6.07–12 视频面试！）；第16项英文填齐**上半页蓝框6项+下半页★4项**湿墨手签；Charlotte 将除未拆封骑缝推荐信外的全套按【原件套】+【复印件套】分叠送 `310馆210室` 或寄挂号信", "en": "[Seoul Batch 4 · CAU] By May 13/14 (postmark valid): **WAIT for CAU OIA's `CAYSS Step 3` fee-waiver email** before UWAY 3-prompt `Study Plan` (keep `수험표` for Jun 7–12 Zoom!); fill **Upper Blue Box 6 fields + Lower 4 `★` fields** on Item #16 & wet-sign; Charlotte stacks [Orig Set] + [Copy Set] (excl. unopened sealed LOR) to `Bldg 310 Rm 210` or mail", "fa": "«تحویل نوبت ۴ سئول · چونگ‌آنگ» تا ۱۳/۱۴ مه: **انتظار برای ایمیل معافیت `CAYSS Step 3` از OIA**، تایپ آنلاین ۳ سؤال در UWAY (حفظ کارت `수험표` برای مصاحبه ۷–۱۲ ژوئن!)، تکمیل **۶ فیلد کادر آبی بالا + ۴ فیلد ستاره‌دار پایین** در بند ۱۶ و تفکیک دو دسته اصل و کپی (به‌جز پاکت پلمپ توصیه‌نامه)"}}, {"id": "c26", "ph": "ph4", "actor": "joint", "phys": false, "text": {"zh": "【新增节点B·高丽奖学金独立公布窗】06.07–12 携护照与 `수험표` 参加中央大视频面试；06.10起核查录取，并重点等待 **06月下旬（高丽录取放榜后 2 周内）独立公布的高丽校级奖学金等级（A类100% / C类65%）**，结合 07.01 中央放榜综合拍板唯一1校！", "en": "[Milestone B · KU Separate Scholarship Window] Jun 7–12 attend CAU Zoom w/ passport & `수험표`; review mid-Jun offers and wait for **KU's separate scholarship tier result (Type A 100% / Type C 65%) released within 2 weeks post-offer (~Late Jun)** alongside Jul 1 CAU results to pick #1!", "fa": "«ایست   function enrichTerms(html) {

      .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')

    const parts = formatted.split(/(<\/?[A-Za-z][A-Za-z0-9-]*(?:\s[^>]*)?>)/g);

              <div class="check-item ${ok ? "done" : ""}" data-bagcheck="${key}">

  // ==================== TAB 7: TRILINGUAL GLOSSARY ====================
  function renderGlossaryCardsHtml() {
    const q = state.glossQuery.trim().toLowerCase();
    const list = DATA.glossary.filter(item => {
      if (state.glossCat !== "all" && item.cat !== state.glossCat) return false;
      if (!q) return true;
      const blob = [item.term.zh, item.term.en, item.term.fa, item.def.zh, item.def.en, item.def.fa, ...(item.aliases || [])].join(" ").toLowerCase();
      return blob.includes(q);
    });
    return list.map(item => `
      <div class="comp-card" id="gloss-card-${item.id}">
        <div class="comp-head">
          <div style="width:100%">
            <span class="tuition-pill" style="margin-bottom:6px;display:inline-block">${t(UI_STR.cats[item.cat])}</span>
            <div style="font-weight:800;font-size:15px">${escHtml(t(item.term))}</div>
            ${state.glossTriView ? `
              <div style="font-size:12px;color:var(--text-3);margin-top:5px;display:flex;flex-direction:column;gap:2px">
                <div dir="ltr" style="unicode-bidi:isolate">🇨🇳 ${escHtml(item.term.zh)}&lrm;</div>
                <div dir="ltr" style="unicode-bidi:isolate">🇬🇧 ${escHtml(item.term.en)}&lrm;</div>
                <div dir="rtl" style="unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 ${escHtml(item.term.fa)}&rlm;</div>
              </div>
            ` : ""}
          </div>
        </div>
        <div style="font-size:13.4px;margin-bottom:10px">${escHtml(t(item.def))}</div>
        ${state.glossTriView && state.lang !== "en" ? `<div style="font-size:12.4px;color:var(--text-3);margin-bottom:8px;unicode-bidi:isolate" dir="ltr">🇬🇧 ${escHtml(item.def.en)}</div>` : ""}
        ${state.glossTriView && state.lang !== "fa" ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:8px;unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif" dir="rtl">🇮🇷 ${escHtml(item.def.fa)}</div>` : ""}
        <div style="background:var(--amber-soft);border-inline-start:3px solid var(--amber);padding:8px 11px;border-radius:7px;font-size:12.5px">
          <strong>💡 ${{zh:"实操要点：",en:"Action Tip: ",fa:"نکته اجرایی: "}[state.lang]}</strong>${escHtml(t(item.tip))}
        </div>
      </div>
    `).join("");
  }

  function renderMain(opts) {
    const options = opts || {};
    const prevY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const anchorEl = options.anchorId ? document.getElementById(options.anchorId) : null;
    const anchorTop = anchorEl ? anchorEl.getBoundingClientRect().top : null;

    applyRootAttrs();
    renderHeader();
    const container = document.getElementById("app-content");
    if (state.activeTab === "t1") container.innerHTML = renderTab1();
    else if (state.activeTab === "t2") container.innerHTML = renderTab2();
    else if (state.activeTab === "t3") container.innerHTML = renderTab3();
    else if (state.activeTab === "t4") container.innerHTML = renderTab4();
    else if (state.activeTab === "t5") container.innerHTML = renderTab5();
    else if (state.activeTab === "t6") container.innerHTML = renderTab6();
    else if (state.activeTab === "t7") container.innerHTML = renderTab7();
    else {
      state.activeTab = "t1";
      container.innerHTML = renderTab1();
    }

    if (options.scrollTop) {
      window.scrollTo(0, 0);
    } else if (options.anchorId && anchorTop !== null) {
      const nextEl = document.getElementById(options.anchorId);
      if (nextEl) {
        const curY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
        const delta = nextEl.getBoundingClientRect().top - anchorTop;
        window.scrollTo(0, Math.max(0, Math.round(curY + delta)));
        if (options.ensureDrawerId) {
          const drawerEl = document.getElementById(options.ensureDrawerId);
          if (drawerEl) {
            const dRect = drawerEl.getBoundingClientRect();
            const vh = window.innerHeight || document.documentElement.clientHeight || 800;
            if (dRect.top > vh - 120) {
              window.scrollBy({ top: Math.min(260, Math.round(dRect.top - (vh - 240))), behavior: "smooth" });
            }
          }
        }
      } else {
        window.scrollTo(0, prevY);
      }
    } else if (!options.skipScrollRestore) {
      window.scrollTo(0, prevY);
    }

    bindGanttHover();
    const searchInput = document.getElementById("gloss-search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        state.glossQuery = e.target.value;
        const grid = document.getElementById("gloss-cards-grid");
        if (grid) grid.innerHTML = renderGlossaryCardsHtml();
      });
    }
  }

  // ==================== MODAL FOR CLICKED TERMS ====================
  function openTermModal(termId) {
    const item = DATA.glossary.find(x => x.id === termId);
    if (!item) return;
    const modal = document.getElementById("term-modal");
    const box = document.getElementById("term-modal-body");
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
        <span class="tuition-pill">${t(UI_STR.cats[item.cat])}</span>
        <button class="ctrl-pill" id="btn-close-modal" style="min-width:36px;justify-content:center">✕</button>
      </div>
      <h3 style="margin:0 0 10px;font-size:17.5px">${escHtml(t(item.term))}</h3>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:13px;font-size:12.8px;line-height:1.7">
        <div dir="ltr" style="unicode-bidi:isolate">🇨🇳 <strong>中文：</strong>${escHtml(item.term.zh)}&lrm;</div>
        <div dir="ltr" style="unicode-bidi:isolate">🇬🇧 <strong>English:</strong> ${escHtml(item.term.en)}&lrm;</div>
        <div dir="rtl" style="unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 <strong>فارسی:</strong> ${escHtml(item.term.fa)}&rlm;</div>
      </div>
      <div style="font-size:14px;margin-bottom:12px">${escHtml(t(item.def))}</div>
      <details style="margin-bottom:13px;font-size:12.8px;color:var(--text-2)">
        <summary style="cursor:pointer;font-weight:700;color:var(--primary)">🌐 ${{zh:"展开三语完整解释对照",en:"View Full Trilingual Definitions",fa:"مشاهده توضیح کامل به هر سه زبان"}[state.lang]}</summary>
        <div style="margin-top:8px;padding:10px;background:var(--surface-2);border-radius:8px;display:flex;flex-direction:column;gap:8px">
          <div>🇨🇳 ${escHtml(item.def.zh)}</div>
          <div dir="ltr">🇬🇧 ${escHtml(item.def.en)}</div>
          <div dir="rtl" style="font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 ${escHtml(item.def.fa)}</div>
        </div>
      </details>
      <div style="background:var(--amber-soft);border-inline-start:4px solid var(--amber);padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px">
        <strong>💡 ${{zh:"本申请实操要点：",en:"Practical Action Tip: ",fa:"نکته کلیدی در این پرونده: "}[state.lang]}</strong>${escHtml(t(item.tip))}
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="ctrl-pill active" data-goto-gloss="${item.id}">📖 ${{zh:"在词汇词典Tab中定位",en:"Locate in Glossary Tab",fa:"مشاهده در تب واژه‌نامه"}[state.lang]}</button>
      </div>
    `;
    modal.classList.add("open");
  }

  // ==================== GANTT HOVER TOOLTIP ====================
  function bindGanttHover() {
    if (window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches) return;
    const tip = document.getElementById("gantt-float-tip");
    document.querySelectorAll(".gantt-row").forEach(row => {
      row.addEventListener("mouseenter", () => {
        const gid = parseInt(row.dataset.gid, 10);
        const r = DATA.tab5.ganttRows.find(x => x.id === gid);
        if (!r) return;
        tip.dir = state.lang === "fa" ? "rtl" : "ltr";
        tip.innerHTML = `
          <div style="font-weight:800;font-size:13.5px;margin-bottom:3px">${escHtml(t(r.name))}</div>
          <div style="color:#60A5FA;font-size:11.5px;margin-bottom:7px" dir="ltr">${escHtml(t(r.fullWin))}</div>
          <div style="margin-bottom:6px"><strong>🎯:</strong> ${escHtml(stripHtmlTags(t(r.deliv)))}</div>
          <div style="color:#FCD34D"><strong>🛡️ Plan B:</strong> ${escHtml(stripHtmlTags(t(r.planB)))}</div>
        `;
        tip.style.display = "block";
      });
      row.addEventListener("mousemove", (e) => {
        const x = Math.min(window.innerWidth - 410, e.clientX + 16);
        const y = Math.min(window.innerHeight - 210, e.clientY + 16);
        tip.style.left = Math.max(12, x) + "px";
        tip.style.top = Math.max(12, y) + "px";
      });
      row.addEventListener("mouseleave", () => {
        tip.style.display = "none";
      });
    });
  }

  function copyTextWithFallback(txt) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext) {
      return navigator.clipboard.writeText(txt).catch(() => fallbackExecCopy(txt));
    }
    return Promise.resolve(fallbackExecCopy(txt));
  }

  function fallbackExecCopy(txt) {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    ta.style.pointerEvents = "none";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    document.body.removeChild(ta);
    if (!ok) throw new Error("Clipboard copy unavailable");
    return true;
  }

  function scrollToElementById(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const header = document.querySelector(".topbar");
    const offset = (header ? header.getBoundingClientRect().height : 104) + 14;
    const curY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const targetY = Math.max(0, Math.round(curY + el.getBoundingClientRect().top - offset));
    window.scrollTo(0, targetY);
  }

  // ==================== GLOBAL EVENT DELEGATION ====================
  document.addEventListener("click", (e) => {
    const termEl = e.target.closest(".term-hl");
    if (termEl && state.hlOn) {
      e.stopPropagation();
      openTermModal(termEl.dataset.term);
      return;
    }

    if (e.target.id === "term-modal" || e.target.closest("#btn-close-modal")) {
      document.getElementById("term-modal").classList.remove("open");
      return;
    }

    const gotoGloss = e.target.closest("[data-goto-gloss]");
    if (gotoGloss) {
      const id = gotoGloss.dataset.gotoGloss;
      document.getElementById("term-modal").classList.remove("open");
      state.activeTab = "t7";
      safeSet("arsan_tab", "t7");
      state.glossCat = "all";
      state.glossQuery = "";
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("gloss-card-" + id, false));
      return;
    }

    const langBtn = e.target.closest(".lang-btn[data-lang]");
    if (langBtn) {
      const nextLang = langBtn.dataset.lang;
      if (VALID_LANGS.includes(nextLang)) {
        state.lang = nextLang;
        safeSet("arsan_lang", state.lang);
        document.getElementById("gantt-float-tip").style.display = "none";
        renderMain();
      }
      return;
    }

    const gvBtn = e.target.closest("[data-gview]");
    if (gvBtn) {
      state.ganttView = gvBtn.dataset.gview;
      renderMain();
      return;
    }

    if (e.target.closest("#btn-hl-toggle")) {
      state.hlOn = !state.hlOn;
      safeSet("arsan_hl", state.hlOn ? "on" : "off");
      renderMain();
      return;
    }

    if (e.target.closest("#btn-theme-toggle")) {
      state.theme = state.theme === "dark" ? "light" : "dark";
      safeSet("arsan_theme", state.theme);
      renderMain();
      return;
    }

    if (e.target.closest("#btn-quick-check")) {
      state.activeTab = "t6";
      safeSet("arsan_tab", "t6");
      renderMain({ scrollTop: true });
      return;
    }

    const tabBtn = e.target.closest(".tab-btn");
    if (tabBtn) {
      const nextTab = tabBtn.dataset.tab;
      if (VALID_TABS.includes(nextTab)) {
        state.activeTab = nextTab;
        safeSet("arsan_tab", state.activeTab);
        document.getElementById("gantt-float-tip").style.display = "none";
        renderMain({ scrollTop: true });
      }
      return;
    }

    const tRow = e.target.closest("[data-tuition]");
    if (tRow) {
      state.selectedTuition = tRow.dataset.tuition;
      renderMain({ anchorId: "tuition-row-" + tRow.dataset.tuition });
      return;
    }

    if (e.target.closest("#btn-toggle-all-steps")) {
      state.stepsCollapsed = !state.stepsCollapsed;
      renderMain();
      return;
    }

    const jumpPlanB = e.target.closest("[data-jump-planb]");
    if (jumpPlanB) {
      state.activeTab = "t2";
      safeSet("arsan_tab", "t2");
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("tab2-planb-postadm", false));
      return;
    }

    const jumpUltimate = e.target.closest("[data-jump-ultimate]");
    if (jumpUltimate) {
      state.activeTab = "t2";
      safeSet("arsan_tab", "t2");
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("tab2-ultimate-details", false));
      return;
    }

    const stepEl = e.target.closest("[data-step]");
    if (stepEl) {
      const idx = parseInt(stepEl.dataset.step, 10);
      state.selectedStep = Number.isFinite(idx) ? idx : 0;
      if (state.stepsCollapsed) state.stepsCollapsed = false;
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("legal-step-" + state.selectedStep, true));
      return;
    }

    const jumpMod = e.target.closest("[data-jump-mod]");
    if (jumpMod) {
      state.selectedModule = jumpMod.dataset.jumpMod;
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("mod-row-" + state.selectedModule, true));
      return;
    }

    const modRow = e.target.closest("[data-mod]");
    if (modRow) {
      state.selectedModule = modRow.dataset.mod;
      renderMain({ anchorId: "mod-row-" + modRow.dataset.mod, ensureDrawerId: "mod-detail-drawer" });
      return;
    }

    const piBtn = e.target.closest("[data-pi]");
    if (piBtn) {
      state.selectedPi = piBtn.dataset.pi;
      renderMain({ anchorId: "pi-customizer-card" });
      return;
    }

    const gfBtn = e.target.closest("[data-gfilter]");
    if (gfBtn) {
      state.ganttFilter = gfBtn.dataset.gfilter;
      renderMain();
      return;
    }

    const gRow = e.target.closest("[data-gid]");
    if (gRow) {
      state.selectedGanttId = parseInt(gRow.dataset.gid, 10);
      document.getElementById("gantt-float-tip").style.display = "none";
      renderMain();
      return;
    }

    const mfBtn = e.target.closest("[data-mfilter]");
    if (mfBtn) {
      state.metroFilter = mfBtn.dataset.mfilter;
      renderMain();
      return;
    }

    const cfBtn = e.target.closest("[data-cfilter]");
    if (cfBtn) {
      state.checkFilter = cfBtn.dataset.cfilter;
      renderMain();
      return;
    }

    const chkEl = e.target.closest("[data-check]");
    if (chkEl) {
      const id = chkEl.dataset.check;
      state.checked[id] = !state.checked[id];
      safeSet("arsan_checked_v1", JSON.stringify(state.checked));
      renderMain();
      return;
    }

    if (e.target.closest("#btn-reset-checks")) {
      state.checked = {};
      state.bagChecked = {};
      safeRemove("arsan_checked_v1");
      safeRemove("arsan_bags_v1");
      renderMain();
      return;
    }

    const bagBtn = e.target.closest("[data-bag]");
    if (bagBtn) {
      state.selectedBag = bagBtn.dataset.bag;
      renderMain();
      return;
    }

    const bagChk = e.target.closest("[data-bagcheck]");
    if (bagChk) {
      const k = bagChk.dataset.bagcheck;
      state.bagChecked[k] = !state.bagChecked[k];
      safeSet("arsan_bags_v1", JSON.stringify(state.bagChecked));
      renderMain();
      return;
    }

    const gcatBtn = e.target.closest("[data-gcat]");
    if (gcatBtn) {
      state.glossCat = gcatBtn.dataset.gcat;
      renderMain();
      return;
    }

    if (e.target.closest("#btn-tri-view")) {
      state.glossTriView = !state.glossTriView;
      renderMain();
      return;
    }

    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      const txt = copyBtn.dataset.copy;
      if (!copyBtn.dataset.origHtml) {
        copyBtn.dataset.origHtml = copyBtn.innerHTML;
      }
      if (copyBtn._copyTimer) {
        clearTimeout(copyBtn._copyTimer);
      }
      copyTextWithFallback(txt)
        .then(() => {
          copyBtn.textContent = t(UI_STR.copied);
        })
        .catch(() => {
          copyBtn.textContent = "⚠️ Copy failed";
        })
        .finally(() => {
          copyBtn._copyTimer = setTimeout(() => {
            if (copyBtn.isConnected && copyBtn.dataset.origHtml) {
              copyBtn.innerHTML = copyBtn.dataset.origHtml;
              delete copyBtn.dataset.origHtml;
            }
            copyBtn._copyTimer = null;
          }, 1400);
        });
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.getElementById("term-modal").classList.remove("open");
    }
  });

  renderMain({ skipScrollRestore: true });
})();
</script>
</body>
</html>
