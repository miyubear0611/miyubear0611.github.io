2 reply ONLY in professor email threads with verifiable e-TRF PDF to book Zoom & send e-TRF/fresh `3×4cm` photo to Charlotte (WARNING: 0 late IELTS allowed after portal cutoffs; NEVER mail unnumbered blank forms in Jan–Feb!)", "fa": "«تکمیل ۱» ۱۱–۱۲ فوریه ارسال کارنامه e-TRF صرفاً در ایمیل اساتید برای وقت زوم و ارسال به شارلوت همراه عکس جدید ۳×۴ (هشدار: ارسال نمره زبان پس از ددلاین و پست فرم بدون کد در ژانویه–فوریه مطلقاً ممنوع!)"}}, {"id": "c15", "ph": "ph3", "actor": "arsan", "phys": false, "text": {"zh": "02.16–02.28 完成 Zoom 面试（确认汉阳免韩语表、高丽35% RA差额、延世专业代码、中央CAYSS推荐书），并对照【图 2E】提前备齐四校往届原表必填项（含高丽第1类通道/2邮箱/Release电话、延世手签D04、中央UWAY在线3道题英文文书稿）！", "en": "Feb 16–28 complete Zoom interviews & prep ALL Fig 2E past-portal fields by late Feb (KU Track 1/2 emails/Release +98-45-33727799, YU pre-signed D04, CAU 3 UWAY online prompts × 1,500–3,000 chars)!", "fa": "۱۶–۲۸ فوریه انجام مصاحبه‌های زوم و آماده‌سازی کامل فیلدهای پیش‌پرکردنی کارت ۲-هـ تا اواخر فوریه (شامل سهمیه ۱ کره، فرم D04 یونسی و متن ۳ سؤال آنلاین UWAY چونگ‌آنگ)!"}}, {"id": "c16", "ph": "ph3", "actor": "arsan", "phys": true, "text": {"zh": "【存款第1窗·专供高丽】02.25–03.02（高丽报名日基准30天内）赴银行柜台书面开具 ≥2,200万KRW、冻结至2027.08.31的英文存款原件 D16（延世4月网申不复用此单，留待04.03收假重开！）；并在 03.15 春假前拿齐母校教授签字推荐信与中央10项打分骑缝密封原件！", "en": "[Bank Win 1 · For KU] Feb 25–Mar 2 (≤30d of KU application) obtain ≥22M KRW bank original D16 frozen to Aug 31, 2027 (do NOT reuse in Apr for YU—re-print Apr 3–6!); collect ALL signed LORs & CAU's 10-metric unopened flap-signed LOR before Mar 15 Nowruz!", "fa": "«پنجره ۱ بانک · ویژه کره» ۲۵ فوریه تا ۲ مارس دریافت اصل گواهی بانکی ۲۲ میلیون وونی مسدود تا ۳۱ آگوست (برای یونسی در آوریل گواهی جدید می‌گیرید!)؛ تکمیل تمام توصیه‌نامه‌ها و پاکت پلمپ ۱۰ امتیازی چونگ‌آنگ پیش از ۱۵ مارس!"}}, {"id": "c17", "ph": "ph4", "actor": "joint", "phys": true, "text": {"zh": "【第2拨首日4h闪电战】03.02/03 10:00 KST 照预填稿15分钟填完 → 首尔 Charlotte 韩国卡/支付宝1分钟代付秒出考号 → Arsan 当日打印湿墨手签 KU/HYU 表（禁复印！），03.03 周三中午前连同存款原件经本地 Tipax(021-8457)/Aramex(021-91090330)/机场早班机1h转Karp   // ==================== TAB 6: CHECKLIST & BAG PACKER ====================
  function renderTab6() {
    const d = DATA.tab6;
    const total = d.checkItems.length;
    const done = getDoneCount();
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    const phaseBars = d.phases.map(ph => {
      const phItems = d.checkItems.filter(x => x.ph === ph.id);
      const phDone = phItems.filter(x => state.checked[x.id]).length;
      const phPct = phItems.length > 0 ? Math.round((phDone / phItems.length) * 100) : 0;
      return `
        <div class="insp-item">
          <div style="display:flex;justify-content:space-between;font-size:12.2px;font-weight:700;margin-bottom:6px;gap:6px">
            <span>${t(ph.name)}</span>
            <span dir="ltr">${phDone}/${phItems.length}</span>
          </div>
          <div class="bar-track-ltr" style="height:9px">
            <div class="bar-seg-blue" style="width:${phPct}%;background:var(--green)"></div>
          </div>
        </div>
      `;
    }).join("");

    const filteredItems = d.checkItems.filter(it => {
      if (state.checkFilter === "phys") return it.phys;
      if (state.checkFilter === "all") return true;
      return it.actor === state.checkFilter;
    });

    const curBag = d.bagPacker.bags.find(b => b.id === state.selectedBag) || d.bagPacker.bags[0];
    const bagTotal = curBag.items.length;
    const bagDone = curBag.items.filter((_, idx) => state.bagChecked[`${curBag.id}_${idx}`]).length;

    return `
      <div class="section-card">
        <h2 class="sec-title">✅ ${t(d.intro.title)}</h2>
        <p class="sec-sub">${t(d.intro.subtitle)}</p>

        <div style="display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface-2);padding:15px;border-radius:12px;border:1px solid var(--border)">
          <svg width="104" height="104" viewBox="0 0 42 42" style="flex-shrink:0">
            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#E2E8F0" stroke-width="4.5"></circle>
            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#0F9D58" stroke-width="4.5" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="25"></circle>
            <text x="21" y="21" text-anchor="middle" font-size="7.5" font-weight="800" fill="currentColor">${pct}%</text>
            <text x="21" y="27" text-anchor="middle" font-size="3.8" fill="#64748B">${done}/${total}</text>
          </svg>
          <div style="flex:1;min-width:220px" class="inspector-grid">
            ${phaseBars}
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${["all", "arsan", "charlotte", "joint", "phys"].map(f => `
              <button class="ctrl-pill ${state.checkFilter === f ? "active" : ""}" data-cfilter="${f}">${t(UI_STR.actors[f])}</button>
            `).join("")}
          </div>
          <button class="ctrl-pill" id="btn-reset-checks">🔄 ${{zh:"重置勾选",en:"Reset",fa:"بازنشانی"}[state.lang]}</button>
        </div>

        <div>
          ${filteredItems.map(it => {
            const isDone = !!state.checked[it.id];
            return `
              <div class="check-item ${isDone ? "done" : ""}" data-check="${it.id}">
                <div class="check-box-ui">${isDone ? "✓" : ""}</div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px">
                    <span class="tuition-pill" style="font-size:11px">${t(UI_STR.actors[it.actor])}</span>
                    ${it.phys ? `<span class="pill-red" style="font-size:11px">🔴 ${{zh:"实体原件/盖章必办",en:"Physical Original / Stamp",fa:"اقدام حضوری / اصل فیزیکی"}[state.lang]}</span>` : ""}
                  </div>
                  <div class="check-label" style="font-size:13.6px;font-weight:500">${enrichTerms(t(it.text))}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>

        <div style="background:var(--amber-soft);border:1.5px solid var(--amber);border-inline-start-width:5px;border-radius:12px;padding:14px 16px;margin-top:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
            <strong style="font-size:14.6px;color:var(--amber)">🛡️ ${t(d.postAdmissionBanner.title)}</strong>
            <button class="ctrl-pill active" data-jump-planb="1">${t(d.postAdmissionBanner.btnLabel)}</button>
          </div>
          <ul style="margin:0;padding-inline-start:18px;font-size:13px">
            ${(d.postAdmissionBanner.items[state.lang] || d.postAdmissionBanner.items.zh).map(x => `<li style="margin-bottom:5px">${enrichTerms(x)}</li>`).join("")}
          </ul>
        </div>
      </div>

      <div class="section-card">
        <h2 class="sec-title">🎒 ${t(d.bagPacker.title)}</h2>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin:12px 0">
          ${d.bagPacker.bags.map(b => `
            <button class="ctrl-pill ${state.selectedBag === b.id ? "active" : ""}" data-bag="${b.id}">${t(b.name)}</button>
          `).join("")}
        </div>

        <div class="inspector-drawer" style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <strong style="font-size:15.5px">${t(curBag.name)}</strong>

            <span class="${bagDone === bagTotal ? "pill-green" : "pill-red"}" style="font-size:12.5px">
              ${bagDone === bagTotal
                ? {zh:"🎉 全套齐备，可封口投递！",en:"🎉 100% Ready to Seal!",fa:"🎉 کامل و آماده ارسال!"}[state.lang]
                : `${bagDone} / ${bagTotal} ${{zh:"已核验",en:"Verified",fa:"بررسی‌شده"}[state.lang]}`}
            </span>
          </div>
        </div>

        <div>
          ${curBag.items.map((item, idx) => {
            const key = `${curBag.id}_${idx}`;
            const ok = !!state.bagChecked[key];
            return `
              <div class="check-item ${ok ? "done" : ""}" data-bagcheck="${key}">
                <div class="check-box-ui">${ok ? "✓" : ""}</div>
                <div class="check-label" style="font-size:13.5px">${enrichTerms(t(item))}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  // ==================== TAB 7: TRILINGUAL GLOSSARY ====================
  function renderGlossaryCardsHtml() {
    const q = state.glossQuery.trim().toLowerCase();
    const list = DATA.glossary.filter(item => {
      if (state.glossCat !== "all" && item.cat !== state.glossCat) return false;
      if (!q) return true;
      const blob = [item.term.zh, item.term.en, item.term.fa, item.def.zh, item.def.en, item.def.fa, ...(item.aliases || [])].join(" ").toLowerCase();
      return blob.includes(q);
    });
    return list.map(item => `
      <div class="comp-card" id="gloss-card-${item.id}">
        <div class="comp-head">
          <div style="width:100%">
            <span class="tuition-pill" style="margin-bottom:6px;display:inline-block">${t(UI_STR.cats[item.cat])}</span>
            <div style="font-weight:800;font-size:15px">${escHtml(t(item.term))}</div>
            ${state.glossTriView ? `
              <div style="font-size:12px;color:var(--text-3);margin-top:5px;display:flex;flex-direction:column;gap:2px">
                <div dir="ltr" style="unicode-bidi:isolate">🇨🇳 ${escHtml(item.term.zh)}&lrm;</div>
                <div dir="ltr" style="unicode-bidi:isolate">🇬🇧 ${escHtml(item.term.en)}&lrm;</div>
                <div dir="rtl" style="unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 ${escHtml(item.term.fa)}&rlm;</div>
              </div>
            ` : ""}
          </div>
        </div>
        <div style="font-size:13.4px;margin-bottom:10px">${escHtml(t(item.def))}</div>
        ${state.glossTriView && state.lang !== "en" ? `<div style="font-size:12.4px;color:var(--text-3);margin-bottom:8px;unicode-bidi:isolate" dir="ltr">🇬🇧 ${escHtml(item.def.en)}</div>` : ""}
        ${state.glossTriView && state.lang !== "fa" ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:8px;unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif" dir="rtl">🇮🇷 ${escHtml(item.def.fa)}</div>` : ""}
        <div style="background:var(--amber-soft);border-inline-start:3px solid var(--amber);padding:8px 11px;border-radius:7px;font-size:12.5px">
          <strong>💡 ${{zh:"实操要点：",en:"Action Tip: ",fa:"نکته اجرایی: "}[state.lang]}</strong>${escHtml(t(item.tip))}
        </div>
      </div>
    `).join("");
  }

  }

  function renderMain(opts) {
    const options = opts || {};
    const prevY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const anchorEl = options.anchorId ? document.getElementById(options.anchorId) : null;
    const anchorTop = anchorEl ? anchorEl.getBoundingClientRect().top : null;

    applyRootAttrs();
    renderHeader();
    const container = document.getElementById("app-content");
    if (state.activeTab === "t1") container.innerHTML = renderTab1();
    else if (state.activeTab === "t2") container.innerHTML = renderTab2();
    else if (state.activeTab === "t3") container.innerHTML = renderTab3();
    else if (state.activeTab === "t4") container.innerHTML = renderTab4();
    else if (state.activeTab === "t5") container.innerHTML = renderTab5();
    else if (state.activeTab === "t6") container.innerHTML = renderTab6();
    else if (state.activeTab === "t7") container.innerHTML = renderTab7();
    else {
      state.activeTab = "t1";
      container.innerHTML = renderTab1();
    }

    if (options.scrollTop) {
      window.scrollTo(0, 0);
    } else if (options.anchorId && anchorTop !== null) {
      const nextEl = document.getElementById(options.anchorId);
      if (nextEl) {
        const curY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
        const delta = nextEl.getBoundingClientRect().top - anchorTop;
        window.scrollTo(0, Math.max(0, Math.round(curY + delta)));
        if (options.ensureDrawerId) {
          const drawerEl = document.getElementById(options.ensureDrawerId);
          if (drawerEl) {
            const dRect = drawerEl.getBoundingClientRect();
            const vh = window.innerHeight || document.documentElement.clientHeight || 800;
            if (dRect.top > vh - 120) {
              window.scrollBy({ top: Math.min(260, Math.round(dRect.top - (vh - 240))), behavior: "smooth" });
            }
          }
        }
      } else {
        window.scrollTo(0, prevY);
      }
    } else if (!options.skipScrollRestore) {
      window.scrollTo(0, prevY);
    }

    bindGanttHover();
    const searchInput = document.getElementById("gloss-search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        state.glossQuery = e.target.value;
        const grid = document.getElementById("gloss-cards-grid");
        if (grid) grid.innerHTML = renderGlossaryCardsHtml();
      });
    }
  }

  // ==================== MODAL FOR CLICKED TERMS ====================
  function openTermModal(termId) {
    const item = DATA.glossary.find(x => x.id === termId);
    if (!item) return;
    const modal = document.getElementById("term-modal");
    const box = document.getElementById("term-modal-body");
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
        <span class="tuition-pill">${t(UI_STR.cats[item.cat])}</span>
        <button class="ctrl-pill" id="btn-close-modal" style="min-width:36px;justify-content:center">✕</button>
      </div>
      <h3 style="margin:0 0 10px;font-size:17.5px">${escHtml(t(item.term))}</h3>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:13px;font-size:12.8px;line-height:1.7">
        <div dir="ltr" style="unicode-bidi:isolate">🇨🇳 <strong>中文：</strong>${escHtml(item.term.zh)}&lrm;</div>
        <div dir="ltr" style="unicode-bidi:isolate">🇬🇧 <strong>English:</strong> ${escHtml(item.term.en)}&lrm;</div>
        <div dir="rtl" style="unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 <strong>فارسی:</strong> ${escHtml(item.term.fa)}&rlm;</div>
      </div>
      <div style="font-size:14px;margin-bottom:12px">${escHtml(t(item.def))}</div>
      <details style="margin-bottom:13px;font-size:12.8px;color:var(--text-2)">
        <summary style="cursor:pointer;font-weight:700;color:var(--primary)">🌐 ${{zh:"展开三语完整解释对照",en:"View Full Trilingual Definitions",fa:"مشاهده توضیح کامل به هر سه زبان"}[state.lang]}</summary>
        <div style="margin-top:8px;padding:10px;background:var(--surface-2);border-radius:8px;display:flex;flex-direction:column;gap:8px">
          <div>🇨🇳 ${escHtml(item.def.zh)}</div>
          <div dir="ltr">🇬🇧 ${escHtml(item.def.en)}</div>
          <div dir="rtl" style="font-family:'Vazirmatn',Tahoma,sans-serif">🇮🇷 ${escHtml(item.def.fa)}</div>
        </div>
      </details>
      <div style="background:var(--amber-soft);border-inline-start:4px solid var(--amber);padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px">
        <strong>💡 ${{zh:"本申请实操要点：",en:"Practical Action Tip: ",fa:"نکته کلیدی در این پرونده: "}[state.lang]}</strong>${escHtml(t(item.tip))}
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="ctrl-pill active" data-goto-gloss="${item.id}">📖 ${{zh:"在词汇词典Tab中定位",en:"Locate in Glossary Tab",fa:"مشاهده در تب واژه‌نامه"}[state.lang]}</button>
      </div>
    `;
    modal.classList.add("open");
  }

  // ==================== GANTT HOVER TOOLTIP ====================
  function bindGanttHover() {
    if (window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches) return;
    const tip = document.getElementById("gantt-float-tip");
    document.querySelectorAll(".gantt-row").forEach(row => {
      row.addEventListener("mouseenter", () => {
        const gid = parseInt(row.dataset.gid, 10);
        const r = DATA.tab5.ganttRows.find(x => x.id === gid);
        if (!r) return;
        tip.dir = state.lang === "fa" ? "rtl" : "ltr";
        tip.innerHTML = `
          <div style="font-weight:800;font-size:13.5px;margin-bottom:3px">${escHtml(t(r.name))}</div>
          <div style="color:#60A5FA;font-size:11.5px;margin-bottom:7px" dir="ltr">${escHtml(t(r.fullWin))}</div>
          <div style="margin-bottom:6px"><strong>🎯:</strong> ${escHtml(stripHtmlTags(t(r.deliv)))}</div>
          <div style="color:#FCD34D"><strong>🛡️ Plan B:</strong> ${escHtml(stripHtmlTags(t(r.planB)))}</div>
        `;
        tip.style.display = "block";
      });
      row.addEventListener("mousemove", (e) => {
        const x = Math.min(window.innerWidth - 410, e.clientX + 16);
        const y = Math.min(window.innerHeight - 210, e.clientY + 16);
        tip.style.left = Math.max(12, x) + "px";
        tip.style.top = Math.max(12, y) + "px";
      });
      row.addEventListener("mouseleave", () => {
        tip.style.display = "none";
      });
    });
  }

  function copyTextWithFallback(txt) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext) {
      return navigator.clipboard.writeText(txt).catch(() => fallbackExecCopy(txt));
    }
    return Promise.resolve(fallbackExecCopy(txt));
  }

  function fallbackExecCopy(txt) {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    ta.style.pointerEvents = "none";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    document.body.removeChild(ta);
    if (!ok) throw new Error("Clipboard copy unavailable");
    return true;
  }

  function scrollToElementById(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const header = document.querySelector(".topbar");
    const offset = (header ? header.getBoundingClientRect().height : 104) + 14;
    const curY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const targetY = Math.max(0, Math.round(curY + el.getBoundingClientRect().top - offset));
    window.scrollTo(0, targetY);
  }

  // ==================== GLOBAL EVENT DELEGATION ====================
  document.addEventListener("click", (e) => {
    const termEl = e.target.closest(".term-hl");
    if (termEl && state.hlOn) {
      e.stopPropagation();
      openTermModal(termEl.dataset.term);
      return;
    }

    if (e.target.id === "term-modal" || e.target.closest("#btn-close-modal")) {
      document.getElementById("term-modal").classList.remove("open");
      return;
    }

    const gotoGloss = e.target.closest("[data-goto-gloss]");
    if (gotoGloss) {
      const id = gotoGloss.dataset.gotoGloss;
      document.getElementById("term-modal").classList.remove("open");
      state.activeTab = "t7";
      safeSet("arsan_tab", "t7");
      state.glossCat = "all";
      state.glossQuery = "";
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("gloss-card-" + id, false));
      return;
    }

    const langBtn = e.target.closest(".lang-btn[data-lang]");
    if (langBtn) {
      const nextLang = langBtn.dataset.lang;
      if (VALID_LANGS.includes(nextLang)) {
        state.lang = nextLang;
        safeSet("arsan_lang", state.lang);
        document.getElementById("gantt-float-tip").style.display = "none";
        renderMain();
      }
      return;
    }

    const gvBtn = e.target.closest("[data-gview]");
    if (gvBtn) {
      state.ganttView = gvBtn.dataset.gview;
      renderMain();
      return;
    }

    if (e.target.closest("#btn-hl-toggle")) {
      state.hlOn = !state.hlOn;
      safeSet("arsan_hl", state.hlOn ? "on" : "off");
      renderMain();
      return;
    }

    if (e.target.closest("#btn-theme-toggle")) {
      state.theme = state.theme === "dark" ? "light" : "dark";
      safeSet("arsan_theme", state.theme);
      renderMain();
      return;
    }

    if (e.target.closest("#btn-quick-check")) {
      state.activeTab = "t6";
      safeSet("arsan_tab", "t6");
      renderMain({ scrollTop: true });
      return;
    }

    const tabBtn = e.target.closest(".tab-btn");
    if (tabBtn) {
      const nextTab = tabBtn.dataset.tab;
      if (VALID_TABS.includes(nextTab)) {
        state.activeTab = nextTab;
        safeSet("arsan_tab", state.activeTab);
        document.getElementById("gantt-float-tip").style.display = "none";
        renderMain({ scrollTop: true });
      }
      return;
    }

    const tRow = e.target.closest("[data-tuition]");
    if (tRow) {
      state.selectedTuition = tRow.dataset.tuition;
      renderMain({ anchorId: "tuition-row-" + tRow.dataset.tuition });
      return;
    }

    if (e.target.closest("#btn-toggle-all-steps")) {
      state.stepsCollapsed = !state.stepsCollapsed;
      renderMain();
      return;
    }

    const jumpPlanB = e.target.closest("[data-jump-planb]");
    if (jumpPlanB) {
      state.activeTab = "t2";
      safeSet("arsan_tab", "t2");
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("tab2-planb-postadm", false));
      return;
    }

    const stepEl = e.target.closest("[data-step]");
    if (stepEl) {
      const idx = parseInt(stepEl.dataset.step, 10);
      state.selectedStep = Number.isFinite(idx) ? idx : 0;
      if (state.stepsCollapsed) state.stepsCollapsed = false;
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("legal-step-" + state.selectedStep, true));
      return;
    }

    const jumpMod = e.target.closest("[data-jump-mod]");
    if (jumpMod) {
      state.selectedModule = jumpMod.dataset.jumpMod;
      renderMain({ skipScrollRestore: true });
      requestAnimationFrame(() => scrollToElementById("mod-row-" + state.selectedModule, true));
      return;
    }

    const modRow = e.target.closest("[data-mod]");
    if (modRow) {
      state.selectedModule = modRow.dataset.mod;
      renderMain({ anchorId: "mod-row-" + modRow.dataset.mod, ensureDrawerId: "mod-detail-drawer" });
      return;
    }

    const piBtn = e.target.closest("[data-pi]");
    if (piBtn) {
      state.selectedPi = piBtn.dataset.pi;
      renderMain({ anchorId: "pi-customizer-card" });
      return;
    }

    const gfBtn = e.target.closest("[data-gfilter]");
    if (gfBtn) {
      state.ganttFilter = gfBtn.dataset.gfilter;
      renderMain();
      return;
    }

    const gRow = e.target.closest("[data-gid]");
    if (gRow) {
      state.selectedGanttId = parseInt(gRow.dataset.gid, 10);
      document.getElementById("gantt-float-tip").style.display = "none";
      renderMain();
      return;
    }

    const mfBtn = e.target.closest("[data-mfilter]");
    if (mfBtn) {
      state.metroFilter = mfBtn.dataset.mfilter;
      renderMain();
      return;
    }

    const cfBtn = e.target.closest("[data-cfilter]");
    if (cfBtn) {
      state.checkFilter = cfBtn.dataset.cfilter;
      renderMain();
      return;
    }

    const chkEl = e.target.closest("[data-check]");
    if (chkEl) {
      const id = chkEl.dataset.check;
      state.checked[id] = !state.checked[id];
      safeSet("arsan_checked_v1", JSON.stringify(state.checked));
      renderMain();
      return;
    }

    if (e.target.closest("#btn-reset-checks")) {
      state.checked = {};
      state.bagChecked = {};
      safeRemove("arsan_checked_v1");
      safeRemove("arsan_bags_v1");
      renderMain();
      return;
    }

    const bagBtn = e.target.closest("[data-bag]");
    if (bagBtn) {
      state.selectedBag = bagBtn.dataset.bag;
      renderMain();
      return;
    }

    const bagChk = e.target.closest("[data-bagcheck]");
    if (bagChk) {
      const k = bagChk.dataset.bagcheck;
      state.bagChecked[k] = !state.bagChecked[k];
      safeSet("arsan_bags_v1", JSON.stringify(state.bagChecked));
      renderMain();
      return;
    }

    const gcatBtn = e.target.closest("[data-gcat]");
    if (gcatBtn) {
      state.glossCat = gcatBtn.dataset.gcat;
      renderMain();
      return;
    }

    if (e.target.closest("#btn-tri-view")) {
      state.glossTriView = !state.glossTriView;
      renderMain();
      return;
    }

    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      const txt = copyBtn.dataset.copy;
      if (!copyBtn.dataset.origHtml) {
        copyBtn.dataset.origHtml = copyBtn.innerHTML;
      }
      if (copyBtn._copyTimer) {
        clearTimeout(copyBtn._copyTimer);
      }
      copyTextWithFallback(txt)
        .then(() => {
          copyBtn.textContent = t(UI_STR.copied);
        })
        .catch(() => {
          copyBtn.textContent = "⚠️ Copy failed";
        })
        .finally(() => {
          copyBtn._copyTimer = setTimeout(() => {
            if (copyBtn.isConnected && copyBtn.dataset.origHtml) {
              copyBtn.innerHTML = copyBtn.dataset.origHtml;
              delete copyBtn.dataset.origHtml;
            }
            copyBtn._copyTimer = null;
          }, 1400);
        });
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.getElementById("term-modal").classList.remove("open");
    }
  });

  renderMain({ skipScrollRestore: true });
})();
</script>
</body>
</html>
