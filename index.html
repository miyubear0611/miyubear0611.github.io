        <h2 class="section-h2">${rep.sec2.heading}</h2>
        <h3 class="section-h3">${rep.sec2.sub1Heading}</h3>

                  .map(

                  <tr>

                      <div class="table-links-col">

            .map(

      <!-- PART 2: COMPLETE PROFESSOR & WEBSITE MASTER DIRECTORY -->
      <section class="section-card" id="sec-prof-dir">

        <p class="dir-note-text">${ui.koreanNameNote}</p>
        <div class="filter-toolbar">

            <button class="filter-chip ${state.profTier === "reach" ? "active" : ""}" data-ptier="reach">${ui.profFilterReach}</button>

      <!-- VERIFIED SOURCES REPOSITORY -->

            (sg) => `

    renderGlossaryCards();

  function bindDynamicEvents() {
    const gInput = document.getElementById("glossarySearchInput");
    if (gInput) {
      gInput.addEventListener("input", (e) => {
        state.glossaryQuery = e.target.value;
        renderGlossaryCards();
      });
    }

    document.querySelectorAll("[data-gcat]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.glossaryCat = btn.dataset.gcat;
        document.querySelectorAll("[data-gcat]").forEach((b) =>
          b.classList.toggle("active", b.dataset.gcat === state.glossaryCat)
        );
        renderGlossaryCards();
      });
    });

    const pInput = document.getElementById("profSearchInput");
    if (pInput) {
      pInput.addEventListener("input", (e) => {
        state.profQuery = e.target.value;
        renderProfDirectoryCards();
      });
    }

    document.querySelectorAll("[data-ptier]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.profTier = btn.dataset.ptier;
        document.querySelectorAll("[data-ptier]").forEach((b) =>
          b.classList.toggle("active", b.dataset.ptier === state.profTier)
        );
        renderProfDirectoryCards();
      });
    });

    const pureDryBtn = document.getElementById("pureDryToggleBtn");
    if (pureDryBtn) {
      pureDryBtn.addEventListener("click", () => {
        state.profPureDryOnly = !state.profPureDryOnly;
        pureDryBtn.classList.toggle("active", state.profPureDryOnly);
        renderProfDirectoryCards();
      });
    }
  }

  function setupGlobalEvents() {
    // Language Switcher (Preserving Vertical Scroll Ratio + Resetting Any Horizontal Offset)
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const nextLang = btn.dataset.lang;
        if (nextLang === state.lang) return;
        const scrollRatio =
          window.scrollY /
          Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        state.lang = nextLang;
        closeMobileOverlays();
        renderAll();
        requestAnimationFrame(() => {
          const targetY =
            scrollRatio *
            Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
          window.scrollTo({ left: 0, top: targetY, behavior: "instant" });
          document.documentElement.scrollLeft = 0;
          document.body.scrollLeft = 0;
        });
      });
    });

    // Mobile TOC Drawer Toggle
    const tocOpenBtn = document.getElementById("mobileTocOpenBtn");
    const backdrop = document.getElementById("mobileTocBackdrop");
    if (tocOpenBtn) {
      tocOpenBtn.addEventListener("click", () => {
        const next = !state.mobileTocOpen;
        closeMobileOverlays();
        state.mobileTocOpen = next;
        const toc = document.getElementById("tocSidebar");
        if (toc) toc.classList.toggle("mobile-open", next);
        if (backdrop) backdrop.hidden = !next;
      });
    }
    if (backdrop) {
      backdrop.addEventListener("click", closeMobileOverlays);
    }

    // Mobile Display Settings Popover Toggle
    const settingsBtn = document.getElementById("mobileSettingsBtn");
    if (settingsBtn) {
      settingsBtn.addEventListener("click", () => {
        const next = !state.mobileToolsOpen;
        closeMobileOverlays();
        state.mobileToolsOpen = next;
        const drawer = document.getElementById("readingToolsDrawer");
        if (drawer) drawer.classList.toggle("mobile-open", next);
      });
    }

    // Theme Switcher
    document.querySelectorAll(".theme-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.theme = btn.dataset.theme;
        applyRootAttributes();
      });
    });

    // Font Size Switcher
    document.querySelectorAll(".size-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.size = btn.dataset.size;
        applyRootAttributes();
      });
    });

    // Print button
    document.getElementById("printPageBtn").addEventListener("click", () => {
      closeMobileOverlays();
      window.print();
    });

    // Delegated Copy Email handler
    document.body.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy-email]");
      if (!btn) return;
      const email = btn.getAttribute("data-copy-email");
      if (!email) return;
      const ui = window.UI_I18N[state.lang];
      const prevText = btn.textContent;
      navigator.clipboard?.writeText(email).then(() => {
        btn.textContent = "✓ " + ui.copiedEmail;
        setTimeout(() => {
          btn.textContent = prevText;
        }, 1400);
      });
    });

    // Reading Progress & Scroll-Spy
    window.addEventListener(
      "scroll",
      () => {
        const docH = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docH > 0 ? Math.min(100, Math.max(0, (window.scrollY / docH) * 100)) : 0;
        const bar = document.getElementById("readingProgressBar");
        if (bar) bar.style.width = pct + "%";

        const sections = document.querySelectorAll(
          "#sec-intro-hierarchy, #sec-intro-majors, #sec-intro-glossary, #sec-exec, #sec-1, #sec-2, #sec-3, #sec-4, #sec-table2, #sec-5, #sec-prof-dir, #sec-sources"
        );
        let currentId = "";
        sections.forEach((sec) => {
          const rect = sec.getBoundingClientRect();
          if (rect.top <= 120) {
            currentId = sec.id;
          }
        });
        if (currentId) {
          document.querySelectorAll(".toc-link").forEach((link) => {
            link.classList.toggle("active", link.getAttribute("href") === "#" + currentId);
          });
        }
      },
      { passive: true }
    );
  }

  function renderAll() {
    applyRootAttributes();
    renderTopbar();
    renderTOC();
    renderMainContent();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");
    if (urlLang && ["zh", "en", "fa"].includes(urlLang)) {
      state.lang = urlLang;
    }
    setupGlobalEvents();
    renderAll();
  });
})();

  </script>
