<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Alignment Tribunal | 阵营裁决所</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入支持中文、英文、韩文和波斯文的优雅字体 */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&family=Vazirmatn:wght@400;700&display=swap');
        
        :root {
            --font-zh: 'Noto Serif SC', serif;
            --font-en: 'Cinzel', serif;
            --font-ko: 'Noto Sans KR', sans-serif;
            --font-fa: 'Vazirmatn', sans-serif;
        }

        body {
            font-family: var(--font-zh);
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(15, 23, 42, 0.5), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(120, 50, 0, 0.15), transparent 50%),
                #0a0810;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        /* 针对不同语言切换主字体 */
        body.lang-en { font-family: var(--font-en); }
        body.lang-ko { font-family: var(--font-ko); }
        body.lang-fa { font-family: var(--font-fa); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            position: relative;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            border-radius: 24px 24px 0 0;
        }

        .btn-option {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        
        .btn-option:hover {
            border-color: #d97706; 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(69, 26, 3, 0.6));
            box-shadow: 0 4px 20px rgba(217, 119, 6, 0.2);
            transform: translateY(-2px) scale(1.01);
        }

        .input-name {
            background: transparent;
            border-bottom: 2px solid #475569;
            transition: all 0.3s;
        }
        .input-name:focus {
            outline: none;
            border-bottom-color: #fbbf24;
            transform: scale(1.05);
        }

        .glitch-text {
            color: #ef4444;
            text-shadow: 2px 2px #000, -2px -2px #000;
            animation: glitch 1s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: skewX(2deg); opacity: 0.9; }
            100% { transform: skewX(-2deg); opacity: 1; }
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .option-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: optionFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes optionFadeIn { to { opacity: 1; transform: translateY(0); } }

        .bar-segment { transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #progress-bar { background: linear-gradient(90deg, #d97706, #fbbf24); }

        /* 语言切换器样式 */
        .lang-btn {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: #94a3b8;
            transition: all 0.3s;
        }
        .lang-btn:hover { color: #facc15; background: rgba(255,255,255,0.1); }
        .lang-btn.active { background: #d97706; color: white; font-weight: bold; }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4 sm:p-8" dir="ltr">
    
    <!-- 动态 Canvas 背景 -->
    <canvas id="bg-canvas" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

    <!-- 语言切换器 -->
    <div class="fixed top-4 right-4 z-50 flex space-x-1 bg-slate-900/60 backdrop-blur-md p-1.5 rounded-full border border-slate-700/50 shadow-lg">
        <button class="lang-btn active" data-lang="zh">中</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fa">فا</button>
        <button class="lang-btn" data-lang="ko">한</button>
    </div>

    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-12 min-h-[600px] flex flex-col relative z-10 overflow-hidden">
        
        <!-- ==================== 1. 欢迎页 ==================== -->
        <section id="welcome-screen" class="flex flex-col items-center justify-center h-full w-full min-h-[400px] fade-in">
            <h1 id="ui-title" class="text-4xl sm:text-6xl font-bold text-amber-500 mb-6 text-center drop-shadow-[0_0_15px_rgba(245,158,11,0.6)] tracking-wider">
                阵营裁决所
            </h1>
            <p id="ui-subtitle" class="text-slate-300 text-center mb-10 max-w-lg leading-relaxed text-lg">
                直击潜意识的 31 道拷问，揭示你真实的灵魂底色。请顺从第一直觉作答，判决之眼凝视着一切伪装。
            </p>
            <div class="mt-4 flex flex-col items-center w-full max-w-sm space-y-6">
                <input type="text" id="player-name" placeholder="刻下你的名字..." maxlength="20" class="input-name w-full text-center text-2xl text-amber-100 pb-2 placeholder-slate-600" autocomplete="off">
                <button id="start-btn" disabled class="w-full px-8 py-4 bg-amber-700/80 hover:bg-amber-600 text-amber-100 font-bold rounded-xl transition-all text-xl border border-amber-500/50 hover:shadow-[0_0_20px_rgba(217,119,6,0.6)] uppercase tracking-widest disabled:opacity-50 disabled:cursor-not-allowed">
                    接受灵魂审判
                </button>
            </div>
        </section>

        <!-- ==================== 2. 答题系统 ==================== -->
        <section id="quiz-screen" class="hidden flex-col h-full w-full fade-in">
            <!-- 顶部信息栏 -->
            <div class="flex justify-between items-center mb-6">
                <button id="prev-btn" class="text-slate-400 hover:text-amber-400 transition-colors flex items-center gap-1 opacity-0 pointer-events-none">
                    <svg class="w-5 h-5 rtl:rotate-180 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span id="ui-prev">上一题</span>
                </button>
                <span id="question-counter" class="text-slate-500 font-bold text-lg dir-ltr">1 / 31</span>
            </div>

            <!-- 主进度条 -->
            <div class="w-full bg-slate-900 rounded-full h-1.5 mb-10 overflow-hidden border border-slate-800">
                <div id="progress-bar" class="bg-amber-600 h-1.5 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(217,119,6,0.8)]" style="width: 0%"></div>
            </div>
            
            <!-- 题目区域 -->
            <div class="flex-grow flex flex-col justify-center mb-8 relative">
                <h2 id="question-text" class="text-2xl sm:text-3xl font-bold mb-10 text-slate-100 leading-relaxed text-center min-h-[100px] flex items-center justify-center">
                    正在连接潜意识...
                </h2>
                <div id="options-container" class="flex flex-col space-y-5 w-full max-w-2xl mx-auto">
                    <!-- 选项由 JS 动态生成 -->
                </div>
            </div>
        </section>

        <!-- ==================== 3. 终极分析结果页 ==================== -->
        <section id="result-screen" class="hidden flex-col items-center w-full h-full fade-in">
            <h2 class="text-xl text-slate-500 mb-2 font-bold tracking-widest"><span id="display-name" class="text-amber-200"></span> <span id="ui-soul-anatomy">的灵魂剖析</span></h2>
            
            <h1 id="alignment-title" class="text-5xl md:text-7xl font-bold text-amber-500 my-4 drop-shadow-[0_0_15px_rgba(245,158,11,0.4)] text-center">
                加载中
            </h1>

            <!-- 测谎警报 -->
            <div id="lie-alert" class="hidden w-full max-w-2xl bg-red-950/50 border border-red-600/50 rounded-xl p-6 my-6 shadow-[0_0_30px_rgba(220,38,38,0.2)]">
                <h3 class="text-red-500 font-bold text-2xl glitch-text mb-3 flex items-center justify-center gap-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

                </h3>

                <p id="ui-lie-conclusion" class="mt-3 text-red-400 font-bold text-center"></p>
            </div>

            <!-- 数据可视化：双轴进度条 -->
            <div class="w-full max-w-2xl bg-slate-900/50 rounded-2xl p-6 my-6 border border-slate-700/50">
                <h3 id="ui-comp" class="text-slate-400 font-bold mb-4 text-center tracking-widest">性格构成百分比</h3>
                
                <!-- 规则轴 -->
                <div class="mb-6">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span id="label-lawful" class="w-1/3 text-left">守序 (Lawful)</span>
                        <span id="label-neutral-x" class="w-1/3 text-center">中立 (Neutral)</span>
                        <span id="label-chaotic" class="w-1/3 text-right">混乱 (Chaotic)</span>
                    </div>
                    <div class="w-full flex h-3 rounded-full overflow-hidden bg-slate-800 dir-ltr">
                        <div id="bar-lawful" class="bar-segment h-full bg-blue-500"></div>
                        <div id="bar-neutral-x" class="bar-segment h-full bg-slate-500"></div>
                        <div id="bar-chaotic" class="bar-segment h-full bg-purple-500"></div>
                    </div>
                    <div id="text-x-percent" class="text-center text-sm mt-2 text-slate-300 font-mono dir-ltr"></div>
                </div>

                <!-- 道德轴 -->
                <div>
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span id="label-good" class="w-1/3 text-left">善良 (Good)</span>
                        <span id="label-neutral-y" class="w-1/3 text-center">中立 (Neutral)</span>
                        <span id="label-evil" class="w-1/3 text-right">邪恶 (Evil)</span>
                    </div>
                    <div class="w-full flex h-3 rounded-full overflow-hidden bg-slate-800 dir-ltr">
                        <div id="bar-good" class="bar-segment h-full bg-emerald-500"></div>
                        <div id="bar-neutral-y" class="bar-segment h-full bg-slate-500"></div>
                        <div id="bar-evil" class="bar-segment h-full bg-red-600"></div>
                    </div>
                    <div id="text-y-percent" class="text-center text-sm mt-2 text-slate-300 font-mono dir-ltr"></div>
                </div>
            </div>

            <!-- 深度解析文案 -->
            <div class="w-full max-w-2xl bg-slate-800/30 rounded-2xl p-6 sm:p-8 border border-slate-600/30 shadow-inner">
                <p id="alignment-desc" class="text-slate-300 leading-relaxed text-left text-lg"></p>
                <div id="dynamic-analysis" class="mt-6 pt-4 border-t border-slate-700/50 text-slate-400 text-base leading-relaxed italic">
                </div>
            </div>

            <button id="restart-btn" class="mt-10 px-8 py-3 bg-transparent border-2 border-amber-700 text-amber-500 font-bold hover:bg-amber-700 hover:text-white rounded-xl transition-all uppercase tracking-widest">
                重启灵魂
            </button>
        </section>
    </main>

                    { text: { zh: "法不容情，按盗窃定罪，给予最低刑罚。", en: "Law is law. Convict, but minimum sentence.", fa: "قانون قانون است. محکوم با حداقل مجازات.", ko: "법은 법이다. 유죄 판결하되 최저 형량 부여." }, type: "L", tag: "LAW_STRICT" },
                    { text: { zh: "让他做社区服务抵消，息事宁人。", en: "Community service to offset it.", fa: "خدمات اجتماعی برای جبران.", ko: "사회봉사로 대체하고 조용히 넘긴다." }, type: "Nx" },
                    { text: { zh: "当庭无罪释放，谴责让他挨饿的体制。", en: "Acquit immediately, condemn the system.", fa: "تبرئه فوری، محکومیت سیستم حاکم.", ko: "무죄 석방하고 그를 굶긴 체제를 비난한다." }, type: "C", tag: "LAW_FUCKIT" }
                ]
            },
            {
                text: { zh: "7. 在团队游戏中，你最讨厌哪种队友？", en: "7. In team games, what teammate do you hate most?", fa: "۷. در بازی‌های تیمی، از چه هم‌تیمی بیشتر متنفرید؟", ko: "7. 팀 게임에서 가장 싫어하는 팀원은?" },
                options: [
                    { text: { zh: "不听指挥、不按战术的‘独狼’。", en: "Lone wolves who ignore tactics.", fa: "گرگ‌های تنها که تاکتیک را نادیده می‌گیرند.", ko: "지시를 안 듣고 전술을 무시하는 '독고다이'." }, type: "L" },
                    { text: { zh: "技术太菜还喜欢乱甩锅的人。", en: "Noobs who constantly blame others.", fa: "مبتدی‌هایی که مدام دیگران را مقصر می‌دانند.", ko: "실력도 없으면서 남 탓만 하는 사람." }, type: "Nx" },
                    { text: { zh: "事事都要管的‘控制狂’队长。", en: "Control freak captains dictating everything.", fa: "کاپیتان‌های کنترل‌گری که همه چیز را دیکته می‌کنند.", ko: "사사건건 간섭하는 '통제광' 대장." }, type: "C" }
                ]
            },
            {
                text: { zh: "8. 对于社会‘传统’和‘习俗’，你的态度是？", en: "8. Attitude towards social 'traditions' and 'customs'?", fa: "۸. نگرش به 'سنت‌ها' و 'رسوم' اجتماعی؟", ko: "8. 사회의 '전통'과 '관습'에 대한 당신의 태도는?" },
                options: [
                    { text: { zh: "文明基石，维系稳定，应被传承。", en: "Cornerstones of civ, maintain stability.", fa: "سنگ بنای تمدن، حفظ ثبات.", ko: "문명의 초석이며 안정을 유지하므로 계승해야 한다." }, type: "L", tag: "TRADITION_LOVE" },
                    { text: { zh: "挑有用的保留，没用的扔掉。", en: "Keep useful ones, toss the rest.", fa: "حفظ موارد مفید، دور انداختن بقیه.", ko: "유용한 것만 남기고 쓸모없는 건 버린다." }, type: "Nx" },
                    { text: { zh: "大多是旧枷锁，最好全部砸碎建新秩序。", en: "Old shackles. Smash them for a new order.", fa: "غل و زنجیرهای قدیمی. نابودی برای نظم جدید.", ko: "대부분 낡은 족쇄다. 다 부수고 새 질서를 세워야 한다." }, type: "C", tag: "TRADITION_DESTROY" }
                ]
            },
            {
                text: { zh: "9. 你的电脑桌面或办公桌通常是怎样的？", en: "9. How is your computer desktop or workspace usually?", fa: "۹. دسکتاپ یا میز کار شما معمولاً چگونه است؟", ko: "9. 당신의 컴퓨터 바탕화면이나 책상은 보통 어떤가요?" },
                options: [
                    { text: { zh: "井井有条，文件分类严密。", en: "Impeccably organized and categorized.", fa: "کاملاً سازماندهی و طبقه‌بندی شده.", ko: "정돈되어 있고 파일 분류가 엄격하다." }, type: "L" },
                    { text: { zh: "有点乱，但我大概知道东西在哪。", en: "A bit messy, but I know where things are.", fa: "کمی به هم ریخته، اما جای چیزها را می‌دانم.", ko: "좀 어수선하지만 뭐 어딨는지는 안다." }, type: "Nx" },
                    { text: { zh: "极其混乱，找东西全靠缘分或搜索。", en: "Utter chaos. Finding things relies on luck/search.", fa: "هرج و مرج مطلق. پیدا کردن شانسی است.", ko: "극도로 혼란스럽다. 운이나 검색에 의존한다." }, type: "C" }
                ]
            },
            {
                text: { zh: "10. 若失去警察和法律，世界会怎样？", en: "10. Without police and laws, what happens to the world?", fa: "۱۰. بدون پلیس و قانون، چه بر سر دنیا می‌آید؟", ko: "10. 경찰과 법이 사라진다면 세상은 어떻게 될까요?" },
                options: [
                    { text: { zh: "陷入恐怖的掠夺和互相残杀。", en: "Plunges into horrific looting and murder.", fa: "غوطه‌ور در غارت و قتل وحشتناک.", ko: "끔찍한 약탈과 살육의 혼란에 빠진다." }, type: "L" },
                    { text: { zh: "前期大乱，后期形成私刑规则。", en: "Initial chaos, later vigilante rules form.", fa: "ابتدا آشوب، سپس شکل‌گیری قوانین خودسرانه.", ko: "초기엔 혼란, 후기엔 사적 제재 규칙이 생길 것이다." }, type: "Nx" },
                    { text: { zh: "优胜劣汰，强者自由的世界。", en: "Survival of the fittest. Freedom for the strong.", fa: "بقا برای شایسته‌ترین‌ها. آزادی برای قوی‌ترها.", ko: "적자생존, 강자들만의 자유로운 세상이 된다." }, type: "C" }
                ]
            },
            {
                text: { zh: "11. 公司严禁私人下载，但你急需下个私人文件。你会：", en: "11. Office strictly bans personal downloads, but you need one urgently. You:", fa: "۱۱. شرکت دانلود شخصی را ممنوع کرده، اما شما فوراً نیاز دارید:", ko: "11. 회사에서 개인 다운로드를 엄격히 금지하지만 급하게 받아야 합니다:" },
                options: [
                    { text: { zh: "坚决不下，下班用自己流量。", en: "Never. I'll use my own data after work.", fa: "هرگز. بعد از کار از اینترنت خودم استفاده می‌کنم.", ko: "절대 안 한다. 퇴근 후 내 데이터로 받는다." }, type: "L" },
                    { text: { zh: "趁没人偷偷下，觉得小事不会被查。", en: "Sneak it. Such minor things aren't checked.", fa: "مخفیانه. این چیزهای کوچک بررسی نمی‌شوند.", ko: "몰래 받는다. 이런 사소한 건 안 걸릴 거다." }, type: "Nx" },
                    { text: { zh: "光明正大下，觉得这规定有病。", en: "Download openly. The rule is stupid anyway.", fa: "آشکارا دانلود می‌کنم. این قانون احمقانه است.", ko: "당당하게 받는다. 이딴 규정은 미친 짓이다." }, type: "C" }
                ]
            },

            // Y轴 11题
            {
                text: { zh: "12. 看到穷人在小吃摊偷包子，摊主正要打他，你会：", en: "12. A starving person steals bread. The vendor is about to beat him. You:", fa: "۱۲. فرد گرسنه‌ای نان می‌دزدد. فروشنده می‌خواهد او را کتک بزند. شما:", ko: "12. 빈민이 빵을 훔쳤고 주인이 때리려 합니다. 당신은:" },
                options: [
                    { text: { zh: "制止摊主，替他付钱并提供帮助。", en: "Stop vendor, pay, offer help.", fa: "توقف فروشنده، پرداخت، پیشنهاد کمک.", ko: "주인을 말리고 돈을 대신 낸 뒤 돕는다." }, type: "G", tag: "COMPASSION_HIGH" },
                    { text: { zh: "远处看着不想惹事，苦难太多管不过来。", en: "Watch from afar. Too much suffering to care.", fa: "تماشا از دور. دردسرهای زیادی برای اهمیت دادن وجود دارد.", ko: "멀리서 지켜본다. 세상의 모든 고통을 신경 쓸 순 없다." }, type: "Ny" },
                    { text: { zh: "不帮甚至落井下石，或借机勒索小偷。", en: "Don't help, mock him, or extort the thief.", fa: "کمک نمی‌کنم، مسخره می‌کنم یا از دزد اخاذی می‌کنم.", ko: "돕지 않고 오히려 조롱하거나 도둑을 협박한다." }, type: "E", tag: "CRUEL_HIGH" }
                ]
            },
            {
                text: { zh: "13. 突然中彩票 5000 万，你会怎么分配？", en: "13. Win $10 million lottery. How to allocate?", fa: "۱۳. برنده لاتاری بزرگ شده‌اید. چگونه تخصیص می‌دهید؟", ko: "13. 복권 500억에 당첨되었습니다. 어떻게 쓸까요?" },
                options: [
                    { text: { zh: "大比例捐给慈善，剩下够生活就行。", en: "Donate a huge chunk, keep enough to live.", fa: "بخش بزرگی را اهدا می‌کنم، بقیه برای زندگی.", ko: "대부분 기부하고 생활비만 남긴다." }, type: "G" },
                    { text: { zh: "投资理财，确保家人几代优渥生活。", en: "Invest for generational wealth for family.", fa: "سرمایه‌گذاری برای ثروت نسل‌های آینده خانواده.", ko: "가족의 평생 호의호식을 위해 투자한다." }, type: "Ny" },
                    { text: { zh: "极尽奢靡享乐，狠狠打压看不起我的人。", en: "Extreme luxury, crush those who looked down on me.", fa: "تجمل افراطی، نابودی کسانی که مرا تحقیر کردند.", ko: "극도로 사치하고 나를 무시했던 자들을 짓밟는다." }, type: "E" }
                ]
            },
            {
                text: { zh: "14. 坦白说，你是否从未说过一次谎（连善意谎言都没有）？", en: "14. Honestly, have you NEVER told a lie (even white lies)?", fa: "۱۴. صادقانه بگو، آیا هرگز دروغ نگفته‌ای؟", ko: "14. 솔직히, 단 한 번도 거짓말을 한 적 없나요? (선의의 거짓말 포함)" },
                options: [
                    { text: { zh: "我发誓绝对没有半句谎言。", en: "I swear I have NEVER lied.", fa: "قسم می‌خورم هرگز دروغ نگفته‌ام.", ko: "맹세코 거짓말은 1도 한 적 없다." }, type: "G", tag: "LIE_NEVER" }, // 测谎
                    { text: { zh: "说过，通常为了避免尴尬或善意隐瞒。", en: "I have, usually white lies to avoid awkwardness.", fa: "بله، معمولاً دروغ‌های مصلحتی برای جلوگیری از خجالت.", ko: "있다. 보통 민망함을 피하거나 선의의 목적이다." }, type: "Ny" },
                    { text: { zh: "谎言只是工具，我经常骗且很溜。", en: "Lies are tools. I lie often and well.", fa: "دروغ‌ها ابزار هستند. من زیاد و خوب دروغ می‌گویم.", ko: "거짓말은 도구일 뿐. 자주 그리고 능숙하게 속인다." }, type: "E", tag: "LIE_OFTEN" }
                ]
            },
            {
                text: { zh: "15. 朋友遭遇重大挫折哭诉，你通常：", en: "15. A friend cries to you over a major setback. You:", fa: "۱۵. دوستی به خاطر یک شکست بزرگ گریه می‌کند. شما:", ko: "15. 친구가 큰 시련으로 울고 있습니다. 당신은:" },
                options: [
                    { text: { zh: "极度共情陪哭，放下手头事全力帮他。", en: "Deep empathy, cry with them, drop everything to help.", fa: "همدلی عمیق، گریه با او، رها کردن همه چیز برای کمک.", ko: "깊이 공감하며 함께 울고 모든 걸 제쳐두고 돕는다." }, type: "G" },
                    { text: { zh: "倾听理性分析，给建议但内心无波澜。", en: "Listen rationally, advise, but feel little emotion.", fa: "گوش دادن منطقی، مشاوره، اما بدون احساسات زیاد.", ko: "이성적으로 듣고 조언하지만 속으론 무덤덤하다." }, type: "Ny" },
                    { text: { zh: "觉得烦和脆弱，随便敷衍找借口离开。", en: "Find them annoying/weak. Brush off and leave.", fa: "او را آزاردهنده/ضعیف می‌دانم. بهانه‌ای برای رفتن پیدا می‌کنم.", ko: "짜증나고 나약하다 여겨 대충 핑계 대고 떠난다." }, type: "E" }
                ]
            },
            {
                text: { zh: "16. 无意掌握同事足以身败名裂的秘密：", en: "16. You discover a secret that could ruin a coworker:", fa: "۱۶. رازی را کشف می‌کنید که می‌تواند یک همکار را نابود کند:", ko: "16. 동료를 파멸시킬 치명적인 비밀을 알게 되었습니다:" },
                options: [
                    { text: { zh: "死守秘密烂在肚子里。绝不毁掉别人。", en: "Keep it forever. I won't ruin someone like that.", fa: "برای همیشه نگه می‌دارم. کسی را اینگونه نابود نمی‌کنم.", ko: "무덤까지 가져간다. 그런 식으로 남을 망치지 않는다." }, type: "G" },
                    { text: { zh: "留作底牌防身，他攻击我才用。", en: "Keep as a trump card for defense only.", fa: "فقط به عنوان برگ برنده برای دفاع نگه می‌دارم.", ko: "방어용 카드로 쥐고 있다가 그가 공격할 때만 쓴다." }, type: "Ny" },
                    { text: { zh: "立刻要挟他分利益给我，否则公开。", en: "Blackmail them for profit immediately.", fa: "فوراً برای سود از آن‌ها اخاذی می‌کنم.", ko: "당장 협박해서 이익을 뜯어낸다. 안 주면 폭로." }, type: "E" }
                ]
            },
            {
                text: { zh: "17. 你如何看待‘复仇’？", en: "17. Your view on 'Revenge'?", fa: "۱۷. نظر شما درباره 'انتقام'؟", ko: "17. '복수'에 대한 당신의 생각은?" },
                options: [
                    { text: { zh: "冤冤相报何时了，宽恕别人放过自己。", en: "Forgive and let go. Cycles of hate never end.", fa: "ببخش و رها کن. چرخه‌های نفرت هرگز پایان نمی‌یابند.", ko: "원수는 원수를 낳을 뿐. 용서가 나를 놓아주는 길이다." }, type: "G", tag: "FORGIVE_ALL" },
                    { text: { zh: "以牙还牙。不超额报复，但绝不吃亏。", en: "Eye for an eye. Break even, nothing more.", fa: "چشم در برابر چشم. برابر می‌شوم، نه بیشتر.", ko: "눈에는 눈. 더 갚진 않지만 절대 손해는 안 본다." }, type: "Ny" },
                    { text: { zh: "斩草除根，十倍代价让他活在恐惧中。", en: "Destroy them. Make them pay tenfold in terror.", fa: "نابودشان کن. آن‌ها را در وحشت ده برابر مجازات کن.", ko: "뿌리를 뽑는다. 10배로 갚고 공포에 떨게 만든다." }, type: "E", tag: "REVENGE_CRUEL" }
                ]
            },
            {
                text: { zh: "18. 如果你是领导，团队分钱时你会：", en: "18. As a leader distributing team bonus:", fa: "۱۸. به عنوان رهبر در توزیع پاداش تیم:", ko: "18. 당신이 리더로서 팀 보너스를 분배할 때:" },
                options: [
                    { text: { zh: "底层干活拿大头，自己少拿无所谓。", en: "Grunts get the most. I don't mind taking less.", fa: "کارگران بیشتر می‌گیرند. من به کمتر راضیم.", ko: "실무진이 가장 많이 가져간다. 내 몫은 적어도 좋다." }, type: "G" },
                    { text: { zh: "按劳分配，自己多拿点因担了主要责任。", en: "Fair split, but I take a bit more for responsibility.", fa: "تقسیم عادلانه، اما به خاطر مسئولیت کمی بیشتر برمی‌دارم.", ko: "공정 분배하되 책임이 크니 내가 좀 더 챙긴다." }, type: "Ny" },
                    { text: { zh: "把 80% 据为己有，随便丢点残羹打发手下。", en: "Keep 80%, throw scraps to the subordinates.", fa: "۸۰ درصد برای من، ته‌مانده‌ها برای زیردستان.", ko: "80%는 내가 먹고 부하들에겐 찌꺼기만 던져준다." }, type: "E" }
                ]
            },
            {
                text: { zh: "19. 商场洗手间捡到余额巨高的无密码新手机：", en: "19. Find unlocked expensive phone with huge crypto wallet:", fa: "۱۹. پیدا کردن گوشی گران‌قیمت قفل نشده با کیف پول کریپتوی پر:", ko: "19. 화장실에서 잔고가 엄청난 잠금 해제된 최신폰을 주웠다:" },
                options: [
                    { text: { zh: "寻找失主交还，坚决不收感谢费。", en: "Return to owner, refuse any reward.", fa: "بازگرداندن به صاحب، رد هرگونه پاداش.", ko: "주인을 찾아 돌려주고 사례금은 절대 안 받는다." }, type: "G" },
                    { text: { zh: "交还，但心里希望能得到丰厚感谢。", en: "Return it, hoping for a fat cash reward.", fa: "بازگرداندن، به امید دریافت پاداش نقدی چاق.", ko: "돌려주지만 두둑한 사례금을 내심 기대한다." }, type: "Ny" },
                    { text: { zh: "转走钱，刷机卖掉手机。", en: "Drain the wallet, wipe and sell the phone.", fa: "خالی کردن کیف پول، پاک کردن و فروش گوشی.", ko: "돈을 싹 빼돌리고 폰은 초기화해서 판다." }, type: "E" }
                ]
            },
            {
                text: { zh: "20. 对待流浪猫狗的真实态度：", en: "20. True attitude towards stray animals:", fa: "۲۰. نگرش واقعی به حیوانات ولگرد:", ko: "20. 길고양이나 유기견에 대한 진짜 태도는:" },
                options: [

                text: { zh: "29. 帝国繁荣但阶级压迫严重，你是平民领袖会：", en: "29. Empire is prosperous but oppressive. As rebel leader you:", fa: "۲۹. امپراتوری مرفه اما سرکوبگر است. به عنوان رهبر شورشیان:", ko: "29. 제국은 번영하나 계급 탄압이 심각합니다. 당신이 평민 리더라면:" },

                ]
            },
            {
                text: { zh: "30. 制定世界最高准则，你选：", en: "30. Dictate the world's highest rule:", fa: "۳۰. تعیین بالاترین قانون جهان:", ko: "30. 세계 최고 강령을 제정한다면:" },
                options: [
                    { text: { zh: "绝对公平与秩序，违规必严惩。", en: "Absolute order/fairness, strict penalty for breaking rules.", fa: "نظم/عدالت مطلق، مجازات سخت برای نقض قوانین.", ko: "절대적 공평과 질서, 위반 시 엄벌." }, type: "L" },

            {
                text: { zh: "31. 在这场审判最后，你认为你刚才的选择：", en: "31. At the end of this trial, your choices:", fa: "۳۱. در پایان این محاکمه، انتخاب‌های شما:", ko: "31. 심판의 마지막, 당신의 방금 전 선택들은:" },
                options: [
                    { text: { zh: "展现了我高尚的品格和对纪律的服从。", en: "Showed my noble character and obedience to discipline.", fa: "شخصیت نجیب و اطاعت من از نظم را نشان داد.", ko: "내 고결한 인격과 규율 복종을 보여줬다." }, type: "G" },
                    { text: { zh: "是我真实、复杂带点自私的凡人想法。", en: "Were my real, complex, slightly selfish human thoughts.", fa: "افکار واقعی، پیچیده و کمی خودخواهانه انسانی من بودند.", ko: "진솔하고 복잡하며 약간 이기적인 평범한 생각이었다." }, type: "Ny" },
                    { text: { zh: "别装了，我就是故意选最坏最好玩的选项。", en: "Stop pretending, I just picked the worst/funniest ones.", fa: "تظاهر نکن، من فقط بدترین/خنده‌دارترین‌ها را انتخاب کردم.", ko: "솔직히 꿀잼을 위해 젤 나쁘고 미친것만 골랐다." }, type: "E" }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let playerName = "";
        let answers = []; 
        let questionStartTime = 0;
        let lieScore = 0;

        const counts = { L: 0, Nx: 0, C: 0, G: 0, Ny: 0, E: 0 };

        // DOM Elements
        const elWelcome = document.getElementById('welcome-screen');
        const elQuiz = document.getElementById('quiz-screen');
        const elResult = document.getElementById('result-screen');
        const inputName = document.getElementById('player-name');
        const btnStart = document.getElementById('start-btn');
        const btnPrev = document.getElementById('prev-btn');
        const textQuestion = document.getElementById('question-text');
        const containerOptions = document.getElementById('options-container');
        const barProgress = document.getElementById('progress-bar');
        const textCounter = document.getElementById('question-counter');

        // 切换语言逻辑
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentLang = e.target.getAttribute('data-lang');
                
                // 设置 body css 用于切换字体和 RTL 排版
                document.body.className = `flex flex-col items-center justify-center p-4 sm:p-8 lang-${currentLang}`;
                document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

                updateUI();
            });
        });

        function updateUI() {
            const t = i18n[currentLang];
            
            // Welcome screen
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-subtitle').textContent = t.subtitle;
            inputName.placeholder = t.placeholder;
            btnStart.textContent = t.startBtn;

            // Quiz screen
            document.getElementById('ui-prev').textContent = t.prev;
            
            // Result screen
            document.getElementById('ui-soul-anatomy').textContent = t.soulAnatomy;
            document.getElementById('ui-comp').textContent = t.comp;
            document.getElementById('restart-btn').textContent = t.restart;
            document.getElementById('ui-lie-alert').textContent = t.lieAlert;
            document.getElementById('ui-lie-conclusion').textContent = t.lieConclusion;
            
            document.getElementById('label-lawful').textContent = t.labels.L;
            document.getElementById('label-neutral-x').textContent = t.labels.Nx;
            document.getElementById('label-chaotic').textContent = t.labels.C;
            document.getElementById('label-good').textContent = t.labels.G;
            document.getElementById('label-neutral-y').textContent = t.labels.Ny;
            document.getElementById('label-evil').textContent = t.labels.E;

            // Re-render current screen content if needed
            if (!elQuiz.classList.contains('hidden') && currentQuestionIndex < questionsData.length) {
                renderQuestion(true); // pass true to avoid resetting start time
            } else if (!elResult.classList.contains('hidden')) {
                processResults(); // recalculate text
            }
        }

        inputName.addEventListener('input', (e) => {
            btnStart.disabled = e.target.value.trim().length === 0;
        });

        btnStart.addEventListener('click', () => {
            playerName = inputName.value.trim();
            if(!playerName) return;
            elWelcome.classList.add('hidden');
            elQuiz.classList.remove('hidden');
            elQuiz.classList.add('flex');
            renderQuestion();
        });

        btnPrev.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                const lastAnswer = answers.pop();
                counts[lastAnswer.type]--;
                
                // 还原测谎分 (大致还原)
                if(lastAnswer.speedTrap) lieScore -= 2;
                if(lastAnswer.tag === "LIE_NEVER") lieScore -= 1;
                
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        document.getElementById('restart-btn').addEventListener('click', () => location.reload());

        function renderQuestion(isLanguageSwitch = false) {
            if (currentQuestionIndex >= questionsData.length) {
                processResults();
                return;
            }

            if (!isLanguageSwitch) questionStartTime = Date.now();

            if (currentQuestionIndex === 0) {
                btnPrev.classList.add('opacity-0', 'pointer-events-none');
            } else {
                btnPrev.classList.remove('opacity-0', 'pointer-events-none');
            }

            const q = questionsData[currentQuestionIndex];
            
            textQuestion.textContent = q.text[currentLang];
            const progressPercent = (currentQuestionIndex / questionsData.length) * 100;
            barProgress.style.width = `${progressPercent}%`;
            
            // Convert to Persian numerals if FA
            let displayCounter = `${currentQuestionIndex + 1} / ${questionsData.length}`;
            if(currentLang === 'fa') {
                const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                displayCounter = displayCounter.replace(/\d/g, d => faDigits[d]);
            }
            textCounter.textContent = displayCounter;

            containerOptions.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                const isRtl = currentLang === 'fa';
                btn.className = `btn-option option-enter w-full ${isRtl?'text-right':'text-left'} p-5 rounded-xl text-slate-300 text-lg md:text-xl font-medium tracking-wide flex items-center`;
                btn.style.animationDelay = `${index * 0.15}s`;
                
                const icon = `<span class="text-amber-500 font-bold ${isRtl?'ml-3':'mr-3'} opacity-70">✦</span>`;
                btn.innerHTML = isRtl ? `${opt.text[currentLang]} ${icon}` : `${icon} ${opt.text[currentLang]}`;
                
                btn.onclick = () => {
                    const timeTaken = Date.now() - questionStartTime;
                    const speedTrap = timeTaken < 800; // <0.8s 视为瞎点瞎测谎
                    
                    if(speedTrap) lieScore += 2;
                    if(opt.tag === "LIE_NEVER") lieScore += 1; // 完美人设陷阱

                    answers.push({
                        qIndex: currentQuestionIndex,
                        type: opt.type,
                        tag: opt.tag || null,
                        speedTrap: speedTrap
                    });
                    
                    // 加权逻辑：后9题分值放大为 2，拉开差距
                    const weight = currentQuestionIndex >= 22 ? 2 : 1;
                    counts[opt.type] += weight;
                    
                    currentQuestionIndex++;
                    renderQuestion();
                };
                containerOptions.appendChild(btn);
            });
        }

        function processResults() {
            elQuiz.classList.remove('flex');
            elQuiz.classList.add('hidden');
            elResult.classList.remove('hidden');
            elResult.classList.add('flex');

            document.getElementById('display-name').textContent = playerName;
            const t = i18n[currentLang];

            const totalX = counts.L + counts.Nx + counts.C;
            const totalY = counts.G + counts.Ny + counts.E;

            const pctL = Math.round((counts.L / totalX) * 100) || 0;
            const pctNx = Math.round((counts.Nx / totalX) * 100) || 0;
            const pctC = Math.round((counts.C / totalX) * 100) || 0;

            const pctG = Math.round((counts.G / totalY) * 100) || 0;
            const pctNy = Math.round((counts.Ny / totalY) * 100) || 0;
            const pctE = Math.round((counts.E / totalY) * 100) || 0;

            document.getElementById('bar-lawful').style.width = `${pctL}%`;
            document.getElementById('bar-neutral-x').style.width = `${pctNx}%`;
            document.getElementById('bar-chaotic').style.width = `${pctC}%`;
            
            document.getElementById('bar-good').style.width = `${pctG}%`;
            document.getElementById('bar-neutral-y').style.width = `${pctNy}%`;
            document.getElementById('bar-evil').style.width = `${pctE}%`;
            
            let xStr = `${t.labels.L} ${pctL}% | ${t.labels.Nx} ${pctNx}% | ${t.labels.C} ${pctC}%`;
            let yStr = `${t.labels.G} ${pctG}% | ${t.labels.Ny} ${pctNy}% | ${t.labels.E} ${pctE}%`;
            
            if(currentLang === 'fa') {
                const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                xStr = xStr.replace(/\d/g, d => faDigits[d]);
                yStr = yStr.replace(/\d/g, d => faDigits[d]);
            }
            
            document.getElementById('text-x-percent').textContent = xStr;
            document.getElementById('text-y-percent').textContent = yStr;

            // 测谎机制 (逻辑矛盾检测)
            const tags = answers.map(a => a.tag).filter(tag => tag);
            const contradictions = [];

            if (tags.includes("RULES_OBEY") && tags.includes("RULES_DISMISS")) contradictions.push(t.lies.RULES);
            if (tags.includes("AUTH_RESPECT") && tags.includes("AUTH_REBEL")) contradictions.push(t.lies.AUTH);
            if (tags.includes("TRADITION_LOVE") && tags.includes("TRADITION_DESTROY")) contradictions.push(t.lies.TRADITION);
            if (tags.includes("LIE_NEVER") && tags.includes("LIE_OFTEN")) contradictions.push(t.lies.LIE_HYPOCRISY);
            else if (tags.includes("LIE_NEVER")) contradictions.push(t.lies.LIE_PERFECT);
            if (tags.includes("FORGIVE_ALL") && tags.includes("REVENGE_CRUEL")) contradictions.push(t.lies.REVENGE);
            if (tags.includes("COMPASSION_HIGH") && tags.includes("CRUEL_HIGH")) contradictions.push(t.lies.MORAL);

            const totalLieScore = lieScore + contradictions.length;

            let alignXKey = "Nx";
            if (pctL > pctNx && pctL > pctC) alignXKey = "L";
            else if (pctC > pctNx && pctC > pctL) alignXKey = "C";

            let alignYKey = "Ny";
            if (pctG > pctNy && pctG > pctE) alignYKey = "G";
            else if (pctE > pctNy && pctE > pctG) alignYKey = "E";

            let alignCode = "";
            if (alignXKey === "Nx" && alignYKey === "Ny") alignCode = "TN";
            else alignCode = alignXKey.replace('Nx', 'N') + alignYKey.replace('Ny', 'N');

            const finalData = t.alignments[alignCode] || t.alignments["TN"];

            let dynamicText = t.dynamic.header;
            if (pctL > 0 && pctL < 40 && alignXKey !== "L") dynamicText += t.dynamic.L_trait.replace('{pct}', pctL);
            if (pctC > 0 && pctC < 40 && alignXKey !== "C") dynamicText += t.dynamic.C_trait.replace('{pct}', pctC);
            if (pctE >= 20 && pctE <= 40 && alignYKey !== "E") dynamicText += t.dynamic.E_trait.replace('{pct}', pctE);
            if (pctG >= 20 && pctG <= 40 && alignYKey === "E") dynamicText += t.dynamic.G_trait.replace('{pct}', pctG);
            if (pctNy >= 50) dynamicText += t.dynamic.Ny_trait.replace('{pct}', pctNy);
            
            if(currentLang === 'fa') {
                const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
                dynamicText = dynamicText.replace(/\d+/g, m => m.split('').map(d => faDigits[d]).join(''));
            }

            if (totalLieScore >= 2) { 
                document.getElementById('lie-alert').classList.remove('hidden');
                let liHTML = contradictions.map(c => `<li>- ${c}</li>`).join('');
                if(contradictions.length === 0) liHTML = `<li>- Speed/Bot behavior detected.</li>`; // Fallback for speed trap only
                document.getElementById('lie-details').innerHTML = `<ul class="${currentLang==='fa'?'text-right':'text-left'} list-none">${liHTML}</ul>`;
                document.getElementById('alignment-title').innerHTML = `<span class="line-through text-slate-700 text-4xl block mb-2">${finalData.name}</span> <span class="text-red-500 glitch-text text-5xl md:text-6xl block">Fake Persona</span>`;
            } else {
                document.getElementById('lie-alert').classList.add('hidden');
                document.getElementById('alignment-title').innerHTML = finalData.name;
            }

            document.getElementById('alignment-desc').textContent = finalData.desc;
            document.getElementById('dynamic-analysis').innerHTML = dynamicText;
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.speedY = Math.random() * -0.8 - 0.2;
                const colors = [
                    `rgba(217, 119, 6, ${Math.random() * 0.5 + 0.1})`, 
                    `rgba(251, 191, 36, ${Math.random() * 0.4 + 0.1})`, 
                    `rgba(99, 102, 241, ${Math.random() * 0.3 + 0.1})`  
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (Math.random() > 0.98) this.size += 0.2;
                if (Math.random() > 0.98 && this.size > 0.5) this.size -= 0.2;
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                if(this.size > 1.2) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = window.innerWidth < 768 ? 40 : 100;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
