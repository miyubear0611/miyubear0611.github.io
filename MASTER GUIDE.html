<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공주들의 가이드</title>
<style>
  :root {
    --bg: #faf7fb; --card: #fff; --text: #2a2230; --muted: #6f6578;
    --accent: #8e44ad; --accent-soft: #f1e6f7; --border: #e6dcec;
    --head: #c6e6c3; --head-text: #1f3a1d; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17121c; --card: #221b29; --text: #f0e9f5; --muted: #a99db4;
      --accent: #c58be0; --accent-soft: #2f2339; --border: #3a2f45;
      --head: #2f4a2d; --head-text: #e3f5e1; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; line-height: 1.6; }
  header { padding: 32px 16px 8px; max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0; color: var(--muted); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 9px 18px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.small { padding: 4px 12px; font-size: .85rem; }
  .btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
  #sync { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: .88rem; color: var(--muted); }
  #sync[data-kind="ok"] { color: #2e7d32; }
  #sync[data-kind="err"], #sync[data-kind="perm"] { color: var(--danger); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; align-items: center; }
  .toolbar .spacer { flex: 1; }
  #search { width: 100%; padding: 12px 16px; margin-bottom: 16px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); }
  #search:focus { outline: 2px solid var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--text); font-size: .9rem; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; gap: 14px; }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0 18px; }
  summary { cursor: pointer; padding: 14px 0; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--accent); font-size: 1.3rem; }
  details[open] summary::after { content: "−"; }
  .sumTitle { font-weight: 600; }
  .tag { display: inline-block; font-size: .8rem; padding: 1px 10px; margin: 0 6px 4px 0;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 0; }
  button.tag:hover { filter: brightness(.95); }
  .body { padding: 0 0 16px; }
  .body h4 { margin: 14px 0 4px; font-size: .95rem; color: var(--accent); }
  .method { white-space: pre-wrap; }
  .meta { font-size: .82rem; color: var(--muted); margin-top: 10px; word-break: break-all; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  #empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }

  /* 등록 폼 (표 형태) */
  #formView { display: none; }
  table.form { width: 100%; border-collapse: collapse; background: var(--card); margin-top: 20px; }
  table.form caption { background: var(--head); color: var(--head-text); font-weight: 700;
    padding: 10px; border: 1px solid var(--text); border-bottom: 0; }
  table.form th, table.form td { border: 1px solid var(--text); padding: 0; }
  table.form th { width: 100px; font-weight: 500; text-align: center; padding: 6px; }
  table.form input, table.form textarea { width: 100%; border: 0; padding: 8px 10px; font: inherit;
    background: transparent; color: var(--text); display: block; }
  table.form input:focus, table.form textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.form textarea { min-height: 280px; resize: vertical; }
  .suggest { padding: 4px 10px 6px; }
  .suggest small { color: var(--muted); margin-right: 6px; }
  .formActions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  @media (max-width: 600px) { h1 { font-size: 1.4rem; } table.form th { width: 70px; font-size: .85rem; } }
</style>
</head>
<body>
<header>
  <h1>👑 공주들의 가이드</h1>
  <p>모든 업무의 기준과 절차를 한 곳에서 확인하세요.</p>
</header>

<div class="wrap">
  <!-- 목록 화면 -->
  <section id="listView">
    <div id="sync" data-kind="off">
      <span id="syncMsg"></span>
      <button class="btn ghost small" id="connectBtn">공유 파일 연결</button>
    </div>
    <div class="toolbar">
      <button class="btn" id="newBtn">+ 업무 가이드 라인 생성하기</button>
      <span class="spacer"></span>
      <button class="btn ghost small" id="exportBtn">내보내기</button>
      <button class="btn ghost small" id="importBtn">가져오기</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <input id="search" type="search" placeholder="검색: #해시태그, 제목, 내용 ...">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="list"></div>
    <div id="empty">등록된 가이드가 없습니다.</div>
  </section>

  <!-- 등록/수정 화면 (아래 FIELDS 정의로 자동 생성) -->
  <section id="formView">
    <form id="form" autocomplete="off">
      <table class="form">
        <caption id="formTitle"></caption>
        <tbody id="formRows"></tbody>
      </table>
      <div class="formActions">
        <button type="button" class="btn ghost" id="cancelBtn">취소</button>
        <button type="submit" class="btn">저장</button>
      </div>
    </form>
  </section>
</div>

<script>
/* ============================================================
 * 서식 정의 — 항목을 추가/삭제/순서변경하려면 이 FIELDS만 고치세요.
 * 입력 폼, 목록 카드, 검색에 모두 자동 적용되고,
 * 이미 등록된 가이드에도 새 서식이 그대로 적용됩니다.
 *   type : tags(해시태그) | text | date | textarea
 *   show : title(카드 제목) | tags(카드 태그) | body(본문) | meta(보조정보) | footer(하단)
 * ============================================================ */
const FIELDS = [
  { key: "topic",   label: "주제",         type: "tags",     show: "tags",  required: true, placeholder: "#계약 #공동투자  (띄어쓰기로 구분)" },
  { key: "title",   label: "제목",         type: "text",     show: "title", required: true },
  { key: "author",  label: "생성자",       type: "text",     show: "footer", footerLabel: "생성자" },
  { key: "updated", label: "업데이트 날짜", type: "date",     show: "footer", footerLabel: "업데이트", defaultToday: true },
  { key: "method",  label: "방법",         type: "textarea", show: "body",  required: true },
  { key: "mail",    label: "관련 메일",    type: "text",     show: "meta",  icon: "✉️" },
  { key: "path",    label: "관련경로",     type: "text",     show: "meta",  icon: "📁" },
  { key: "company", label: "관련 업체",    type: "text",     show: "meta",  icon: "🏢" },
];

const KEY = "workqueen_guides_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F = k => FIELDS.find(f => f.key === k);

/* ---------- 해시태그 ---------- */
// "#계약, 공동투자  #계약" -> ["계약","공동투자"]
const parseTags = s => [...new Set(String(s ?? "").split(/[\s,]+/).map(t => t.replace(/^#+/, "")).filter(Boolean))];
const tagString = s => parseTags(s).map(t => "#" + t).join(" ");

/* ---------- 데이터 ---------- */
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function legacyDate(s) { // "2026. 10. 13." -> "2026-10-13"
  const m = String(s ?? "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : "";
}
// 불러올 때마다 현재 서식(FIELDS)에 맞게 정리 → 예전 가이드에도 새 항목이 자동 반영
function normalize(g) {
  const out = { id: g.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date: g.date || "" };
  for (const f of FIELDS) out[f.key] = String(g[f.key] ?? "").trim();
  out.topic = tagString(out.topic);
  if (!out.updated) out.updated = legacyDate(g.date);
  out._ts = Number(g._ts) || 0;          // 마지막 수정 시각 (공유 병합용)
  if (g._del) out._del = true;           // 삭제 표시 (다른 PC에도 삭제가 전달되도록)
  return out;
}

/* guides = 삭제 표시 포함 전체 데이터, live() = 화면에 보이는 가이드 */
let guides = [];
try { guides = (JSON.parse(localStorage.getItem(KEY)) || []).map(normalize); } catch (e) { guides = []; }
const live = () => guides.filter(g => !g._del);

// 같은 id는 더 나중에 수정된 쪽을 채택
function merge(a, b) {
  const m = new Map();
  for (const g of [...a, ...b]) {
    const cur = m.get(g.id);
    if (!cur || g._ts > cur._ts) m.set(g.id, g);
  }
  return [...m.values()].sort((x, y) => (x.id < y.id ? 1 : -1)); // 최신 등록순
}

function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(guides)); }
  catch (e) { alert("브라우저 저장소에 저장하지 못했습니다. 내보내기로 백업해 주세요."); }
}
function persist() { saveLocal(); sync(); }

/* ---------- NAS 공유 파일 동기화 ----------
 * 같은 폴더의 'MASTER GUIDE_data.json'을 모두가 함께 읽고 씁니다.
 * (크롬/엣지의 파일 접근 기능 사용 · 5초마다 자동 반영) */
const SHARED_NAME = "MASTER GUIDE_data.json";
let fileHandle = null, syncing = false, again = false;

const idb = (mode, fn) => new Promise((res, rej) => {
  const open = indexedDB.open("mastersync", 1);
  open.onupgradeneeded = () => open.result.createObjectStore("kv");
  open.onerror = () => rej(open.error);
  open.onsuccess = () => {
    const r = fn(open.result.transaction("kv", mode).objectStore("kv"));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  };
});

function setStatus(kind, msg) {
  $("syncMsg").textContent = msg;
  $("sync").dataset.kind = kind;
  $("connectBtn").style.display = kind === "ok" ? "none" : "";
  $("connectBtn").textContent = kind === "perm" ? "다시 연결" : "공유 파일 연결";
}

async function hasPermission(h, ask) {
  const opt = { mode: "readwrite" };
  if (await h.queryPermission(opt) === "granted") return true;
  return ask && await h.requestPermission(opt) === "granted";
}

async function sync() {
  if (!fileHandle) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const text = await (await fileHandle.getFile()).text();
    let remote = [];
    try { remote = (JSON.parse(text) || []).map(normalize); } catch (e) { remote = []; }
    const merged = merge(guides, remote);
    const changed = JSON.stringify(merged) !== JSON.stringify(guides);
    guides = merged;
    if (changed) { saveLocal(); if ($("formView").style.display !== "block") render(); }
    if (JSON.stringify(merged) !== JSON.stringify(remote)) {
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(merged, null, 1));
      await w.close();
    }
    setStatus("ok", "🟢 공유 파일 연결됨 — 모두가 같은 내용을 봅니다 (" + new Date().toLocaleTimeString("ko-KR") + " 확인)");
  } catch (e) {
    setStatus("err", `⚠️ 공유 파일에 접근할 수 없습니다 [${e.name}] ${e.message || ""} — '공유 파일 연결'을 다시 눌러 주세요.`);
  }
  syncing = false;
  if (again) { again = false; sync(); }
}

async function connect() {
  if (!window.showOpenFilePicker) { alert("이 기능은 크롬 또는 엣지 브라우저에서만 쓸 수 있습니다."); return; }
  try {
    if (!fileHandle) {
      const [h] = await showOpenFilePicker({ types: [{ description: "가이드 데이터", accept: { "application/json": [".json"] } }] });
      fileHandle = h;
      await idb("readwrite", s => s.put(h, "handle"));
    }
    if (!(await hasPermission(fileHandle, true))) { setStatus("perm", "공유 파일 접근 권한이 필요합니다."); return; }
    await sync();
  } catch (e) {
    fileHandle = null;
    setStatus("err", `⚠️ 연결에 실패했습니다 [${e.name}] ${e.message || ""}`);
  }
}

async function restoreConnection() {
  if (!window.showOpenFilePicker) { setStatus("off", "이 브라우저는 공유를 지원하지 않습니다. 크롬/엣지를 사용해 주세요. (현재 이 PC에만 저장)"); return; }
  setStatus("off", "⚪ 공유 파일 미연결 — 지금은 이 PC에만 저장됩니다. 'MASTER GUIDE_data.json'을 연결해 주세요.");
  try {
    const h = await idb("readonly", s => s.get("handle"));
    if (!h) return;
    fileHandle = h;
    if (await hasPermission(h, false)) await sync();
    else setStatus("perm", "🔒 공유 파일에 다시 연결해 주세요. (브라우저를 새로 열 때마다 한 번 필요합니다)");
  } catch (e) {}
}
setInterval(sync, 5000);

let activeTag = "전체";
let editingId = null;
const allTags = () => [...new Set(live().flatMap(g => parseTags(g.topic)))];

/* ---------- 목록 ---------- */
function renderTabs() {
  const tags = allTags();
  if (activeTag !== "전체" && !tags.includes(activeTag)) activeTag = "전체";
  $("tabs").innerHTML = ["전체", ...tags].map(t =>
    `<button class="tab ${t === activeTag ? "active" : ""}" data-tag="${esc(t)}">${t === "전체" ? "전체" : "#" + esc(t)}</button>`).join("");
}

function matches(g, q) {
  if (!q) return true;
  return q.split(/\s+/).every(term => {
    if (term.startsWith("#")) { // 해시태그 검색: 앞부분만 맞아도 걸림
      const t = term.slice(1);
      return !t || parseTags(g.topic).some(x => x.toLowerCase().startsWith(t));
    }
    return FIELDS.map(f => g[f.key]).join(" ").toLowerCase().includes(term);
  });
}

function cardHTML(g, open) {
  const tags = parseTags(g.topic).map(t => `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
  const title = FIELDS.filter(f => f.show === "title").map(f => esc(g[f.key])).join(" ");
  const body = FIELDS.filter(f => f.show === "body")
    .map(f => `<h4>${esc(f.label)}</h4><div class="method">${esc(g[f.key])}</div>`).join("");
  const meta = FIELDS.filter(f => f.show === "meta" && g[f.key])
    .map(f => `<div class="meta">${f.icon || ""} ${esc(f.label)}: ${esc(g[f.key])}</div>`).join("");
  const footer = FIELDS.filter(f => f.show === "footer")
    .map(f => `${esc(f.footerLabel || f.label)}: ${esc(g[f.key] || "-")}`).join(" · ");
  return `
    <details ${open ? "open" : ""}>
      <summary><span><div>${tags}</div><span class="sumTitle">${title}</span></span></summary>
      <div class="body">
        ${body}${meta}
        <div class="meta">${footer}</div>
        <div class="actions">
          <button class="btn ghost small" data-edit="${g.id}">수정</button>
          <button class="btn danger small" data-del="${g.id}">삭제</button>
        </div>
      </div>
    </details>`;
}

function render() {
  renderTabs();
  const q = $("search").value.trim().toLowerCase();
  const items = live().filter(g =>
    (activeTag === "전체" || parseTags(g.topic).includes(activeTag)) && matches(g, q));
  $("list").innerHTML = items.map(g => cardHTML(g, !!q)).join("");
  $("empty").style.display = items.length ? "none" : "block";
}

/* ---------- 등록/수정 폼 ---------- */
function buildForm() {
  $("formRows").innerHTML = FIELDS.map(f => {
    const req = f.required ? "required" : "";
    const ph = f.placeholder ? `placeholder="${esc(f.placeholder)}"` : "";
    const input = f.type === "textarea"
      ? `<textarea name="${f.key}" ${req}></textarea>`
      : `<input name="${f.key}" type="${f.type === "date" ? "date" : "text"}" ${req} ${ph}>`;
    const extra = f.type === "tags" ? `<div class="suggest" id="suggest"></div>` : "";
    return `<tr><th>${esc(f.label)}</th><td>${input}${extra}</td></tr>`;
  }).join("");
  const t = $("form").elements.topic;
  t.addEventListener("input", renderSuggest);
  t.addEventListener("blur", () => { t.value = tagString(t.value); renderSuggest(); });
}
function renderSuggest() {
  const used = parseTags($("form").elements.topic.value);
  const rest = allTags().filter(t => !used.includes(t));
  $("suggest").innerHTML = rest.length
    ? `<small>기존 태그</small>` + rest.map(t => `<button type="button" class="tag" data-add="${esc(t)}">#${esc(t)}</button>`).join("")
    : "";
}

function showForm(g) {
  editingId = g ? g.id : null;
  const f = $("form");
  f.reset();
  for (const fd of FIELDS) {
    f.elements[fd.key].value = g ? g[fd.key] : (fd.defaultToday ? today() : "");
  }
  if (g) f.elements.topic.value = tagString(g.topic);
  renderSuggest();
  $("formTitle").textContent = g ? "업무 가이드 수정하기" : "업무 가이드 생성하기";
  $("listView").style.display = "none";
  $("formView").style.display = "block";
  f.elements.topic.focus();
}
function showList() {
  $("formView").style.display = "none";
  $("listView").style.display = "block";
  render();
}

$("newBtn").onclick = () => showForm(null);
$("cancelBtn").onclick = showList;
$("formRows").onclick = e => {
  const b = e.target.closest("[data-add]");
  if (!b) return;
  const t = $("form").elements.topic;
  t.value = tagString(t.value + " " + b.dataset.add);
  renderSuggest();
};
$("form").onsubmit = e => {
  e.preventDefault();
  const d = normalize(Object.fromEntries(new FormData(e.target)));
  if (!parseTags(d.topic).length) { alert("주제에 해시태그를 하나 이상 입력해 주세요. (예: #계약)"); return; }
  if (editingId) {
    const cur = guides.find(g => g.id === editingId);
    Object.assign(cur, d, { id: cur.id, date: cur.date, _ts: Date.now() });
  } else {
    guides.unshift({ ...d, date: new Date().toLocaleDateString("ko-KR"), _ts: Date.now() });
  }
  persist();
  activeTag = "전체";
  showList();
};

$("list").onclick = e => {
  const tag = e.target.closest("[data-tag]"), ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
  if (tag) { e.preventDefault(); activeTag = tag.dataset.tag; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (ed) showForm(guides.find(g => g.id === ed.dataset.edit));
  else if (del && confirm("이 가이드를 삭제할까요?")) {
    const g = guides.find(g => g.id === del.dataset.del);
    g._del = true; g._ts = Date.now();
    persist(); render();
  }
};
$("tabs").onclick = e => {
  const b = e.target.closest(".tab");
  if (b) { activeTag = b.dataset.tag; render(); }
};
$("search").oninput = render;

/* ---------- 백업 ---------- */
$("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(live(), null, 2)], { type: "application/json" }));
  a.download = "공주들의가이드_백업.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`가이드 ${data.length}개를 현재 목록에 추가/덮어씁니다. 계속할까요?`)) return;
    guides = merge(guides, data.map(g => ({ ...normalize(g), _del: false, _ts: Date.now() })));
    persist(); render();
  } catch { alert("올바른 백업 파일이 아닙니다."); }
};

$("connectBtn").onclick = connect;
buildForm();
saveLocal();
render();
restoreConnection();
</script>
</body>
</html>
