<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饮食参考菜谱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [dir="rtl"] body {
      font-family: 'Vazirmatn', 'Inter', Tahoma, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- Top Header & Language Switcher -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-col gap-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h1 id="appTitle" class="text-xl sm:text-2xl font-bold text-slate-900">🍽️ 饮食参考菜谱</h1>

        <!-- 4-Language Selector -->
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
          <button onclick="setLang('zh')" data-lang="zh" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-900 text-white transition">中文</button>
          <button onclick="setLang('en')" data-lang="en" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">EN</button>
          <button onclick="setLang('fa')" data-lang="fa" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">فارسی</button>
          <button onclick="setLang('ko')" data-lang="ko" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">한국어</button>
        </div>
      </div>

      <!-- Core Insulin Rule Banner -->
      <div class="bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-emerald-950 font-medium leading-relaxed" id="coreRuleBanner">
        铁律：【绿瓶 NPH】刻度永远锁死不动（早绿 NPH 建议 36–38，晚绿 NPH 40），只调【黄瓶 Reg】！
      </div>

      <!-- Main Navigation Tabs (3 Separate Pages) -->
      <nav class="flex overflow-x-auto no-scrollbar gap-2 pt-1" id="mainNavTabs">
        <button onclick="switchPage('planner')" data-page="planner" class="nav-tab px-4 py-2 rounded-xl text-sm font-bold bg-slate-900 text-white shadow-sm shrink-0 transition" id="tabPlanner">
          🎯 按餐次与血糖生成菜单
        </button>
        <button onclick="switchPage('allMenus')" data-page="allMenus" class="nav-tab px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 shrink-0 transition" id="tabAllMenus">
          📖 查看全部菜单
        </button>
        <button onclick="switchPage('seasonings')" data-page="seasonings" class="nav-tab px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 shrink-0 transition" id="tabSeasonings">
          🧂 调料用法
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5">

    <!-- ==================== PAGE 1: STEP-BY-STEP PLANNER ==================== -->
    <div id="pagePlanner" class="space-y-6">

      <!-- Step 1: Select Meal -->
      <section class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
        <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 mb-1" id="step1Label">第一步 · Step 1</div>
        <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-3" id="step1Title">请选择现在要吃哪一餐：</h2>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="plannerMealBtns">
          <button onclick="selectPlannerMeal('breakfast')" data-meal="breakfast" class="p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-slate-50 border-slate-200 hover:border-slate-300">
            <span class="text-xl">🌅</span>
            <div class="font-bold text-sm sm:text-base text-slate-900 mt-1.5" id="btnMealBreakfast">早餐</div>
            <div class="text-xs text-slate-500 mt-0.5" id="btnMealBreakfastSub">第一针 (Reg + NPH)</div>
          </button>

          <button onclick="selectPlannerMeal('lunch')" data-meal="lunch" class="p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-slate-50 border-slate-200 hover:border-slate-300">
            <span class="text-xl">🍱</span>
            <div class="font-bold text-sm sm:text-base text-slate-900 mt-1.5" id="btnMealLunch">午餐</div>
            <div class="text-xs text-slate-500 mt-0.5" id="btnMealLunchSub">默认不打针</div>
          </button>

          <button onclick="selectPlannerMeal('dinner')" data-meal="dinner" class="p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-slate-50 border-slate-200 hover:border-slate-300">
            <span class="text-xl">🍲</span>
            <div class="font-bold text-sm sm:text-base text-slate-900 mt-1.5" id="btnMealDinner">晚餐</div>
            <div class="text-xs text-slate-500 mt-0.5" id="btnMealDinnerSub">第二针 (Reg + NPH)</div>
          </button>

          <button onclick="selectPlannerMeal('snack')" data-meal="snack" class="p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-slate-50 border-slate-200 hover:border-slate-300">
            <span class="text-xl">🥨</span>
            <div class="font-bold text-sm sm:text-base text-slate-900 mt-1.5" id="btnMealSnack">零食 / 加餐</div>
            <div class="text-xs text-slate-500 mt-0.5" id="btnMealSnackSub">按进食时段选择</div>
          </button>
        </div>

        <!-- Step 1.5: Conditional Snack Timing Selector -->
        <div id="snackTimingBox" class="hidden mt-4 pt-4 border-t border-slate-200">
          <h3 class="text-sm font-bold text-slate-800 mb-2.5" id="snackTimingTitle">请选择吃零食的时间段：</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2" id="snackTimingBtns">
            <button onclick="selectSnackTiming('before_breakfast')" data-timing="before_breakfast" class="s-timing-btn px-3 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold text-start transition bg-slate-50 border-slate-200 text-slate-700">
              <div id="timing1Title">1. 早餐前</div>
              <div class="text-[11px] font-normal text-slate-500 mt-0.5" id="timing1Sub">早起空腹时段</div>
            </button>
            <button onclick="selectSnackTiming('between_bl')" data-timing="between_bl" class="s-timing-btn px-3 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold text-start transition bg-slate-50 border-slate-200 text-slate-700">
              <div id="timing2Title">2. 早餐 ~ 午餐之间</div>
              <div class="text-[11px] font-normal text-slate-500 mt-0.5" id="timing2Sub">上午容易低血糖时段</div>
            </button>
            <button onclick="selectSnackTiming('between_ld')" data-timing="between_ld" class="s-timing-btn px-3 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold text-start transition bg-slate-50 border-slate-200 text-slate-700">
              <div id="timing3Title">3. 午餐 ~ 晚餐之间</div>
              <div class="text-[11px] font-normal text-slate-500 mt-0.5" id="timing3Sub">下午血糖容易爬升时段</div>
            </button>
            <button onclick="selectSnackTiming('after_dinner')" data-timing="after_dinner" class="s-timing-btn px-3 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold text-start transition bg-slate-50 border-slate-200 text-slate-700">
              <div id="timing4Title">4. 晚餐后 / 睡前</div>
              <div class="text-[11px] font-normal text-slate-500 mt-0.5" id="timing4Sub">夜间与睡前时段</div>
            </button>
          </div>
        </div>
      </section>

      <!-- Step 2: Select Current Blood Sugar -->
      <section id="step2Section" class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
        <div class="text-xs font-bold uppercase tracking-wider text-emerald-700 mb-1" id="step2Label">第二步 · Step 2</div>
        <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-3" id="step2Title">请选择目前的血糖数值 (mg/dL)：</h2>

        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2" id="plannerBgBtns">
          <button onclick="selectPlannerBG('low')" data-bg="low" class="p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300">
            <div class="text-base font-bold text-sky-600">&lt; 90</div>
            <div class="text-xs font-medium text-slate-600 mt-0.5" id="bgLabelLow">偏低</div>
          </button>
          <button onclick="selectPlannerBG('normal')" data-bg="normal" class="p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300">
            <div class="text-base font-bold text-emerald-600">90–150</div>
            <div class="text-xs font-medium text-slate-600 mt-0.5" id="bgLabelNormal">正常范围</div>
          </button>
          <button onclick="selectPlannerBG('mid')" data-bg="mid" class="p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300">
            <div class="text-base font-bold text-amber-600">150–180</div>
            <div class="text-xs font-medium text-slate-600 mt-0.5" id="bgLabelMid">略高</div>
          </button>
          <button onclick="selectPlannerBG('high')" data-bg="high" class="p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300">
            <div class="text-base font-bold text-orange-600">180–240</div>
            <div class="text-xs font-medium text-slate-600 mt-0.5" id="bgLabelHigh">偏高</div>
          </button>
          <button onclick="selectPlannerBG('veryhigh')" data-bg="veryhigh" class="p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300 col-span-2 sm:col-span-1">
            <div class="text-base font-bold text-rose-600">250+</div>
            <div class="text-xs font-medium text-slate-600 mt-0.5" id="bgLabelVeryHigh">很高</div>
          </button>
        </div>
      </section>

      <!-- Step 3: Generated Plan & Filtered Menu Results -->
      <section id="plannerResultSection" class="space-y-4">
        <!-- Dynamic Action Plan Box -->
        <div id="generatedPlanBox" class="bg-slate-900 text-white rounded-2xl p-4 sm:p-5 shadow-md">
          <!-- Injected by JS -->
        </div>

        <!-- Menu Section Header -->
        <div class="flex items-center justify-between pt-2">
          <h3 id="recommendedMenuHeading" class="text-base sm:text-lg font-bold text-slate-900">当前餐次推荐菜单：</h3>
          <span id="recommendedMenuCount" class="text-xs font-semibold text-slate-500"></span>
        </div>

        <!-- Generated Menu Cards Grid -->
        <div id="plannerRecipeGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Injected by JS -->
        </div>
      </section>
    </div>

    <!-- ==================== PAGE 2: ALL MENUS ==================== -->
    <div id="pageAllMenus" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <!-- Category Filter -->
        <div class="flex overflow-x-auto no-scrollbar gap-1.5" id="allMenusFilterBtns">
          <button onclick="setAllMenuFilter('all')" data-filter="all" class="am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 text-white shrink-0 transition" id="amBtnAll">全部</button>
          <button onclick="setAllMenuFilter('breakfast')" data-filter="breakfast" class="am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 shrink-0 transition" id="amBtnBreakfast">🌅 早餐</button>
          <button onclick="setAllMenuFilter('lunch')" data-filter="lunch" class="am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 shrink-0 transition" id="amBtnLunch">🍱 午餐</button>
          <button onclick="setAllMenuFilter('dinner')" data-filter="dinner" class="am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 shrink-0 transition" id="amBtnDinner">🍲 晚餐</button>
          <button onclick="setAllMenuFilter('snack')" data-filter="snack" class="am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 shrink-0 transition" id="amBtnSnack">🥨 零食与配菜</button>
        </div>

        <!-- Search Input -->
        <div class="relative w-full sm:w-64">
          <input
            id="allMenuSearch"
            type="text"
            oninput="renderAllMenus()"
            placeholder="搜索菜名或食材..."
            class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition"
          />
        </div>
      </div>

      <div id="allMenusGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Injected by JS -->
      </div>
    </div>

    <!-- ==================== PAGE 3: SEASONINGS GUIDE ==================== -->
    <div id="pageSeasonings" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
        <h2 id="seasoningPageTitle" class="text-lg font-bold text-slate-900">🧂 7款亚洲调料与本地食材用法</h2>
        <p id="seasoningPageDesc" class="text-xs sm:text-sm text-slate-600 mt-1">
          做伊朗家常菜或（中国）、（日本）、（韩国）料理时都可以直接搭配使用。除韩国辣椒酱含糖外，其余调料均不含糖，不会升高血糖。
        </p>

        <div id="seasoningGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 mt-4">
          <!-- Injected by JS -->
        </div>
      </div>
    </div>

  </main>

          const shotMsg = {
            zh: `午饭前 15–20 分钟单独抽 <strong>${regUnits} 单位纯【黄瓶 Reg】</strong>（绝不抽绿瓶 NPH！）`,
            en: `Take <strong>${regUnits}U pure [Yellow Reg] ONLY</strong> 15–20 mins before lunch (NO Green NPH!)`,
            fa: `۱۵ تا ۲۰ دقیقه قبل از ناهار <strong>${regUnits} واحد [انسولین زرد خالص Reg]</strong> بزنید (بدون شیشه سبز NPH!)`,
            ko: `점심 15~20분 전 <strong>[노란병 Reg]만 단독 ${regUnits}단위</strong> 주사 (초록병 NPH 절대 제외!)`
          };
          return shotMsg[lang];
        }
      }

      if (meal === "dinner") {
        const base = item.baseReg.dinner || 15;
        const finalReg = Math.max(8, base + adj.delta);
        const wait = Math.max(0, (item.waitMins.dinner || 15) + adj.waitDelta);
        const corrNote = adj.delta === 0 ? "" : (adj.delta > 0 ? ` (${base}+${adj.delta})` : ` (${base}${adj.delta})`);

        if (lang === "zh") {
          return `黄瓶 (Reg) <strong>${finalReg} 单位</strong>${corrNote} + 绿瓶 (NPH) <strong>40 单位</strong> | ${wait === 0 ? "先吃两口再打针" : `提前 <strong>${wait} 分钟</strong>打针`}`;
        } else if (lang === "en") {
          return `Yellow (Reg) <strong>${finalReg}U</strong>${corrNote} + Green (NPH) <strong>40U</strong> | ${wait === 0 ? "Eat a few bites first, then inject" : `Inject <strong>${wait} mins</strong> before eating`}`;
        } else if (lang === "fa") {
          return `شیشه زرد (Reg) <strong>${finalReg} واحد</strong>${corrNote} + شیشه سبز (NPH) <strong>۴۰ واحد</strong> | ${wait === 0 ? "اول چند لقمه بخورید بعد بزنید" : `<strong>${wait} دقیقه</strong> قبل از شام بزنید`}`;
        } else {
          return `노란병 (Reg) <strong>${finalReg}단위</strong>${corrNote} + 초록병 (NPH) <strong>40단위</strong> | ${wait === 0 ? "먼저 몇 입 드신 후 주사" : `식사 <strong>${wait}분 전</strong> 주사`}`;
        }
      }

      // Snack
      const snackMsg = {
        zh: "无需注射胰岛素（按上方时间段与当前血糖搭配食用）",
        en: "No insulin injection needed (follow timing & BG advice above)",
        fa: "بدون نیاز به تزریق انسولین (طبق راهنمای بالا میل شود)",
        ko: "인슐린 주사 불필요 (위 시간대 및 혈당 가이드에 맞춰 섭취)"
      };
      return snackMsg[lang];
    }

    // ==================== RENDER FUNCTIONS ====================
    function setLang(lang) {
      currentLang = lang;
      const t = i18n[lang];
      const htmlRoot = document.getElementById("htmlRoot");
      htmlRoot.setAttribute("dir", t.dir);
      htmlRoot.setAttribute("lang", lang);

      // Update language buttons
      document.querySelectorAll(".lang-btn").forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.className = "lang-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
        } else {
          btn.className = "lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition";
        }
      });

      // Update static texts
      document.getElementById("appTitle").textContent = t.appTitle;
      document.getElementById("coreRuleBanner").textContent = t.coreRule;
      document.getElementById("tabPlanner").textContent = t.tabPlanner;
      document.getElementById("tabAllMenus").textContent = t.tabAllMenus;
      document.getElementById("tabSeasonings").textContent = t.tabSeasonings;

      document.getElementById("step1Label").textContent = t.step1Label;
      document.getElementById("step1Title").textContent = t.step1Title;
      document.getElementById("btnMealBreakfast").textContent = t.btnMealBreakfast;
      document.getElementById("btnMealBreakfastSub").textContent = t.btnMealBreakfastSub;
      document.getElementById("btnMealLunch").textContent = t.btnMealLunch;
      document.getElementById("btnMealLunchSub").textContent = t.btnMealLunchSub;
      document.getElementById("btnMealDinner").textContent = t.btnMealDinner;
      document.getElementById("btnMealDinnerSub").textContent = t.btnMealDinnerSub;
      document.getElementById("btnMealSnack").textContent = t.btnMealSnack;
      document.getElementById("btnMealSnackSub").textContent = t.btnMealSnackSub;

      document.getElementById("snackTimingTitle").textContent = t.snackTimingTitle;
      document.getElementById("timing1Title").textContent = t.timing1Title;
      document.getElementById("timing1Sub").textContent = t.timing1Sub;
      document.getElementById("timing2Title").textContent = t.timing2Title;
      document.getElementById("timing2Sub").textContent = t.timing2Sub;
      document.getElementById("timing3Title").textContent = t.timing3Title;
      document.getElementById("timing3Sub").textContent = t.timing3Sub;
      document.getElementById("timing4Title").textContent = t.timing4Title;
      document.getElementById("timing4Sub").textContent = t.timing4Sub;

      document.getElementById("step2Label").textContent = t.step2Label;
      document.getElementById("step2Title").textContent = t.step2Title;
      document.getElementById("bgLabelLow").textContent = t.bgLabelLow;
      document.getElementById("bgLabelNormal").textContent = t.bgLabelNormal;
      document.getElementById("bgLabelMid").textContent = t.bgLabelMid;
      document.getElementById("bgLabelHigh").textContent = t.bgLabelHigh;
      document.getElementById("bgLabelVeryHigh").textContent = t.bgLabelVeryHigh;

      document.getElementById("recommendedMenuHeading").textContent = t.recommendedMenuHeading;
      document.getElementById("amBtnAll").textContent = t.amBtnAll;
      document.getElementById("amBtnBreakfast").textContent = t.amBtnBreakfast;
      document.getElementById("amBtnLunch").textContent = t.amBtnLunch;
      document.getElementById("amBtnDinner").textContent = t.amBtnDinner;
      document.getElementById("amBtnSnack").textContent = t.amBtnSnack;
      document.getElementById("allMenuSearch").placeholder = t.searchPlaceholder;

      document.getElementById("seasoningPageTitle").textContent = t.seasoningPageTitle;
      document.getElementById("seasoningPageDesc").textContent = t.seasoningPageDesc;

      renderPlanner();
      renderAllMenus();
      renderSeasonings();
    }

    function switchPage(page) {
      currentPage = page;
      document.getElementById("pagePlanner").classList.toggle("hidden", page !== "planner");
      document.getElementById("pageAllMenus").classList.toggle("hidden", page !== "allMenus");
      document.getElementById("pageSeasonings").classList.toggle("hidden", page !== "seasonings");

      document.querySelectorAll(".nav-tab").forEach(btn => {
        if (btn.dataset.page === page) {
          btn.className = "nav-tab px-4 py-2 rounded-xl text-sm font-bold bg-slate-900 text-white shadow-sm shrink-0 transition";
        } else {
          btn.className = "nav-tab px-4 py-2 rounded-xl text-sm font-bold bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 shrink-0 transition";
        }
      });
    }

    function selectPlannerMeal(meal) {
      plannerMeal = meal;
      document.getElementById("snackTimingBox").classList.toggle("hidden", meal !== "snack");
      renderPlanner();
    }

    function selectSnackTiming(timing) {
      plannerSnackTiming = timing;
      renderPlanner();
    }

    function selectPlannerBG(bg) {
      plannerBG = bg;
      renderPlanner();
    }

    function getGiBadgeInfo(level, lang) {
      const t = i18n[lang];
      if (level === "green") {
        return {
          text: t.giGreen,
          border: "border-emerald-200",
          headerBg: "bg-emerald-50/70",
          badge: "bg-emerald-100 text-emerald-800 border border-emerald-300"
        };
      } else if (level === "yellow") {
        return {
          text: t.giYellow,
          border: "border-amber-200",
          headerBg: "bg-amber-50/70",
          badge: "bg-amber-100 text-amber-800 border border-amber-300"
        };
      } else {
        return {
          text: t.giRed,
          border: "border-rose-200",
          headerBg: "bg-rose-50/70",
          badge: "bg-rose-100 text-rose-800 border border-rose-300"
        };
      }
    }

    function renderPlanner() {
      const t = i18n[currentLang];

      // Highlight selected meal button
      document.querySelectorAll(".p-meal-btn").forEach(btn => {
        if (btn.dataset.meal === plannerMeal) {
          btn.className = "p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-emerald-50/80 border-emerald-600 shadow-sm";
        } else {
          btn.className = "p-meal-btn p-3.5 rounded-xl border-2 text-start transition flex flex-col justify-between bg-slate-50 border-slate-200 hover:border-slate-300";
        }
      });

      // Highlight selected snack timing button
      document.querySelectorAll(".s-timing-btn").forEach(btn => {
        if (btn.dataset.timing === plannerSnackTiming) {
          btn.className = "s-timing-btn px-3 py-2.5 rounded-xl border-2 text-xs sm:text-sm font-bold text-start transition bg-emerald-50 border-emerald-600 text-emerald-950 shadow-sm";
        } else {
          btn.className = "s-timing-btn px-3 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold text-start transition bg-slate-50 border-slate-200 text-slate-700 hover:border-slate-300";
        }
      });

      // Highlight selected BG button
      document.querySelectorAll(".p-bg-btn").forEach(btn => {
        const isSelected = btn.dataset.bg === plannerBG;
        const spanClass = btn.dataset.bg === "veryhigh" ? "col-span-2 sm:col-span-1" : "";
        if (isSelected) {
          btn.className = `p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-900 border-slate-900 text-white shadow-sm ${spanClass}`;
        } else {
          btn.className = `p-bg-btn p-3 rounded-xl border-2 text-center transition bg-slate-50 border-slate-200 hover:border-slate-300 ${spanClass}`;
        }
      });

      // Render Action Plan Summary
      const summaryHtml = generatePlanSummary(currentLang, plannerMeal, plannerSnackTiming, plannerBG);
      document.getElementById("generatedPlanBox").innerHTML = `
        <div class="text-xs sm:text-sm leading-relaxed space-y-1">${summaryHtml}</div>
      `;

      // Filter Recipes for the Selected Meal
      let matched = recipes.filter(r => r.meals.includes(plannerMeal));

      if (plannerMeal === "snack") {
        matched = matched.filter(r => {
          const timingMatch = !r.snackTimings || r.snackTimings.includes(plannerSnackTiming);
          if (plannerBG === "low") {
            return r.id === "s1" || r.id === "s2" || r.id === "s4";
          }
          if (plannerBG === "high" || plannerBG === "veryhigh") {
            return r.giLevel === "green" && timingMatch;
          }
          return timingMatch && r.id !== "s1";
        });
      } else {
        // Sort green dishes first when BG is high/veryhigh
        if (plannerBG === "high" || plannerBG === "veryhigh") {
          const order = { green: 1, yellow: 2, red: 3 };
          matched.sort((a, b) => order[a.giLevel] - order[b.giLevel]);
        }
      }

      document.getElementById("recommendedMenuCount").textContent = `${matched.length}`;

      const grid = document.getElementById("plannerRecipeGrid");
      grid.innerHTML = matched.map(item => {
        const giInfo = getGiBadgeInfo(item.giLevel, currentLang);
        const doseHtml = getCardMealInstruction(item, plannerMeal, plannerBG, currentLang);
        const showHighWarn = (plannerBG === "high" || plannerBG === "veryhigh") && item.giLevel === "red" && plannerMeal !== "snack";
        const showLowWarn = plannerBG === "low" && plannerMeal !== "snack";

        return `
          <article class="bg-white rounded-2xl border ${giInfo.border} shadow-sm overflow-hidden flex flex-col justify-between">
            <div>
              <div class="${giInfo.headerBg} px-4 py-3.5 border-b ${giInfo.border}">
                <div class="flex items-start justify-between gap-2">
                  <h4 class="font-bold text-slate-900 text-base leading-snug">${item.title[currentLang]}</h4>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold shrink-0 ${giInfo.badge}">
                    ${giInfo.text}
                  </span>
                </div>
                <p class="text-xs text-slate-600 mt-1 font-medium">${item.subTitle[currentLang]}</p>
              </div>

              <!-- Single Meal Specific Dose Box -->
              <div class="px-4 pt-3 pb-2 space-y-2">
                <div class="p-3 rounded-xl bg-slate-900 text-white text-xs sm:text-sm leading-relaxed">
                  <div class="text-[11px] font-bold text-emerald-400 mb-0.5">${t.currentMealDoseLabel}</div>
                  <div>${doseHtml}</div>
                </div>
                ${showHighWarn ? `<div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-medium">${t.highBgWarn}</div>` : ""}
                ${showLowWarn ? `<div class="p-2.5 rounded-xl bg-sky-50 border border-sky-200 text-sky-900 text-xs font-medium">${t.lowBgWarn}</div>` : ""}
              </div>

              <!-- Eating & Cooking Tips -->
              <div class="px-4 py-2.5">
                <div class="text-xs font-bold text-slate-700 mb-1.5">${t.howToEatLabel}</div>
                <ul class="space-y-1.5 text-xs text-slate-600 leading-relaxed">
                  ${item.howToEat[currentLang].map(line => `<li class="flex items-start gap-1.5"><span class="text-emerald-600 font-bold">•</span><span>${line}</span></li>`).join("")}
                </ul>
              </div>
            </div>
            <div class="h-2"></div>
          </article>
        `;
      }).join("");
    }

    // ==================== PAGE 2: RENDER ALL MENUS ====================
    function setAllMenuFilter(filter) {
      allMenuFilter = filter;
      document.querySelectorAll(".am-filter-btn").forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = "am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 text-white shrink-0 transition";
        } else {
          btn.className = "am-filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 shrink-0 transition";
        }
      });
      renderAllMenus();
    }

    function renderAllMenus() {
      const t = i18n[currentLang];
      const q = (document.getElementById("allMenuSearch").value || "").trim().toLowerCase();

      const filtered = recipes.filter(item => {
        const matchMeal = allMenuFilter === "all" || item.meals.includes(allMenuFilter);
        const matchQuery = !q ||
          item.title[currentLang].toLowerCase().includes(q) ||
          item.subTitle[currentLang].toLowerCase().includes(q) ||
          item.howToEat[currentLang].some(line => line.toLowerCase().includes(q));
        return matchMeal && matchQuery;
      });

      const grid = document.getElementById("allMenusGrid");
      grid.innerHTML = filtered.map(item => {
        const giInfo = getGiBadgeInfo(item.giLevel, currentLang);
        const mealBadges = item.meals.map(m => `<span class="px-2 py-0.5 rounded-md bg-white/80 border border-slate-200 text-[11px] font-semibold text-slate-700">${t.mealLabels[m]}</span>`).join("");

        return `
          <article class="bg-white rounded-2xl border ${giInfo.border} shadow-sm overflow-hidden flex flex-col justify-between">
            <div>
              <div class="${giInfo.headerBg} px-4 py-3.5 border-b ${giInfo.border}">
                <div class="flex items-start justify-between gap-2">
                  <h4 class="font-bold text-slate-900 text-base leading-snug">${item.title[currentLang]}</h4>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold shrink-0 ${giInfo.badge}">
                    ${giInfo.text}
                  </span>
                </div>
                <p class="text-xs text-slate-600 mt-1 font-medium">${item.subTitle[currentLang]}</p>
                <div class="flex flex-wrap gap-1.5 mt-2">${mealBadges}</div>
              </div>

              <div class="px-4 py-3">
                <div class="text-xs font-bold text-slate-700 mb-1.5">${t.howToEatLabel}</div>
                <ul class="space-y-1.5 text-xs text-slate-600 leading-relaxed">
                  ${item.howToEat[currentLang].map(line => `<li class="flex items-start gap-1.5"><span class="text-emerald-600 font-bold">•</span><span>${line}</span></li>`).join("")}
                </ul>
              </div>
            </div>
            <div class="h-2"></div>
          </article>
        `;
      }).join("");
    }

    // ==================== PAGE 3: RENDER SEASONINGS ====================
    function renderSeasonings() {
      const grid = document.getElementById("seasoningGrid");
      grid.innerHTML = seasoningsData.map(s => `
        <div class="p-4 rounded-xl bg-amber-50/60 border border-amber-200/90">
          <h3 class="font-bold text-slate-900 text-sm sm:text-base">${s.title[currentLang]}</h3>
          <p class="text-xs sm:text-sm text-slate-700 mt-1.5 leading-relaxed">${s.desc[currentLang]}</p>
        </div>
      `).join("");
    }

    window.onload = function() {
      setLang("zh");
    };
  </script>
</body>
</html>
