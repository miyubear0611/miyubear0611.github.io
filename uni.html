    const colors = ['bg-slate-900 text-teal-400', 'bg-slate-900 text-teal-400', 'bg-slate-900 text-teal-400', 'bg-teal-500 text-white', 'bg-blue-500 text-white'];
    const pSteps = data.pipelineSteps.map((s, i) => `
        <div class="relative z-10 flex flex-col items-center bg-slate-800 p-5 rounded-2xl border ${i>2 ? 'border-teal-500/50 bg-gradient-to-b from-slate-800 to-teal-900/30' : 'border-slate-700'} w-full lg:flex-1 shadow-lg">
            <div class="w-12 h-12 ${colors[i]} rounded-full flex items-center justify-center font-black text-xl mb-4 border ${i>2?'border-transparent':'border-slate-700'}">${i+1}</div>
            <h5 class="font-bold text-white text-center text-sm md:text-base mb-2">${s.t}</h5>
            <p class="text-[11px] ${i>2?'text-teal-200':'text-slate-400'} text-center leading-tight">${s.d}</p>
        </div>
        ${i < 4 ? `<div class="flex lg:hidden justify-center text-slate-600 py-1"><svg class="w-5 h-5 ltr:rotate-0 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg></div>` : ''}
    `).join('');
    document.getElementById('ui-pipeline-steps').innerHTML = `
        <div class="hidden lg:block absolute top-[45%] start-8 end-8 w-auto h-0.5 bg-slate-700 -translate-y-1/2 z-0"></div>
        ${pSteps}
    `;

    const renderCard = (p) => {
        const t = THEMES[p.univId];
        let noticeHtml = '';
        if(p.noticeType === 'highlight') {
            noticeHtml = `<div class="mx-6 mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl flex gap-3 shadow-sm text-start"><div class="mt-0.5 bg-emerald-100 p-1.5 rounded-lg text-emerald-600 h-fit"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div><div><h4 class="text-emerald-800 font-bold mb-1 text-[15px]">${p.noticeTitle}</h4><p class="text-emerald-700 text-sm m-0 leading-relaxed">${p.noticeDesc}</p></div></div>`;
        } else if(p.noticeType === 'caution') {
            noticeHtml = `<div class="mx-6 mt-6 p-4 bg-amber-50 border border-amber-200 rounded-xl flex gap-3 shadow-sm text-start"><div class="mt-0.5 bg-amber-100 p-1.5 rounded-lg text-amber-600 h-fit"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div><div><h4 class="text-amber-800 font-bold mb-1 text-[15px]">${p.noticeTitle}</h4><p class="text-amber-700 text-sm m-0 leading-relaxed">${p.noticeDesc}</p></div></div>`;
        }
        
        let typeColor = p.type.includes('Wet') ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-cyan-100 text-cyan-800 border-cyan-200';
        let dotColor = p.type.includes('Wet') ? 'bg-purple-500' : 'bg-cyan-500';

        return `
        <div class="bg-white rounded-2xl border-s-4 ${t.border} border-y border-e border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow text-start">
            <div class="${t.bg} border-b border-slate-200 px-6 py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-full ${typeColor} border font-semibold text-xs shadow-sm"><span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span> ${p.type}</span>
                        <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-full ${t.badge} font-semibold text-xs shadow-sm border">${p.univ}</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-900 m-0 group">
                        <a href="${p.link}" target="_blank" class="flex items-center gap-2 ${t.hover} transition-colors">
                            ${p.name} 
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 group-hover:bg-white/50 transition-colors">
                                <svg class="w-3.5 h-3.5 text-slate-500 group-hover:text-current" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </span>
                        </a>
                    </h3>
                    <p class="text-sm text-slate-600 mt-1.5 font-medium">${p.dept} / ${p.major}</p>
                </div>
            </div>
            ${noticeHtml}
            <div class="p-6 prose prose-slate max-w-none text-sm md:text-base prose-p:leading-relaxed">${p.descHTML}</div>
        </div>`;
    };

    document.getElementById('container-ch2').innerHTML = data.profs.filter(p=>p.ch===2).map(renderCard).join('');
    document.getElementById('container-ch3').innerHTML = data.profs.filter(p=>p.ch===3).map(renderCard).join('');
    document.getElementById('container-ch4').innerHTML = data.profs.filter(p=>p.ch===4).map(renderCard).join('');
    document.getElementById('container-ch5').innerHTML = data.profs.filter(p=>p.ch===5).map(renderCard).join('');

    // Render Table
    document.getElementById('ui-table-head').innerHTML = `<tr>${data.tableCols.map((c,i)=>`<th class="${i===0?'sticky start-0 bg-slate-900 z-30 shadow-[1px_0_0_rgba(51,65,85,1)] rtl:shadow-[-1px_0_0_rgba(51,65,85,1)]':''} px-5 py-4 text-xs font-bold tracking-wider align-top">${c}</th>`).join('')}</tr>`;
    
    document.getElementById('ui-table-body').innerHTML = data.profs.map(p => {
        const t = THEMES[p.univId];
        const f = FIT_COLORS[p.fitStatus];
        return `
        <tr class="hover:bg-slate-50 transition-colors border-s-4 ${t.border} ${f.bg ? f.bg+'/20' : ''}">
            <td class="sticky start-0 bg-white group-hover:bg-slate-50 z-10 px-5 py-5 border-e border-slate-100 shadow-[1px_0_0_rgba(241,245,249,1)] rtl:shadow-[-1px_0_0_rgba(241,245,249,1)]">
                <a href="${p.link}" target="_blank" class="font-bold text-[14px] text-slate-900 ${t.hover} flex items-center gap-1">${p.name} <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>
                <div class="mt-1 text-xs font-bold ${t.text}">${p.univ}</div>
                <div class="mt-0.5 text-[11px] text-slate-500">${p.dept}<br>${p.major}</div>
            </td>
            <td class="px-5 py-5 align-top"><span class="inline-flex py-1 px-2.5 rounded text-[11px] font-bold bg-slate-100 text-slate-700 whitespace-nowrap">${p.type}</span></td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[180px] font-medium leading-relaxed">${p.paradigm}</td>
            <td class="px-5 py-5 align-top min-w-[200px] ${f.bg ? f.bg+'/50' : ''}">
                <div class="flex items-center gap-1.5 mb-1.5"><span class="w-2 h-2 rounded-full ${f.dot}"></span><span class="font-bold text-[13px] ${f.text}">${p.fitLabel}</span></div>
                <p class="text-[12px] text-slate-500 leading-relaxed">${p.fitDesc}</p>
            </td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[180px] leading-relaxed">${p.value}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[180px] leading-relaxed">${p.funding}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[160px] leading-relaxed">${p.difficulty}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[200px] leading-relaxed">${p.insight}</td>
        </tr>`;
    }).join('');

    document.getElementById('ui-conclusion').innerHTML = `
        <h2 class="text-2xl font-bold mb-6 text-cyan-400 text-start">${data.conclusionTitle}</h2>
        <div class="bg-gradient-to-r from-blue-900/50 to-indigo-900/50 border border-blue-800/50 p-6 rounded-xl text-start">
            <p class="m-0 text-slate-200 font-light leading-relaxed">${data.conclusionP1}</p>
        </div>
    `;
    
    // Add fade-in animation triggers by removing/re-adding class
    document.querySelectorAll('.fade-in').forEach(el => {
        el.classList.remove('fade-in');
        void el.offsetWidth; // trigger reflow
        el.classList.add('fade-in');
    });
}

window.onload = () => changeLanguage('ko');
</script>

</body>
</html>
