    // Render Table
    document.getElementById('ui-table-head').innerHTML = `<tr>${data.tableCols.map((c,i)=>`<th class="${i===0?'sticky start-0 top-0 bg-slate-950 z-50 shadow-[1px_1px_0_rgba(51,65,85,1)] rtl:shadow-[-1px_1px_0_rgba(51,65,85,1)]':'sticky top-0 bg-slate-900 z-40 shadow-[0_1px_0_rgba(51,65,85,1)]'} px-5 py-4 text-xs font-bold tracking-wider align-top whitespace-nowrap shadow-sm border-b border-slate-700">${c}</th>`).join('')}</tr>`;
    
    document.getElementById('ui-table-body').innerHTML = data.profs.map(p => {
        const t = THEMES[p.univId];
        const f = FIT_COLORS[p.fitStatus];
        return `
        <tr class="group hover:bg-slate-50 transition-colors border-s-4 ${t.border} ${f.bg ? f.bg+'/20' : ''}">
            <td class="sticky start-0 bg-white group-hover:bg-slate-50 z-30 px-5 py-5 border-e border-slate-100 shadow-[1px_0_0_rgba(241,245,249,1)] rtl:shadow-[-1px_0_0_rgba(241,245,249,1)]">
                <a href="${p.link}" target="_blank" class="font-bold text-[14px] text-slate-900 ${t.hover} flex items-center gap-1">${p.name} <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>
                <div class="mt-1 text-xs font-bold ${t.text}">${p.univ}</div>
                <div class="mt-0.5 text-[11px] text-slate-500">${p.dept}<br>${p.major}</div>
            </td>
            <td class="px-5 py-5 align-top"><span class="inline-flex py-1 px-2.5 rounded text-[11px] font-bold bg-slate-100 text-slate-700 whitespace-nowrap">${p.type}</span></td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[200px] font-medium leading-relaxed">${p.paradigm}</td>
            <td class="px-5 py-5 align-top min-w-[200px] ${f.bg ? f.bg+'/50' : ''}">
                <div class="flex items-center gap-1.5 mb-1.5"><span class="w-2 h-2 rounded-full ${f.dot}"></span><span class="font-bold text-[13px] ${f.text}">${p.fitLabel}</span></div>
                <p class="text-[12px] text-slate-500 leading-relaxed">${p.fitDesc}</p>
            </td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[260px] leading-relaxed">${p.value}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[200px] leading-relaxed">${p.funding}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[200px] leading-relaxed">${p.difficulty}</td>
            <td class="px-5 py-5 align-top text-[13px] text-slate-700 min-w-[220px] leading-relaxed">${p.insight}</td>
        </tr>`;
    }).join('');

    document.getElementById('ui-conclusion').innerHTML = `
        <h2 class="text-2xl font-bold mb-6 text-cyan-400 text-start">${data.conclusionTitle}</h2>
        <div class="bg-gradient-to-r from-blue-900/50 to-indigo-900/50 border border-blue-800/50 p-6 rounded-xl text-start">
            <p class="m-0 text-slate-200 font-light leading-relaxed">${data.conclusionP1}</p>
        </div>
    `;
    
    // Add fade-in animation triggers by removing/re-adding class
    document.querySelectorAll('.fade-in').forEach(el => {
        el.classList.remove('fade-in');
        void el.offsetWidth; // trigger reflow
        el.classList.add('fade-in');
    });
}

window.onload = () => changeLanguage('ko');
</script>

</body>
</html>
